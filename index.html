<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cookie's Arcade">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background: transparent;
    font-family: -apple-system, "PingFang SC", sans-serif;
    color: rgba(60, 40, 25, 0.9);
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .title {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: 0.45em;
    color: rgba(80, 50, 30, 0.45);
    text-transform: uppercase;
    font-weight: 400;
    z-index: 10;
  }
  /* 15 块：6 列 × 5 行，每块 span 2（占 2 列）= 每行 3 块 × 5 行整满，无残行。
     15 在 6 列网格下唯一无残行解（small 数须为 3 的倍数，2hero+small 凑不出 15），故全等 small 排布。
     底部留 idle 角色台面。*/
  .grid {
    position: fixed;
    top: 52px;
    left: 14px;
    right: 14px;
    bottom: 10vh;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 10px;
  }
  .tile { grid-column: span 2; }
  .tile {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 280ms cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 280ms ease-out;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    background: #11173a;
    box-shadow:
      0 6px 16px rgba(80, 50, 20, 0.18),
      0 1px 2px rgba(80, 50, 20, 0.1);
  }
  .tile:hover {
    transform: scale(1.03);
    box-shadow:
      0 16px 40px rgba(80, 50, 20, 0.3),
      0 0 0 2px rgba(255, 255, 255, 0.15);
  }
  .tile:active { transform: scale(0.97); }

  .preview {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .label {
    padding: 10px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(8px);
  }
  .label .name {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .label .num {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.2em;
    font-variant-numeric: tabular-nums;
  }

  /* ====== Scribble preview（画彩虹：一条彩虹波浪线被循环画出再擦掉）====== */
  .preview.scribble {
    background: linear-gradient(160deg, #fff5e8 0%, #ffe6d2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .preview.scribble svg { width: 84%; height: 64%; overflow: visible; }
  .preview.scribble path {
    fill: none;
    stroke: url(#scribble-rainbow);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.12));
    animation: scribble-draw 4s ease-in-out infinite;
  }
  @keyframes scribble-draw {
    0%        { stroke-dashoffset: 300; }
    55%, 72%  { stroke-dashoffset: 0; }
    100%      { stroke-dashoffset: -300; }
  }
  .preview.scribble .sc-hand {
    position: absolute;
    right: 12%;
    bottom: 14%;
    font-size: 7vmin;
    line-height: 1;
    animation: sc-hand-bob 4s ease-in-out infinite;
  }
  @keyframes sc-hand-bob {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    30%      { transform: translate(-8%, -6%) rotate(-8deg); }
    60%      { transform: translate(4%, 2%) rotate(4deg); }
  }

  /* ====== Peekaboo preview（躲猫猫：两床被子轮流掀开露出朋友）====== */
  .preview.peekaboo {
    background: linear-gradient(160deg, #ffe1e6 0%, #ffc2cf 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7%;
  }
  .preview.peekaboo .pk-nest {
    position: relative;
    width: 30%;
    aspect-ratio: 1;
    border-radius: 24%;
    overflow: hidden;
    background: radial-gradient(70% 70% at 50% 55%, #ffffff 0%, #ffe6ea 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(60, 40, 20, 0.12);
  }
  .preview.peekaboo .pk-emo {
    font-size: 9vmin;
    line-height: 1;
    animation: pk-bounce 3.6s ease-in-out infinite;
  }
  .preview.peekaboo .pk-cover {
    position: absolute;
    inset: 0;
    border-radius: 24%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pk-lift 3.6s ease-in-out infinite;
  }
  .preview.peekaboo .pk-cover::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.5) 14%, transparent 16%);
    background-size: 26% 26%;
    background-position: 10% 10%;
  }
  .preview.peekaboo .pk-cover .knob {
    position: relative;
    z-index: 1;
    font-size: 5vmin;
    line-height: 1;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
  }
  .preview.peekaboo .pk-nest:nth-child(1) .pk-cover { background: #ff8fa3; }
  .preview.peekaboo .pk-nest:nth-child(2) .pk-cover { background: #6fa8e6; animation-delay: 1.8s; }
  .preview.peekaboo .pk-nest:nth-child(2) .pk-emo  { animation-delay: 1.8s; }
  @keyframes pk-lift {
    0%, 18%   { transform: translateY(0)     rotate(0);     opacity: 1; }
    34%, 66%  { transform: translateY(-112%) rotate(-6deg); opacity: 0; }
    82%, 100% { transform: translateY(0)     rotate(0);     opacity: 1; }
  }
  @keyframes pk-bounce {
    0%, 28%   { transform: scale(0.4) translateY(8%); opacity: 0; }
    42%       { transform: scale(1.15);               opacity: 1; }
    62%       { transform: scale(1);                  opacity: 1; }
    74%, 100% { transform: scale(0.4) translateY(8%); opacity: 0; }
  }

  /* ====== Find preview（找一找：喇叭提问 + 两张小卡其一脉冲）====== */
  .preview.find {
    background: linear-gradient(160deg, #c5ecd6 0%, #93d8b3 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5vmin;
  }
  .preview.find .horn {
    font-size: 6vmin;
    line-height: 1;
    animation: find-horn 2.8s ease-in-out infinite;
  }
  @keyframes find-horn {
    0%, 20%, 100% { transform: rotate(0); }
    6%            { transform: rotate(-10deg) scale(1.12); }
    14%           { transform: rotate(10deg)  scale(1.12); }
  }
  .preview.find .frow { display: flex; gap: 3vmin; }
  .preview.find .mini {
    width: 12vmin;
    aspect-ratio: 1;
    border-radius: 18%;
    background: rgba(255, 255, 255, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7.5vmin;
    line-height: 1;
    box-shadow: 0 4px 10px rgba(60, 40, 20, 0.12);
  }
  .preview.find .mini.hit { animation: find-hit 2.8s ease-in-out infinite; }
  @keyframes find-hit {
    0%, 40%, 75%, 100% { transform: scale(1); box-shadow: 0 4px 10px rgba(60, 40, 20, 0.12); }
    55%                { transform: scale(1.14); box-shadow: 0 0 0 1.2vmin rgba(255, 255, 255, 0.65); }
  }

  /* ====== Words preview（词卡机：emoji+词 错时接力 pop）====== */
  .preview.words {
    background: linear-gradient(160deg, #ffd9e0 0%, #ffb6c8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .preview.words .wc {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 11vmin;
    line-height: 1;
    opacity: 0;
    animation: word-pop 6s ease-in-out infinite;
  }
  .preview.words .wc::after {
    content: attr(data-w);
    font-size: 4.2vmin;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: rgba(50, 30, 18, 0.8);
  }
  .preview.words .wc:nth-child(1) { animation-delay: 0s; }
  .preview.words .wc:nth-child(2) { animation-delay: 2s; }
  .preview.words .wc:nth-child(3) { animation-delay: 4s; }
  @keyframes word-pop {
    0%, 100% { transform: scale(0)   translateY(18%);  opacity: 0; }
    8%       { transform: scale(1.1) translateY(0);    opacity: 1; }
    25%      { transform: scale(1)   translateY(0);    opacity: 1; }
    33%      { transform: scale(0.6) translateY(-18%); opacity: 0; }
  }

  /* ====== Cars preview ====== */
  .preview.cars {
    background: linear-gradient(180deg, #bfe0ff 0%, #e2f0fc 55%, #98d086 55%, #6cba5f 100%);
    overflow: hidden;
    position: relative;
  }
  .preview.cars .car-em {
    position: absolute;
    font-size: 14vmin;
    line-height: 1;
    bottom: 5%;
    left: -20%;
    will-change: transform;
    animation: car-cross 6s linear infinite;
    filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.15));
  }
  .preview.cars .car-em.c1 { animation-delay: 0s;    bottom: 8%;  font-size: 10vmin; }
  .preview.cars .car-em.c2 { animation-delay: 2s;    bottom: 4%;  font-size: 12vmin; }
  .preview.cars .car-em.c3 { animation-delay: 4s;    bottom: 12%; font-size: 8vmin; }
  @keyframes car-cross {
    0%   { transform: translateX(0); }
    100% { transform: translateX(200%); }
  }
  .preview.cars .sun-em {
    position: absolute;
    top: 8%; right: 8%;
    font-size: 7vmin;
    line-height: 1;
    animation: sun-spin 8s linear infinite;
  }
  @keyframes sun-spin {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }

  /* ====== Animals preview ====== */
  .preview.animals {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    overflow: hidden;
  }
  .preview.animals .quad {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8vmin;
    line-height: 1;
    animation: ani-bounce 2.4s ease-in-out infinite;
  }
  .preview.animals .quad:nth-child(1) { background: linear-gradient(160deg, #ffd2d8, #ffb3c1); animation-delay: 0s; }
  .preview.animals .quad:nth-child(2) { background: linear-gradient(160deg, #cfeec9, #a8dca0); animation-delay: 0.4s; }
  .preview.animals .quad:nth-child(3) { background: linear-gradient(160deg, #ffeaa8, #ffd06b); animation-delay: 0.8s; }
  .preview.animals .quad:nth-child(4) { background: linear-gradient(160deg, #c8def5, #9ec5ee); animation-delay: 1.2s; }
  @keyframes ani-bounce {
    0%, 70%, 100% { transform: translateY(0) scale(1); }
    15%           { transform: translateY(-10%) scale(1.15); }
    30%           { transform: translateY(0)    scale(1); }
  }

  /* ====== Twirlywoos 主题预览（共享）====== */
  .preview.tw {
    background: linear-gradient(180deg, #fff5e8 0%, #ffe9c8 100%);
    overflow: hidden;
  }
  .tw-bird {
    position: absolute;
    pointer-events: none;
    will-change: transform;
  }
  .tw-bird svg { width: 100%; height: 100%; display: block; }

  /* 召唤鸟鸟 */
  .preview.tw-summon .tw-bird {
    width: 38%; aspect-ratio: 200/270;
    animation: summon-pop 3s ease-in-out infinite;
  }
  .preview.tw-summon .tw-bird:nth-child(1) { left: 15%; top: 20%; animation-delay: 0s; }
  .preview.tw-summon .tw-bird:nth-child(2) { left: 50%; top: 30%; animation-delay: 1.5s; }
  @keyframes summon-pop {
    0%, 60%, 100% { transform: scale(0); opacity: 0; }
    10%           { transform: scale(1.15); opacity: 1; }
    50%           { transform: scale(1);    opacity: 1; }
  }

  /* 戳泡泡 (鸟) */
  .preview.tw-bubbles {
    background: linear-gradient(180deg, #fff8ec 0%, #ffe9c8 60%, #ffd9a8 100%);
  }
  .preview.tw-bubbles .tw-bird {
    width: 28%; aspect-ratio: 200/270;
    bottom: 0;
  }
  .preview.tw-bubbles .tw-bird:nth-child(1) { left: 10%; width: 14%; }
  .preview.tw-bubbles .tw-bird:nth-child(2) { left: 26%; width: 18%; }
  .preview.tw-bubbles .tw-bird:nth-child(3) { left: 48%; width: 22%; }
  .preview.tw-bubbles .tw-bird:nth-child(4) { left: 72%; width: 26%; }
  .preview.tw-bubbles .pv-bubble {
    position: absolute;
    border-radius: 50%;
    animation: pv-bub-fall 4s linear infinite;
    box-shadow:
      inset -3px -4px 8px rgba(0, 0, 0, 0.1),
      inset 3px 4px 8px rgba(255, 255, 255, 0.55);
  }
  .preview.tw-bubbles .pv-bubble:nth-child(5) { left: 30%; width: 18%; aspect-ratio: 1; animation-delay: 0s;   background: radial-gradient(circle at 30% 30%, #8be0e855, #8be0e81a); }
  .preview.tw-bubbles .pv-bubble:nth-child(6) { left: 60%; width: 14%; aspect-ratio: 1; animation-delay: 2s; background: radial-gradient(circle at 30% 30%, #ffafd155, #ffafd11a); }
  @keyframes pv-bub-fall {
    0%   { top: -25%; opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { top: 75%; opacity: 0; }
  }

  /* 四鸟合唱 */
  .preview.tw-chorus {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 4px;
    background: #fff5e0;
  }
  .preview.tw-chorus .chorus-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .preview.tw-chorus .chorus-cell:nth-child(1) { background: #cfe2fd; }
  .preview.tw-chorus .chorus-cell:nth-child(2) { background: #fbd0c8; }
  .preview.tw-chorus .chorus-cell:nth-child(3) { background: #fde8b0; }
  .preview.tw-chorus .chorus-cell:nth-child(4) { background: #fff3b0; }
  .preview.tw-chorus .chorus-cell .tw-bird {
    width: 70%; aspect-ratio: 200/270;
    position: relative;
    animation: chorus-bounce 2.4s ease-in-out infinite;
  }
  .preview.tw-chorus .chorus-cell:nth-child(1) .tw-bird { animation-delay: 0s; }
  .preview.tw-chorus .chorus-cell:nth-child(2) .tw-bird { animation-delay: 0.6s; }
  .preview.tw-chorus .chorus-cell:nth-child(3) .tw-bird { animation-delay: 1.2s; }
  .preview.tw-chorus .chorus-cell:nth-child(4) .tw-bird { animation-delay: 1.8s; }
  @keyframes chorus-bounce {
    0%, 70%, 100% { transform: translateY(0) scale(1); }
    15%           { transform: translateY(-12%) scale(1.06); }
    30%           { transform: translateY(0)    scale(1); }
  }

  /* 彩色心情 */
  .preview.tw-mood {
    animation: mood-cycle 8s linear infinite;
    display: flex; align-items: center; justify-content: center;
  }
  .preview.tw-mood .tw-bird {
    position: relative;
    width: 56%; aspect-ratio: 200/270;
    animation: mood-pulse 2s ease-in-out infinite;
  }
  @keyframes mood-cycle {
    0%   { background: #bedffd; }
    25%  { background: #fdc4b8; }
    50%  { background: #fde29a; }
    75%  { background: #fff39c; }
    100% { background: #bedffd; }
  }
  @keyframes mood-pulse {
    0%, 100% { transform: scale(0.96); }
    50%      { transform: scale(1.06); }
  }

  /* More More More */
  .preview.tw-more {
    background: linear-gradient(180deg, #fff5e8 0%, #ffe8c8 100%);
  }
  .preview.tw-more .tw-bird {
    bottom: 0;
    width: 22%; aspect-ratio: 200/270;
  }
  .preview.tw-more .tw-bird:nth-child(1) { left: 6%;  width: 13%; }
  .preview.tw-more .tw-bird:nth-child(2) { left: 20%; width: 17%; }
  .preview.tw-more .tw-bird:nth-child(3) { left: 36%; width: 21%; }
  .preview.tw-more .tw-bird:nth-child(4) { left: 56%; width: 25%; }
  .preview.tw-more .pv-ball {
    position: absolute;
    border-radius: 50%;
    box-shadow: inset -3px -4px 8px rgba(0,0,0,0.2), inset 3px 4px 8px rgba(255,255,255,0.3);
    animation: pv-ball-drop 3s ease-in infinite;
  }
  .preview.tw-more .pv-ball:nth-child(5) { left: 30%; width: 18%; aspect-ratio: 1; background: radial-gradient(circle at 30% 30%, #ef4444, #b91c1c); animation-delay: 0s; }
  .preview.tw-more .pv-ball:nth-child(6) { left: 55%; width: 16%; aspect-ratio: 1; background: radial-gradient(circle at 30% 30%, #3b82f6, #1e40af); animation-delay: 1s; }
  .preview.tw-more .pv-ball:nth-child(7) { left: 72%; width: 14%; aspect-ratio: 1; background: radial-gradient(circle at 30% 30%, #fbbf24, #b45309); animation-delay: 2s; }
  @keyframes pv-ball-drop {
    0%   { top: -25%; opacity: 0; }
    15%  { opacity: 1; }
    100% { top: 65%; opacity: 1; }
  }

  /* ====== Keyboard preview ====== */
  .preview.keyboard {
    background: #0a0e27;
  }
  .preview.keyboard .kb-shape {
    position: absolute;
    width: 22%;
    aspect-ratio: 1;
    animation: kb-pop 2s ease-in-out infinite;
  }
  .preview.keyboard .kb-shape:nth-child(1) { left: 18%; top: 22%; animation-delay: 0s;   }
  .preview.keyboard .kb-shape:nth-child(2) { left: 58%; top: 18%; animation-delay: 0.5s; }
  .preview.keyboard .kb-shape:nth-child(3) { left: 22%; top: 56%; animation-delay: 1s;   }
  .preview.keyboard .kb-shape:nth-child(4) { left: 60%; top: 60%; animation-delay: 1.5s; }
  @keyframes kb-pop {
    0%, 90%, 100% { transform: scale(0); opacity: 0; }
    15%           { transform: scale(1.15); opacity: 1; }
    75%           { transform: scale(1);    opacity: 1; }
  }

  /* ====== Bubbles preview ====== */
  .preview.bubbles {
    background: linear-gradient(180deg, #0c1530 0%, #0a1028 100%);
  }
  .preview.bubbles .bubble {
    position: absolute;
    border-radius: 50%;
    animation: pv-rise 5s linear infinite;
    box-shadow:
      inset -4px -5px 10px rgba(0, 0, 0, 0.15),
      inset 4px 5px 10px rgba(255, 255, 255, 0.5);
  }
  .preview.bubbles .bubble:nth-child(1) { left: 15%; width: 22%; aspect-ratio: 1; animation-delay: 0s;   background: radial-gradient(circle at 30% 30%, #8be0e855, #8be0e81a); }
  .preview.bubbles .bubble:nth-child(2) { left: 50%; width: 18%; aspect-ratio: 1; animation-delay: 1.2s; background: radial-gradient(circle at 30% 30%, #ffafd155, #ffafd11a); }
  .preview.bubbles .bubble:nth-child(3) { left: 75%; width: 26%; aspect-ratio: 1; animation-delay: 2.4s; background: radial-gradient(circle at 30% 30%, #fff48a55, #fff48a1a); }
  .preview.bubbles .bubble:nth-child(4) { left: 30%; width: 16%; aspect-ratio: 1; animation-delay: 3.6s; background: radial-gradient(circle at 30% 30%, #a5e8a355, #a5e8a31a); }
  @keyframes pv-rise {
    0%   { bottom: -30%; opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { bottom: 110%; opacity: 0; }
  }

  /* ====== Drums preview ====== */
  .preview.drums {
    background: #0a0e27;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8%;
  }
  .preview.drums .pad {
    width: 14%;
    aspect-ratio: 1;
    border-radius: 50%;
    animation: pad-beat 1.6s ease-in-out infinite;
  }
  .preview.drums .pad:nth-child(1) { background: #ff5252; animation-delay: 0s;   }
  .preview.drums .pad:nth-child(2) { background: #ffeb3b; animation-delay: 0.4s; }
  .preview.drums .pad:nth-child(3) { background: #5c9eff; animation-delay: 0.8s; }
  .preview.drums .pad:nth-child(4) { background: #ba68c8; animation-delay: 1.2s; }
  @keyframes pad-beat {
    0%, 100% { transform: scale(0.7); opacity: 0.3; box-shadow: 0 0 0 0 currentColor; }
    20%      { transform: scale(1.2); opacity: 1;   box-shadow: 0 0 20px 6px currentColor; }
  }

  /* ====== Cascade preview ====== */
  .preview.cascade {
    animation: cascade-cycle 10s linear infinite;
  }
  @keyframes cascade-cycle {
    0%   { background: #d65a5a; }
    14%  { background: #d68a52; }
    28%  { background: #d4be4d; }
    42%  { background: #5fa86c; }
    56%  { background: #4eaab4; }
    70%  { background: #5d83c4; }
    84%  { background: #9968b3; }
    100% { background: #d18ab2; }
  }

  .footer {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);

<script>
  // 挂木板墙 + 树影底（首页不带红船，纯舞台）
  TW.Stage.mount();
  // 底部 4 角色排（30s 无操作切瘫倒态，任意活动复活）
  TW.Stage.mountIdleCast({ idleMs: 30000 });

  // 把 preview 里所有 .tw-bird 用对应角色 SVG 填充
  // noFilter: 首屏 tw-bird 小尺寸缩略，feTurbulence 滤镜跑这么多会卡首页
  document.querySelectorAll('.tile .tw-bird').forEach(node => {
    const ck = node.dataset.char || 'bighoo';
    node.innerHTML = TW.svg(ck, { expression: 'idle', noFilter: true });
  });

  const tiles = document.querySelectorAll('.tile');
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey) return;
    const idx = parseInt(e.key, 10);
    if (idx >= 1 && idx <= tiles.length) {
      const tile = tiles[idx - 1];
      if (tile) {
        e.preventDefault();
        location.href = tile.getAttribute('href');
        return;
      }
    }
    if (e.key.length === 1 || e.key === 'Enter') {
      e.preventDefault();
      const random = tiles[Math.floor(Math.random() * tiles.length)];
      location.href = random.getAttribute('href');
    }
  });
</script>
