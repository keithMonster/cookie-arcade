<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cookie's Arcade">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background: transparent;
    font-family: -apple-system, "PingFang SC", sans-serif;
    color: rgba(60, 40, 25, 0.9);
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
    touch-action: pan-y;
    overscroll-behavior-y: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .title {
    padding: 22px 0 14px;
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.45em;
    color: rgba(80, 50, 30, 0.45);
    text-transform: uppercase;
    font-weight: 400;
  }
  /* 首页可滚动（2026-07-16 改版）：18 块统一 2 列大块，自然滚动。
     不再玩「N 块在 6 列下的无残行算术」——任何款数 2 列都整齐，加游戏零布局成本。
     滚到底 footer 下方留空，露出 fixed 在底部的 idle 角色台面。*/
  .grid {
    display: grid;
    margin: 0 auto;
    padding: 0 14px;
    max-width: 1100px; /* 桌面宽窗防止 2 列被拉成横幅；iPad 竖屏不受影响 */
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: clamp(150px, 24vh, 300px);
    gap: 10px;
  }
  .tile {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 280ms cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 280ms ease-out;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    background: #11173a;
    box-shadow:
      0 6px 16px rgba(80, 50, 20, 0.18),
      0 1px 2px rgba(80, 50, 20, 0.1);
  }
  .tile:hover {
    transform: scale(1.03);
    box-shadow:
      0 16px 40px rgba(80, 50, 20, 0.3),
      0 0 0 2px rgba(255, 255, 255, 0.15);
  }
  .tile:active { transform: scale(0.97); }

  .preview {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .label {
    padding: 10px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(8px);
  }
  .label .name {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .label .num {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.2em;
    font-variant-numeric: tabular-nums;
  }

  /* ====== Echo preview（跟着敲：兔子敲三下、三颗点依次亮，轮到你时变绿）====== */
  .preview.echo {
    background: linear-gradient(180deg, #fff3d1 0%, #ffe4a8 60%, #e2b077 60%, #c98f55 100%);
    position: relative;
    overflow: hidden;
  }
  .preview.echo .ec-bunny {
    position: absolute;
    top: 14%;
    left: 30%;
    transform: translateX(-50%);
    font-size: 8vmin;
    line-height: 1;
    animation: ec-bounce 2.4s ease-in-out infinite;
  }
  @keyframes ec-bounce {
    0%, 100%, 30%, 45%      { transform: translate(-50%, 0); }
    10%, 20%, 35%, 40%      { transform: translate(-50%, 6%) scale(1.05, 0.94); }
  }
  .preview.echo .ec-drum {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9vmin;
    line-height: 1;
  }
  .preview.echo .ec-dot {
    position: absolute;
    bottom: 56%;
    width: 3vmin;
    height: 3vmin;
    border-radius: 50%;
    border: 0.5vmin solid rgba(120, 70, 30, 0.35);
    animation: ec-light 2.4s ease-in-out infinite;
  }
  .preview.echo .ec-dot.d1 { left: 50%; }
  .preview.echo .ec-dot.d2 { left: 60%; animation-delay: 0.24s; }
  .preview.echo .ec-dot.d3 { left: 70%; animation-delay: 0.48s; }
  @keyframes ec-light {
    0%, 8%          { background: transparent; border-color: rgba(120, 70, 30, 0.35); transform: scale(1); }
    12%, 40%        { background: #ff9a3c;     border-color: #ff9a3c;                 transform: scale(1.15); }
    50%             { background: transparent; border-color: rgba(120, 70, 30, 0.35); transform: scale(1); }
    62%, 90%        { background: #6cc86a;     border-color: #6cc86a;                 transform: scale(1.15); }
    100%            { background: transparent; border-color: rgba(120, 70, 30, 0.35); transform: scale(1); }
  }

  /* ====== Train preview（排排队：小火车开过来，动物排队候车）====== */
  .preview.train {
    background: linear-gradient(180deg, #aee3f5 0%, #cdeefb 58%, #a8dc9c 58%, #8fce84 100%);
    position: relative;
    overflow: hidden;
  }
  .preview.train .tr-kid {
    position: absolute;
    bottom: 30%;
    font-size: 6.5vmin;
    line-height: 1;
    animation: tr-sway 2.4s ease-in-out infinite;
  }
  .preview.train .tr-kid.k1 { left: 12%; }
  .preview.train .tr-kid.k2 { left: 30%; animation-delay: -1.2s; }
  @keyframes tr-sway {
    0%, 100% { transform: rotate(-5deg); }
    50%      { transform: rotate(5deg) translateY(-0.8vmin); }
  }
  .preview.train .tr-loco {
    position: absolute;
    bottom: 6%;
    left: 0;
    font-size: 12vmin;
    line-height: 1;
    animation: tr-run 5s linear infinite;
  }
  .preview.train .tr-puff {
    position: absolute;
    bottom: 26%;
    left: 0;
    font-size: 4.5vmin;
    line-height: 1;
    animation: tr-run 5s linear infinite, tr-fade 1.25s ease-in-out infinite;
  }
  @keyframes tr-run {
    0%   { transform: translateX(60vw); }
    100% { transform: translateX(-14vmin); }
  }
  @keyframes tr-fade {
    0%, 100% { opacity: 0.2; }
    50%      { opacity: 0.9; }
  }

  /* ====== Basket preview（装一装：水果一颗颗落进篮子，✨ 闪）====== */
  .preview.basket {
    background: linear-gradient(180deg, #fdf3d0 0%, #cdeab5 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .preview.basket .bk-basket {
    font-size: 15vmin;
    line-height: 1;
    margin-bottom: 6%;
    animation: bk-catch 3.6s ease-in-out infinite;
  }
  @keyframes bk-catch {
    0%, 55%, 100% { transform: scale(1); }
    62%           { transform: scale(1.12, 0.88); }
    72%           { transform: scale(0.96, 1.05); }
  }
  .preview.basket .bk-fruit {
    position: absolute;
    top: 8%; left: 50%;
    font-size: 7vmin;
    line-height: 1;
    animation: bk-drop 3.6s cubic-bezier(0.5, 0, 0.6, 1) infinite;
  }
  @keyframes bk-drop {
    0%, 18%  { transform: translate(-50%, 0) rotate(-8deg); opacity: 0; }
    28%      { opacity: 1; }
    58%      { transform: translate(-50%, 9vmin) rotate(10deg) scale(0.9); opacity: 1; }
    64%, 100%{ transform: translate(-50%, 10vmin) scale(0.4); opacity: 0; }
  }
  .preview.basket .bk-spark {
    position: absolute;
    bottom: 34%; left: 60%;
    font-size: 4.5vmin;
    animation: bk-spark 3.6s ease-out infinite;
  }
  @keyframes bk-spark {
    0%, 60%  { opacity: 0; transform: translate(0, 0) scale(0.5); }
    70%      { opacity: 1; }
    92%, 100%{ opacity: 0; transform: translate(2vmin, -5vmin) scale(1.1); }
  }

  /* ====== Sleep preview（睡觉觉：被子慢慢盖上，💤 飘起星星眨眼）====== */
  .preview.sleep {
    background: linear-gradient(180deg, #1a2244 0%, #2c3a68 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .preview.sleep .sl-pet {
    font-size: 12vmin;
    line-height: 1;
    animation: sl-doze 4.2s ease-in-out infinite;
  }
  @keyframes sl-doze {
    0%, 100% { transform: rotate(0) scale(1); }
    30%      { transform: rotate(-5deg) scale(1.02); }
    65%      { transform: rotate(3deg); }
  }
  .preview.sleep .sl-blanket {
    position: absolute;
    left: 20%; right: 20%; bottom: 7%;
    height: 26%;
    border-radius: 3vmin 3vmin 2vmin 2vmin;
    background: linear-gradient(180deg, #8d79bd, #6d5ba8);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.25);
    animation: sl-tuck 4.2s ease-in-out infinite;
  }
  @keyframes sl-tuck {
    0%, 20%   { height: 26%; }
    45%, 100% { height: 38%; }
  }
  .preview.sleep .sl-zzz {
    position: absolute;
    top: 16%; right: 24%;
    font-size: 5vmin;
    animation: sl-zzz 4.2s ease-out infinite;
  }
  @keyframes sl-zzz {
    0%, 42% { opacity: 0;    transform: translate(0, 0) scale(0.5); }
    58%     { opacity: 0.9; }
    100%    { opacity: 0;    transform: translate(2vmin, -6vmin) scale(1.1); }
  }
  .preview.sleep .sl-star {
    position: absolute;
    top: 12%; left: 16%;
    font-size: 3.5vmin;
    animation: sl-star 2.6s ease-in-out infinite;
  }
  @keyframes sl-star {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.95; }
  }
  .preview.sleep .sl-moon {
    position: absolute;
    top: 10%; right: 10%;
    font-size: 5.5vmin;
  }

  /* ====== Bath preview（洗澡澡：泥点被搓掉，小狗变干净冒泡泡星星）====== */
  .preview.bath {
    background: linear-gradient(160deg, #dff2fa 0%, #b8e0f0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .preview.bath .bt-pet {
    font-size: 13vmin;
    line-height: 1;
    animation: bt-wash 3.4s ease-in-out infinite;
  }
  @keyframes bt-wash {
    0%, 40%       { transform: rotate(-3deg); filter: grayscale(0.5) brightness(0.9); }
    20%           { transform: rotate(3deg);  filter: grayscale(0.5) brightness(0.9); }
    52%           { transform: rotate(0);     filter: none; }
    62%           { transform: scale(1.18) rotate(-6deg); filter: none; }
    72%, 100%     { transform: scale(1)    rotate(0);     filter: none; }
  }
  .preview.bath .bt-mud {
    position: absolute;
    top: 34%;
    left: 40%;
    width: 5vmin;
    height: 4vmin;
    border-radius: 55% 45% 50% 50% / 48% 55% 45% 52%;
    background: radial-gradient(60% 60% at 40% 35%, #a07a52, #7c5a38 70%, #6b4c2e);
    animation: bt-mud 3.4s ease-out infinite;
  }
  @keyframes bt-mud {
    0%, 38%    { transform: scale(1);   opacity: 0.92; }
    48%, 100%  { transform: scale(0.2); opacity: 0; }
  }
  .preview.bath .bt-bub {
    position: absolute;
    bottom: 18%;
    left: 24%;
    font-size: 6vmin;
    line-height: 1;
    animation: bt-bub 3.4s ease-in-out infinite;
  }
  @keyframes bt-bub {
    0%, 36%   { transform: translateY(0)      scale(0.4); opacity: 0; }
    46%       { transform: translateY(-2vmin) scale(1);   opacity: 1; }
    64%, 100% { transform: translateY(-7vmin) scale(0.8); opacity: 0; }
  }
  .preview.bath .bt-shine {
    position: absolute;
    top: 18%;
    right: 20%;
    font-size: 6vmin;
    line-height: 1;
    animation: bt-shine 3.4s ease-in-out infinite;
  }
  @keyframes bt-shine {
    0%, 54%   { transform: scale(0)   rotate(0);     opacity: 0; }
    66%       { transform: scale(1.2) rotate(20deg); opacity: 1; }
    88%, 100% { transform: scale(0.9) rotate(40deg); opacity: 0; }
  }

  /* ====== Feed preview（喂一喂：食物飞向小猫，小猫咀嚼冒爱心）====== */
  .preview.feed {
    background: linear-gradient(160deg, #ffefd8 0%, #ffd9a8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .preview.feed .fd-pet {
    font-size: 13vmin;
    line-height: 1;
    animation: fd-chomp 3.2s ease-in-out infinite;
  }
  @keyframes fd-chomp {
    0%, 52%, 100% { transform: scale(1)    rotate(0); }
    60%           { transform: scale(1.12) rotate(-5deg); }
    68%           { transform: scale(0.97) rotate(4deg); }
    76%           { transform: scale(1.08) rotate(-3deg); }
  }
  .preview.feed .fd-food {
    position: absolute;
    left: 16%;
    bottom: 12%;
    font-size: 8vmin;
    line-height: 1;
    animation: fd-fly 3.2s ease-in-out infinite;
  }
  @keyframes fd-fly {
    0%, 14%   { transform: translate(0, 0) scale(1); opacity: 0; }
    22%       { transform: translate(0, 0) scale(1); opacity: 1; }
    52%       { transform: translate(13vmin, -6vmin) scale(0.3); opacity: 0; }
    100%      { transform: translate(13vmin, -6vmin) scale(0.3); opacity: 0; }
  }
  .preview.feed .fd-heart {
    position: absolute;
    top: 16%;
    right: 22%;
    font-size: 6vmin;
    line-height: 1;
    animation: fd-heart 3.2s ease-in-out infinite;
  }
  @keyframes fd-heart {
    0%, 58%    { transform: scale(0)   translateY(0);    opacity: 0; }
    70%        { transform: scale(1.2) translateY(0);    opacity: 1; }
    92%, 100%  { transform: scale(1)   translateY(-40%); opacity: 0; }
  }

  /* ====== Shapes preview（送回家：圆形弹进房子的洞，洞亮起）====== */
  .preview.shapes {
    background: linear-gradient(160deg, #d4ebf8 0%, #aed7ef 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5vmin;
  }
  .preview.shapes .sh-roof {
    width: 17vmin;
    height: 5vmin;
    background: linear-gradient(180deg, #ef8468, #e06a4e);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .preview.shapes .sh-wall {
    width: 13.5vmin;
    height: 9vmin;
    background: #fffaf0;
    border-radius: 0 0 1.2vmin 1.2vmin;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(60, 40, 20, 0.14);
  }
  .preview.shapes .sh-hole {
    width: 5vmin;
    height: 5vmin;
    border-radius: 50%;
    border: 0.5vmin dashed rgba(60, 40, 20, 0.35);
    animation: sh-hole-glow 3s ease-in-out infinite;
  }
  @keyframes sh-hole-glow {
    0%, 56%   { background: transparent; border-color: rgba(60, 40, 20, 0.35); }
    64%, 84%  { background: #4dabf7;     border-color: transparent; }
    100%      { background: transparent; border-color: rgba(60, 40, 20, 0.35); }
  }
  .preview.shapes .sh-ball {
    width: 4.6vmin;
    height: 4.6vmin;
    border-radius: 50%;
    background: #4dabf7;
    box-shadow: 0 2px 4px rgba(60, 40, 20, 0.2);
    animation: sh-jump 3s ease-in-out infinite;
  }
  @keyframes sh-jump {
    0%, 26%   { transform: translateY(0); opacity: 1; }
    58%       { transform: translateY(-9.6vmin) scale(1); opacity: 1; }
    60%, 100% { transform: translateY(-9.6vmin) scale(0.6); opacity: 0; }
  }

  /* ====== Storybook preview（绘本：一扇门周期开合，门后角色探出）====== */
  .preview.storybook {
    background: radial-gradient(circle at 50% 38%, #6dd5ed, #2193b0);
    display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden; perspective: 600px;
  }
  .preview.storybook .sb-peek {
    position: absolute; bottom: 14%; left: 50%;
    width: 26%; height: 40%; border-radius: 50% 50% 46% 46%;
    background: radial-gradient(circle at 38% 32%, #6fb0e8, #4a90d9);
    transform: translateX(-50%) translateY(62%);
    animation: sb-peek 3.4s ease-in-out infinite; z-index: 1;
  }
  .preview.storybook .sb-peek::before,
  .preview.storybook .sb-peek::after {
    content: ''; position: absolute; top: 28%; width: 20%; height: 20%;
    border-radius: 50%; background: #fff;
  }
  .preview.storybook .sb-peek::before { left: 24%; }
  .preview.storybook .sb-peek::after  { right: 24%; }
  @keyframes sb-peek {
    0%,42%   { transform: translateX(-50%) translateY(62%); }
    64%,86%  { transform: translateX(-50%) translateY(0); }
    100%     { transform: translateX(-50%) translateY(62%); }
  }
  .preview.storybook .sb-door {
    display: block; position: relative; width: 44%; height: 80%;
    background: linear-gradient(160deg, #c8814f, #a8693c);
    border: 0.5vmin solid #6e4630;
    border-radius: 46% 46% 6% 6% / 36% 36% 5% 5%;
    transform-origin: left center;
    box-shadow: inset -0.6vmin 0 1vmin rgba(0,0,0,0.2);
    animation: sb-door 3.4s ease-in-out infinite; z-index: 2;
  }
  @keyframes sb-door {
    0%,38%   { transform: rotateY(0); }
    60%,88%  { transform: rotateY(-68deg); }
    100%     { transform: rotateY(0); }
  }

  /* ====== Scribble preview（画彩虹：一条彩虹波浪线被循环画出再擦掉）====== */
  .preview.scribble {
    background: linear-gradient(160deg, #fff5e8 0%, #ffe6d2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .preview.scribble svg { width: 84%; height: 64%; overflow: visible; }
  .preview.scribble path {
    fill: none;
    stroke: url(#scribble-rainbow);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.12));
    animation: scribble-draw 4s ease-in-out infinite;
  }
  @keyframes scribble-draw {
    0%        { stroke-dashoffset: 300; }
    55%, 72%  { stroke-dashoffset: 0; }
    100%      { stroke-dashoffset: -300; }
  }
  .preview.scribble .sc-hand {
    position: absolute;
    right: 12%;
    bottom: 14%;
    font-size: 7vmin;
    line-height: 1;
    animation: sc-hand-bob 4s ease-in-out infinite;
  }
  @keyframes sc-hand-bob {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    30%      { transform: translate(-8%, -6%) rotate(-8deg); }
    60%      { transform: translate(4%, 2%) rotate(4deg); }
  }

  /* ====== Peekaboo preview（躲猫猫：两床被子轮流掀开露出朋友）====== */
  .preview.peekaboo {
    background: linear-gradient(160deg, #ffe1e6 0%, #ffc2cf 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7%;
  }
  .preview.peekaboo .pk-nest {
    position: relative;
    width: 30%;
    aspect-ratio: 1;
    border-radius: 24%;
    overflow: hidden;
    background: radial-gradient(70% 70% at 50% 55%, #ffffff 0%, #ffe6ea 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(60, 40, 20, 0.12);
  }
  .preview.peekaboo .pk-emo {
    font-size: 9vmin;
    line-height: 1;
    animation: pk-bounce 3.6s ease-in-out infinite;
  }
  .preview.peekaboo .pk-cover {
    position: absolute;
    inset: 0;
    border-radius: 24%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pk-lift 3.6s ease-in-out infinite;
  }
  .preview.peekaboo .pk-cover::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.5) 14%, transparent 16%);
    background-size: 26% 26%;
    background-position: 10% 10%;
  }
  .preview.peekaboo .pk-cover .knob {
    position: relative;
    z-index: 1;
    font-size: 5vmin;
    line-height: 1;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
  }
  .preview.peekaboo .pk-nest:nth-child(1) .pk-cover { background: #ff8fa3; }
  .preview.peekaboo .pk-nest:nth-child(2) .pk-cover { background: #6fa8e6; animation-delay: 1.8s; }
  .preview.peekaboo .pk-nest:nth-child(2) .pk-emo  { animation-delay: 1.8s; }
  @keyframes pk-lift {
    0%, 18%   { transform: translateY(0)     rotate(0);     opacity: 1; }
    34%, 66%  { transform: translateY(-112%) rotate(-6deg); opacity: 0; }
    82%, 100% { transform: translateY(0)     rotate(0);     opacity: 1; }
  }
  @keyframes pk-bounce {
    0%, 28%   { transform: scale(0.4) translateY(8%); opacity: 0; }
    42%       { transform: scale(1.15);               opacity: 1; }
    62%       { transform: scale(1);                  opacity: 1; }
    74%, 100% { transform: scale(0.4) translateY(8%); opacity: 0; }
  }

  /* ====== Find preview（找一找：喇叭提问 + 两张小卡其一脉冲）====== */
  .preview.find {
    background: linear-gradient(160deg, #c5ecd6 0%, #93d8b3 100%);
    display: flex;

  .preview.animals .quad:nth-child(3) { background: linear-gradient(160deg, #ffeaa8, #ffd06b); animation-delay: 0.8s; }

    width: 38%; aspect-ratio: 200/270;

  .preview.tw-summon .tw-bird:nth-child(2) { left: 50%; top: 30%; animation-delay: 1.5s; }
  @keyframes summon-pop {
    0%, 60%, 100% { transform: scale(0); opacity: 0; }

    50%           { transform: scale(1);    opacity: 1; }

    background: linear-gradient(180deg, #fff8ec 0%, #ffe9c8 60%, #ffd9a8 100%);
  }
  .preview.tw-bubbles .tw-bird {
    width: 28%; aspect-ratio: 200/270;
    bottom: 0;
  }
  .preview.tw-bubbles .tw-bird:nth-child(1) { left: 10%; width: 14%; }
  .preview.tw-bubbles .tw-bird:nth-child(2) { left: 26%; width: 18%; }
  .preview.tw-bubbles .tw-bird:nth-child(3) { left: 48%; width: 22%; }
  .preview.tw-bubbles .tw-bird:nth-child(4) { left: 72%; width: 26%; }
  .preview.tw-bubbles .pv-bubble {
    position: absolute;
    border-radius: 50%;
    animation: pv-bub-fall 4s linear infinite;
    box-shadow:
      inset -3px -4px 8px rgba(0, 0, 0, 0.1),
      inset 3px 4px 8px rgba(255, 255, 255, 0.55);

  .preview.tw-bubbles .pv-bubble:nth-child(5) { left: 30%; width: 18%; aspect-ratio: 1; animation-delay: 0s;   background: radial-gradient(circle at 30% 30%, #8be0e855, #8be0e81a); }
  .preview.tw-bubbles .pv-bubble:nth-child(6) { left: 60%; width: 14%; aspect-ratio: 1; animation-delay: 2s; background: radial-gradient(circle at 30% 30%, #ffafd155, #ffafd11a); }
  @keyframes pv-bub-fall {
    0%   { top: -25%; opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { top: 75%; opacity: 0; }

  /* 四鸟合唱 */

    grid-template-rows: 1fr 1fr;

    align-items: center;
    justify-content: center;
    overflow: hidden;

  .preview.tw-chorus .chorus-cell:nth-child(2) { background: #fbd0c8; }
  .preview.tw-chorus .chorus-cell:nth-child(3) { background: #fde8b0; }
  .preview.tw-chorus .chorus-cell:nth-child(4) { background: #fff3b0; }
  .preview.tw-chorus .chorus-cell .tw-bird {
    width: 70%; aspect-ratio: 200/270;
    position: relative;
    animation: chorus-bounce 2.4s ease-in-out infinite;

  .preview.tw-chorus .chorus-cell:nth-child(1) .tw-bird { animation-delay: 0s; }
  .preview.tw-chorus .chorus-cell:nth-child(2) .tw-bird { animation-delay: 0.6s; }
  .preview.tw-chorus .chorus-cell:nth-child(3) .tw-bird { animation-delay: 1.2s; }
  .preview.tw-chorus .chorus-cell:nth-child(4) .tw-bird { animation-delay: 1.8s; }

    15%           { transform: translateY(-12%) scale(1.06); }
    30%           { transform: translateY(0)    scale(1); }

  .preview.tw-mood {

    0%, 100% { transform: scale(0.96); }
    50%      { transform: scale(1.06); }

  /* More More More */

    75%           { transform: scale(1);    opacity: 1; }

  /* ====== Bubbles preview ====== */
  .preview.bubbles {
    background: linear-gradient(180deg, #0c1530 0%, #0a1028 100%);
  }
  .preview.bubbles .bubble {
    position: absolute;
    border-radius: 50%;
    animation: pv-rise 5s linear infinite;
    box-shadow:

      inset 4px 5px 10px rgba(255, 255, 255, 0.5);
  }
  .preview.bubbles .bubble:nth-child(1) { left: 15%; width: 22%; aspect-ratio: 1; animation-delay: 0s;   background: radial-gradient(circle at 30% 30%, #8be0e855, #8be0e81a); }
  .preview.bubbles .bubble:nth-child(2) { left: 50%; width: 18%; aspect-ratio: 1; animation-delay: 1.2s; background: radial-gradient(circle at 30% 30%, #ffafd155, #ffafd11a); }
  .preview.bubbles .bubble:nth-child(3) { left: 75%; width: 26%; aspect-ratio: 1; animation-delay: 2.4s; background: radial-gradient(circle at 30% 30%, #fff48a55, #fff48a1a); }
  .preview.bubbles .bubble:nth-child(4) { left: 30%; width: 16%; aspect-ratio: 1; animation-delay: 3.6s; background: radial-gradient(circle at 30% 30%, #a5e8a355, #a5e8a31a); }
  @keyframes pv-rise {
    0%   { bottom: -30%; opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { bottom: 110%; opacity: 0; }
  }

  /* ====== Drums preview ====== */
  .preview.drums {
    background: #0a0e27;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8%;

  .preview.drums .pad {

    border-radius: 50%;

  .preview.drums .pad:nth-child(2) { background: #ffeb3b; animation-delay: 0.4s; }
  .preview.drums .pad:nth-child(3) { background: #5c9eff; animation-delay: 0.8s; }
  .preview.drums .pad:nth-child(4) { background: #ba68c8; animation-delay: 1.2s; }
  @keyframes pad-beat {
    0%, 100% { transform: scale(0.7); opacity: 0.3; box-shadow: 0 0 0 0 currentColor; }
    20%      { transform: scale(1.2); opacity: 1;   box-shadow: 0 0 20px 6px currentColor; }
  }

  /* ====== Cascade preview ====== */
  .preview.cascade {
    animation: cascade-cycle 10s linear infinite;
  }
  @keyframes cascade-cycle {
    0%   { background: #d65a5a; }
    14%  { background: #d68a52; }
    28%  { background: #d4be4d; }
    42%  { background: #5fa86c; }

    70%  { background: #5d83c4; }
    84%  { background: #9968b3; }
    100% { background: #d18ab2; }
  }

  /* footer 在文档流末尾：文字提示 + 底部大留白，滚到底露出 idle 角色台面 */
  .footer {
    padding: 18px 0 30vh;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: rgba(80, 50, 30, 0.35);
  }
</style>

<script src="games/_lib/twirlywoos.js"></script>
<script src="games/_lib/stage.js"></script>
<script>
  // 挂木板墙 + 树影底（首页不带红船，纯舞台）
  TW.Stage.mount();
  // 底部 4 角色排（30s 无操作切瘫倒态，任意活动复活）
  TW.Stage.mountIdleCast({ idleMs: 30000 });

  // 把 preview 里所有 .tw-bird 用对应角色 SVG 填充
  // noFilter: 首屏 tw-bird 小尺寸缩略，feTurbulence 滤镜跑这么多会卡首页
  document.querySelectorAll('.tile .tw-bird').forEach(node => {
    const ck = node.dataset.char || 'bighoo';
    node.innerHTML = TW.svg(ck, { expression: 'idle', noFilter: true });
  });

  const tiles = document.querySelectorAll('.tile');
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey) return;
    const idx = parseInt(e.key, 10);
    if (idx >= 1 && idx <= tiles.length) {
      const tile = tiles[idx - 1];
      if (tile) {
        e.preventDefault();
        location.href = tile.getAttribute('href');
        return;
      }
    }
    if (e.key.length === 1 || e.key === 'Enter') {
      e.preventDefault();
      const random = tiles[Math.floor(Math.random() * tiles.length)];
      location.href = random.getAttribute('href');
    }
  });
</script>
