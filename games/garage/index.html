<style>
:root{color-scheme:light;--ink:#294c49;--sky:#d8eee7;--mint:#78b7a0;--cream:#fff0cf;--coral:#e57e60;--yellow:#f4c765}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}body{background:var(--sky);font-family:-apple-system,"PingFang SC",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}button,a{touch-action:none}button{border:0;background:none;padding:0;color:var(--ink);cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid var(--ink);outline-offset:4px}svg{display:block;width:100%;height:100%;pointer-events:none;overflow:visible}
#back{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:48px;height:48px;border-radius:50%;background:var(--cream);display:grid;place-items:center;color:var(--ink)}#back svg{width:24px;height:24px}
main{height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:max(72px,calc(env(safe-area-inset-top) + 64px)) max(12px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#scene{position:relative;width:min(100%,900px,calc((100dvh - 236px)*1.45));aspect-ratio:900/620;flex-shrink:0;border-radius:32px;isolation:isolate}#backdrop{position:absolute;inset:0;border-radius:32px;overflow:hidden}.prop{position:absolute;min-width:44px;min-height:44px;z-index:2}.prop svg{transition:filter .15s}.prop:active svg{filter:brightness(1.1)}
#sun{left:79%;top:3%;width:13%;height:18%}#cloud{left:10%;top:3%;width:23%;height:15%}#sign{left:43%;top:18%;width:14%;height:16%}#cat{left:83%;top:71%;width:14%;height:21%}
#car-zone{position:absolute;left:10%;top:38%;width:77%;height:46%;z-index:3;--paint:#e98263;transform-origin:50% 92%}#car-art{position:absolute;inset:0}.car-hit{position:absolute;min-width:44px;min-height:44px;border-radius:24px}#body-hit{left:19%;top:35%;width:57%;height:29%}#driver{left:41%;top:5%;width:19%;height:30%}#horn{left:84%;top:41%;width:15%;height:25%}.wheel-hit{top:64%;width:21%;height:35%}#left-wheel{left:12%}#right-wheel{left:67%}.wheel-art{transform-box:fill-box;transform-origin:center bottom;transition:transform .24s,opacity .18s}.absent{opacity:0}.flat{transform:scaleY(.56)}.loose .hub{fill:var(--coral)}.loose{animation:loose 1.1s ease-in-out infinite}.mud{transition:opacity .25s}.shine{opacity:0}.ready .shine{opacity:1}.ready #horn{animation:hint 1.5s infinite}.driving{animation:drive 2.2s cubic-bezier(.5,0,.8,.5) forwards}.arriving{animation:arrive .75s ease-out}.driving .wheel-art{animation:wheel-spin .3s linear infinite;transform-origin:center}
#tools{display:flex;align-items:center;justify-content:center;gap:16px;padding:16px 24px;background:#a3c9b7;border-radius:32px;box-shadow:0 8px 0 #83ac99,0 16px 24px #294c4914;width:min(100%,600px);flex-shrink:0}.tool{width:96px;height:96px;border-radius:24px;background:var(--cream);box-shadow:0 5px 0 #dbc99e;position:relative;transition:background .15s}.tool svg{padding:12px}.tool.selected{background:var(--yellow);outline:4px solid var(--ink);outline-offset:4px}.held svg{opacity:.18}.hint{outline:4px dashed #f7c250;outline-offset:4px;animation:hint 1.3s ease-in-out infinite}.over{background:#fff0cf45;outline:4px solid var(--yellow)}.pop{animation:pop .34s ease-out}.wobble{animation:wobble .35s ease-out}.ghost{position:fixed;z-index:40;width:80px;height:80px;pointer-events:none;filter:drop-shadow(0 8px 8px #294c4930)}.ghost svg{width:100%;height:100%}.puff{position:fixed;border:3px solid var(--cream);border-radius:50%;width:20px;height:20px;pointer-events:none;z-index:45;animation:puff .65s ease-out forwards}.ground-ring{position:absolute;width:24px;height:12px;border:3px solid var(--yellow);border-radius:50%;pointer-events:none;animation:puff .65s ease-out forwards;z-index:4}
@keyframes pop{40%{scale:1.1;translate:0 -4px}}@keyframes wobble{25%{rotate:-5deg}75%{rotate:5deg}}@keyframes loose{50%{rotate:5deg}}@keyframes hint{50%{filter:brightness(1.15)}}@keyframes puff{to{scale:2.5;translate:0 -24px;opacity:0}}@keyframes drive{0%{translate:0 0;rotate:0}10%{translate:-2% 0;rotate:-2deg}100%{translate:150% 0;rotate:0}}@keyframes arrive{from{translate:-140% 0}to{translate:0 0}}@keyframes wheel-spin{to{rotate:360deg}}
@media(max-width:500px){main{gap:24px}#tools{gap:12px;padding:12px;border-radius:24px}.tool{width:calc((100vw - 84px)/4);height:calc((100vw - 84px)/4);max-height:80px}.tool svg{padding:8px}#scene{width:100%}}
@media(max-height:540px) and (orientation:landscape){main{padding:16px max(72px,env(safe-area-inset-right)) 24px max(72px,env(safe-area-inset-left));gap:12px}#scene{width:min(100%,calc((100dvh - 140px)*1.45))}#tools{padding:8px 16px;gap:16px;width:auto}.tool{width:64px;height:64px}.tool svg{padding:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.hint{filter:brightness(1.12)}}
</style>

   <rect x="607" y="154" width="42" height="26" rx="12" fill="#ffe49b"/><rect x="35" y="167" width="19" height="27" rx="8" fill="#b85243"/><path d="M30 224H658" stroke="#f8db9e" stroke-width="18" stroke-linecap="round"/>

 <button class="tool" id="wrench" aria-label="拿扳手"><svg viewBox="0 0 100 100"><path d="M25 13C6 34 20 55 41 49L71 85Q78 91 86 81Q91 76 85 69L52 37C58 14 42 5 30 9L43 24L30 35Z" fill="#79a8a3"/><circle cx="77" cy="77" r="5" fill="#fff0cf"/></svg></button>
 <button class="tool" id="pump" aria-label="拿气筒"><svg viewBox="0 0 100 100"><path d="M61 77H75Q88 76 88 61V39" fill="none" stroke="#496c64" stroke-width="6" stroke-linecap="round"/><rect x="31" y="31" width="29" height="52" rx="10" fill="#e88465"/><path d="M45 12V34M23 11H67M25 84H68" stroke="#496c64" stroke-width="9" stroke-linecap="round"/><rect x="38" y="44" width="15" height="25" rx="6" fill="#f7bd87"/></svg></button>
 <button class="tool" id="sponge" aria-label="拿海绵"><svg viewBox="0 0 100 100"><path d="M18 28Q28 15 39 24Q52 13 62 25Q85 17 87 39L83 74Q76 88 62 78Q45 89 36 77Q14 85 13 67Z" fill="#f4c765"/><g fill="#dca34e"><circle cx="33" cy="43" r="5"/><circle cx="58" cy="38" r="4"/><circle cx="70" cy="57" r="5"/><circle cx="41" cy="65" r="6"/></g><g fill="#e6f4e8" stroke="#a5c6ba" stroke-width="2"><circle cx="78" cy="18" r="10"/><circle cx="91" cy="34" r="6"/><circle cx="17" cy="16" r="6"/></g></svg></button>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pointers=new Map(), tools=['tire','wrench','pump','sponge'];
const voice=new Audio('audio/intro.mp3');voice.preload='auto';voice.volume=.7;
let round=0,phase='play',fault={},selected=null,misses=0,context=null,voiceTimer=0,roundTimer=0,lastInput=Date.now(),introduced=false,lastTone=0;
const layouts=[{missing:true,air:0,mud:3},{missing:false,air:0,mud:3},{missing:true,air:3,mud:3},{missing:true,air:0,mud:0}];
function tone(freq=500){
 if(performance.now()-lastTone<45)return;lastTone=performance.now();
 try{context??=new(window.AudioContext||window.webkitAudioContext)();context.resume().catch(()=>{});const o=context.createOscillator(),g=context.createGain();o.frequency.setValueAtTime(freq,context.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.65,context.currentTime+.15);g.gain.setValueAtTime(.09,context.currentTime);g.gain.exponentialRampToValueAtTime(.001,context.currentTime+.2);o.connect(g);g.connect(context.destination);o.start();o.stop(context.currentTime+.21);}catch{}
}
function say(name){
 if(document.hidden)return;clearTimeout(voiceTimer);voice.pause();const src=`audio/${name}.mp3`;
 if(voice.getAttribute('src')!==src)voice.src=src;else voice.currentTime=0;
 voice.play().catch(()=>{});voiceTimer=setTimeout(()=>voice.pause(),6000);
}
function animate(el,name='pop'){el.classList.remove(name);void el.getBoundingClientRect();el.classList.add(name);}
function burst(el,color='#fff0cf'){
 const b=el.getBoundingClientRect();for(let i=0;i<4;i++){const p=document.createElement('i');p.className='puff';p.style.cssText=`left:${b.x+b.width/2+(i-1.5)*16}px;top:${b.y+b.height/2}px;border-color:${color}`;document.body.append(p);setTimeout(()=>p.remove(),700);}
}
function feedback(el){lastInput=Date.now();animate(el);tone();if(!introduced){introduced=true;say('intro');}}
function needs(){if(fault.missing)return 'tire';if(!fault.tight)return 'wrench';if(fault.air<3)return 'pump';if(fault.mud)return 'sponge';return null;}
function targetFor(tool){return tool==='sponge'?'body-hit':`${fault.side}-wheel`;}
function clearHints(){$$('.hint').forEach(el=>el.classList.remove('hint'));}
function hint(){clearHints();if(phase!=='play')return;const n=needs();if(n){$(`#${n}`).classList.add('hint');$(`#${targetFor(n)}`).classList.add('hint');}else $('#horn').classList.add('hint');}
function render(){
 for(const side of ['left','right']){const el=$(`#${side}-art`),active=side===fault.side;el.classList.toggle('absent',active&&fault.missing);el.classList.toggle('loose',active&&!fault.missing&&!fault.tight);el.classList.toggle('flat',active&&!fault.missing&&fault.air<3);if(active&&!fault.missing&&fault.air<3)el.style.transform=`scaleY(${.5+fault.air/6})`;else el.style.transform='';}
 $$('#axle circle').forEach((el,i)=>el.style.opacity=fault.missing&&fault.side===['left','right'][i]?'1':'0');
 $$('.mud').forEach((el,i)=>el.style.opacity=i<fault.mud?'1':'0');$('#car-zone').classList.toggle('ready',!needs());
 for(const id of tools){$(`#${id}`).classList.toggle('selected',selected===id);$(`#${id}`).setAttribute('aria-pressed',String(selected===id));}
}
function miss(el,name='look'){misses++;animate(el,'wobble');tone(280);say(name);if(misses>=2)hint();}
// 所有输入在这里按最新状态判定，提示和第二根手指均不能绕过依赖。
function use(tool,target){
 if(phase!=='play')return false;const el=$(`#${target}`);if(!el||!tools.includes(tool))return false;
 const wheel=target===`${fault.side}-wheel`,body=target==='body-hit';let valid=false;
 if(tool==='sponge'&&body&&fault.mud){fault.mud--;valid=true;}
 if(wheel){
  if(tool==='tire'&&fault.missing){fault.missing=false;fault.tight=false;valid=true;}
  else if(tool==='wrench'&&!fault.missing&&!fault.tight){fault.tight=true;valid=true;}
  else if(tool==='pump'&&!fault.missing&&fault.tight&&fault.air<3){fault.air++;valid=true;}
 }
 if(!valid){miss(el,wheel&&fault.missing?'wheel_first':wheel&&!fault.tight?'tighten_first':'look');return false;}
 misses=0;clearHints();render();animate(el);burst(el,tool==='sponge'?'#e9faf4':'#f4c765');tone(720);
 say(!needs()?'ready':tool==='tire'?'fitted':tool==='wrench'?'tight':tool==='pump'?'air':'clean');
 if(!needs())hint();return true;
}
function heldTool(id){return [...pointers.values()].some(p=>p.tool===id);}
function choose(id){if(heldTool(id)){say('release');return;}selected=selected===id?null:id;render();if(selected)say(id);}
function drive(){
 if(phase!=='play')return;if(needs()){miss($('#horn'),'not_ready');return;}
 if(pointers.size){say('release');return;}
 phase='drive';selected=null;clearHints();render();$('#car-zone').classList.remove('arriving');$('#car-zone').classList.add('driving');burst($('#car-zone'));tone(820);say('done');roundTimer=setTimeout(newRound,2600);
}
function tap(id){
 if(tools.includes(id)){if(phase==='play')choose(id);return;}
 if(['left-wheel','right-wheel','body-hit'].includes(id)){if(selected){if(heldTool(selected))say('release');else use(selected,id);}else{say(id==='body-hit'&&fault.mud?'sponge':id===`${fault.side}-wheel`&&needs()?needs():'hello');}return;}
 if(id==='horn'){drive();return;}
 if(id==='driver'){burst($('#driver'),'#e88465');say('hello');return;}
 if(id==='cat'){animate($('#cat'),'wobble');tone(650);burst($('#cat'));return;}
 if(id==='cloud'){burst($('#cloud'),'#b1d8e5');tone(340);return;}
 if(id==='sun'){burst($('#sun'),'#f4c765');tone(860);return;}
 if(id==='sign'){animate($('#sign'),'wobble');say(needs()||'ready');}
}
function targetAt(x,y){
 const candidates=['left-wheel','right-wheel','body-hit'].map(id=>({id,b:$(`#${id}`).getBoundingClientRect()}));
 const inside=pad=>candidates.filter(({b})=>x>=b.left-pad&&x<=b.right+pad&&y>=b.top-pad&&y<=b.bottom+pad);
 const hits=inside(0);const close=hits.length?hits:inside(12);close.sort((a,b)=>Math.hypot(x-a.b.x-a.b.width/2,y-a.b.y-a.b.height/2)-Math.hypot(x-b.b.x-b.b.width/2,y-b.b.y-b.b.height/2));return close[0]?.id||null;
}
function clearPointer(id){
 const p=pointers.get(id);if(!p)return;pointers.delete(id);p.ghost?.remove();p.el.classList.remove('held');try{p.el.releasePointerCapture(id);}catch{};refreshOver();
}
function clearAll(){for(const id of [...pointers.keys()])clearPointer(id);selected=null;render();}
function refreshOver(){$$('.over').forEach(el=>el.classList.remove('over'));for(const p of pointers.values())if(p.over)$(`#${p.over}`).classList.add('over');}
function ghost(p,e){
 if(!p.ghost){p.ghost=document.createElement('div');p.ghost.className='ghost';p.ghost.innerHTML=p.el.innerHTML;p.ghost.setAttribute('aria-hidden','true');document.body.append(p.ghost);p.el.classList.add('held');}
 p.ghost.style.left=`${e.clientX-40}px`;p.ghost.style.top=`${e.clientY-40}px`;
}
for(const el of $$('button')){
 el.addEventListener('pointerdown',e=>{
  if(e.button!==0||[...pointers.values()].some(p=>p.el===el))return;e.preventDefault();feedback(el);
  if(phase!=='play'&&tools.includes(el.id))return;
  pointers.set(e.pointerId,{id:e.pointerId,el,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false,tool:tools.includes(el.id)?el.id:null,round,over:null,distance:0,worked:false});
  try{el.setPointerCapture(e.pointerId);}catch{}
 });
 // pointer 的点击由自己的 pointerup 执行；保留键盘/辅助技术生成的 detail=0 click。
 el.addEventListener('click',e=>{if(e.detail===0&&!e.pointerType){feedback(el);tap(el.id);}});
}
document.addEventListener('pointermove',e=>{
 const p=pointers.get(e.pointerId);if(!p||!p.tool||p.round!==round)return;
 if(Math.hypot(e.clientX-p.x,e.clientY-p.y)>9)p.moved=true;if(!p.moved)return;
 if(selected===p.tool){selected=null;render();}ghost(p,e);
 const target=targetAt(e.clientX,e.clientY);if(p.over!==target){p.distance=0;p.worked=false;}p.over=target;
 p.distance+=Math.hypot(e.clientX-p.lastX,e.clientY-p.lastY);p.lastX=e.clientX;p.lastY=e.clientY;
 // 擦洗和打气是连续动作；位移而非帧数计工，停住不会自动完成。
 if(target&&['sponge','pump'].includes(p.tool)&&p.distance>28){
  const can=p.tool==='sponge'?target==='body-hit'&&fault.mud>0:target===`${fault.side}-wheel`&&!fault.missing&&fault.tight&&fault.air<3;
  if(can){use(p.tool,target);p.worked=true;p.distance=0;}
 }
 refreshOver();
});
document.addEventListener('pointerup',e=>{
 const p=pointers.get(e.pointerId);if(!p)return;const target=p.tool&&p.moved?targetAt(e.clientX,e.clientY):null;clearPointer(e.pointerId);
 if(p.round!==round)return;if(p.tool&&p.moved){if(selected===p.tool)selected=null;render();if(target){if(!p.worked)use(p.tool,target);}else miss(p.el,'place');}
 else if(Math.hypot(e.clientX-p.x,e.clientY-p.y)<20)tap(p.el.id);
});
for(const type of ['pointercancel','lostpointercapture'])document.addEventListener(type,e=>clearPointer(e.pointerId));
$('#scene').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();lastInput=Date.now();tone(380);const p=document.createElement('i');p.className='puff';p.style.left=`${e.clientX}px`;p.style.top=`${e.clientY}px`;document.body.append(p);setTimeout(()=>p.remove(),700);});
function newRound(){
 clearTimeout(roundTimer);clearAll();round++;phase='play';const pattern=layouts[(round-1)%layouts.length];fault={...pattern,tight:!pattern.missing,side:round%2?'left':'right'};misses=0;lastInput=Date.now();clearHints();
 $('#car-zone').style.setProperty('--paint',['#e98263','#6aa9b5','#d8ae55','#92a276'][(round-1)%4]);$('#car-zone').classList.remove('driving');animate($('#car-zone'),'arriving');render();if(introduced)say('intro');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){location.href='../../';return;}if(e.repeat)return;if(['1','2','3','4'].includes(e.key)){e.preventDefault();const el=$(`#${tools[+e.key-1]}`);feedback(el);tap(el.id);}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const el=$(e.key==='ArrowLeft'?'#left-wheel':'#right-wheel');feedback(el);tap(el.id);}});
window.addEventListener('blur',clearAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearAll();voice.pause();}else{lastInput=Date.now();if(phase==='drive')newRound();}});
window.addEventListener('pagehide',()=>{clearAll();clearTimeout(roundTimer);clearTimeout(voiceTimer);voice.pause();});
window.addEventListener('pageshow',e=>{if(e.persisted){clearAll();if(phase==='drive')newRound();}});
setInterval(()=>{if(!document.hidden&&phase==='play'&&!pointers.size&&Date.now()-lastInput>8000)hint();},2000);
newRound();
(async()=>{const queue=['tire','wrench','pump','sponge','fitted','tight','air','clean','ready','done','hello','look','wheel_first','tighten_first','not_ready','place','release'];await Promise.all(Array.from({length:3},async()=>{while(queue.length){try{const r=await fetch(`audio/${queue.shift()}.mp3`);if(r.ok)await r.arrayBuffer();}catch{}}}));})();
</script>
