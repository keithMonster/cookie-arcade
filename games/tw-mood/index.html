<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>彩色心情 · Cookie's Arcade</title>
<script src="../_lib/twirlywoos.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #f5f5f5;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color 1.2s ease-out;
    font-family: -apple-system, "PingFang SC", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: none) {
    #back { color: rgba(0, 0, 0, 0.4) !important; }
  }

  #stage { position: fixed; inset: 0; overflow: hidden; }

  /* 中央角色 */
  .mood-char {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: clamp(220px, 40vmin, 460px);
    aspect-ratio: 200 / 270;
    pointer-events: none;
    will-change: transform, opacity;
    animation: char-life 2200ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes char-life {
    0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    20%  { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    35%  { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
    80%  { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0; }
  }
  .mood-char svg {
    width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.12));
  }

  /* 圆环涟漪 */
  .ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    border: 6px solid;
    will-change: transform, opacity;
    animation: ring-out 1400ms ease-out forwards;
  }
  @keyframes ring-out {
    0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(4);   opacity: 0; }
  }

  #back {
    position: fixed; top: 0; right: 0;
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    color: rgba(0, 0, 0, 0.15);
    text-decoration: none;
  }
  #back:hover { color: rgba(0, 0, 0, 0.7); background: rgba(0, 0, 0, 0.04); }

  #hint {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(0, 0, 0, 0.4);
    font-size: 22px; letter-spacing: 0.1em;
    pointer-events: none; transition: opacity 600ms;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<a id="back" href="../../">←</a>
<div id="hint">戳一戳变颜色</div>

<script>
  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  let started = false;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // 角色对应"心情底色"：用 belly 色作为柔和背景
  const MOOD_BG = {
    bighoo:   '#bedffd',
    toodloo:  '#fdc4b8',
    chickedy: '#fde29a',
    chick:    '#fff39c',
  };

  // 唯一化：当前活动的角色 + 长延音节点，新触发时立即清旧
  let activeCharEl = null;
  let activeNotes = null; // { osc, osc2, gain, gain2, stopTime }

  function trigger(charKey, x, y) {
    if (!started) start();
    const ck = charKey || pick(TW.CHAR_LIST);
    const c = TW.CHARS[ck];

    // 背景渐变
    document.body.style.background = MOOD_BG[ck];

    // 清旧角色（淡出快）——先取消运行中的 CSS animation，否则 forwards 动画接管
    // opacity，inline 赋值和 transition 都不生效（实际变成 200ms 后硬切）
    if (activeCharEl) {
      const old = activeCharEl;
      old.getAnimations().forEach(a => a.cancel());
      old.style.transition = 'opacity 180ms';
      old.style.opacity = '0';
      setTimeout(() => old.remove(), 200);
    }

    // 中央新角色
    const charEl = document.createElement('div');
    charEl.className = 'mood-char';
    charEl.innerHTML = TW.svg(ck, { expression: 'cheer' });
    stage.appendChild(charEl);
    activeCharEl = charEl;
    setTimeout(() => {
      if (activeCharEl === charEl) activeCharEl = null;
      charEl.remove();
    }, 2300);

    // 涟漪环（每次都加，1.4s 自然消失）
    const rx = (x === undefined) ? window.innerWidth / 2 : x;
    const ry = (y === undefined) ? window.innerHeight / 2 : y;
    const ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.left = rx + 'px';
    ring.style.top = ry + 'px';
    ring.style.width = '180px';
    ring.style.height = '180px';
    ring.style.borderColor = c.body;
    stage.appendChild(ring);
    setTimeout(() => ring.remove(), 1500);

    // 长延音（打断旧的）
    playLong(ck);
  }

  // 长延音：新触发淡出旧的（避免叠加打架）
  function playLong(ck) {
    const ctx = TW.ensureCtx();
    const now = ctx.currentTime;
    const c = TW.CHARS[ck];
    const baseFreq = 220 / Math.max(0.5, c.sizeRatio);

    // 淡出旧延音（fade 50ms 内）
    if (activeNotes) {
      const old = activeNotes;
      try {
        old.gain.gain.cancelScheduledValues(now);
        old.gain2.gain.cancelScheduledValues(now);
        old.gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
        old.gain2.gain.linearRampToValueAtTime(0.001, now + 0.05);
        old.osc.stop(now + 0.06);
        old.osc2.stop(now + 0.06);
      } catch (_) {}
      activeNotes = null;
    }

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(baseFreq, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.08);
    gain.gain.setValueAtTime(0.18, now + 1.6);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 2.3);
    // 第二谐波
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = baseFreq * 1.5;
    gain2.gain.setValueAtTime(0, now);
    gain2.gain.linearRampToValueAtTime(0.08, now + 0.1);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
    osc2.connect(gain2).connect(ctx.destination);
    osc2.start(now);
    osc2.stop(now + 1.9);

    const notes = { osc, osc2, gain, gain2, stopTime: now + 2.3 };
    activeNotes = notes;
    setTimeout(() => { if (activeNotes === notes) activeNotes = null; }, 2400);
  }

  function start() {
    if (started) return;
    started = true;
    hint.classList.add('gone');
    setTimeout(() => hint.remove(), 800);
    TW.ensureCtx();
  }

  // 键盘：1-4 选角色 / 其它键随机
  const KEY_MAP = ['bighoo', 'toodloo', 'chickedy', 'chick'];
  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;   // 按住键 OS 自动重复不是真实按键（长延音游戏被连触=噪墙）
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === 'Escape') {
      if (!document.fullscreenElement) location.href = '../../';
      return;
    }
    e.preventDefault();
    if ((e.key === 'f' || e.key === 'F') && !document.fullscreenElement) {
      // 已全屏时 F 键不再拦截——落回下方正常变色反馈（每按必反馈）
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      return;
    }
    const idx = parseInt(e.key, 10);
    if (idx >= 1 && idx <= 4) trigger(KEY_MAP[idx - 1]);
    else trigger();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('#back')) return;
    trigger(undefined, e.clientX, e.clientY);
  });
  document.addEventListener('touchstart', (e) => {
    if (e.target.closest('#back')) return;
    if (!started) start();
    for (const t of e.changedTouches) {
      trigger(undefined, t.clientX, t.clientY);
    }
    e.preventDefault();
  }, { passive: false });
</script>
</body>
</html>
