<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>车车 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    /* 天空 → 草地 横线分界，柔色调 */
    background: linear-gradient(180deg,
      #bfe0ff 0%,
      #e2f0fc 55%,
      #98d086 55%,
      #6cba5f 100%);
  }

  /* 远山剪影：靠 SVG 浮在地平线 */
  .hills {
    position: fixed;
    left: 0; right: 0;
    bottom: 38vh;
    height: 14vh;
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }

  /* 远处云朵：3 个慢慢飘 */
  .cloud {
    position: fixed;
    pointer-events: none;
    font-size: 14vmin;
    line-height: 1;
    opacity: 0.85;
    will-change: transform;
    animation: drift 60s linear infinite;
    z-index: 0;
  }
  .cloud.c1 { top: 6%;  left: -20%; animation-duration: 80s; }
  .cloud.c2 { top: 14%; left: -30%; animation-duration: 100s; animation-delay: -30s; font-size: 10vmin; }
  .cloud.c3 { top: 22%; left: -25%; animation-duration: 110s; animation-delay: -60s; font-size: 12vmin; }
  @keyframes drift {
    0%   { transform: translateX(0); }
    100% { transform: translateX(160vw); }
  }

  /* 太阳 */
  .sun {
    position: fixed;
    top: 4%;
    right: 5%;
    font-size: 14vmin;
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 0 30px rgba(255, 220, 100, 0.6));
    animation: sun-pulse 4s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes sun-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* 车舞台 */
  #stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
  }

  /* 一辆车 */
  .vehicle {
    position: absolute;
    pointer-events: none;
    will-change: transform, left;
    transform-origin: center bottom;
  }
  .em {
    font-size: 22vmin;
    line-height: 1;
    filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.18));
    animation: wobble 0.36s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes wobble {
    0%   { transform: translateY(0) rotate(-1.2deg); }
    100% { transform: translateY(-2%) rotate(1.2deg); }
  }
  .em.flip { transform: scaleX(-1); animation: wobble-flip 0.36s ease-in-out infinite alternate; }
  @keyframes wobble-flip {
    0%   { transform: scaleX(-1) translateY(0) rotate(1.2deg); }
    100% { transform: scaleX(-1) translateY(-2%) rotate(-1.2deg); }
  }

  /* 急救车类的双闪灯 */
  .lights {
    position: absolute;
    top: -2%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    pointer-events: none;
  }
  .light {
    width: 4vmin;
    height: 4vmin;
    border-radius: 50%;
    opacity: 0.5;
    animation: light-flash 0.42s ease-in-out infinite alternate;
  }
  @keyframes light-flash {
    0%   { opacity: 0.35; transform: scale(0.85); }
    100% { opacity: 1;    transform: scale(1.15); }
  }

  /* 尘土 puff（车出现时） */
  .dust {
    position: absolute;
    width: 12vmin;
    height: 12vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(160, 130, 80, 0.5) 0%, rgba(160, 130, 80, 0) 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: dust-puff 700ms ease-out forwards;
  }
  @keyframes dust-puff {
    0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    20%  { transform: translate(-50%, -50%) scale(1);   opacity: 0.85; }
    100% { transform: translate(-50%, -30%) scale(1.6); opacity: 0; }
  }

  /* 路面尘土轨迹（车行进时尾巴） */
  .trail {
    position: absolute;
    width: 6vmin;
    height: 6vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180, 150, 100, 0.4) 0%, rgba(180, 150, 100, 0) 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: trail-fade 1.2s ease-out forwards;
  }
  @keyframes trail-fade {
    0%   { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0;   transform: translate(-50%, -80%) scale(1.5); }
  }

  /* 返回按钮 */
  #back {
    position: fixed; top: 0; right: 0;
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(50, 30, 18, 0.45);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
  }
  #back:active { color: #000; }

  /* 一开始的轻提示 */
  #hint {
    position: fixed;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(16px, 2.5vmin, 24px);
    letter-spacing: 0.3em;
    color: rgba(50, 30, 18, 0.6);
    pointer-events: none;
    transition: opacity 600ms;
    z-index: 100;
    background: rgba(255, 255, 255, 0.5);
    padding: 8px 22px;
    border-radius: 20px;
    backdrop-filter: blur(6px);
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<svg class="hills" viewBox="0 0 1200 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,140 L0,80 Q150,20 300,60 T600,40 Q750,30 900,70 T1200,50 L1200,140 Z" fill="#7da567"/>
  <path d="M0,140 L0,110 Q200,70 400,95 T800,85 Q1000,80 1200,100 L1200,140 Z" fill="#5a8c52"/>
</svg>

<div class="sun">☀️</div>
<div class="cloud c1">☁️</div>
<div class="cloud c2">☁️</div>
<div class="cloud c3">☁️</div>

<div id="stage"></div>
<a id="back" href="../../">←</a>
<div id="hint">戳一戳，车车开过来</div>

<script>
// ===== 车车池 =====
// emoji + 中文名 + 拟声词 + audio key（对应 audio/<key>.mp3）+ 可选闪光灯
const VEHICLES = [
  { emoji: '🚌', name: '校车',     cry: '嘀嘀',           key: 'bus' },
  { emoji: '🚒', name: '消防车',   cry: '呜呜呜',         key: 'firetruck', flash: ['#ff3a3a', '#ffeb3b'] },
  { emoji: '🚓', name: '警车',     cry: '嘀嘟嘀嘟',       key: 'police',    flash: ['#3a6dff', '#ff3a3a'] },
  { emoji: '🚑', name: '救护车',   cry: '呜哇呜哇',       key: 'ambulance', flash: ['#ff3a3a', '#ffffff'] },
  { emoji: '🚜', name: '拖拉机',   cry: '突突突',         key: 'tractor' },
  { emoji: '🚛', name: '大卡车',   cry: '嘟嘟',           key: 'truck' },
  { emoji: '🚗', name: '小汽车',   cry: '滴滴',           key: 'car' },
  { emoji: '🚂', name: '小火车',   cry: '呜呜呜，哐当哐当', key: 'train' },
  { emoji: '🏍️', name: '摩托车',  cry: '嗡嗡嗡',         key: 'motorbike' },
];

// ===== 音频（预录 mp3，避开 iOS SpeechSynthesis 整段——Keith iPad 实证 SpeechSynthesis 静默） =====
// audio/<key>.mp3 是火山引擎灿灿音色离线生成（tools/gen-audio.py）
const audioCache = {};
// 人声 300ms 最小间隔——手掌拍屏 3-5 触点各 spawn 一辆是好的（视觉并行），
// 但 3-5 段「名字+拟声」同时开播只会混成噪音，音频单独节流
let lastVoiceAt = 0;
function playAudio(key) {
  const now = Date.now();
  if (now - lastVoiceAt < 300) return;
  lastVoiceAt = now;
  let a = audioCache[key];
  if (!a) {
    a = new Audio(`audio/${key}.mp3`);
    a.preload = 'auto';
    audioCache[key] = a;
  }
  a.currentTime = 0;
  a.play().catch(() => {});
}

// 进入后空闲预载全部车声 mp3——首戳出声不等网络（2026-06-10）
// fetch 暖 HTTP 缓存 + Audio 元素双轨（iOS Safari 对媒体 preload='auto' 消极，fetch 兜底真下载）
setTimeout(() => {
  VEHICLES.forEach(({ key }) => {
    if (!audioCache[key]) {
      const a = new Audio(`audio/${key}.mp3`);
      a.preload = 'auto';
      audioCache[key] = a;
    }
    fetch(`audio/${key}.mp3`).catch(() => {});
  });
}, 400);

// ===== 工具 =====
const stage = document.getElementById('stage');
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// 洗牌队列：一轮 9 辆全亮相再重洗——纯随机短期重复感强（连戳老出同一辆，2026-06-10）
let vehicleBag = [];
function nextVehicle() {
  if (!vehicleBag.length) {
    vehicleBag = VEHICLES.slice();
    for (let i = vehicleBag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [vehicleBag[i], vehicleBag[j]] = [vehicleBag[j], vehicleBag[i]];
    }
  }
  return vehicleBag.pop();
}

// ===== 召唤一辆车 =====
const MAX_VEHICLES = 12;   // baby 狂戳上限：超限删最老，防 DOM 节点 + setInterval 无限堆积
const liveVehicles = [];   // { el, trailInterval, exitTimer }

// 清理一辆车（自然退场 / 被上限挤掉都走这里），indexOf 守卫保证幂等
function removeVehicle(rec) {
  const i = liveVehicles.indexOf(rec);
  if (i === -1) return;
  liveVehicles.splice(i, 1);
  clearInterval(rec.trailInterval);
  clearTimeout(rec.exitTimer);
  rec.el.remove();
}

// v 不传 = 洗牌队列取下一辆；传了 = 指定那辆
function spawn(x, y, v) {
  if (!v) v = nextVehicle();
  while (liveVehicles.length >= MAX_VEHICLES) removeVehicle(liveVehicles[0]);  // 删最老
  const W = window.innerWidth;
  const H = window.innerHeight;

  // 方向：尽量给车留长路——tap 在左半屏，往右开（flip）；右半屏，往左开（默认 emoji 朝向）
  // emoji 自带朝向：Apple/Android 主流车 emoji 多为车头朝左
  const goRight = (x < W * 0.5);
  const dir = goRight ? 1 : -1;
  const exitX = goRight ? W + 280 : -280;

  // y 限定：避开顶部太阳/云，避开底部地平线下沿；以 tap.y 为中心向中央温和拉
  const yClamped = clamp(y, H * 0.18, H * 0.85);

  // 车元素
  const el = document.createElement('div');
  el.className = 'vehicle';
  el.style.left = x + 'px';
  el.style.top = yClamped + 'px';
  // emoji 的 transform-origin = center；按 22vmin 大小，给 -50%/-50% 居中
  el.style.transform = 'translate(-50%, -50%)';

  const em = document.createElement('div');
  em.className = 'em' + (goRight ? ' flip' : '');
  em.textContent = v.emoji;
  el.appendChild(em);

  // 闪光灯（仅急救/警/消）
  if (v.flash) {
    const lights = document.createElement('div');
    lights.className = 'lights';
    v.flash.forEach((c, i) => {
      const lt = document.createElement('div');
      lt.className = 'light';
      lt.style.background = c;
      lt.style.boxShadow = `0 0 18px ${c}, 0 0 32px ${c}`;
      lt.style.animationDelay = (i * 0.21) + 's';
      lights.appendChild(lt);
    });
    el.appendChild(lights);
  }

  stage.appendChild(el);
  // 强制 reflow 落定初始样式——新插入元素首次样式计算无 before-change style，
  // 单 rAF 内同帧设 transition+终点可能不触发过渡（车瞬移出屏）
  void el.offsetWidth;

  // 出现处弹尘土
  spawnDust(x, yClamped + 30);

  // 启动行驶动画（4-6 秒，根据距离）
  const distance = Math.abs(exitX - x);
  const duration = clamp(distance / 280, 3.0, 6.0); // 280 px/s 速度
  requestAnimationFrame(() => {
    el.style.transition = `left ${duration}s linear`;
    el.style.left = exitX + 'px';
  });

  // 沿途间歇尾巴尘土
  const trailInterval = setInterval(() => {
    const rect = el.getBoundingClientRect();
    const tx = rect.left + rect.width / 2 + (goRight ? -40 : 40);
    const ty = rect.top + rect.height / 2 + 30;
    spawnTrail(tx, ty);
  }, 220);

  // 预录 mp3 念「name，cry」
  playAudio(v.key);

  // 登记进 liveVehicles，退场清理统一走 removeVehicle（自然退场 / 被上限挤掉同源）
  const rec = { el, trailInterval, exitTimer: null };
  rec.exitTimer = setTimeout(() => removeVehicle(rec), duration * 1000 + 200);
  liveVehicles.push(rec);
}

function spawnDust(x, y) {
  const d = document.createElement('div');
  d.className = 'dust';
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  stage.appendChild(d);
  setTimeout(() => d.remove(), 800);
}

function spawnTrail(x, y) {
  const d = document.createElement('div');
  d.className = 'trail';
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  stage.appendChild(d);
  setTimeout(() => d.remove(), 1300);
}

// ===== 输入 =====
let hintGone = false;
function hideHint() {
  if (hintGone) return;
  hintGone = true;
  const h = document.getElementById('hint');
  if (h) {
    h.classList.add('gone');
    setTimeout(() => h.remove(), 800);
  }
}

document.addEventListener('click', (e) => {
  if (e.target.closest?.('#back')) return;
  hideHint();
  spawn(e.clientX, e.clientY);
});

document.addEventListener('touchstart', (e) => {
  if (e.target.closest?.('#back')) return;
  hideHint();
  for (const t of e.changedTouches) {
    spawn(t.clientX, t.clientY);
  }
  e.preventDefault();
}, { passive: false });

// 键盘：随机位置召唤；数字键 1-9 精确召唤对应车
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;   // 按住键 OS 自动重复不是真实按键
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === 'Escape') {
    if (!document.fullscreenElement) location.href = '../../';
    return;
  }
  if ((e.key === 'f' || e.key === 'F') && !document.fullscreenElement) {
    // 已全屏时 F 键不再拦截——落回下方正常游戏反馈（每按必反馈）
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    return;
  }
  e.preventDefault();
  hideHint();
  const idx = parseInt(e.key, 10);
  const W = window.innerWidth;
  const H = window.innerHeight;
  const rx = Math.random() * W * 0.4 + W * 0.3;  // 中间 40%
  const ry = Math.random() * H * 0.5 + H * 0.3;  // 中间 50%
  const specific = (idx >= 1 && idx <= VEHICLES.length) ? VEHICLES[idx - 1] : undefined;
  spawn(rx, ry, specific);
});
</script>
</body>
</html>
