<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>学说话 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    background-color: #ffc4d2;             /* 初始 = 家人主题色，paint() 后随主题切换 */
    transition: background-color 600ms ease;
  }
  /* 固定光晕：给纯色背景加一层柔和立体感（gradient 不能 transition，所以主色走 background-color、质感走这层固定 overlay） */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 18%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%),
      radial-gradient(120% 90% at 50% 110%, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0) 55%);
    pointer-events: none;
    z-index: 0;
  }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1vh;
    cursor: pointer;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1vh;
  }

  .emoji {
    font-size: 44vmin;
    line-height: 1;
    filter: drop-shadow(0 10px 0 rgba(0, 0, 0, 0.10));
    will-change: transform, opacity;
  }
  .emoji.bounce { animation: emoji-bounce 540ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes emoji-bounce {
    0%   { transform: scale(1)    rotate(0); }
    25%  { transform: scale(1.18) rotate(-5deg); }
    55%  { transform: scale(0.95) rotate(4deg); }
    100% { transform: scale(1)    rotate(0); }
  }

  .word {
    font-size: clamp(40px, 11vmin, 128px);
    font-weight: 800;
    letter-spacing: 0.16em;
    color: rgba(50, 30, 18, 0.88);
    text-shadow: 0 3px 0 rgba(255, 255, 255, 0.7);
    will-change: transform, opacity;
  }

  /* 切换动画：旧词上飞淡出，新词从下方蹦上来（复用 animals 已验证曲线；2026-06-10 提速） */
  .swap-out { animation: card-swap-out 260ms ease-in forwards; }
  .swap-in  { animation: card-swap-in  400ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes card-swap-out {
    0%   { transform: translateY(0)    scale(1)   rotate(0); opacity: 1; }
    100% { transform: translateY(-26%) scale(0.4) rotate(-16deg); opacity: 0; }
  }
  @keyframes card-swap-in {
    0%   { transform: translateY(38%) scale(0.3) rotate(13deg); opacity: 0; }
    60%  { transform: translateY(-5%) scale(1.12) rotate(-3deg); opacity: 1; }
    100% { transform: translateY(0)   scale(1)    rotate(0); opacity: 1; }
  }

  /* 闪光圈：戳一下从词中心扩散 */
  .ring {
    position: absolute;
    left: 50%;
    top: 44%;
    width: 38%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 8px solid rgba(255, 255, 255, 0.75);
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }
  .ring.pulse { animation: ring-pulse 600ms ease-out forwards; }
  @keyframes ring-pulse {
    0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0.85; }
    100% { transform: translate(-50%, -50%) scale(1.9); opacity: 0; }
  }

  #back {
    position: fixed; top: 0; right: 0;
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(80, 50, 30, 0.5);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
  }
  #back:active { color: rgba(80, 50, 30, 0.9); }

  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    letter-spacing: 0.3em;
    color: rgba(80, 50, 30, 0.5);
    pointer-events: none;
    transition: opacity 600ms;
    z-index: 100;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="card" id="card">
    <div class="emoji" id="emoji"></div>
    <div class="word" id="word"></div>
  </div>
  <div class="ring" id="ring"></div>
</div>

<a id="back" href="../../">←</a>
<div id="hint">戳一戳，跟我学说话</div>

<script>
// ===== 词库 =====
// emoji 大图 + 中文词 + audio key（对应 audio/<key>.mp3）+ theme（主题索引，决定背景色）
// 按 5 主题分组排列：同主题词连续出现形成语义聚类，背景随主题渐变切换。
// 家人放第一组（情感优先）；🍪饼干 = Cookie 自己名字双关。
const WORDS = [
  // 家人
  { emoji: '👨', word: '爸爸', key: 'baba',   theme: 0 },
  { emoji: '👩', word: '妈妈', key: 'mama',   theme: 0 },
  { emoji: '👶', word: '宝宝', key: 'baobao', theme: 0 },
  { emoji: '👴', word: '爷爷', key: 'yeye',   theme: 0 },
  { emoji: '👵', word: '奶奶', key: 'nainai', theme: 0 },
  // 水果
  { emoji: '🍎', word: '苹果', key: 'apple',      theme: 1 },
  { emoji: '🍌', word: '香蕉', key: 'banana',     theme: 1 },
  { emoji: '🍓', word: '草莓', key: 'strawberry', theme: 1 },
  { emoji: '🍇', word: '葡萄', key: 'grape',      theme: 1 },
  { emoji: '🍊', word: '橘子', key: 'orange',     theme: 1 },
  { emoji: '🍉', word: '西瓜', key: 'watermelon', theme: 1 },
  // 食物
  { emoji: '🍚', word: '米饭', key: 'rice',    theme: 2 },
  { emoji: '🥚', word: '鸡蛋', key: 'egg',     theme: 2 },
  { emoji: '🥛', word: '牛奶', key: 'milk',    theme: 2 },
  { emoji: '🍞', word: '面包', key: 'bread',   theme: 2 },
  { emoji: '🍜', word: '面条', key: 'noodle',  theme: 2 },
  { emoji: '🍪', word: '饼干', key: 'biscuit', theme: 2 },
  // 身体
  { emoji: '👀', word: '眼睛', key: 'eye',   theme: 3 },
  { emoji: '👂', word: '耳朵', key: 'ear',   theme: 3 },
  { emoji: '👃', word: '鼻子', key: 'nose',  theme: 3 },
  { emoji: '👄', word: '嘴巴', key: 'mouth', theme: 3 },
  { emoji: '✋', word: '小手', key: 'hand',  theme: 3 },
  { emoji: '🦶', word: '小脚', key: 'foot',  theme: 3 },
  // 自然
  { emoji: '☀️', word: '太阳', key: 'sun',     theme: 4 },
  { emoji: '🌙', word: '月亮', key: 'moon',    theme: 4 },
  { emoji: '⭐', word: '星星', key: 'star',    theme: 4 },
  { emoji: '🌈', word: '彩虹', key: 'rainbow', theme: 4 },
  { emoji: '🌸', word: '花',   key: 'flower',  theme: 4 },
  { emoji: '🌧️', word: '下雨', key: 'rain',    theme: 4 },
];

// 每次进入洗牌：主题组顺序随机 + 组内随机（2026-06-10 Keith 反馈「每次进去都先是爸爸妈妈」）
// ——开局第一张每次不同，同时保留「同主题连续出现」的背景色语义聚类
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
const groups = [];
WORDS.forEach(w => (groups[w.theme] = groups[w.theme] || []).push(w));
const DECK = shuffle(groups.filter(Boolean).map(g => shuffle(g))).flat();

// 主题主色（柔和糖果色，互相区分）——走 background-color 以便 600ms 平滑过渡
const THEMES = ['#ffc4d2', '#ffae86', '#ffd86b', '#a8dcc0', '#9ec8f0'];

// ===== 音频（预录 mp3，避开 iOS SpeechSynthesis 整段被屏蔽——Keith iPad 实证） =====
// audio/<key>.mp3 = say -v Tingting「<词>[[slnc 700]]<词>」念两遍、中间留 700ms 白引导跟读
const audioCache = {};
function getAudio(key) {
  let a = audioCache[key];
  if (!a) {
    a = new Audio(`audio/${key}.mp3`);
    a.preload = 'auto';
    audioCache[key] = a;
    // 念完（两遍 + 留白都结束）→ 进入停留窗口，到点自动翻下一张
    a.addEventListener('ended', onSpoken);
  }
  return a;
}

// ===== DOM =====
const stage = document.getElementById('stage');
const emojiEl = document.getElementById('emoji');
const wordEl = document.getElementById('word');
const ringEl = document.getElementById('ring');

const DWELL_MS = 900;   // 念完后停留多久再自动翻（2026-06-10 1800→900：留跟读窗口但不拖节奏）

let idx = 0;
let swapping = false;
let speaking = false;   // 当前卡正在念
let spoken = false;     // 当前卡已念完（停留窗口内）
let dwellTimer = null;

function paint(i) {
  const w = DECK[i];
  emojiEl.textContent = w.emoji;
  wordEl.textContent = w.word;
  document.body.style.backgroundColor = THEMES[w.theme];
}

function pulseRing() {
  ringEl.classList.remove('pulse');
  void ringEl.offsetWidth;
  ringEl.classList.add('pulse');
}

function bounce() {
  emojiEl.classList.remove('bounce');
  void emojiEl.offsetWidth;
  emojiEl.classList.add('bounce');
}

// 戳 / 任意键的分层语义（2026-06-10 节奏调优——连戳要能往前走，不再原地重念卡死）：
// · 静默卡（还没念过）→ 念这张（保「戳 = 念眼前这张」心智，2026-06-03 校准）
// · 念的途中再戳 → 只弹跳 + 闪圈反馈，不重念不重置计时（保「每按必反馈」）
// · 念完后的停留窗口再戳 → 立即翻下一张（跳过等待）
function tap() {
  if (swapping) return;
  hideHint();
  if (speaking) { bounce(); pulseRing(); return; }
  if (spoken) { clearTimeout(dwellTimer); advance(); return; }
  speakCurrent();
}

function speakCurrent() {
  clearTimeout(dwellTimer);
  speaking = true;
  const a = getAudio(DECK[idx].key);
  a.currentTime = 0;
  a.play().catch(() => {
    // 音频失败（加载失败/手势链外）不能卡死在 speaking：当作念完，照常停留→自动翻
    speaking = false;
    spoken = true;
    scheduleAdvance();
  });
  bounce();
  pulseRing();
}

// 念完 → 标记进入停留窗口，延时 DWELL_MS 自动翻
function onSpoken() {
  speaking = false;
  spoken = true;
  scheduleAdvance();
}

function scheduleAdvance() {
  clearTimeout(dwellTimer);
  dwellTimer = setTimeout(advance, DWELL_MS);
}

function advance() {
  if (swapping) return;
  swapping = true;
  speaking = false;
  spoken = false;
  clearTimeout(dwellTimer);
  const next = (idx + 1) % DECK.length;

  emojiEl.classList.add('swap-out');
  wordEl.classList.add('swap-out');

  setTimeout(() => {
    idx = next;
    paint(idx);
    emojiEl.classList.remove('swap-out', 'bounce');
    wordEl.classList.remove('swap-out');
    void emojiEl.offsetWidth;
    emojiEl.classList.add('swap-in');
    wordEl.classList.add('swap-in');
    // 翻过来静默展示，不发音——保「戳 = 念眼前这张」的统一心智（Keith 2026-06-03 校准）
    pulseRing();
    setTimeout(() => {
      emojiEl.classList.remove('swap-in');
      wordEl.classList.remove('swap-in');
      swapping = false;
    }, 410);
  }, 260);
}

let hintGone = false;
function hideHint() {
  if (hintGone) return;
  hintGone = true;
  const h = document.getElementById('hint');
  if (h) {
    h.classList.add('gone');
    setTimeout(() => h.remove(), 800);
  }
}

// ===== 输入：整屏任意位置戳 / 任意键 =====
stage.addEventListener('click', tap, { passive: true });
stage.addEventListener('touchstart', (e) => {
  tap();
  e.preventDefault();   // 抑制 iOS 合成 click，避免一戳触发两次
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === 'Escape') {
    if (!document.fullscreenElement) location.href = '../../';
    return;
  }
  if (e.key === 'f' || e.key === 'F') {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) {
      el.requestFullscreen().catch(() => {});
    }
    return;
  }
  e.preventDefault();
  tap();
});

// 进入：静默展示第一张，等 Cookie 戳
paint(0);
</script>
</body>
</html>
