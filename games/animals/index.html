<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>动物园 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    background: #2a1810;
  }

  .grid {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
    padding: 6px;
  }

  .panel {
    position: relative;
    border-radius: 28px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 120ms cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:
      inset 0 0 0 4px rgba(255, 255, 255, 0.35),
      0 8px 20px rgba(0, 0, 0, 0.18);
    will-change: transform;
  }
  .panel:active { transform: scale(0.96); }
  .panel.pop { animation: panel-pop 420ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes panel-pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  /* 4 块固定底色（柔和糖果色，互相区分） */
  .panel.c0 { background: linear-gradient(160deg, #ffd2d8 0%, #ffb3c1 100%); } /* 粉 */
  .panel.c1 { background: linear-gradient(160deg, #cfeec9 0%, #a8dca0 100%); } /* 绿 */
  .panel.c2 { background: linear-gradient(160deg, #ffeaa8 0%, #ffd06b 100%); } /* 黄 */
  .panel.c3 { background: linear-gradient(160deg, #c8def5 0%, #9ec5ee 100%); } /* 蓝 */

  .animal {
    position: relative;
    width: 100%;
    height: 78%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .emoji {
    font-size: 38vmin;
    line-height: 1;
    filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.10));
    transition: transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform, opacity;
  }
  .emoji.bounce { animation: emoji-bounce 520ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes emoji-bounce {
    0%   { transform: scale(1)    rotate(0); }
    25%  { transform: scale(1.25) rotate(-6deg); }
    55%  { transform: scale(0.95) rotate(4deg); }
    100% { transform: scale(1)    rotate(0); }
  }

  /* 切换动画：旧字符上飞淡出，新字符从下方蹦上来 */
  .emoji.swap-out { animation: emoji-swap-out 380ms ease-in forwards; }
  .emoji.swap-in  { animation: emoji-swap-in  520ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes emoji-swap-out {
    0%   { transform: translateY(0)    scale(1)   rotate(0); opacity: 1; }
    100% { transform: translateY(-30%) scale(0.4) rotate(-20deg); opacity: 0; }
  }
  @keyframes emoji-swap-in {
    0%   { transform: translateY(40%) scale(0.3) rotate(15deg); opacity: 0; }
    60%  { transform: translateY(-6%) scale(1.15) rotate(-4deg); opacity: 1; }
    100% { transform: translateY(0)   scale(1)    rotate(0); opacity: 1; }
  }

  .name {
    font-size: clamp(28px, 6vmin, 64px);
    font-weight: 800;
    letter-spacing: 0.12em;
    color: rgba(50, 30, 18, 0.85);
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
    padding-bottom: 1.5%;
    transition: opacity 240ms;
  }
  .name.fade { opacity: 0.15; }

  /* 闪光圈：点击时从中心扩散 */
  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 30%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 6px solid rgba(255, 255, 255, 0.7);
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 0;
    pointer-events: none;
  }
  .ring.pulse { animation: ring-pulse 600ms ease-out forwards; }
  @keyframes ring-pulse {
    0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0.85; }
    100% { transform: translate(-50%, -50%) scale(2.0); opacity: 0; }
  }

  /* 返回按钮 */
  #back {
    position: fixed; top: 0; right: 0;
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(255, 255, 255, 0.55);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
  }
  #back:active { color: #fff; }

  /* 一开始的轻提示 */
  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: 0.3em;
    color: rgba(255, 255, 255, 0.55);
    pointer-events: none;
    transition: opacity 600ms;
    z-index: 100;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div class="grid" id="grid">
  <div class="panel c0" data-idx="0">
    <div class="animal"><div class="emoji"></div><div class="ring"></div></div>
    <div class="name"></div>
  </div>
  <div class="panel c1" data-idx="1">
    <div class="animal"><div class="emoji"></div><div class="ring"></div></div>
    <div class="name"></div>
  </div>
  <div class="panel c2" data-idx="2">
    <div class="animal"><div class="emoji"></div><div class="ring"></div></div>
    <div class="name"></div>
  </div>
  <div class="panel c3" data-idx="3">
    <div class="animal"><div class="emoji"></div><div class="ring"></div></div>
    <div class="name"></div>
  </div>
</div>

<a id="back" href="../../">←</a>
<div id="hint">戳一戳，听动物叫</div>

<script>
// ===== 动物池 =====
// 每只动物：emoji + 中文名 + Web Audio 合成参数 (kind + 频率/时长)
// kind 类型与合成函数 playSound() 一一对应
const ANIMALS = [
  // 家养小可爱
  { emoji: '🐱', name: '小猫',    sound: { kind: 'meow' } },
  { emoji: '🐶', name: '小狗',    sound: { kind: 'bark' } },
  { emoji: '🐭', name: '小老鼠',  sound: { kind: 'squeak' } },
  { emoji: '🐰', name: '小兔子',  sound: { kind: 'sniff' } },

  // 农场
  { emoji: '🐮', name: '奶牛',    sound: { kind: 'moo' } },
  { emoji: '🐷', name: '小猪',    sound: { kind: 'oink' } },
  { emoji: '🐑', name: '绵羊',    sound: { kind: 'baa' } },
  { emoji: '🐔', name: '母鸡',    sound: { kind: 'cluck' } },
  { emoji: '🦆', name: '鸭子',    sound: { kind: 'quack' } },
  { emoji: '🐴', name: '小马',    sound: { kind: 'neigh' } },

  // 野生
  { emoji: '🐯', name: '老虎',    sound: { kind: 'roar' } },
  { emoji: '🦁', name: '狮子',    sound: { kind: 'bigRoar' } },
  { emoji: '🐘', name: '大象',    sound: { kind: 'trumpet' } },
  { emoji: '🐵', name: '猴子',    sound: { kind: 'chitter' } },

  // 小生灵
  { emoji: '🐝', name: '蜜蜂',    sound: { kind: 'buzz' } },
  { emoji: '🐸', name: '青蛙',    sound: { kind: 'croak' } },
  { emoji: '🐦', name: '小鸟',    sound: { kind: 'chirp' } },
];

// ===== Web Audio =====
let _ctx = null;
function ensureCtx() {
  if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (_ctx.state === 'suspended') _ctx.resume();
  return _ctx;
}

// 单音工具：osc + gain envelope，可选 vibrato (LFO 调制频率)
function tone(wave, f0, f1, dur, vol, attack, ctx, startAt, vibrato) {
  const t = startAt || ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = wave;
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1 || f0), t + dur);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + (attack || 0.015));
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(ctx.destination);
  if (vibrato) {
    const lfo = ctx.createOscillator();
    const lg = ctx.createGain();
    lfo.type = 'sine';
    lfo.frequency.value = vibrato.rate || 8;
    lg.gain.value = vibrato.depth || f0 * 0.04;
    lfo.connect(lg).connect(osc.frequency);
    lfo.start(t);
    lfo.stop(t + dur + 0.02);
  }
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// 噪声（用于狗吠、老虎吼等带气声的音色）
function noise(dur, vol, filterFreq, ctx, startAt) {
  const t = startAt || ctx.currentTime;
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = filterFreq || 800;
  filter.Q.value = 1.5;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filter).connect(gain).connect(ctx.destination);
  src.start(t);
  src.stop(t + dur + 0.02);
}

// 调度表：每种 kind 一段合成
const SOUND_RECIPES = {
  meow(ctx, t) {
    // 小猫"喵~"：上滑 + 下滑 + 颤音
    tone('sawtooth', 600, 800, 0.18, 0.16, 0.02, ctx, t,
      { rate: 8, depth: 30 });
    tone('sawtooth', 800, 480, 0.32, 0.18, 0.01, ctx, t + 0.16,
      { rate: 7, depth: 40 });
  },
  bark(ctx, t) {
    // 小狗"汪汪"：两声短促，低频 + 噪声
    for (let i = 0; i < 2; i++) {
      const at = t + i * 0.22;
      tone('sawtooth', 240, 140, 0.14, 0.22, 0.005, ctx, at);
      noise(0.12, 0.18, 600, ctx, at);
    }
  },
  squeak(ctx, t) {
    // 老鼠"吱吱"：超高短促 pip × 3
    for (let i = 0; i < 3; i++) {
      tone('square', 2400, 1800, 0.06, 0.10, 0.003, ctx, t + i * 0.09);
    }
  },
  sniff(ctx, t) {
    // 小兔子：嗅嗅声 + 一声轻 chirp（emoji 没真叫，做个可爱拟声）
    noise(0.08, 0.12, 1200, ctx, t);
    noise(0.08, 0.10, 1500, ctx, t + 0.14);
    tone('triangle', 1100, 1300, 0.10, 0.08, 0.005, ctx, t + 0.3);
  },
  moo(ctx, t) {
    // 奶牛"哞~"：低沉拉长 + 慢颤音
    tone('sawtooth', 140, 95, 0.85, 0.22, 0.08, ctx, t,
      { rate: 5, depth: 12 });
  },
  oink(ctx, t) {
    // 小猪"哼哼"：短促鼻音两声
    for (let i = 0; i < 2; i++) {
      const at = t + i * 0.18;
      tone('sawtooth', 280, 200, 0.12, 0.20, 0.005, ctx, at,
        { rate: 24, depth: 30 });
      noise(0.10, 0.06, 400, ctx, at);
    }
  },
  baa(ctx, t) {
    // 绵羊"咩~"：颤音很强
    tone('sawtooth', 420, 380, 0.55, 0.18, 0.04, ctx, t,
      { rate: 22, depth: 50 });
  },
  cluck(ctx, t) {
    // 母鸡"咯咯哒"：三连音
    tone('square', 800, 700, 0.07, 0.13, 0.003, ctx, t);
    tone('square', 850, 760, 0.07, 0.13, 0.003, ctx, t + 0.13);
    tone('square', 600, 480, 0.18, 0.15, 0.003, ctx, t + 0.28);
  },
  quack(ctx, t) {
    // 鸭子"嘎嘎"：sawtooth 中频 + noise
    for (let i = 0; i < 2; i++) {
      const at = t + i * 0.22;
      tone('sawtooth', 700, 500, 0.16, 0.18, 0.005, ctx, at,
        { rate: 28, depth: 40 });
      noise(0.14, 0.08, 1500, ctx, at);
    }
  },
  neigh(ctx, t) {
    // 小马嘶鸣：高 + 抖 + 下滑
    tone('sawtooth', 520, 480, 0.18, 0.18, 0.02, ctx, t,
      { rate: 14, depth: 35 });
    tone('sawtooth', 460, 240, 0.42, 0.18, 0.01, ctx, t + 0.18,
      { rate: 18, depth: 50 });
  },
  roar(ctx, t) {
    // 老虎吼：低沉 sawtooth + 大量噪声
    tone('sawtooth', 110, 75, 0.65, 0.20, 0.05, ctx, t,
      { rate: 6, depth: 8 });
    noise(0.65, 0.15, 250, ctx, t);
  },
  bigRoar(ctx, t) {
    // 狮子吼：更低 + 更厚 + 双层
    tone('sawtooth', 90, 60, 0.85, 0.22, 0.06, ctx, t,
      { rate: 5, depth: 6 });
    tone('square',   180, 120, 0.85, 0.10, 0.06, ctx, t);
    noise(0.85, 0.18, 200, ctx, t);
  },
  trumpet(ctx, t) {
    // 大象号鸣：上升后回落，铜管感
    tone('sawtooth', 220, 540, 0.30, 0.20, 0.03, ctx, t);
    tone('sawtooth', 540, 480, 0.18, 0.20, 0.005, ctx, t + 0.30);
    tone('sawtooth', 480, 200, 0.35, 0.18, 0.005, ctx, t + 0.48);
  },
  chitter(ctx, t) {
    // 猴子吱吱：快速高音 pulses
    const notes = [1200, 900, 1400, 1000, 1500, 1100];
    notes.forEach((f, i) => {
      tone('square', f, f * 0.85, 0.07, 0.10, 0.003, ctx, t + i * 0.08);
    });
  },
  buzz(ctx, t) {
    // 蜜蜂嗡嗡：低音 sawtooth + 强 AM
    tone('sawtooth', 200, 220, 0.7, 0.15, 0.04, ctx, t,
      { rate: 35, depth: 25 });
  },
  croak(ctx, t) {
    // 青蛙呱呱：低频 square + noise 两声
    for (let i = 0; i < 2; i++) {
      const at = t + i * 0.28;
      tone('square', 160, 120, 0.20, 0.18, 0.005, ctx, at,
        { rate: 30, depth: 20 });
      noise(0.18, 0.08, 350, ctx, at);
    }
  },
  chirp(ctx, t) {
    // 小鸟啾啾：三连快上扬
    tone('triangle', 1800, 2400, 0.08, 0.12, 0.003, ctx, t);
    tone('triangle', 2000, 2600, 0.08, 0.12, 0.003, ctx, t + 0.11);
    tone('triangle', 2200, 2900, 0.10, 0.12, 0.003, ctx, t + 0.22);
  },
};

function playSound(soundCfg) {
  const ctx = ensureCtx();
  const fn = SOUND_RECIPES[soundCfg.kind];
  if (fn) fn(ctx, ctx.currentTime);
}

// ===== Speech (中文报名) =====
// iOS Safari 在用户首次交互后才能 speak；本游戏总是交互触发，OK
let _voicesReady = false;
let _zhVoice = null;
function loadVoices() {
  if (_voicesReady) return;
  const list = speechSynthesis.getVoices();
  if (!list.length) return;
  _zhVoice = list.find(v => /zh(-|_)CN/i.test(v.lang))
          || list.find(v => /zh/i.test(v.lang))
          || null;
  _voicesReady = true;
}
if (typeof speechSynthesis !== 'undefined') {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speakName(name) {
  if (typeof speechSynthesis === 'undefined') return;
  // 取消上一条，避免叠加排队
  speechSynthesis.cancel();
  loadVoices();
  const u = new SpeechSynthesisUtterance(name);
  u.lang = 'zh-CN';
  u.rate = 0.85;
  u.pitch = 1.25;   // 偏童声
  u.volume = 1.0;
  if (_zhVoice) u.voice = _zhVoice;
  speechSynthesis.speak(u);
}

// ===== 游戏状态 =====
// 4 面板，每个独立维护"已点几次 / 这一轮触发阈值（3~5 随机）"
const panels = [];
let poolPointer = 4;   // 已分配出去的下一个动物索引（0-3 初始占用了）

function init() {
  const panelEls = document.querySelectorAll('.panel');
  panelEls.forEach((el, i) => {
    const state = {
      el,
      idx: i,
      animalIdx: i,                 // 0-15 in ANIMALS
      clicks: 0,
      threshold: randInt(3, 5),     // 这一轮换之前要点几次（3~5）
      emoji: el.querySelector('.emoji'),
      name: el.querySelector('.name'),
      ring: el.querySelector('.ring'),
      swapping: false,
    };
    panels.push(state);
    paintPanel(state);
    el.addEventListener('click', () => tap(state), { passive: true });
    el.addEventListener('touchstart', (e) => {
      tap(state);
      e.preventDefault();
    }, { passive: false });
  });

  // 数字键 1-4 也能触发对应面板
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === 'Escape') {
      if (!document.fullscreenElement) location.href = '../../';
      return;
    }
    if (e.key === 'f' || e.key === 'F') {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }
      return;
    }
    const idx = parseInt(e.key, 10);
    if (idx >= 1 && idx <= 4) {
      e.preventDefault();
      tap(panels[idx - 1]);
    }
  });

  // 提示淡出（任意首触即藏）
  let hintGone = false;
  function hideHint() {
    if (hintGone) return;
    hintGone = true;
    const h = document.getElementById('hint');
    if (h) {
      h.classList.add('gone');
      setTimeout(() => h.remove(), 800);
    }
  }
  document.addEventListener('pointerdown', hideHint, { once: true });
  document.addEventListener('keydown', hideHint, { once: true });
}

function paintPanel(p) {
  const a = ANIMALS[p.animalIdx];
  p.emoji.textContent = a.emoji;
  p.name.textContent = a.name;
}

function tap(p) {
  if (p.swapping) return;
  ensureCtx();
  const a = ANIMALS[p.animalIdx];

  // 闪光圈
  p.ring.classList.remove('pulse');
  // 强制 reflow 重启动画
  void p.ring.offsetWidth;
  p.ring.classList.add('pulse');

  // emoji bounce
  p.emoji.classList.remove('bounce');
  void p.emoji.offsetWidth;
  p.emoji.classList.add('bounce');

  // panel 整体轻 pop
  p.el.classList.remove('pop');
  void p.el.offsetWidth;
  p.el.classList.add('pop');

  // 报名 + 叫声
  speakName(a.name);
  // 叫声稍微晚一点点，避开语音同时启动的尖峰
  setTimeout(() => playSound(a.sound), 280);

  // 累点
  p.clicks++;
  if (p.clicks >= p.threshold) {
    p.clicks = 0;
    p.threshold = randInt(3, 5);
    // 切换到下一只
    setTimeout(() => swapAnimal(p), 900);
  }
}

function swapAnimal(p) {
  p.swapping = true;
  const nextIdx = nextAnimalForPanel(p);

  // 旧 emoji + 名字一起淡
  p.emoji.classList.add('swap-out');
  p.name.classList.add('fade');

  setTimeout(() => {
    p.animalIdx = nextIdx;
    paintPanel(p);
    p.emoji.classList.remove('swap-out', 'bounce');
    void p.emoji.offsetWidth;
    p.emoji.classList.add('swap-in');
    p.name.classList.remove('fade');
    setTimeout(() => {
      p.emoji.classList.remove('swap-in');
      p.swapping = false;
    }, 540);
  }, 360);
}

function nextAnimalForPanel(p) {
  // 取池子里下一个 + 跳过当前其它面板正在用的，避免同屏重复
  const occupied = new Set(panels.filter(o => o !== p).map(o => o.animalIdx));
  for (let i = 0; i < ANIMALS.length; i++) {
    const candidate = (poolPointer + i) % ANIMALS.length;
    if (!occupied.has(candidate) && candidate !== p.animalIdx) {
      poolPointer = (candidate + 1) % ANIMALS.length;
      return candidate;
    }
  }
  // 极端兜底（理论不可达）
  return (p.animalIdx + 1) % ANIMALS.length;
}

function randInt(a, b) {
  return a + Math.floor(Math.random() * (b - a + 1));
}

init();
</script>
</body>
</html>
