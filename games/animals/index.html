<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>动物园 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    background: #2a1810;
  }

  .grid {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
    padding: 6px;
  }

  .panel {
    position: relative;
    border-radius: 28px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 120ms cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:
      inset 0 0 0 4px rgba(255, 255, 255, 0.35),
      0 8px 20px rgba(0, 0, 0, 0.18);
    will-change: transform;
  }
  .panel:active { transform: scale(0.96); }
  .panel.pop { animation: panel-pop 420ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes panel-pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  /* 4 块固定底色（柔和糖果色，互相区分） */
  .panel.c0 { background: linear-gradient(160deg, #ffd2d8 0%, #ffb3c1 100%); } /* 粉 */
  .panel.c1 { background: linear-gradient(160deg, #cfeec9 0%, #a8dca0 100%); } /* 绿 */
  .panel.c2 { background: linear-gradient(160deg, #ffeaa8 0%, #ffd06b 100%); } /* 黄 */
  .panel.c3 { background: linear-gradient(160deg, #c8def5 0%, #9ec5ee 100%); } /* 蓝 */

  .animal {
    position: relative;
    width: 100%;
    height: 78%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .emoji {
    font-size: 38vmin;
    line-height: 1;
    filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.10));
    transition: transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform, opacity;
  }
  .emoji.bounce { animation: emoji-bounce 520ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes emoji-bounce {
    0%   { transform: scale(1)    rotate(0); }
    25%  { transform: scale(1.25) rotate(-6deg); }
    55%  { transform: scale(0.95) rotate(4deg); }
    100% { transform: scale(1)    rotate(0); }
  }

  /* 切换动画：旧字符上飞淡出，新字符从下方蹦上来 */
  .emoji.swap-out { animation: emoji-swap-out 380ms ease-in forwards; }
  .emoji.swap-in  { animation: emoji-swap-in  520ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes emoji-swap-out {
    0%   { transform: translateY(0)    scale(1)   rotate(0); opacity: 1; }
    100% { transform: translateY(-30%) scale(0.4) rotate(-20deg); opacity: 0; }
  }
  @keyframes emoji-swap-in {
    0%   { transform: translateY(40%) scale(0.3) rotate(15deg); opacity: 0; }
    60%  { transform: translateY(-6%) scale(1.15) rotate(-4deg); opacity: 1; }
    100% { transform: translateY(0)   scale(1)    rotate(0); opacity: 1; }
  }

  .name {
    font-size: clamp(28px, 6vmin, 64px);
    font-weight: 800;
    letter-spacing: 0.12em;
    color: rgba(50, 30, 18, 0.85);
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
    padding-bottom: 1.5%;
    transition: opacity 240ms;
  }
  .name.fade { opacity: 0.15; }

  /* 拟声词大字爆炸（speech 兜底 / 视觉强化） */
  .cry-burst {
    position: absolute;
    left: 50%;
    top: 30%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(48px, 14vmin, 160px);
    font-weight: 900;
    color: #fff;
    text-shadow:
      -3px -3px 0 rgba(0, 0, 0, 0.8),
       3px -3px 0 rgba(0, 0, 0, 0.8),
      -3px  3px 0 rgba(0, 0, 0, 0.8),
       3px  3px 0 rgba(0, 0, 0, 0.8),
       0 6px 12px rgba(0, 0, 0, 0.3);
    letter-spacing: 0.05em;
    pointer-events: none;
    opacity: 0;
    z-index: 5;
    white-space: nowrap;
  }
  .cry-burst.pop { animation: cry-pop 900ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes cry-pop {
    0%   { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
    25%  { transform: translate(-50%, -50%) scale(1.3) rotate(8deg); opacity: 1; }
    45%  { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }
    75%  { transform: translate(-50%, -75%) scale(1) rotate(0); opacity: 1; }
    100% { transform: translate(-50%, -110%) scale(0.7) rotate(0); opacity: 0; }
  }

  /* 闪光圈：点击时从中心扩散 */
  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 30%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 6px solid rgba(255, 255, 255, 0.7);
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 0;
    pointer-events: none;
  }
  .ring.pulse { animation: ring-pulse 600ms ease-out forwards; }
  @keyframes ring-pulse {
    0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0.85; }
    100% { transform: translate(-50%, -50%) scale(2.0); opacity: 0; }
  }

  /* 返回按钮 */
  #back {
    position: fixed; top: 0; right: 0;
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(255, 255, 255, 0.55);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
  }
  #back:active { color: #fff; }

  /* 一开始的轻提示 */
  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: 0.3em;
    color: rgba(255, 255, 255, 0.55);
    pointer-events: none;
    transition: opacity 600ms;
    z-index: 100;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div class="grid" id="grid">
  <div class="panel c0" data-idx="0">
    <div class="animal"><div class="emoji"></div><div class="ring"></div><div class="cry-burst"></div></div>
    <div class="name"></div>
  </div>
  <div class="panel c1" data-idx="1">
    <div class="animal"><div class="emoji"></div><div class="ring"></div><div class="cry-burst"></div></div>
    <div class="name"></div>
  </div>
  <div class="panel c2" data-idx="2">
    <div class="animal"><div class="emoji"></div><div class="ring"></div><div class="cry-burst"></div></div>
    <div class="name"></div>
  </div>
  <div class="panel c3" data-idx="3">
    <div class="animal"><div class="emoji"></div><div class="ring"></div><div class="cry-burst"></div></div>
    <div class="name"></div>
  </div>
</div>

<a id="back" href="../../">←</a>
<div id="hint">戳一戳，听动物叫</div>

<script>
// ===== 动物池 =====
// emoji + 中文名 + 拟声词（视觉 burst）+ audio key（对应 audio/<key>.mp3）
const ANIMALS = [
  { emoji: '🐱', name: '小猫',    cry: '喵',       key: 'cat' },
  { emoji: '🐶', name: '小狗',    cry: '汪汪',     key: 'dog' },
  { emoji: '🐭', name: '小老鼠',  cry: '吱吱',     key: 'mouse' },
  { emoji: '🐰', name: '小兔子',  cry: '蹦蹦跳',   key: 'rabbit' },
  { emoji: '🐮', name: '奶牛',    cry: '哞',       key: 'cow' },
  { emoji: '🐷', name: '小猪',    cry: '哼哼',     key: 'pig' },
  { emoji: '🐑', name: '绵羊',    cry: '咩',       key: 'sheep' },
  { emoji: '🐔', name: '母鸡',    cry: '咯咯哒',   key: 'chicken' },
  { emoji: '🦆', name: '鸭子',    cry: '嘎嘎',     key: 'duck' },
  { emoji: '🐴', name: '小马',    cry: '哒哒哒',   key: 'horse' },
  { emoji: '🐯', name: '老虎',    cry: '嗷呜',     key: 'tiger' },
  { emoji: '🦁', name: '狮子',    cry: '吼',       key: 'lion' },
  { emoji: '🐘', name: '大象',    cry: '长鼻子',   key: 'elephant' },
  { emoji: '🐵', name: '猴子',    cry: '吱吱',     key: 'monkey' },
  { emoji: '🐝', name: '蜜蜂',    cry: '嗡嗡',     key: 'bee' },
  { emoji: '🐸', name: '青蛙',    cry: '呱呱',     key: 'frog' },
  { emoji: '🐦', name: '小鸟',    cry: '啾啾',     key: 'bird' },
];

// 每次进入洗牌：开局 4 只 + 后续出场顺序都随机（2026-06-10，同 words「每次进去都一样」反馈精神）
for (let i = ANIMALS.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [ANIMALS[i], ANIMALS[j]] = [ANIMALS[j], ANIMALS[i]];
}

// ===== 音频（预录 mp3，避开 iOS SpeechSynthesis 整段——Keith iPad 实证 SpeechSynthesis 静默） =====
// audio/<key>.mp3 是 macOS say -v Tingting 婷婷音色离线生成的「name，cry」组合语音
const audioCache = {};
function playAudio(key) {
  let a = audioCache[key];
  if (!a) {
    a = new Audio(`audio/${key}.mp3`);
    a.preload = 'auto';
    audioCache[key] = a;
  }
  a.currentTime = 0;
  a.play().catch(() => {});  // play() 是 promise；用户手势链外 / 加载失败都 silently 吃掉
}

// 进入后空闲预载全部叫声 mp3——首戳出声不等网络（2026-06-10）
// fetch 暖 HTTP 缓存 + Audio 元素双轨（iOS Safari 对媒体 preload='auto' 消极，fetch 兜底真下载）
setTimeout(() => {
  ANIMALS.forEach(({ key }) => {
    if (!audioCache[key]) {
      const a = new Audio(`audio/${key}.mp3`);
      a.preload = 'auto';
      audioCache[key] = a;
    }
    fetch(`audio/${key}.mp3`).catch(() => {});
  });
}, 400);

// ===== 游戏状态 =====
// 4 面板，每个独立维护"已点几次 / 这一轮触发阈值（3~5 随机）"
const panels = [];
let poolPointer = 4;   // 已分配出去的下一个动物索引（0-3 初始占用了）

function init() {
  const panelEls = document.querySelectorAll('.panel');
  panelEls.forEach((el, i) => {
    const state = {
      el,
      idx: i,
      animalIdx: i,                 // 0-16 in ANIMALS（17 只）
      clicks: 0,
      threshold: randInt(3, 5),     // 这一轮换之前要点几次（3~5）
      emoji: el.querySelector('.emoji'),
      name: el.querySelector('.name'),
      ring: el.querySelector('.ring'),
      cryBurst: el.querySelector('.cry-burst'),
      swapping: false,
      pendingSwap: null,   // 已排队的换动物 timer 句柄——防连拍在 1400ms 窗口内重复排队
    };
    panels.push(state);
    paintPanel(state);
    el.addEventListener('click', () => tap(state), { passive: true });
    el.addEventListener('touchstart', (e) => {
      tap(state);
      e.preventDefault();
    }, { passive: false });
  });

  // 数字键 1-4 也能触发对应面板
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === 'Escape') {
      if (!document.fullscreenElement) location.href = '../../';
      return;
    }
    if ((e.key === 'f' || e.key === 'F') && !document.fullscreenElement) {
      // 已全屏时 F 键不再拦截——落回下方正常游戏反馈（每按必反馈）
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      return;
    }
    if (e.repeat) return;   // 按住键 OS 自动重复不是真实按键
    const idx = parseInt(e.key, 10);
    if (idx >= 1 && idx <= 4) {
      e.preventDefault();
      tap(panels[idx - 1]);
      return;
    }
    // 其他任意键（键盘乱拍）：随机戳一个面板——与 cars/find/words 的乱拍友好哲学对齐
    if (e.key.length === 1 || e.key === 'Enter' || e.key.startsWith('Arrow')) {
      e.preventDefault();
      tap(panels[Math.floor(Math.random() * panels.length)]);
    }
  });

  // 提示淡出（任意首触即藏）
  let hintGone = false;
  function hideHint() {
    if (hintGone) return;
    hintGone = true;
    const h = document.getElementById('hint');
    if (h) {
      h.classList.add('gone');
      setTimeout(() => h.remove(), 800);
    }
  }
  document.addEventListener('pointerdown', hideHint, { once: true });
  document.addEventListener('keydown', hideHint, { once: true });
}

function paintPanel(p) {
  const a = ANIMALS[p.animalIdx];
  p.emoji.textContent = a.emoji;
  p.name.textContent = a.name;
}

function tap(p) {
  if (p.swapping) return;
  const a = ANIMALS[p.animalIdx];

  // 闪光圈
  p.ring.classList.remove('pulse');
  // 强制 reflow 重启动画
  void p.ring.offsetWidth;
  p.ring.classList.add('pulse');

  // emoji bounce
  p.emoji.classList.remove('bounce');
  void p.emoji.offsetWidth;
  p.emoji.classList.add('bounce');

  // panel 整体轻 pop
  p.el.classList.remove('pop');
  void p.el.offsetWidth;
  p.el.classList.add('pop');

  // 拟声词大字爆炸（speech 失败时的视觉兜底）
  p.cryBurst.textContent = a.cry;
  p.cryBurst.classList.remove('pop');
  void p.cryBurst.offsetWidth;
  p.cryBurst.classList.add('pop');

  // 预录 mp3 念「name，cry」
  playAudio(a.key);

  // 累点
  p.clicks++;
  if (p.clicks >= p.threshold && !p.pendingSwap) {
    p.clicks = 0;
    p.threshold = randInt(3, 5);
    // 切换到下一只（句柄入 pendingSwap——1400ms 窗口内连拍再次命中阈值不重复排队）
    p.pendingSwap = setTimeout(() => swapAnimal(p), 1400);
  }
}

function swapAnimal(p) {
  p.pendingSwap = null;
  if (p.swapping) return;   // 双保险：换场动画中不叠加第二次换场
  p.swapping = true;
  const nextIdx = nextAnimalForPanel(p);

  // 旧 emoji + 名字一起淡
  p.emoji.classList.add('swap-out');
  p.name.classList.add('fade');

  setTimeout(() => {
    p.animalIdx = nextIdx;
    paintPanel(p);
    p.emoji.classList.remove('swap-out', 'bounce');
    void p.emoji.offsetWidth;
    p.emoji.classList.add('swap-in');
    p.name.classList.remove('fade');
    setTimeout(() => {
      p.emoji.classList.remove('swap-in');
      p.swapping = false;
    }, 540);
  }, 360);
}

function nextAnimalForPanel(p) {
  // 取池子里下一个 + 跳过当前其它面板正在用的，避免同屏重复
  const occupied = new Set(panels.filter(o => o !== p).map(o => o.animalIdx));
  for (let i = 0; i < ANIMALS.length; i++) {
    const candidate = (poolPointer + i) % ANIMALS.length;
    if (!occupied.has(candidate) && candidate !== p.animalIdx) {
      poolPointer = (candidate + 1) % ANIMALS.length;
      return candidate;
    }
  }
  // 极端兜底（理论不可达）
  return (p.animalIdx + 1) % ANIMALS.length;
}

function randInt(a, b) {
  return a + Math.floor(Math.random() * (b - a + 1));
}

init();
</script>
</body>
</html>
