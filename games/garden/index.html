<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>小小花园 · Cookie</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8eacb;touch-action:none;overscroll-behavior:none}
button,a{touch-action:none}button{border:0;background:none;padding:0;cursor:pointer;color:inherit}
svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
#scene{height:100%;height:100dvh;max-width:1100px;margin:auto;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;grid-template-areas:'sky' 'beds' 'shelf' 'harvest';grid-template-rows:minmax(70px,1fr) minmax(150px,2.3fr) minmax(76px,1fr) minmax(100px,1.25fr);gap:8px;isolation:isolate}
#back{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:30;width:48px;height:48px;border-radius:50%;background:#fff9e8;color:#506954;display:grid;place-items:center;box-shadow:0 2px 0 #b9c7a3}
#back svg{width:24px;height:24px}
#sky{grid-area:sky;display:flex;align-items:center;justify-content:space-around;padding-left:52px}
#sun{width:clamp(56px,10vw,84px);aspect-ratio:1}#cloud{width:clamp(80px,16vw,140px);height:70px}#bee{width:64px;height:56px}
#beds{grid-area:beds;display:flex;align-items:stretch;justify-content:center;gap:clamp(8px,2vw,24px);padding:0 8px}
.bed{position:relative;min-width:0;flex:1;max-width:250px;border-radius:50%;align-self:stretch}
.bed .soil{position:absolute;left:0;right:0;bottom:10%;height:28%;background:#9f704c;border-radius:50%;border-bottom:12px solid #805b42;box-shadow:0 8px 0 #c2d5a8}
.bed .soil:after{content:'';position:absolute;inset:18% 12%;border-radius:50%;background:#805c43;opacity:.7}
.plant{position:absolute;left:8%;right:8%;bottom:24%;height:72%;transform-origin:50% 100%;pointer-events:none}
.bed .seed-dot{fill:#f1c27a}.bed[data-stage='0'] .plant{opacity:.7}
.bed .tag{position:absolute;width:32px;height:40px;right:3%;bottom:10%;transform:rotate(10deg);background:#f8e5b8;border-radius:8px;box-shadow:0 4px 0 #b39169;padding:2px}
.bed[data-stage='0'] .tag{display:none}
.watermark{position:absolute;left:10%;top:68%;width:80%;height:12%;border-radius:50%;background:#80c5cf;opacity:0;pointer-events:none}
.watered .watermark{animation:soak 1s ease-out}.selected{filter:drop-shadow(0 0 6px #fffdf3)}
.bed.selected .soil{outline:4px solid #fff9d9;outline-offset:5px}
.hint{animation:hint 1.1s ease-in-out infinite}.pop{animation:pop .45s ease-out}.wiggle{animation:wiggle .4s ease-in-out}
#shelf{grid-area:shelf;display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,32px);background:#eddbab;border-radius:24px;box-shadow:0 6px 0 #c6b886;max-width:720px;width:100%;justify-self:center;padding:8px 12px}
.seed,#water{width:clamp(50px,16vw,92px);height:100%;max-height:106px;min-height:56px;flex:0 1 94px;position:relative;border-radius:16px}
.seed.selected,#water.selected{background:#fff5cc;box-shadow:0 0 0 4px #fffdf3}
#harvest{grid-area:harvest;display:flex;align-items:center;justify-content:space-evenly;position:relative;gap:12px}
#basket{width:clamp(100px,27vw,160px);height:100%;max-height:145px;min-height:90px;position:relative;flex-shrink:0}
#basket .goods{position:absolute;left:12%;right:12%;top:10%;height:45%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.goods svg{width:33%;height:100%}#basket.delivering{animation:delivery 1.2s ease-in-out}
#friend{width:clamp(90px,24vw,150px);height:100%;max-height:160px;position:relative}
#table{width:clamp(70px,18vw,120px);height:80%;max-height:120px;position:relative;align-self:flex-end}
#table .goods{display:flex;position:absolute;top:2%;left:5%;width:90%;height:60%;pointer-events:none}
.ghost{position:fixed;z-index:40;pointer-events:none;width:80px;height:90px;transform:translate(-50%,-65%);filter:drop-shadow(0 7px 4px #38553c40)}
.dropmark{outline:4px dashed #fff4c0;outline-offset:1px}.held{opacity:.48}
.spark{position:fixed;pointer-events:none;z-index:42;width:16px;height:16px;background:#fff2ae;border-radius:50%;animation:spark .7s ease-out forwards}
@keyframes pop{40%{transform:translateY(-8px) rotate(-4deg)}70%{transform:translateY(-3px) rotate(3deg)}}
@keyframes wiggle{25%,75%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes hint{50%{filter:drop-shadow(0 0 9px #fff8b0)}}
@keyframes soak{10%,45%{opacity:.75}100%{opacity:0}}
@keyframes delivery{40%{transform:translateX(30px) rotate(-4deg)}65%{transform:translateX(25px)}}
@keyframes spark{to{transform:translateY(-45px) scale(.1);opacity:0}}
@media(orientation:landscape) and (max-height:600px){
 #scene{grid-template-areas:'sky sky' 'beds harvest' 'shelf harvest';grid-template-columns:minmax(0,3fr) minmax(160px,1fr);grid-template-rows:54px minmax(105px,1fr) 76px;gap:8px}
 #sky{justify-content:space-evenly}#sun{width:50px}#cloud{height:48px}#bee{height:44px}
 #beds{gap:16px}.bed{max-width:180px}#harvest{flex-wrap:wrap;gap:0;align-content:center}#basket{width:100px;height:90px}#friend{width:80px;height:92px}#table{width:65px;height:75px;align-self:auto}
 #shelf{padding:4px 12px}.seed,#water{max-width:72px;min-height:56px}.bed .tag{width:26px;height:32px}
}
@media(prefers-reduced-motion:reduce){.pop,.wiggle,.hint,#basket.delivering,.spark{animation-duration:.01ms}.watered .watermark{animation-duration:.2s}}
</style>
<a id="back" href="../../" aria-label="返回游戏台"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></svg></a>
<main id="scene">
 <div id="sky">
  <button id="sun" data-action="sun" aria-label="太阳"><svg viewBox="0 0 100 100"><g stroke="#e1ae42" stroke-width="6" stroke-linecap="round"><path d="M50 4v9m0 74v9M4 50h9m74 0h9M17 17l7 7m52 52 7 7M17 83l7-7m52-52 7-7"/></g><circle cx="50" cy="50" r="28" fill="#efbd50"/><path d="M39 54q11 14 22 0" fill="none" stroke="#9e743e" stroke-width="3" stroke-linecap="round"/><g fill="#9e743e"><circle cx="40" cy="44" r="2.5"/><circle cx="60" cy="44" r="2.5"/></g></svg></button>
  <button id="cloud" data-action="cloud" aria-label="云朵"><svg viewBox="0 0 160 85"><path d="M29 67C-4 65 4 26 35 30 38-2 91-4 103 26c35-10 61 28 35 40Z" fill="#fffaf0"/><path d="M66 48q10 8 20 0" stroke="#bdc8bc" stroke-width="3" fill="none" stroke-linecap="round"/></svg></button>
  <button id="bee" data-action="bee" aria-label="蜜蜂"><svg viewBox="0 0 90 80"><g fill="#fffaf0"><ellipse cx="37" cy="22" rx="13" ry="17" transform="rotate(-25 37 22)"/><ellipse cx="57" cy="22" rx="13" ry="17" transform="rotate(25 57 22)"/></g><ellipse cx="47" cy="47" rx="28" ry="20" fill="#edbe57"/><path d="M34 29v36m18-37v37" stroke="#8c7348" stroke-width="7"/><circle cx="68" cy="43" r="3" fill="#594e37"/><path d="m20 47-12 3 12 4" fill="#8c7348"/></svg></button>
 </div>
 <div id="beds"><button class="bed" data-bed="0" aria-label="左边花圃"></button><button class="bed" data-bed="1" aria-label="中间花圃"></button><button class="bed" data-bed="2" aria-label="右边花圃"></button></div>
 <div id="shelf"><button class="seed" data-seed="carrot" aria-label="胡萝卜种子"></button><button class="seed" data-seed="strawberry" aria-label="草莓种子"></button><button class="seed" data-seed="flower" aria-label="花种子"></button><button id="water" data-action="water" aria-label="水壶"></button></div>
 <div id="harvest"><button id="basket" data-action="basket" aria-label="收获篮，点一下送到桌上"></button><button id="friend" data-action="friend" aria-label="小狐狸"><svg viewBox="0 0 130 160"><path d="M92 123q55-40 26-70 6 36-40 42" fill="#d78a50"/><ellipse cx="62" cy="125" rx="34" ry="31" fill="#d98b51"/><ellipse cx="61" cy="128" rx="20" ry="24" fill="#fae5bf"/><path d="m24 56-8-48 39 24h20l37-25-7 53Z" fill="#d98b51"/><path d="m25 20 7 29 17-15m52-15-8 31-15-16" fill="#a75e43"/><ellipse cx="63" cy="69" rx="48" ry="40" fill="#df9657"/><path d="M17 64q24-4 46 25 22-28 48-24-3 43-48 43T17 64" fill="#fff0d0"/><g fill="#644c3e"><circle cx="41" cy="65" r="4"/><circle cx="84" cy="65" r="4"/><ellipse cx="63" cy="89" rx="7" ry="5"/></g><path d="M51 98q12 8 24 0" fill="none" stroke="#a97550" stroke-width="3" stroke-linecap="round"/></svg></button><button id="table" data-action="table" aria-label="收获摆在桌上"></button></div>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s), kinds=['carrot','strawberry','flower'], STORE='cookie-garden-v1';
const empty=()=>({schema:1,beds:[null,null,null],basket:[],table:[]});
const goodCrop=c=>c&&typeof c==='object'&&kinds.includes(c.kind)&&Number.isInteger(c.color)&&c.color>=0&&c.color<3;
function readGarden(){
 try{const s=JSON.parse(localStorage.getItem(STORE));
  if(!s||s.schema!==1||!Array.isArray(s.beds)||s.beds.length!==3) return empty();
  if(!s.beds.every(c=>c===null||(goodCrop(c)&&Number.isInteger(c.stage)&&c.stage>=1&&c.stage<=3)))return empty();
  if(!['basket','table'].every(k=>Array.isArray(s[k])&&s[k].length<=3&&s[k].every(goodCrop)))return empty();
  return {schema:1,beds:s.beds.map(c=>c&&({kind:c.kind,color:c.color,stage:c.stage})),basket:s.basket.map(c=>({kind:c.kind,color:c.color})),table:s.table.map(c=>({kind:c.kind,color:c.color}))};
 }catch{return empty();}
}
let garden=readGarden(),selected=null,audioContext=null,started=false,deliveryTimer=0;
const holds=new Map(),locks=new Map(),misses=[0,0,0],voice=new Audio();voice.preload='auto';voice.volume=.3;voice.src='audio/intro.mp3';
let speechKey='',speechTime=0;
function save(){try{localStorage.setItem(STORE,JSON.stringify(garden));}catch{}}
function tone(high=false){
 try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(()=>{});
  const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime;
  o.type='sine';o.frequency.setValueAtTime(high?620:330,t);o.frequency.exponentialRampToValueAtTime(high?900:460,t+.12);
  g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.10,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.2);
 }catch{}
}
function say(key){
 if(speechKey==='intro'&&!voice.paused&&['carrot','strawberry','flower','plant'].includes(key))return;
 if(speechKey===key&&performance.now()-speechTime<1300)return;
 speechKey=key;speechTime=performance.now();voice.pause();const src=new URL('audio/'+key+'.mp3',location.href).href;if(voice.src!==src)voice.src=src;else voice.currentTime=0;voice.play().catch(()=>{});
}
function animate(el,cls='pop'){
 if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);
}
document.addEventListener('animationend',e=>{if(e.animationName!=='hint')e.target.classList.remove('pop','wiggle','watered');if(e.target.classList.contains('spark'))e.target.remove();});
function burst(el){
 const r=el.getBoundingClientRect();for(let i=0;i<4;i++){const b=document.createElement('i');b.className='spark';b.style.left=(r.x+r.width*(.2+i*.2))+'px';b.style.top=(r.y+r.height*.3)+'px';document.body.append(b);setTimeout(()=>b.remove(),900);}
}
const svg=body=>'<svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMax meet" aria-hidden="true">'+body+'</svg>';
function cropArt(kind,color=0){
 if(kind==='carrot')return svg('<path d="M48 41Q14 43 34 80L48 112Q56 119 64 96L78 52Q77 35 48 41" fill="#eb9553"/><path d="m43 60 17 4m-18 16 13 4" stroke="#cb7746" stroke-width="4" stroke-linecap="round"/><path d="M51 43Q14 6 35 10q19 0 20 31Q48-1 65 5q16 6-8 38Q96 2 91 24q-3 14-34 20" fill="#68975b"/>');
 if(kind==='strawberry')return svg('<path d="M22 39Q46 24 75 39q21 11 7 36-17 32-31 35Q35 108 19 77 3 53 22 39" fill="#d96764"/><path d="m50 40-24-9 15-5 7-19 10 19 20 5-23 9" fill="#638e57"/><g fill="#ffdfa2"><ellipse cx="30" cy="55" rx="2.5" ry="4"/><ellipse cx="53" cy="58" rx="2.5" ry="4"/><ellipse cx="73" cy="54" rx="2.5" ry="4"/><ellipse cx="42" cy="79" rx="2.5" ry="4"/><ellipse cx="64" cy="77" rx="2.5" ry="4"/><ellipse cx="53" cy="96" rx="2.5" ry="4"/></g>');
 const c=['#e7ad48','#d47c8a','#8aabbc'][color];
 return svg('<path d="M50 110V47" stroke="#6d965e" stroke-width="8" stroke-linecap="round"/><path d="M49 94Q15 96 19 73q24-5 30 21m4-17q32 1 29-22-23-1-29 22" fill="#7ca66b"/><g fill="'+c+'"><ellipse cx="50" cy="25" rx="15" ry="22"/><ellipse cx="70" cy="43" rx="22" ry="15"/><ellipse cx="50" cy="62" rx="15" ry="22"/><ellipse cx="29" cy="43" rx="22" ry="15"/></g><circle cx="50" cy="43" r="15" fill="#f8db87"/><circle cx="45" cy="41" r="2" fill="#99794c"/><circle cx="55" cy="41" r="2" fill="#99794c"/>');
}
function plantArt(c){
 if(!c)return '';
 if(c.stage===1)return svg('<ellipse class="seed-dot" cx="50" cy="102" rx="9" ry="5"/><path d="M37 111h27" stroke="#654b3b" stroke-width="4" stroke-linecap="round"/>');
 if(c.stage===2)return svg('<path d="M50 113V70" stroke="#729a5c" stroke-width="7" stroke-linecap="round"/><path d="M49 88Q16 93 19 63q27-4 30 25m3-9q32 3 30-26-26-3-30 26" fill="#84ac67"/>');
 return cropArt(c.kind,c.color);
}
function seedArt(kind){return svg('<path d="M20 18h60l8 90H12Z" fill="#f8eccb" stroke="#bc9e6b" stroke-width="2"/><path d="M20 18h60l-5 14H24Z" fill="#d9bb83"/><g transform="translate(24 34) scale(.52)">'+cropArt(kind).replace(/<\/?svg[^>]*>/g,'')+'</g>');}
const waterArt=svg('<path d="M72 45q30-18 21 17-4 13-21 8" fill="none" stroke="#699aa7" stroke-width="9"/><path d="M25 42h48l4 56q-26 14-53-1Z" fill="#7eafbc"/><path d="m25 63-21-21-4 8 24 39" fill="#6c9eac"/><path d="M25 43q20-17 48 0" fill="#aacbd0"/><path d="M37 65v21m13-24v26" stroke="#a8cbd1" stroke-width="5" stroke-linecap="round"/>');
function render(){
 document.querySelectorAll('.bed').forEach((el,i)=>{const c=garden.beds[i];el.dataset.stage=c?c.stage:0;el.dataset.kind=c?c.kind:'';el.innerHTML='<div class="soil"></div><div class="plant">'+plantArt(c)+'</div><div class="tag">'+(c?cropArt(c.kind,c.color):'')+'</div><div class="watermark"></div>';});
 $('#basket').innerHTML=svg('<path d="M19 63Q16 12 50 12t32 51" fill="none" stroke="#af8353" stroke-width="8"/><path d="M9 58h82l-9 44H20Z" fill="#d2a266"/><path d="M12 72h76m-72 15h69M32 61l4 39m15-39v40m16-40-4 39" stroke="#b58653" stroke-width="4"/><g fill="#687b5c"><circle cx="29" cy="110" r="8"/><circle cx="72" cy="110" r="8"/></g>')+'<div class="goods">'+garden.basket.map(c=>cropArt(c.kind,c.color)).join('')+'</div>';
 $('#table').innerHTML=svg('<path d="M12 73h77v15H12Zm9 14h10v31H21Zm51 0h10v31H72Z" fill="#b8905d"/>')+'<div class="goods">'+garden.table.map(c=>cropArt(c.kind,c.color)).join('')+'</div>';
 syncSelection();
}
function syncSelection(){
 document.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));
 if(selected){const el=selected.type==='seed'?$('[data-seed="'+selected.kind+'"]'):selected.type==='water'?$('#water'):$('[data-bed="'+selected.bed+'"]');el?.classList.add('selected');}
 document.querySelectorAll('.bed').forEach((el,i)=>el.classList.toggle('held',locks.has('bed'+i)));
 $('#water').classList.toggle('held',locks.has('water'));
}
function hint(i,key){
 const bed=$('[data-bed="'+i+'"]');animate(bed,'wiggle');say(key);misses[i]++;
 if(misses[i]<2)return;
 document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));
 const c=garden.beds[i];(c?(c.stage<3?$('#water'):$('#basket')):$('.seed')).classList.add('hint');
}
function commit(){selected=null;document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));save();render();tone(true);}
function isLocked(key,pointer){return locks.has(key)&&locks.get(key)!==pointer;}
function applyTool(tool,i,pointer){
 if(!Number.isInteger(i)||i<0||i>2)return false;
 if(isLocked('bed'+i,pointer)||tool.type==='water'&&isLocked('water',pointer)){animate($('[data-bed="'+i+'"]'));return false;}
 const c=garden.beds[i];
 if(tool.type==='seed'){
  if(c){hint(i,'occupied');return false;}
  garden.beds[i]={kind:tool.kind,stage:1,color:Math.floor(Math.random()*3)};commit();say('plant');
 }else if(tool.type==='water'){
  if(!c){hint(i,'empty');animate($('[data-bed="'+i+'"]'),'watered');return false;}
  if(c.stage===3){hint(i,'ready');return false;}
  c.stage++;commit();animate($('[data-bed="'+i+'"]'),'watered');say(c.stage===2?'sprout':'ready');
 }else return false;
 misses[i]=0;animate($('[data-bed="'+i+'"] .plant'));return true;
}
function harvest(i,pointer){
 if(isLocked('bed'+i,pointer))return false;
 const c=garden.beds[i];if(!c||c.stage!==3){hint(i,'young');return false;}
 if(garden.basket.length>=3){hint(i,'full');return false;}
 garden.basket.push({kind:c.kind,color:c.color});garden.beds[i]=null;misses[i]=0;commit();say('harvest');burst($('#basket'));return true;
}
function deliver(){
 if(!garden.basket.length){animate($('#basket'));say('place');return;}
 garden.table=garden.basket.map(c=>({...c}));garden.basket=[];commit();say('deliver');animate($('#friend'));burst($('#friend'));
 clearTimeout(deliveryTimer);$('#basket').classList.remove('delivering');void $('#basket').offsetWidth;$('#basket').classList.add('delivering');deliveryTimer=setTimeout(()=>$('#basket').classList.remove('delivering'),1200);
}
function choose(tool){selected=selected&&JSON.stringify(selected)===JSON.stringify(tool)?null:tool;syncSelection();say(tool.type==='seed'?tool.kind:tool.type==='water'?'water':'harvest');}
function tap(el,pointer){
 if(el.dataset.seed){choose({type:'seed',kind:el.dataset.seed});return;}
 if(el.dataset.bed!==undefined){
  const i=Number(el.dataset.bed);if(isLocked('bed'+i,pointer)){animate(el);return;}
  if(selected&&selected.type!=='crop'){if(!applyTool(selected,i,pointer)){selected=null;syncSelection();}return;}
  const c=garden.beds[i];if(c?.stage===3)choose({type:'crop',bed:i});else hint(i,c?'young':'empty');return;
 }
 const a=el.dataset.action;
 if(a==='water'){if(!isLocked('water',pointer))choose({type:'water'});return;}
 if(a==='basket'){if(selected?.type==='crop')harvest(selected.bed,pointer);else deliver();return;}
 animate(el);burst(el);tone(a==='bee');if(a==='friend')say('hello');
}
function hit(x,y){return document.elementFromPoint(x,y)?.closest('[data-bed],[data-action],[data-seed]');}
function toolFor(el){
 if(el.dataset.seed)return{type:'seed',kind:el.dataset.seed};
 if(el.id==='water')return{type:'water'};
 if(el.dataset.bed!==undefined&&garden.beds[+el.dataset.bed]?.stage===3)return{type:'crop',bed:+el.dataset.bed};
 return null;
}
function clearWater(h){clearTimeout(h.timer);h.timer=0;h.over=null;}
function moveWater(h,target){
 const i=target?.dataset.bed===undefined?null:Number(target.dataset.bed);
 if(h.over===i)return;clearWater(h);h.over=i;
 if(i===null||h.watered.has(i))return;
 h.timer=setTimeout(()=>{h.timer=0;if(!holds.has(h.id)||h.over!==i)return;h.watered.add(i);applyTool(h.tool,i,h.id);},600);
}
function start(e){
 const el=e.target.closest('[data-bed],[data-action],[data-seed]');if(!el||e.button>0)return;
 e.preventDefault();tone();if(!started){started=true;say('intro');}
 const tool=toolFor(el),key=tool?.type==='water'?'water':el.dataset.bed!==undefined?'bed'+el.dataset.bed:null;
 if(key&&locks.has(key)){animate(el);return;}
 const h={id:e.pointerId,el,tool,key,x:e.clientX,y:e.clientY,moved:false,ghost:null,timer:0,over:null,watered:new Set()};
 holds.set(e.pointerId,h);if(key)locks.set(key,e.pointerId);try{el.setPointerCapture(e.pointerId);}catch{}
 animate(el);syncSelection();
}
function move(e){
 const h=holds.get(e.pointerId);if(!h)return;e.preventDefault();
 if(Math.hypot(e.clientX-h.x,e.clientY-h.y)>12)h.moved=true;
 if(!h.moved||!h.tool)return;
 selected=null;syncSelection();
 if(!h.ghost){h.ghost=document.createElement('div');h.ghost.className='ghost';h.ghost.innerHTML=h.tool.type==='seed'?seedArt(h.tool.kind):h.tool.type==='water'?waterArt:cropArt(garden.beds[h.tool.bed].kind,garden.beds[h.tool.bed].color);document.body.append(h.ghost);}
 h.ghost.style.left=e.clientX+'px';h.ghost.style.top=e.clientY+'px';
 const target=hit(e.clientX,e.clientY);if(h.tool.type==='water')moveWater(h,target);
}
function release(h){
 clearWater(h);h.ghost?.remove();holds.delete(h.id);if(h.key&&locks.get(h.key)===h.id)locks.delete(h.key);
 try{if(h.el.hasPointerCapture(h.id))h.el.releasePointerCapture(h.id);}catch{}syncSelection();
}
function end(e){
 const h=holds.get(e.pointerId);if(!h)return;e.preventDefault();const target=hit(e.clientX,e.clientY);
 clearTimeout(h.timer);
 if(!h.moved)tap(h.el,h.id);
 else if(h.tool?.type==='crop'){if(target?.id==='basket')harvest(h.tool.bed,h.id);else{say('place');animate(h.el,'wiggle');}}
 else if(h.tool&&target?.dataset.bed!==undefined){const i=Number(target.dataset.bed);if(h.tool.type!=='water')applyTool(h.tool,i,h.id);else if(!h.watered.has(i)){say('water');animate(target,'wiggle');}}
 else if(h.tool){say('place');animate(h.el,'wiggle');}
 release(h);
}
function cancel(e){const h=holds.get(e.pointerId);if(h)release(h);selected=null;syncSelection();}
function cleanup(){
 for(const h of [...holds.values()])release(h);selected=null;clearTimeout(deliveryTimer);$('#basket').classList.remove('delivering');voice.pause();
 document.querySelectorAll('.spark').forEach(e=>e.remove());syncSelection();
}
document.querySelectorAll('.seed').forEach(el=>el.innerHTML=seedArt(el.dataset.seed));$('#water').innerHTML=waterArt;render();
document.addEventListener('pointerdown',start,{passive:false});document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',end,{passive:false});document.addEventListener('pointercancel',cancel);
document.addEventListener('lostpointercapture',e=>{if(holds.has(e.pointerId))cancel(e);});
window.addEventListener('blur',cleanup);window.addEventListener('pagehide',cleanup);window.addEventListener('resize',cleanup);document.addEventListener('visibilitychange',()=>{if(document.hidden)cleanup();});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault());
window.gardenDebug=()=>({state:JSON.parse(JSON.stringify(garden)),held:holds.size,locks:[...locks.keys()],selected:selected&&{...selected},voice:{paused:voice.paused,time:voice.currentTime,src:voice.currentSrc}});
</script>
</html>
