<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#e4ecd3"><title>小小水果铺 · Cookie</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}html,body{margin:0;height:100%;overflow:hidden;background:#e4ecd3;touch-action:none;overscroll-behavior:none}button,a{border:0;padding:0;color:inherit;background:none;touch-action:none}svg{width:100%;height:100%;display:block;pointer-events:none;overflow:visible}#scene{height:100%;height:100dvh;max-width:1000px;margin:auto;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;grid-template-rows:64px minmax(150px,1.15fr) minmax(110px,.9fr) minmax(140px,1fr);gap:12px}#back{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:48px;height:48px;background:#fff9e8;border-radius:50%;box-shadow:0 3px #bcc8a7;z-index:20;padding:12px}#sky{display:flex;align-items:center;justify-content:space-around;padding-left:52px}#sun{width:64px;height:64px}#cloud{width:96px;height:56px}#bell{width:56px;height:56px}#customer-area{display:flex;justify-content:center;align-items:center;gap:clamp(12px,4vw,56px)}#customer{position:relative;width:clamp(96px,25vw,200px);height:100%;max-height:230px}#card{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:clamp(156px,43vw,310px);min-height:108px;padding:16px;background:#fff9e8;border:4px solid #d8caa5;border-radius:24px;box-shadow:0 5px #c7b78f}#card:after{content:'';position:absolute;left:-17px;top:45%;width:24px;height:24px;background:#fff9e8;border-left:4px solid #d8caa5;border-bottom:4px solid #d8caa5;transform:rotate(45deg)}#card .fruit{width:30%;max-width:72px;aspect-ratio:1}#shelf{display:flex;justify-content:center;align-items:center;gap:clamp(16px,6vw,64px);border-radius:24px;background:#e8c994;border-bottom:10px solid #bd9666;box-shadow:0 7px #cfdbb5}.stock{width:clamp(104px,29vw,200px);height:90%;min-height:88px;background:#f3dfb6;border-radius:20px;padding:8px 24px;position:relative;box-shadow:inset 0 -6px #d8b17c}.stock:before{content:'';position:absolute;inset:auto 12% 9%;height:18%;border-radius:50%;background:#d9b77f}.stock svg{position:relative}#counter{display:flex;justify-content:center;align-items:center;background:#cee0b5;border-radius:32px}#basket{position:relative;width:clamp(230px,60vw,360px);height:100%;max-height:210px;min-height:130px}#basket-handle{position:absolute;left:25%;right:25%;top:0;height:30%;min-height:44px;border-radius:24px;z-index:2}#goods{position:absolute;inset:30% 8% 25%;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;gap:4px}.piece{width:100%;height:100%;min-height:56px;position:relative;background:none}.piece svg{filter:drop-shadow(0 3px 0 #aa794b55)}.selected{filter:drop-shadow(0 0 6px #fff9de);outline:4px solid #fff9de;outline-offset:4px;border-radius:20px}.held{opacity:.55}.pop{animation:pop .36s ease-out}.wiggle{animation:wiggle .4s ease-out}.hint{animation:hint 1.1s ease-in-out infinite}.ghost{position:fixed;width:88px;height:88px;transform:translate(-50%,-55%);pointer-events:none;z-index:50;filter:drop-shadow(0 8px 5px #69522c30)}.ghost.basket{width:220px;height:150px}.spark{position:fixed;z-index:60;pointer-events:none;width:16px;height:16px;background:#edb857;border-radius:50%;animation:spark .8s ease-out forwards}#customer.happy{animation:happy .65s ease-in-out 2}@keyframes pop{50%{transform:scale(1.08) translateY(-4px)}}@keyframes wiggle{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}@keyframes hint{50%{filter:drop-shadow(0 0 10px #fff9ce);transform:scale(1.04)}}@keyframes spark{to{transform:translateY(-90px) scale(.2);opacity:0}}@keyframes happy{50%{transform:translateY(-12px) rotate(4deg)}}@media(orientation:landscape) and (max-height:650px){#scene{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));grid-template-columns:1fr 1fr;grid-template-rows:40px minmax(104px,1fr) minmax(96px,.8fr);gap:8px;grid-template-areas:'sky sky' 'customer shelf' 'customer counter'}#sky{grid-area:sky}#sun{width:48px;height:48px}#customer-area{grid-area:customer;flex-direction:column-reverse;gap:8px}#customer{width:104px;height:112px}#card{width:176px;min-height:76px;padding:8px 12px}#card:after{left:45%;top:auto;bottom:-16px;transform:rotate(-45deg)}#shelf{grid-area:shelf;gap:12px}.stock{width:42%;padding:8px 12px}#counter{grid-area:counter}#basket{width:230px;min-height:96px}#goods{inset:29% 8% 23%}.piece{min-height:48px}}
</style>
<a id="back" href="../../" aria-label="返回游戏台"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14" fill="none" stroke="#58734f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<main id="scene"><div id="sky"><button id="sun" data-kind="decor" aria-label="太阳"></button><button id="cloud" data-kind="decor" aria-label="云朵"></button><button id="bell" data-kind="decor" aria-label="铃铛"></button></div><div id="customer-area"><button id="customer" data-kind="customer" aria-label="小顾客"></button><button id="card" data-kind="card" aria-label="顾客想要的水果"></button></div><div id="shelf" data-kind="decor"><button class="stock" data-kind="stock" data-fruit="apple" aria-label="苹果货架"></button><button class="stock" data-kind="stock" data-fruit="pear" aria-label="梨货架"></button></div><div id="counter" data-kind="decor"><div id="basket" role="button" data-kind="basket" aria-label="水果篮"><div id="basket-art"></div><button id="basket-handle" data-kind="basket" aria-label="拿起整个水果篮"></button><div id="goods"></div></div></div></main>
<script>
'use strict';
const $=s=>document.querySelector(s),holds=new Map(),locks=new Map(),voice=new Audio();voice.preload='auto';voice.volume=.3;let ac,selection=null,sequence=0,round=0,misses=0,celebrating=false,nextTimer=0,lastVoice='',lastVoiceAt=0;const state={fruit:'apple',count:1,animal:0,basket:[]};
const svg=b=>'<svg viewBox="0 0 100 100" aria-hidden="true">'+b+'</svg>';
function fruitArt(k){return svg(k==='apple'?'<path d="M50 30C18 7 2 45 20 74q15 25 30 14 21 12 34-15C101 42 80 11 50 30" fill="#d96e60"/><path d="M50 31q-4-18 4-23" fill="none" stroke="#815b3d" stroke-width="6" stroke-linecap="round"/><path d="M54 23Q65 3 82 12q-4 18-28 11" fill="#719950"/><path d="M28 39q-10 8-8 20" stroke="#f2aaa0" stroke-width="6" fill="none" stroke-linecap="round"/>':'<path d="M41 25q11-10 20 0c-2 22 23 23 25 48q-1 24-36 22-35 2-35-22 1-22 24-41Z" fill="#e1bf54"/><path d="m50 23 5-15" stroke="#805b3c" stroke-width="6" stroke-linecap="round"/><path d="M55 17Q67 2 81 12q-7 15-26 5" fill="#789b53"/><path d="M30 57q-9 10-6 18" stroke="#f5df96" stroke-width="6" fill="none" stroke-linecap="round"/>');}
const basketArt=svg('<path d="M22 52q0-46 28-46t28 46" fill="none" stroke="#ab7d50" stroke-width="7"/><path d="M5 45h90L84 88H16Z" fill="#d6a66b"/><path d="M9 58h82M13 73h74M28 47l5 39m17-39v39m22-39-5 39" stroke="#b88653" stroke-width="3"/><path d="M7 47h86" stroke="#eac38b" stroke-width="7" stroke-linecap="round"/>').replace('<svg viewBox="0 0 100 100"','<svg preserveAspectRatio="none" viewBox="0 0 100 100"');
function animalArt(i){const color=['#d89a67','#b9b8a1','#d9ba89'][i];return svg((i===1?'<ellipse cx="31" cy="17" rx="12" ry="25" fill="'+color+'"/><ellipse cx="69" cy="17" rx="12" ry="25" fill="'+color+'"/>':i===0?'<path d="m12 37 1-31 29 22M58 28 87 6l1 31" fill="'+color+'"/>':'<circle cx="22" cy="22" r="17" fill="'+color+'"/><circle cx="78" cy="22" r="17" fill="'+color+'"/>')+'<ellipse cx="50" cy="88" rx="32" ry="27" fill="#92afa0"/><ellipse cx="50" cy="48" rx="43" ry="36" fill="'+color+'"/><ellipse cx="50" cy="60" rx="28" ry="19" fill="#fff0d4"/><circle cx="34" cy="45" r="4" fill="#584b3f"/><circle cx="66" cy="45" r="4" fill="#584b3f"/><path d="m46 55 4 4 4-4m-4 4v5m-7 0q7 7 14 0" fill="none" stroke="#584b3f" stroke-width="3" stroke-linecap="round"/><ellipse cx="21" cy="57" rx="7" ry="4" fill="#eab19d"/><ellipse cx="79" cy="57" rx="7" ry="4" fill="#eab19d"/>');}
function tone(high=false){try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume().catch(()=>{});const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.frequency.setValueAtTime(high?680:380,t);o.frequency.exponentialRampToValueAtTime(high?950:460,t+.13);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.08,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.2);}catch{}}
function say(key){if(key===lastVoice&&performance.now()-lastVoiceAt<900)return;lastVoice=key;lastVoiceAt=performance.now();voice.pause();voice.src='audio/'+key+'.mp3';voice.play().catch(()=>{});}
function animate(el,c='pop'){if(!el)return;el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),700);}
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<6;i++){const p=document.createElement('i');p.className='spark';p.style.left=r.left+r.width*(.15+i*.14)+'px';p.style.top=r.top+r.height*.35+'px';document.body.append(p);setTimeout(()=>p.remove(),850);}}
function request(){say('want_'+state.fruit+'_'+state.count);animate($('#card'));}
function sync(){document.querySelectorAll('.selected,.held').forEach(e=>e.classList.remove('selected','held'));if(selection){const el=selection.type==='stock'?$('[data-fruit="'+selection.fruit+'"]'):selection.type==='piece'?$('[data-id="'+selection.id+'"]'):$('#basket');el?.classList.add('selected');}for(const [key]of locks){const el=key==='basket'?$('#basket'):key.startsWith('stock:')?$('[data-fruit="'+key.slice(6)+'"]'):$('[data-id="'+key.slice(6)+'"]');el?.classList.add('held');}}
function ghostGoods(){for(const h of holds.values()){if(h.tool?.type==='basket'&&h.ghost){const row=h.ghost.querySelector('.ghost-goods');if(row)row.innerHTML=state.basket.map(p=>'<span style="width:25%;height:100%">'+fruitArt(p.fruit)+'</span>').join('');}}}
function render(){ghostGoods(); $('#goods').innerHTML=state.basket.map(p=>'<button class="piece" data-kind="piece" data-id="'+p.id+'" aria-label="篮里的'+(p.fruit==='apple'?'苹果':'梨')+'">'+fruitArt(p.fruit)+'</button>').join('');$('#customer').innerHTML=animalArt(state.animal);$('#card').innerHTML=Array.from({length:state.count},()=>'<span class="fruit">'+fruitArt(state.fruit)+'</span>').join('');sync();}
function clearHints(){document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));}
function miss(key){misses++;say(key);animate($('#basket'),'wiggle');animate($('#customer'),'wiggle');if(misses>=2){$('#card').classList.add('hint');const wrong=state.basket.find(p=>p.fruit!==state.fruit);if(wrong||state.basket.length>state.count)$('#goods').classList.add('hint');else $('[data-fruit="'+state.fruit+'"]').classList.add('hint');}}
function available(key,id){return !locks.has(key)||locks.get(key)===id;}
function put(tool,id){if(celebrating)return false;if(tool.type!=='stock'||!available('stock:'+tool.fruit,id))return false;if(state.basket.length>=4){say('full');animate($('#basket'),'wiggle');return false;}state.basket.push({id:++sequence,fruit:tool.fruit});selection=null;clearHints();render();tone(true);animate($('#basket'));say('put');return true;}
function take(tool,target,id){if(celebrating||!available('piece:'+tool.id,id))return false;const i=state.basket.findIndex(p=>p.id===tool.id);if(i<0)return false;if(target.dataset.fruit!==state.basket[i].fruit){miss('return');animate(target,'wiggle');return false;}state.basket.splice(i,1);selection=null;clearHints();render();animate(target);tone(true);say('back');return true;}
function deliver(id){if(celebrating){animate($('#customer'));return;}if(!available('basket',id)||[...locks.keys()].some(k=>k.startsWith('piece:'))){say('hands');animate($('#basket'));return;}selection=null;sync();if(state.basket.some(p=>p.fruit!==state.fruit)){miss('wrong');return;}if(state.basket.length!==state.count){miss(state.basket.length<state.count?'less':'more');return;}celebrating=true;clearHints();tone(true);say('thanks');$('#customer').classList.add('happy');burst($('#customer'));nextTimer=setTimeout(()=>{clearHints();state.basket=[];round++;state.fruit=round%2?'pear':'apple';state.count=[1,2,3,2,1,3][round%6];state.animal=(state.animal+1)%3;misses=0;selection=null;celebrating=false;$('#customer').classList.remove('happy');render();request();},1500);}
function select(tool){selection=JSON.stringify(selection)===JSON.stringify(tool)?null:tool;sync();say(tool.type==='stock'?tool.fruit:tool.type==='basket'?'give':'return');}
function tap(el,id){const kind=el.dataset.kind;if(kind==='stock'){if(selection?.type==='piece')take(selection,el,id);else if(!celebrating)select({type:'stock',fruit:el.dataset.fruit});return;}if(kind==='piece'){if(selection?.type==='stock')put(selection,id);else if(!celebrating)select({type:'piece',id:+el.dataset.id});return;}if(kind==='basket'){if(selection?.type==='stock')put(selection,id);else if(!celebrating)select({type:'basket'});return;}if(kind==='customer'){if(selection?.type==='basket')deliver(id);else{request();animate(el);}return;}if(kind==='card'){request();return;}animate(el);burst(el);say(el.id==='bell'?'hello':el.id==='sun'?'sun':el.id==='shelf'?'put':el.id==='counter'?'place':'cloud');}
function hit(x,y){return document.elementFromPoint(x,y)?.closest('[data-kind]');}
function start(e){const el=e.target.closest('[data-kind]');if(!el||e.button>0)return;e.preventDefault();tone();animate(el);const kind=el.dataset.kind,tool=kind==='stock'?{type:'stock',fruit:el.dataset.fruit}:kind==='piece'?{type:'piece',id:+el.dataset.id}:kind==='basket'?{type:'basket'}:null,key=tool?(kind==='stock'?'stock:'+tool.fruit:kind==='piece'?'piece:'+tool.id:'basket'):null;if(key&&locks.has(key)){say('hands');return;}const h={id:e.pointerId,el,tool,key,round,x:e.clientX,y:e.clientY,moved:false,ghost:null,art:tool?.type==='stock'?fruitArt(tool.fruit):tool?.type==='piece'?fruitArt(state.basket.find(p=>p.id===tool.id)?.fruit):basketArt};holds.set(h.id,h);if(key)locks.set(key,h.id);try{$('#scene').setPointerCapture(h.id);}catch{}sync();}
function move(e){const h=holds.get(e.pointerId);if(!h)return;e.preventDefault();if(Math.hypot(e.clientX-h.x,e.clientY-h.y)>12)h.moved=true;if(!h.moved||!h.tool)return;if(!h.ghost){h.ghost=document.createElement('div');h.ghost.className='ghost'+(h.tool.type==='basket'?' basket':'');h.ghost.innerHTML=h.art;if(h.tool.type==='basket'){const row=document.createElement('div');row.className='ghost-goods';row.style.cssText='position:absolute;inset:30% 8% 25%;display:flex;pointer-events:none';row.innerHTML=state.basket.map(p=>'<span style="width:25%;height:100%">'+fruitArt(p.fruit)+'</span>').join('');h.ghost.append(row);}document.body.append(h.ghost);}h.ghost.style.left=e.clientX+'px';h.ghost.style.top=e.clientY+'px';}
function release(h){holds.delete(h.id);if(locks.get(h.key)===h.id)locks.delete(h.key);h.ghost?.remove();try{if($('#scene').hasPointerCapture(h.id))$('#scene').releasePointerCapture(h.id);}catch{}sync();}
function end(e){const h=holds.get(e.pointerId);if(!h)return;e.preventDefault();const target=hit(e.clientX,e.clientY);if(celebrating){animate(h.el);release(h);return;}if(h.round===round){if(!h.moved)tap(h.el,h.id);else if(h.tool?.type==='stock'&&['basket','piece'].includes(target?.dataset.kind))put(h.tool,h.id);else if(h.tool?.type==='piece'&&target?.dataset.kind==='stock')take(h.tool,target,h.id);else if(h.tool?.type==='basket'&&target?.dataset.kind==='customer')deliver(h.id);else{animate(h.el,'wiggle');if(h.tool)miss('place');}}release(h);}
function cancel(e){const h=holds.get(e.pointerId);if(h)release(h);}
function cleanup(){for(const h of [...holds.values()])release(h);selection=null;voice.pause();sync();}
$('#sun').innerHTML=svg('<g stroke="#dfb252" stroke-width="5" stroke-linecap="round"><path d="M50 4v10m0 72v10M4 50h10m72 0h10M17 17l8 8m50 50 8 8M17 83l8-8m50-50 8-8"/></g><circle cx="50" cy="50" r="27" fill="#edc869"/><circle cx="42" cy="46" r="3" fill="#a9873f"/><circle cx="58" cy="46" r="3" fill="#a9873f"/><path d="M43 58q7 6 14 0" fill="none" stroke="#a9873f" stroke-width="3" stroke-linecap="round"/>');$('#cloud').innerHTML=svg('<path d="M17 70Q0 50 24 40q-2-29 26-23 20-10 29 18 29 0 20 28-5 16-30 11H25Z" fill="#fff9e8"/>');$('#bell').innerHTML=svg('<path d="M22 70q10-11 10-29 0-24 18-24t18 24q0 18 10 29Z" fill="#d8b458"/><circle cx="50" cy="79" r="9" fill="#ad8846"/><path d="M25 68h50" stroke="#f4d991" stroke-width="7" stroke-linecap="round"/>');$('#basket-art').style.cssText='position:absolute;inset:0';$('#basket-art').innerHTML=basketArt;document.querySelectorAll('.stock').forEach(el=>el.innerHTML=fruitArt(el.dataset.fruit));render();document.addEventListener('pointerdown',start,{passive:false});document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',end,{passive:false});document.addEventListener('pointercancel',cancel);document.addEventListener('lostpointercapture',e=>{if(holds.has(e.pointerId))cancel(e);});window.addEventListener('blur',cleanup);window.addEventListener('pagehide',cleanup);window.addEventListener('resize',cleanup);document.addEventListener('visibilitychange',()=>{if(document.hidden)cleanup();});document.addEventListener('contextmenu',e=>e.preventDefault());window.marketDebug=()=>JSON.parse(JSON.stringify({state,round,misses,celebrating,selected:selection,held:[...holds.values()].map(h=>({id:h.id,key:h.key,round:h.round})),locks:[...locks.entries()]}));
</script>
