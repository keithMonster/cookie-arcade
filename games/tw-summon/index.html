<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>召唤鸟鸟 · Cookie's Arcade</title>
<script src="../_lib/twirlywoos.js"></script>
<script src="../_lib/stage.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: none) {
    #back { color: rgba(0, 0, 0, 0.4) !important; }
  }
  #stage { position: fixed; inset: 0; overflow: hidden; }

  .pop-char {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
    animation: pop-in 2400ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    transform-origin: center bottom;
  }
  @keyframes pop-in {
    0%   { transform: scale(0)   rotate(-12deg); opacity: 0; }
    18%  { transform: scale(1.18) rotate(6deg);  opacity: 1; }
    32%  { transform: scale(1)   rotate(-3deg); }
    48%  { transform: scale(1)   rotate(2deg);  opacity: 1; }
    80%  { transform: scale(1)   rotate(0);     opacity: 1; }
    100% { transform: scale(0.8) rotate(0);     opacity: 0; }
  }
  .pop-char svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.08));
  }

  .name-tag {
    position: absolute;
    pointer-events: none;
    font-size: clamp(36px, 7vw, 84px);
    font-weight: 800;
    color: rgba(0, 0, 0, 0.78);
    text-shadow: 0 3px 0 rgba(255, 255, 255, 0.6);
    letter-spacing: 0.05em;
    animation: tag-pop 1800ms ease-out forwards;
    will-change: transform, opacity;
  }
  /* 每帧都带 translateX(-50%)——CSS 动画会整体接管 transform，inline 写居中会被覆盖（tag 右偏半个字宽） */
  @keyframes tag-pop {
    0%   { transform: translateX(-50%) scale(0.4) translateY(0); opacity: 0; }
    20%  { transform: translateX(-50%) scale(1.2) translateY(-10px); opacity: 1; }
    35%  { transform: translateX(-50%) scale(1)   translateY(0); opacity: 1; }
    80%  { transform: translateX(-50%) scale(1)   translateY(0); opacity: 1; }
    100% { transform: translateX(-50%) scale(1)   translateY(-30px); opacity: 0; }
  }

  /* 闪光圈 */
  .summon-ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    border: 6px solid;
    animation: ring-out 700ms ease-out forwards;
  }
  @keyframes ring-out {
    0%   { transform: scale(0.3); opacity: 0.9; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  #back {
    position: fixed;
    top: 8px; left: 4px;
    top: calc(constant(safe-area-inset-top) + 8px);
    left: calc(constant(safe-area-inset-left) + 4px);
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: calc(env(safe-area-inset-left, 0px) + 4px);
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    color: rgba(0, 0, 0, 0.15);
    text-decoration: none;
  }
  #back:hover { color: rgba(0, 0, 0, 0.7); background: rgba(0, 0, 0, 0.04); }

  #hint {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(0, 0, 0, 0.45);
    font-size: 22px; letter-spacing: 0.1em;
    pointer-events: none; transition: opacity 600ms;
    text-align: center; line-height: 1.6;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<a id="back" href="../../">←</a>
<div id="hint">戳一戳召唤鸟鸟</div>

<script>
  // 红船舞台底（风景随机：蓝天/沙漠/海/草地）
  TW.Stage.mount({ withShip: true });

  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  let started = false;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // 唯一化状态：同屏 tag 唯一 / 同屏角色最多 4 个
  let activeTag = null;
  const liveChars = [];

  function summonAt(x, y, charKey) {
    const c = TW.CHARS[charKey];
    // 角色大小按 sizeRatio 缩放，base 200px
    const height = 200 + c.sizeRatio * 160; // ~ 200-360px
    const width = height * (200 / 270);

    const el = document.createElement('div');
    el.className = 'pop-char';
    el.style.width = width + 'px';
    el.style.height = height + 'px';
    el.style.left = (x - width / 2) + 'px';
    el.style.top = (y - height / 2) + 'px';
    // noFilter: 同屏可能 4 个 summon char 都存在，filter 叠加会卡 iPad
    el.innerHTML = TW.svg(charKey, { expression: 'cheer', noFilter: true });
    stage.appendChild(el);
    setTimeout(() => el.remove(), 2500);

    // 闪光圈
    const ringSize = height * 0.9;
    const ring = document.createElement('div');
    ring.className = 'summon-ring';
    ring.style.width = ringSize + 'px';
    ring.style.height = ringSize + 'px';
    ring.style.left = (x - ringSize / 2) + 'px';
    ring.style.top = (y - ringSize / 2) + 'px';
    ring.style.borderColor = c.body;
    stage.appendChild(ring);
    setTimeout(() => ring.remove(), 750);

    // 名字（唯一化：连续召唤时旧 tag 立即清，避免叠一团）
    if (activeTag) activeTag.remove();
    const tag = document.createElement('div');
    tag.className = 'name-tag';
    tag.textContent = c.name + '！';
    tag.style.color = c.body;
    tag.style.left = '50%';
    // clamp 到屏内——上半屏召唤时 y-height/2-60 会为负，tag 整个飞出视口
    tag.style.top = Math.max(16, y - height / 2 - 60) + 'px';
    stage.appendChild(tag);
    activeTag = tag;
    setTimeout(() => {
      if (activeTag === tag) activeTag = null;
      tag.remove();
    }, 1850);

    // 同屏角色超 4 个时立即清最老
    while (liveChars.length >= 4) {
      const old = liveChars.shift();
      old.remove();
    }
    liveChars.push(el);
    // 角色 2.5s 后已 remove，从 liveChars 也清
    setTimeout(() => {
      const i = liveChars.indexOf(el);
      if (i >= 0) liveChars.splice(i, 1);
    }, 2500);

    // 50% 念中文名（24 月龄命名爆发期，复用 storybook 预录旁白）/ 50% 原角色叫声——二选一防叠音
    if (Math.random() < 0.5) {
      nameEl.src = 'audio/reveal_' + charKey + '.mp3';
      nameEl.currentTime = 0;
      nameEl.play().catch(() => TW.playCall(charKey));   // 音频失败回退叫声，保每按必反馈
    } else {
      TW.playCall(charKey);
    }
  }

  // 念名单例（召唤全在手势内触发，换 src 直接播即可）
  const nameEl = new Audio();
  nameEl.preload = 'auto';
  // 空闲预载 4 段念名 mp3 暖 HTTP 缓存
  setTimeout(() => {
    ['bighoo', 'toodloo', 'chickedy', 'chick'].forEach(k => {
      fetch(`audio/reveal_${k}.mp3`).catch(() => {});
    });
  }, 600);

  function trigger(x, y, charKey) {
    if (!started) start();
    // 默认在屏幕安全区域
    const margin = 180;
    const safeX = (x === undefined)
      ? rand(margin, window.innerWidth - margin)
      : x;
    const safeY = (y === undefined)
      ? rand(margin + 60, window.innerHeight - margin - 60)
      : y;
    const ck = charKey || pick(TW.CHAR_LIST);
    summonAt(safeX, safeY, ck);
  }

  function start() {
    if (started) return;
    started = true;
    hint.classList.add('gone');
    setTimeout(() => hint.remove(), 800);
    TW.ensureCtx();
  }

  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;   // 按住键 OS 自动重复不是真实按键
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === 'Escape') {
      if (!document.fullscreenElement) location.href = '../../';
      return;
    }
    e.preventDefault();
    if ((e.key === 'f' || e.key === 'F') && !document.fullscreenElement) {
      // 已全屏时 F 键不再拦截——落回下方正常召唤反馈（每按必反馈）
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      return;
    }
    // 数字键 1-4 精确召唤
    const idx = parseInt(e.key, 10);
    if (idx >= 1 && idx <= 4) {
      trigger(undefined, undefined, TW.CHAR_LIST[idx - 1]);
      return;
    }
    trigger();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('#back')) return;
    trigger(e.clientX, e.clientY);
  });
  document.addEventListener('touchstart', (e) => {
    if (e.target.closest('#back')) return;
    if (!started) start();
    for (const t of e.changedTouches) {
      trigger(t.clientX, t.clientY);
    }
    e.preventDefault();
  }, { passive: false });
</script>
</body>
</html>
