<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>召唤鸟鸟 · Cookie's Arcade</title>
<script src="../_lib/twirlywoos.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(180deg, #fef6e6 0%, #fde6c8 100%);
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: none) {
    #back { color: rgba(0, 0, 0, 0.4) !important; }
  }
  #stage { position: fixed; inset: 0; overflow: hidden; }

  .pop-char {
    position: absolute;
    pointer-events: none;
    will-change: transform, opacity;
    animation: pop-in 2400ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    transform-origin: center bottom;
  }
  @keyframes pop-in {
    0%   { transform: scale(0)   rotate(-12deg); opacity: 0; }
    18%  { transform: scale(1.18) rotate(6deg);  opacity: 1; }
    32%  { transform: scale(1)   rotate(-3deg); }
    48%  { transform: scale(1)   rotate(2deg);  opacity: 1; }
    80%  { transform: scale(1)   rotate(0);     opacity: 1; }
    100% { transform: scale(0.8) rotate(0);     opacity: 0; }
  }
  .pop-char svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.08));
  }

  .name-tag {
    position: absolute;
    pointer-events: none;
    font-size: clamp(36px, 7vw, 84px);
    font-weight: 800;
    color: rgba(0, 0, 0, 0.78);
    text-shadow: 0 3px 0 rgba(255, 255, 255, 0.6);
    letter-spacing: 0.05em;
    animation: tag-pop 1800ms ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes tag-pop {
    0%   { transform: scale(0.4) translateY(0); opacity: 0; }
    20%  { transform: scale(1.2) translateY(-10px); opacity: 1; }
    35%  { transform: scale(1)   translateY(0); opacity: 1; }
    80%  { transform: scale(1)   translateY(0); opacity: 1; }
    100% { transform: scale(1)   translateY(-30px); opacity: 0; }
  }

  /* 闪光圈 */
  .summon-ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    border: 6px solid;
    animation: ring-out 700ms ease-out forwards;
  }
  @keyframes ring-out {
    0%   { transform: scale(0.3); opacity: 0.9; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  #back {
    position: fixed; top: 0; right: 0;
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    color: rgba(0, 0, 0, 0.15);
    text-decoration: none;
  }
  #back:hover { color: rgba(0, 0, 0, 0.7); background: rgba(0, 0, 0, 0.04); }

  #hint {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(0, 0, 0, 0.45);
    font-size: 22px; letter-spacing: 0.1em;
    pointer-events: none; transition: opacity 600ms;
    text-align: center; line-height: 1.6;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<a id="back" href="../../">←</a>
<div id="hint">按 任意键 召唤鸟鸟<br>Esc 返回</div>

<script>
  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  let started = false;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function summonAt(x, y, charKey) {
    const c = TW.CHARS[charKey];
    // 角色大小按 sizeRatio 缩放，base 200px
    const height = 200 + c.sizeRatio * 160; // ~ 200-360px
    const width = height * (200 / 270);

    const el = document.createElement('div');
    el.className = 'pop-char';
    el.style.width = width + 'px';
    el.style.height = height + 'px';
    el.style.left = (x - width / 2) + 'px';
    el.style.top = (y - height / 2) + 'px';
    el.innerHTML = TW.svg(charKey, { expression: 'cheer' });
    stage.appendChild(el);
    setTimeout(() => el.remove(), 2500);

    // 闪光圈
    const ringSize = height * 0.9;
    const ring = document.createElement('div');
    ring.className = 'summon-ring';
    ring.style.width = ringSize + 'px';
    ring.style.height = ringSize + 'px';
    ring.style.left = (x - ringSize / 2) + 'px';
    ring.style.top = (y - ringSize / 2) + 'px';
    ring.style.borderColor = c.body;
    stage.appendChild(ring);
    setTimeout(() => ring.remove(), 750);

    // 名字
    const tag = document.createElement('div');
    tag.className = 'name-tag';
    tag.textContent = c.name + '！';
    tag.style.color = c.body;
    tag.style.left = '50%';
    tag.style.top = (y - height / 2 - 60) + 'px';
    tag.style.transform = 'translateX(-50%)';
    stage.appendChild(tag);
    setTimeout(() => tag.remove(), 1850);

    TW.playCall(charKey);
  }

  function trigger(x, y, charKey) {
    if (!started) start();
    // 默认在屏幕安全区域
    const margin = 180;
    const safeX = (x === undefined)
      ? rand(margin, window.innerWidth - margin)
      : x;
    const safeY = (y === undefined)
      ? rand(margin + 60, window.innerHeight - margin - 60)
      : y;
    const ck = charKey || pick(TW.CHAR_LIST);
    summonAt(safeX, safeY, ck);
  }

  function start() {
    if (started) return;
    started = true;
    hint.classList.add('gone');
    setTimeout(() => hint.remove(), 800);
    TW.ensureCtx();
  }

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === 'Escape') {
      if (!document.fullscreenElement) location.href = '../../';
      return;
    }
    e.preventDefault();
    if (e.key === 'f' || e.key === 'F') {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }
      return;
    }
    // 数字键 1-4 精确召唤
    const idx = parseInt(e.key, 10);
    if (idx >= 1 && idx <= 4) {
      trigger(undefined, undefined, TW.CHAR_LIST[idx - 1]);
      return;
    }
    trigger();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('#back')) return;
    trigger(e.clientX, e.clientY);
  });
  document.addEventListener('touchstart', (e) => {
    if (e.target.closest('#back')) return;
    if (!started) start();
    for (const t of e.changedTouches) {
      trigger(t.clientX, t.clientY);
    }
    e.preventDefault();
  }, { passive: false });
</script>
</body>
</html>
