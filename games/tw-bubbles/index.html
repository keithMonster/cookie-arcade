<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>戳泡泡 · Twirlywoos · Cookie's Arcade</title>
<script src="../_lib/twirlywoos.js"></script>
<script src="../_lib/stage.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: none) {
    #back { color: rgba(0, 0, 0, 0.4) !important; }
  }
  #stage { position: fixed; inset: 0; overflow: hidden; }

  /* 角色排 */
  #cast {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 32%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3%;
    padding: 0 4% 8px;
    pointer-events: none;
    z-index: 3;
  }
  .char-slot {
    height: 100%;
    display: flex;
    align-items: flex-end;
    transition: transform 200ms ease-out;
  }
  .char-slot.lookup {
    animation: look-up 600ms ease-out;
  }
  @keyframes look-up {
    0%, 100% { transform: translateY(0) rotate(0); }
    35%      { transform: translateY(-18px) rotate(0); }
  }
  .char-slot svg {
    height: 100%;
    width: auto;
    display: block;
    filter: drop-shadow(0 5px 0 rgba(0, 0, 0, 0.08));
  }

  /* 泡泡（从上往下） */
  .bubble {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    will-change: transform, opacity;
    box-shadow:
      inset -8px -10px 20px rgba(0, 0, 0, 0.12),
      inset 8px 10px 16px rgba(255, 255, 255, 0.55),
      0 0 24px rgba(255, 255, 255, 0.15);
  }
  .bubble::before {
    content: '';
    position: absolute;
    top: 16%;
    left: 22%;
    width: 28%;
    height: 22%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.65);
    filter: blur(2px);
  }
  .bubble.popping {
    animation: pop 380ms ease-out forwards !important;
  }
  @keyframes pop {
    0%   { transform: scale(1);   opacity: 1; }
    40%  { transform: scale(1.4); opacity: 0.5; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  /* 戳破粒子 */
  .splash {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    will-change: transform, opacity;
    animation: splash-fly 700ms cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
  }
  @keyframes splash-fly {
    0%   { transform: translate(0, 0)              scale(1);   opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }

  /* "啵" 字幕 */
  .pop-text {
    position: absolute;
    pointer-events: none;
    font-size: 48px;
    font-weight: 800;
    color: rgba(0, 0, 0, 0.7);
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.7);
    animation: text-rise 800ms ease-out forwards;
  }
  @keyframes text-rise {
    0%   { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    25%  { transform: translate(-50%, -10px) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -40px) scale(1); opacity: 0; }
  }

  #back {
    position: fixed; top: 0; right: 0;
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    color: rgba(0, 0, 0, 0.15);
    text-decoration: none;
  }
  #back:hover { color: rgba(0, 0, 0, 0.7); background: rgba(0, 0, 0, 0.04); }

  #hint {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(0, 0, 0, 0.45);
    font-size: 22px; letter-spacing: 0.1em;
    pointer-events: none; transition: opacity 600ms;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="cast">
  <div class="char-slot" data-char="chick"></div>
  <div class="char-slot" data-char="chickedy"></div>
  <div class="char-slot" data-char="toodloo"></div>
  <div class="char-slot" data-char="bighoo"></div>
</div>
<a id="back" href="../../">←</a>
<div id="hint">戳一戳泡泡</div>

<script>
  // 红船舞台底（风景随机：蓝天/沙漠/海/草地）
  TW.Stage.mount({ withShip: true });

  const stage = document.getElementById('stage');
  const cast = document.getElementById('cast');
  const hint = document.getElementById('hint');

  let started = false;
  let mouseX = -1000, mouseY = -1000;
  const liveBubbles = [];
  const MAX_BUBBLES = 12;
  const SPAWN_INTERVAL = 700;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // 一次性渲染 cast（不重渲染——表情切换由 CSS 仰头动画承担，性能优先）
  // noFilter: 4 角色排底部小尺寸 + 持续 spawn 泡泡占 GPU，省掉 feTurbulence 防卡
  cast.querySelectorAll('.char-slot').forEach(slot => {
    const ck = slot.dataset.char;
    const sr = TW.CHARS[ck].sizeRatio;
    slot.style.height = (sr * 100) + '%';
    slot.innerHTML = TW.svg(ck, { expression: 'idle', noFilter: true });
  });

  function castLookUp() {
    // 整排仰头（CSS 动画，零 DOM 重渲染）
    cast.querySelectorAll('.char-slot').forEach(s => {
      s.classList.remove('lookup');
      void s.offsetWidth;
      s.classList.add('lookup');
    });
  }

  // ===== 泡泡：从顶部生成往下飘（与画面方向一致） =====
  function spawnBubble() {
    if (liveBubbles.length >= MAX_BUBBLES) return;
    const size = rand(70, 150);
    const startX = rand(20, window.innerWidth - size - 20);
    // 角色排区域以上 = 屏幕高度 - 32%（角色区） - size
    const castTopY = window.innerHeight * 0.68;
    const fallTo = castTopY - size - 10;
    const life = rand(7, 11);
    const color = pick(['#8be0e8', '#ffafd1', '#fff48a', '#a5e8a3', '#d2a4f5', '#ffd2a1']);

    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.left = startX + 'px';
    el.style.top = (-size - 20) + 'px';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.background = `radial-gradient(circle at 30% 30%,
      ${color}66 0%, ${color}33 50%, ${color}0d 100%)`;
    stage.appendChild(el);

    // CSS 动画：top transition + wobble
    const wobble = rand(20, 50) * (Math.random() < 0.5 ? -1 : 1);
    const wobblePeriod = rand(2, 3.5);
    el.animate(
      [
        { transform: `translateX(0)`, top: (-size - 20) + 'px', opacity: 0 },
        { transform: `translateX(${wobble}px)`, top: ((fallTo - (-size - 20)) * 0.5) + 'px', opacity: 1, offset: 0.5 },
        { transform: `translateX(0)`, top: fallTo + 'px', opacity: 1 },
      ],
      { duration: life * 1000, easing: 'linear', fill: 'forwards' }
    );

    const rec = {
      el, color, size, startX,
      startTop: -size - 20,
      endTop: fallTo,
      life,
      bornAt: performance.now(),
      popping: false,
    };
    liveBubbles.push(rec);

    setTimeout(() => {
      const i = liveBubbles.indexOf(rec);
      if (i >= 0) liveBubbles.splice(i, 1);
      if (!rec.popping) el.remove();
    }, life * 1000 + 100);
  }

  function bubbleCenter(b, now) {
    const t = Math.min((now - b.bornAt) / 1000 / b.life, 1);
    const cy = b.startTop + (b.endTop - b.startTop) * t + b.size / 2;
    const cx = b.startX + b.size / 2; // 忽略 wobble 的几十像素近似
    return { cx, cy, r: b.size / 2 };
  }

  function popAt(px, py) {
    const now = performance.now();
    // 容差半径放大：泡泡 wobble 在 compositor 上跑 (Web Animations API)，
    // JS 算 cx 拿不到实时 transform 偏移（±50px）。半径放大 1.4 倍
    // 让 cookie 戳偏 30-40px 也能命中——避免"明明戳到了却没破"的挫败
    const TOUCH_PAD = 1.4;
    for (let i = liveBubbles.length - 1; i >= 0; i--) {
      const b = liveBubbles[i];
      if (b.popping) continue;
      const { cx, cy, r } = bubbleCenter(b, now);
      const tr = r * TOUCH_PAD;
      const dx = px - cx, dy = py - cy;
      if (dx * dx + dy * dy < tr * tr) {
        popBubble(b, cx, cy);
      }
    }
  }
  function popCheck() {
    if (mouseX < 0) return;
    popAt(mouseX, mouseY);
  }

  function popHighestAndSpawn() {
    const now = performance.now();
    let target = null, lowestY = -Infinity; // "最高" 视觉上 = top 最小，但屏幕上泡泡掉下来 → 戳"最先要到角色"那个 = cy 最大
    for (const b of liveBubbles) {
      if (b.popping) continue;
      const c = bubbleCenter(b, now);
      if (c.cy > lowestY) { lowestY = c.cy; target = { b, ...c }; }
    }
    if (target) {
      popBubble(target.b, target.cx, target.cy);
    } else {
      const cx = rand(window.innerWidth * 0.2, window.innerWidth * 0.8);
      const cy = rand(window.innerHeight * 0.25, window.innerHeight * 0.55);
      const color = pick(['#8be0e8', '#ffafd1', '#fff48a']);
      spawnSplash(cx, cy, color);
      TW.playPop();
      castLookUp();
      maybeShowOooo(cx, cy);
    }
    spawnBubble();
  }

  function popBubble(b, cx, cy) {
    b.popping = true;
    b.el.classList.add('popping');
    setTimeout(() => {
      const i = liveBubbles.indexOf(b);
      if (i >= 0) liveBubbles.splice(i, 1);
      b.el.remove();
    }, 400);
    spawnSplash(cx, cy, b.color);
    TW.playPop();
    castLookUp();
    showPopText(cx, cy);
    maybeShowOooo(cx, cy);
  }

  function spawnSplash(cx, cy, color) {
    const count = 12;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'splash';
      const size = rand(6, 14);
      p.style.left = (cx - size / 2) + 'px';
      p.style.top = (cy - size / 2) + 'px';
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.background = color;
      const angle = (i / count) * Math.PI * 2 + Math.random() * 0.3;
      const dist = rand(60, 140);
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      stage.appendChild(p);
      setTimeout(() => p.remove(), 750);
    }
  }

  function showPopText(cx, cy) {
    const el = document.createElement('div');
    el.className = 'pop-text';
    el.textContent = pick(['啵', '啵啵', '波', '啵！']);
    el.style.left = cx + 'px';
    el.style.top = (cy - 30) + 'px';
    el.style.color = pick(['#dc2626', '#f59e0b', '#3b82f6', '#10b981', '#8b5cf6']);
    stage.appendChild(el);
    setTimeout(() => el.remove(), 850);
  }

  // 偶尔（25%）触发集体 Oooo 反应
  let lastOoooAt = 0;
  function maybeShowOooo(cx, cy) {
    const now = performance.now();
    if (now - lastOoooAt < 1800) return;
    if (Math.random() > 0.3) return;
    lastOoooAt = now;
    TW.playOooo();
    const el = document.createElement('div');
    el.className = 'pop-text';
    el.textContent = 'Oooooh!';
    el.style.fontSize = '64px';
    el.style.left = '50%';
    el.style.top = (window.innerHeight * 0.55) + 'px';
    el.style.color = '#f97316';
    stage.appendChild(el);
    setTimeout(() => el.remove(), 850);
  }

  function start() {
    if (started) return;
    started = true;
    hint.classList.add('gone');
    setTimeout(() => hint.remove(), 800);
    TW.ensureCtx();
    setInterval(spawnBubble, SPAWN_INTERVAL);
    function tick() { popCheck(); requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
    for (let i = 0; i < 3; i++) setTimeout(spawnBubble, i * 400);
  }

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX; mouseY = e.clientY;
    if (!started) start();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('#back')) return;
    mouseX = e.clientX; mouseY = e.clientY;
    if (!started) start();
    popCheck();
  });
  document.addEventListener('touchstart', (e) => {
    if (e.target.closest('#back')) return;
    if (!started) start();
    for (const t of e.changedTouches) popAt(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!started) start();
    for (const t of e.touches) popAt(t.clientX, t.clientY);
  }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === 'Escape') {
      if (!document.fullscreenElement) location.href = '../../';
      return;
    }
    e.preventDefault();
    if (!started) start();
    if (e.key === 'f' || e.key === 'F') {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }
      return;
    }
    popHighestAndSpawn();
  });

  window.addEventListener('resize', () => {
    [...liveBubbles].forEach(b => {
      const i = liveBubbles.indexOf(b);
      if (i >= 0) liveBubbles.splice(i, 1);
      b.el.remove();
    });
  });
</script>
</body>
</html>
