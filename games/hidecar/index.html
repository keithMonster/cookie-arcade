<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#d8e8cb}button{border:0;padding:0;background:none;color:inherit;touch-action:none}svg{width:100%;height:100%;display:block;pointer-events:none}#back{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#fff9e8;color:#536b55;z-index:20;box-shadow:0 3px #b2c49f}#back svg{width:24px;height:24px}#scene{height:100%;height:100dvh;max-width:1100px;margin:auto;position:relative;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;grid-template-rows:minmax(76px,1fr) minmax(130px,2fr) minmax(160px,2fr);gap:12px}#scene>*{min-width:0}#sky{display:flex;align-items:center;justify-content:space-evenly;gap:8px;padding-left:50px}#sky button{flex-shrink:1;min-width:44px;min-height:44px}#sun{width:clamp(44px,15vw,72px);height:clamp(44px,15vw,72px)}#cloud{width:clamp(70px,25vw,125px);height:clamp(48px,18vw,76px)}#bird{width:clamp(44px,15vw,72px);height:clamp(44px,14vw,60px)}#garages{display:flex;align-items:flex-end;gap:clamp(8px,3vw,32px);padding:0 4px}.garage{flex:1;height:100%;max-height:275px;min-width:0;position:relative;overflow:hidden;border-radius:28px 28px 12px 12px;background:#c4a57c;box-shadow:0 7px #b9cb9e;isolation:auto}.roof{position:absolute;top:0;height:25%;width:100%;background:var(--color);border-radius:28px 28px 0 0;box-shadow:inset 0 -7px #00000012}.roof:before{content:'';position:absolute;width:28px;height:28px;left:calc(50% - 14px);top:18%;border-radius:50%;background:#fff3ce99}.inside{position:absolute;inset:26% 8% 5%;background:#776c59;border-radius:15px 15px 0 0;box-shadow:inset 0 6px 8px #4e4b3d44}.floor{position:absolute;bottom:0;left:9%;right:9%;height:9%;background:#e5ce9f;border-radius:50%}.door{position:absolute;inset:26% 8% 5%;border-radius:12px 12px 0 0;background:repeating-linear-gradient(to bottom,var(--color) 0,var(--color) 18%,#ffffff30 18%,#ffffff30 20%);box-shadow:inset 0 -6px #00000013;transform:translateY(0);transition:transform .48s ease-in-out;z-index:6;pointer-events:none}.door:after{content:'';position:absolute;width:32%;height:8px;background:#fff0cf;bottom:12%;left:34%;border-radius:6px}.garage{transition:translate .95s ease-in-out}.garage.sliding{z-index:8}.garage.open .door{transform:translateY(-108%)}.garage.hint{animation:glow 1.1s ease-in-out infinite}.garage.wiggle{animation:wiggle .4s}.garage.flash .inside{background:#9b9576}#road{position:relative;align-self:center;height:80%;max-height:205px;min-height:120px;border-radius:70px;background:#a9b4ac;box-shadow:inset 0 0 0 10px #e8dfbd,0 7px #bbc99e}#road:before{content:'';position:absolute;left:12%;right:12%;top:48%;border-top:7px dashed #f7f0d6;pointer-events:none}#road.ready{animation:roadglow 1.3s ease-in-out infinite}#car{position:fixed;width:clamp(72px,19vw,140px);height:clamp(56px,15vw,108px);z-index:5;transform:translate(-50%,-65%);transition:left 1.15s ease-in-out,top 1.15s ease-in-out;filter:drop-shadow(0 7px 1px #3b49322a)}#car.held{z-index:12;transition:none;filter:drop-shadow(0 12px 3px #39463050)}#car.selected{filter:drop-shadow(0 0 7px #fff9ae)}#car[hidden]{display:none}.pop{animation:pop .42s ease-out}@keyframes pop{45%{transform:translateY(-9px) rotate(-5deg)}}@keyframes wiggle{25%,75%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes glow{50%{box-shadow:0 0 0 6px #fff1a5,0 0 24px 6px #fff8cc}}@keyframes roadglow{50%{box-shadow:inset 0 0 0 10px #fff4ba,0 7px #bbc99e}}
@media(orientation:landscape) and (max-height:600px){#scene{grid-template-rows:60px minmax(100px,1.5fr) minmax(85px,1fr);gap:8px}#sun{width:50px;height:50px}#cloud{width:100px;height:54px}#bird{width:60px;height:48px}#road{min-height:75px;height:100%}.garage{max-width:240px}#garages{justify-content:center}.roof:before{width:20px;height:20px;left:calc(50% - 10px)}#car{width:90px;height:68px}}
@media(prefers-reduced-motion:reduce){#car{transition-duration:.4s}.pop,.wiggle{animation-duration:.1s}}
</style>
<a id="back" href="../../" aria-label="返回游戏台"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></svg></a>
<main id="scene">
<div id="sky"><button id="sun" data-decor aria-label="太阳"><svg viewBox="0 0 100 100"><g stroke="#dfb14d" stroke-width="6" stroke-linecap="round"><path d="M50 4v10m0 72v10M4 50h10m72 0h10M17 17l8 8m50 50 8 8M17 83l8-8m50-50 8-8"/></g><circle cx="50" cy="50" r="28" fill="#ecc05b"/><path d="M38 54q12 14 24 0" fill="none" stroke="#997641" stroke-width="3"/><g fill="#997641"><circle cx="40" cy="43" r="3"/><circle cx="60" cy="43" r="3"/></g></svg></button><button id="cloud" data-decor aria-label="云朵"><svg viewBox="0 0 160 90"><path d="M28 73C-4 72 2 30 34 34 39-1 91-5 104 29c36-10 62 31 34 43Z" fill="#fff9e9"/></svg></button><button id="bird" data-decor aria-label="小鸟"><svg viewBox="0 0 100 85"><path d="m29 53-24-8 19 25" fill="#af8264"/><ellipse cx="51" cy="50" rx="30" ry="25" fill="#d9a078"/><path d="M41 42q-4 30 27 15" fill="#bc8665"/><circle cx="70" cy="37" r="4" fill="#615240"/><path d="m80 43 16 8-17 5" fill="#e6be64"/></svg></button></div>
<div id="garages"><button class="garage open" data-door="0" style="--color:#80a8ad" aria-label="左边车库"><span class="roof"></span><span class="inside"></span><span class="floor"></span><span class="door"></span></button><button class="garage open" data-door="1" style="--color:#80a8ad" aria-label="中间车库"><span class="roof"></span><span class="inside"></span><span class="floor"></span><span class="door"></span></button><button class="garage open" data-door="2" style="--color:#80a8ad" aria-label="右边车库"><span class="roof"></span><span class="inside"></span><span class="floor"></span><span class="door"></span></button></div>
<button id="road" aria-label="出发路面"></button>
<button id="car" aria-label="小车"><svg viewBox="0 0 160 110"><path d="m35 53 18-31q4-7 14-7h29q12 0 18 10l17 28" fill="#d65f57"/><path d="m56 26-13 27h30V26Zm29 0v27h33l-16-27" fill="#dce9df"/><path d="M24 47h112q13 0 13 14v22H12V62q0-15 12-15" fill="#e67965"/><path d="M14 70h135v15H14Z" fill="#c65c50"/><circle cx="42" cy="85" r="18" fill="#575f59"/><circle cx="42" cy="85" r="8" fill="#e7d9b6"/><circle cx="119" cy="85" r="18" fill="#575f59"/><circle cx="119" cy="85" r="8" fill="#e7d9b6"/><path d="M134 58h13v10h-13" fill="#ffe3a1"/><path d="M12 57h9v10h-9" fill="#f6c1a2"/><path d="M79 63h12" stroke="#a84843" stroke-width="4" stroke-linecap="round"/></svg></button>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s),doors=[...document.querySelectorAll('.garage')],car=$('#car'),road=$('#road'),voice=new Audio();
voice.volume=.3;voice.preload='auto';voice.src='audio/look.mp3';
let phase='arriving',target=0,misses=0,round=0,selected=false,carOwner=null,context=null,lastVoice='',lastVoiceAt=0;
const pointers=new Map(),locks=new Map(),timers=new Set();
function later(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn();},ms);timers.add(id);return id;}
function tone(high=false){try{context??=new(window.AudioContext||window.webkitAudioContext)();context.resume().catch(()=>{});const o=context.createOscillator(),g=context.createGain(),t=context.currentTime;o.type='sine';o.frequency.setValueAtTime(high?640:340,t);o.frequency.exponentialRampToValueAtTime(high?860:430,t+.12);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.085,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(context.destination);o.start(t);o.stop(t+.2);}catch{}}
function say(key){if(lastVoice===key&&performance.now()-lastVoiceAt<1300)return;lastVoice=key;lastVoiceAt=performance.now();voice.pause();voice.src='audio/'+key+'.mp3';voice.play().catch(()=>{});}
function bump(el,cls='pop'){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);later(()=>el.classList.remove(cls),450);}
function point(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height*.79};}
function place(p){car.style.left=p.x+'px';car.style.top=p.y+'px';}
function home(){place(point(doors[target]));}
function snapHome(){car.style.transition='none';home();void car.offsetWidth;car.style.transition='';}
function sync(){car.classList.toggle('selected',selected);road.classList.toggle('ready',phase==='found');doors.forEach((d,i)=>d.classList.toggle('hint',phase==='searching'&&misses>=2&&i===target));}
function finishShuffle(){
 doors.forEach(d=>{d.style.transition='none';d.style.translate='';d.classList.remove('sliding');});
 void $('#garages').offsetWidth;
 doors.forEach(d=>{d.style.transition='';});
 car.style.transition='none';home();void car.offsetWidth;car.style.transition='';
 phase='searching';car.hidden=true;say('find');sync();
}
function swapGarages(a,b){
 const before=doors.map(d=>d.getBoundingClientRect().left);
 const order=doors.map(d=>Number(d.style.order||d.dataset.door));
 [order[a],order[b]]=[order[b],order[a]];
 doors.forEach((d,i)=>{d.style.transition='none';d.style.order=order[i];});
 doors.forEach((d,i)=>{d.style.translate=(before[i]-d.getBoundingClientRect().left)+'px 0';});
 void $('#garages').offsetWidth;
 const front=Math.random()<.5?a:b;
 doors[front].classList.add('sliding');
 doors.forEach(d=>{d.style.transition='';d.style.translate='0px 0px';});
 later(()=>doors[front].classList.remove('sliding'),1000);
}
function shuffle(){
 cleanup();phase='shuffling';car.hidden=true;sync();
 const others=[0,1,2].filter(i=>i!==target);
 if(Math.random()<.5)others.reverse();
 swapGarages(target,others[0]);
 later(()=>swapGarages(target,others[1]),1200);
 later(finishShuffle,2350);
}
function newRound(){cleanup();round++;phase='arriving';target=Math.floor(Math.random()*3);misses=0;selected=false;car.hidden=false;doors.forEach(d=>d.classList.add('open'));car.style.transition='none';place(point(road));sync();later(()=>{car.style.transition='';home();},100);later(()=>{phase='showing';say('look');},1300);later(()=>{phase='closing';doors.forEach(d=>d.classList.remove('open'));},2600);later(shuffle,3150);}
function openDoor(i){const d=doors[i];tone();if(phase==='searching'){d.classList.add('open');if(i===target){phase='found';car.style.transition='none';car.hidden=false;home();void car.offsetWidth;car.style.transition='';selected=false;say('found');tone(true);sync();}else{misses++;bump(d,'wiggle');d.classList.add('flash');say(misses>=2?'hint':'empty');sync();later(()=>{d.classList.remove('flash');if(phase==='searching'||phase==='found')d.classList.remove('open');},850);}return;}if(phase==='found'&&i!==target){d.classList.toggle('open');return;}bump(d);if(phase==='found')say('drive');}
function drive(pointer){if(phase!=='found')return;if(carOwner!==null&&carOwner!==pointer){bump(road);tone();return;}phase='leaving';selected=false;car.classList.remove('held');car.style.transition='';place(point(road));sync();tone(true);say('go');later(()=>{place({x:innerWidth+170,y:point(road).y});},1250);later(newRound,2650);}
function hit(x,y){return document.elementFromPoint(x,y)?.closest('[data-door],[data-decor],#road,#car');}
function tap(el,pointer){if(el.dataset.door!==undefined){openDoor(+el.dataset.door);return;}if(el===car){if(phase==='found'){selected=!selected;sync();say('drive');}else tone(true);return;}if(el===road){if(phase==='found'&&selected)drive(pointer);else{bump(road);tone();if(phase==='found')say('drive');}return;}bump(el);tone(el.id==='bird');}
function release(h){if(h.door){h.door.style.transform='';h.door.style.transition='';}pointers.delete(h.id);if(locks.get(h.el)===h.id)locks.delete(h.el);if(carOwner===h.id){carOwner=null;car.classList.remove('held');if(phase==='found')home();}try{if(h.el.hasPointerCapture(h.id))h.el.releasePointerCapture(h.id);}catch{}}
function start(e){const el=e.target.closest('[data-door],[data-decor],#road,#car');if(!el||e.button>0)return;e.preventDefault();tone();if(locks.has(el)){bump(el,'wiggle');return;}const h={id:e.pointerId,el,x:e.clientX,y:e.clientY,moved:false,phase,door:el.dataset.door!==undefined&&phase==='searching'&&!el.classList.contains('open')?el.querySelector('.door'):null,lift:0,canDrag:el===car&&phase==='found'};pointers.set(h.id,h);locks.set(el,h.id);if(h.canDrag)carOwner=h.id;try{el.setPointerCapture(h.id);}catch{}if(el!==car&&el.dataset.door===undefined)bump(el);else if(el.dataset.door!==undefined&&phase!=='searching')tone();}
function move(e){const h=pointers.get(e.pointerId);if(!h)return;e.preventDefault();if(Math.hypot(e.clientX-h.x,e.clientY-h.y)>12)h.moved=true;if(h.door&&h.phase===phase){h.lift=Math.max(0,Math.min(h.door.offsetHeight,h.y-e.clientY));h.door.style.transition='none';h.door.style.transform='translateY(-'+h.lift+'px)';}if(h.moved&&h.canDrag&&carOwner===h.id&&phase==='found'){selected=false;car.classList.add('held');place({x:e.clientX,y:e.clientY});sync();}}
function end(e){const h=pointers.get(e.pointerId);if(!h)return;e.preventDefault();const r=road.getBoundingClientRect(),onRoad=e.clientX>=r.left-15&&e.clientX<=r.right+15&&e.clientY>=r.top-15&&e.clientY<=r.bottom+15;if(h.moved&&h.door&&h.phase===phase){if(h.lift>=Math.min(48,h.door.offsetHeight*.3))openDoor(+h.el.dataset.door);else tone();}else if(h.moved&&h.canDrag){if(phase==='found'&&onRoad)drive(h.id);else if(phase==='found'){say('drive');tone();}}else if(!h.moved&&h.phase===phase)tap(h.el,h.id);else if(!h.moved){bump(h.el);tone();}release(h);}
function cancel(e){const h=pointers.get(e.pointerId);if(h)release(h);}
function cleanup(){for(const h of [...pointers.values()])release(h);selected=false;voice.pause();sync();}
function settle(){cleanup();for(const id of timers)clearTimeout(id);timers.clear();doors.forEach(d=>{d.classList.remove('flash','pop','wiggle','sliding');d.style.translate='';});if(['arriving','showing','closing'].includes(phase)){phase='showing';car.hidden=false;doors.forEach(d=>d.classList.add('open'));home();later(()=>{phase='closing';doors.forEach(d=>d.classList.remove('open'));},1300);later(shuffle,1850);}else if(phase==='shuffling'){finishShuffle();}else if(phase==='leaving'){newRound();}else if(phase==='found'){doors.forEach((d,i)=>d.classList.toggle('open',i===target));snapHome();}else if(phase==='searching'){doors.forEach(d=>d.classList.remove('open'));}sync();}
window.addEventListener('blur',settle);window.addEventListener('pagehide',settle);window.addEventListener('resize',settle);document.addEventListener('visibilitychange',()=>{if(document.hidden)settle();});
document.addEventListener('pointerdown',start,{passive:false});document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',end,{passive:false});document.addEventListener('pointercancel',cancel);document.addEventListener('lostpointercapture',cancel);document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
window.hidecarDebug=()=>({phase,target,misses,round,selected,carOwner,held:pointers.size,locks:locks.size,doors:doors.map(d=>({open:d.classList.contains('open'),hint:d.classList.contains('hint')})),carHidden:car.hidden,order:doors.map(d=>Number(d.style.order||d.dataset.door)),voice:{paused:voice.paused,src:voice.currentSrc}});
newRound();
</script>
</html>
