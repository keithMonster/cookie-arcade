<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>跟着敲 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    /* 暖色小舞台：上半奶油幕布，下半木地板 */
    background: linear-gradient(180deg, #fff3d1 0%, #ffe4a8 56%, #e2b077 56%, #c98f55 100%);
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 10%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%),
      radial-gradient(120% 90% at 50% 112%, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0) 55%);
    pointer-events: none;
    z-index: 0;
  }
  /* 幕布两侧的红帘：纯装饰，暗示"上台表演" */
  .curtain {
    position: fixed;
    top: 0;
    width: 9vmin;
    height: 58vh;
    background: repeating-linear-gradient(90deg, #d9534f 0 2vmin, #c4413d 2vmin 4.5vmin);
    border-radius: 0 0 4vmin 4vmin;
    box-shadow: 0 1.5vmin 2vmin rgba(120, 40, 30, 0.25);
    z-index: 1;
  }
  .curtain.l { left: 0; }
  .curtain.r { right: 0; }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    padding: max(6vmin, env(safe-area-inset-top, 0px)) 2vmin max(2vmin, env(safe-area-inset-bottom, 0px));
  }

  /* ===== 鼓手小兔子（戳它 = 再听一次）===== */
  .drummer {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 0.5vmin;
    cursor: pointer;
    z-index: 5;
    animation: drummer-sway 2.6s ease-in-out infinite;
    filter: drop-shadow(0 1.4vmin 1vmin rgba(90, 50, 20, 0.22));
  }
  @keyframes drummer-sway {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2deg) translateY(-0.6vmin); }
  }
  .drummer .bunny { font-size: 17vmin; line-height: 1; }
  .drummer .lildrum { font-size: 9vmin; line-height: 1; margin-bottom: 1vmin; }
  /* 兔子敲一下：整只往下一顿 + 小鼓一颤 */
  .drummer.hit { animation: drummer-hit 260ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes drummer-hit {
    0%   { transform: translateY(0)       scale(1); }
    35%  { transform: translateY(1.8vmin) scale(1.06, 0.92); }
    100% { transform: translateY(0)       scale(1); }
  }
  .drummer.hit .lildrum { animation: lildrum-shake 260ms ease-out; }
  @keyframes lildrum-shake {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.25) rotate(-8deg); }
    100% { transform: scale(1); }
  }
  /* 说话中：发光 */
  .drummer.talking .bunny { animation: bunny-talk 560ms ease-in-out infinite; }
  @keyframes bunny-talk {
    0%, 100% { transform: rotate(0); }
    30%      { transform: rotate(-5deg) scale(1.04); }
    70%      { transform: rotate(5deg)  scale(1.04); }
  }
  /* 庆祝：蹦起来 */
  .drummer.cheer { animation: drummer-cheer 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 2; }
  @keyframes drummer-cheer {
    0%, 100% { transform: translateY(0)      scale(1); }
    40%      { transform: translateY(-7vmin) scale(1.12) rotate(-6deg); }
    70%      { transform: translateY(-2vmin) scale(1.04) rotate(4deg); }
  }

  /* ===== 节拍点：兔子敲一下亮一颗，轮到他时敲一下填一颗 ===== */
  .beats {
    display: flex;
    align-items: center;
    min-height: 10vmin;
    z-index: 4;
  }
  .dot {
    width: 7vmin;
    height: 7vmin;
    border-radius: 50%;
    border: 0.9vmin solid rgba(120, 70, 30, 0.35);
    background: transparent;
    margin-left: var(--gap, 2vmin);
    transition: background 180ms, border-color 180ms, transform 180ms;
    will-change: transform;
  }
  .dot:first-child { margin-left: 0; }
  /* 兔子敲亮：橙 */
  .dot.lit  { background: #ff9a3c; border-color: #ff9a3c; animation: dot-pop 320ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  /* 他敲填：绿 */
  .dot.done { background: #6cc86a; border-color: #6cc86a; animation: dot-pop 320ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes dot-pop {
    0%   { transform: scale(0.6); }
    50%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  /* 轮到他：空心点一起轻轻呼吸，暗示"该填这些了" */
  .beats.yours .dot:not(.done) { animation: dot-breathe 1.1s ease-in-out infinite; }
  @keyframes dot-breathe {
    0%, 100% { transform: scale(1);    border-color: rgba(120, 70, 30, 0.35); }
    50%      { transform: scale(1.12); border-color: rgba(108, 200, 106, 0.9); }
  }

  /* ===== 大鼓（他的）===== */
  .drum {
    position: relative;
    width: 58vmin;
    max-width: 480px;
    height: 34vmin;
    max-height: 280px;
    cursor: pointer;
    z-index: 4;
    will-change: transform;
  }
  .drum .shell {
    position: absolute;
    left: 0; right: 0;
    top: 18%; bottom: 0;
    background: linear-gradient(90deg, #c9433c 0%, #ee6f66 45%, #e05b52 55%, #b83a33 100%);
    border-radius: 0 0 50% 50% / 0 0 22% 22%;
    box-shadow: inset 0 -2.5vmin 0 rgba(0, 0, 0, 0.12), 0 2vmin 2.4vmin rgba(90, 40, 20, 0.28);
  }
  /* 鼓身的绑绳：斜条纹 */
  .drum .shell::before {
    content: '';
    position: absolute;
    inset: 12% 0 10%;
    background: repeating-linear-gradient(112deg, transparent 0 7vmin, rgba(255, 236, 170, 0.75) 7vmin 7.8vmin);
    opacity: 0.85;
  }
  .drum .head {
    position: absolute;
    left: 0; right: 0;
    top: 0;
    height: 38%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 40%, #fff7e3 0%, #f5e0b4 65%, #e6c890 100%);
    border: 1.4vmin solid #d9534f;
    box-shadow: inset 0 0 3vmin rgba(120, 80, 30, 0.18);
    overflow: hidden;
  }
  /* 轮到他：鼓面周围一圈绿色光晕呼吸 */
  .drum::after {
    content: '';
    position: absolute;
    left: -3%; right: -3%;
    top: -6%;
    height: 50%;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(108, 200, 106, 0);
    pointer-events: none;
    transition: box-shadow 300ms;
  }
  .drum.yours::after { animation: drum-glow 1.1s ease-in-out infinite; }
  @keyframes drum-glow {
    0%, 100% { box-shadow: 0 0 0 0      rgba(108, 200, 106, 0.0); }
    50%      { box-shadow: 0 0 4vmin 1.6vmin rgba(108, 200, 106, 0.55); }
  }
  /* 敲下去：整只鼓压扁弹回 */
  .drum.hit { animation: drum-hit 220ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes drum-hit {
    0%   { transform: scale(1, 1); }
    35%  { transform: scale(1.05, 0.9) translateY(1.4vmin); }
    100% { transform: scale(1, 1); }
  }
  /* 鼓面上的涟漪 */
  .ring {
    position: absolute;
    width: 6vmin; height: 6vmin;
    margin: -3vmin 0 0 -3vmin;
    border-radius: 50%;
    border: 0.8vmin solid rgba(255, 150, 60, 0.85);
    pointer-events: none;
    animation: ring-out 520ms ease-out forwards;
  }
  @keyframes ring-out {
    0%   { transform: scale(0.4); opacity: 1; }
    100% { transform: scale(4.5); opacity: 0; }
  }

  /* 庆祝粒子 */
  .spark {
    position: fixed;
    font-size: 7vmin;
    line-height: 1;
    pointer-events: none;
    z-index: 600;
    animation: spark-fly 950ms ease-out forwards;
  }
  @keyframes spark-fly {
    0%   { transform: translate(0, 0)                                    scale(0.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.2); opacity: 0; }
  }
  /* 音符：兔子敲一下飘一个 */
  .note {
    position: fixed;
    font-size: 6vmin;
    line-height: 1;
    pointer-events: none;
    z-index: 500;
    animation: note-rise 900ms ease-out forwards;
  }
  @keyframes note-rise {
    0%   { transform: translate(0, 0)             scale(0.6) rotate(0);        opacity: 1; }
    100% { transform: translate(var(--dx), -14vmin) scale(1.2) rotate(var(--rot)); opacity: 0; }
  }

  #back {
    position: fixed;
    top: 8px; left: 4px;
    top: calc(constant(safe-area-inset-top) + 8px);
    left: calc(constant(safe-area-inset-left) + 4px);
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: calc(env(safe-area-inset-left, 0px) + 4px);
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(80, 50, 30, 0.5);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
  }
  #back:active { color: rgba(80, 50, 30, 0.9); }

  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    letter-spacing: 0.3em;
    color: rgba(80, 50, 30, 0.5);
    pointer-events: none;
    transition: opacity 600ms;
    z-index: 100;
    white-space: nowrap;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div class="curtain l"></div>
<div class="curtain r"></div>

<div class="stage" id="stage">
  <div class="drummer" id="drummer"><span class="bunny">🐰</span><span class="lildrum">🥁</span></div>
  <div class="beats" id="beats"></div>
  <div class="drum" id="drum">
    <div class="shell"></div>
    <div class="head" id="head"></div>
  </div>
</div>

<a id="back" href="../../">←</a>
<div id="hint">听一听，跟着敲</div>

<script>
// ===== 节奏型：以拍为单位的时刻表（1 拍 = BEAT_MS）=====
// 25 个月只到「听几下、敲几下」——次数是玩点，时值差异只在兔子的示范里听得见，
// 他的回敲不判时值（稳定节拍是 4 岁左右的事，那是下一站）
const BEAT_MS = 560;
const PATTERNS = [
  [0, 1],              // 咚 咚
  [0, 1, 2],           // 咚 咚 咚
  [0, 0.5, 1.5],       // 咚咚 · 咚
  [0, 1, 1.5],         // 咚 · 咚咚
  [0, 0.5, 1.5, 2],    // 咚咚 · 咚咚
];
const YOUR_TURN_COUNT = 2;   // your_turn_1 / your_turn_2 轮换
const YAY_COUNT = 3;         // yay_1 ~ yay_3 轮换
const IDLE_REDEMO_MS = 6000; // 轮到他却迟迟不敲：兔子再示范一遍

// ===== 语音：单 Audio 元素 + 换 src（iOS 解锁后非手势链 play 才可靠）=====
const qEl = new Audio();
qEl.preload = 'auto';

// ===== Web Audio 鼓声：兔子的小鼓偏高、他的大鼓偏低，耳朵分得出谁在敲 =====
let actx = null, master = null;
function ensureAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      // master 压到 0.6 + 压缩器：连敲叠加也不削波（同 drums）
      master = actx.createGain();
      master.gain.value = 0.6;
      const comp = actx.createDynamicsCompressor();
      master.connect(comp);
      comp.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    return true;
  } catch (e) { return false; }
}
function thump(baseHz, peak) {
  if (!ensureAudio()) return;
  const now = actx.currentTime;
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(baseHz * 2.6, now);
  osc.frequency.exponentialRampToValueAtTime(baseHz, now + 0.08);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(peak, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
  osc.connect(g).connect(master);
  osc.start(now);
  osc.stop(now + 0.4);
  // 噪声 attack：击打感
  const len = Math.floor(actx.sampleRate * 0.04);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource();
  src.buffer = buf;
  const ng = actx.createGain();
  ng.gain.value = peak * 0.3;
  src.connect(ng).connect(master);
  src.start(now);
  src.stop(now + 0.05);
}
const bunnyThump = () => thump(150, 0.42);   // 兔子的小鼓
const bigThump   = () => thump(70, 0.5);     // 他的大鼓
const softThump  = () => thump(70, 0.22);    // 不是他的回合时敲：照样响，轻一点

// ===== DOM =====
const drummerEl = document.getElementById('drummer');
const beatsEl = document.getElementById('beats');
const drumEl = document.getElementById('drum');
const headEl = document.getElementById('head');

// ===== 状态机 =====
// idle = 静候首戳解锁音频；demo = 兔子示范中；yours = 轮到他敲；cheer = 庆祝中
let phase = 'idle';
let pattern = [];
let dots = [];
let hits = 0;
let prevIdx = -1;
let turnAlt = 0, yayAlt = 0;
let timers = [];
let idleTimer = null;

function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function clearIdle() { if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; } }

function pickPattern() {
  let idx;
  do { idx = Math.floor(Math.random() * PATTERNS.length); } while (idx === prevIdx);
  prevIdx = idx;
  pattern = PATTERNS[idx];
}

function paintDots() {
  beatsEl.innerHTML = '';
  beatsEl.classList.remove('yours');
  dots = pattern.map((t, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    // 点与点的间距跟着时值走：半拍挨着、一拍隔开——节奏型看得见
    if (i > 0) d.style.setProperty('--gap', (t - pattern[i - 1]) <= 0.5 ? '1.4vmin' : '6vmin');
    beatsEl.appendChild(d);
    return d;
  });
}

// ===== 语音链 =====
let chain = [];
let chainDone = null;
let chainDog = null;   // 看门狗：iOS 中断（Siri/锁屏）时 ended/error 都不来，5s 兜底往下走（同 find/shapes）
function say(files, onDone) {
  chain = files.slice();
  chainDone = onDone || null;
  stepChain();
}
function stepChain() {
  clearTimeout(chainDog);
  if (!chain.length) {
    drummerEl.classList.remove('talking');
    const fn = chainDone; chainDone = null;
    if (fn) fn();
    return;
  }
  qEl.src = 'audio/' + chain.shift();
  qEl.currentTime = 0;
  drummerEl.classList.add('talking');
  qEl.play().catch(() => {});
  chainDog = setTimeout(stepChain, 5000);
}
qEl.addEventListener('ended', stepChain);
qEl.addEventListener('error', stepChain);   // mp3 缺失也不卡链，往下走

// ===== 粒子 =====
function restart(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}
function burstSparks(fromEl) {
  const r = fromEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const EMOJIS = ['⭐', '✨', '🎉', '🎵', '🌟'];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = EMOJIS[i % EMOJIS.length];
    const ang = (Math.PI * 2 * i) / 10 + Math.random() * 0.6;
    const dist = 18 + Math.random() * 16;
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'vmin');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'vmin');
    s.style.setProperty('--rot', (Math.random() * 90 - 45) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}
function floatNote(fromEl) {
  const r = fromEl.getBoundingClientRect();
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = Math.random() < 0.5 ? '🎵' : '🎶';
  n.style.left = (r.left + r.width * (0.3 + Math.random() * 0.4)) + 'px';
  n.style.top = (r.top + r.height * 0.2) + 'px';
  n.style.setProperty('--dx', (Math.random() * 10 - 5) + 'vmin');
  n.style.setProperty('--rot', (Math.random() * 40 - 20) + 'deg');
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 950);
}
function ripple(x, y) {
  const r = headEl.getBoundingClientRect();
  const ring = document.createElement('div');
  ring.className = 'ring';
  // 没有坐标（键盘）就落鼓面正中
  ring.style.left = (x == null ? r.width / 2 : Math.max(0, Math.min(r.width, x - r.left))) + 'px';
  ring.style.top = (y == null ? r.height / 2 : Math.max(0, Math.min(r.height, y - r.top))) + 'px';
  headEl.appendChild(ring);
  setTimeout(() => ring.remove(), 560);
}

// ===== 兔子示范 =====
function demo(withIntro, isAgain) {
  clearTimers();
  clearIdle();
  phase = 'demo';
  drumEl.classList.remove('yours');
  paintDots();
  const lead = withIntro ? ['intro.mp3', 'listen.mp3'] : isAgain ? ['again.mp3'] : ['listen.mp3'];
  say(lead, () => {
    if (phase !== 'demo') return;
    pattern.forEach((t, i) => {
      later(() => {
        restart(drummerEl, 'hit');
        bunnyThump();
        dots[i].classList.add('lit');
        floatNote(drummerEl);
      }, 200 + t * BEAT_MS);
    });
    const end = 200 + pattern[pattern.length - 1] * BEAT_MS;
    later(yourTurn, end + 750);
  });
}

function yourTurn() {
  phase = 'yours';
  hits = 0;
  dots.forEach(d => d.classList.remove('lit'));
  beatsEl.classList.add('yours');
  drumEl.classList.add('yours');
  turnAlt = turnAlt % YOUR_TURN_COUNT + 1;
  say(['your_turn_' + turnAlt + '.mp3']);
  armIdle();
}
function armIdle() {
  clearIdle();
  idleTimer = setTimeout(() => {
    if (phase === 'yours') demo(false, true);
  }, IDLE_REDEMO_MS);
}

// ===== 他敲一下 =====
function hitDrum(x, y) {
  hideHint();
  restart(drumEl, 'hit');
  ripple(x, y);
  if (phase === 'idle') {
    // 首戳：手势内解锁 Audio 元素 + AudioContext，播开场并开始第一次示范
    ensureAudio();
    bigThump();
    demo(true, false);
    return;
  }
  if (phase !== 'yours') {
    // 不是他的回合：照样出声出动（每次输入必反馈），只是不计数
    softThump();
    return;
  }
  bigThump();
  dots[hits].classList.add('done');
  hits++;
  // 兔子跟着点头
  restart(drummerEl, 'hit');
  if (hits >= pattern.length) {
    cheer();
  } else {
    armIdle();
  }
}

// ===== 敲够了：庆祝 → 下一个节奏型 =====
function cheer() {
  phase = 'cheer';
  clearIdle();
  beatsEl.classList.remove('yours');
  drumEl.classList.remove('yours');
  restart(drummerEl, 'cheer');
  burstSparks(drumEl);
  later(() => burstSparks(drummerEl), 350);
  yayAlt = yayAlt % YAY_COUNT + 1;
  let moved = false;
  const next = () => {
    if (moved) return;
    moved = true;
    pickPattern();
    demo(false, false);
  };
  // 语音念完就换；mp3 缺失或太长也有 2.6s 兜底
  say(['yay_' + yayAlt + '.mp3'], () => later(next, 500));
  later(next, 2600);
}

// ===== 戳兔子：再听一次（idle 时同首戳解锁）=====
function tapDrummer() {
  hideHint();
  if (phase === 'idle') { hitDrum(); return; }
  if (phase === 'cheer') return;
  restart(drummerEl, 'hit');
  bunnyThump();
  demo(false, true);
}

let hintGone = false;
function hideHint() {
  if (hintGone) return;
  hintGone = true;
  const h = document.getElementById('hint');
  if (h) {
    h.classList.add('gone');
    setTimeout(() => h.remove(), 800);
  }
}

// ===== 输入：鼓面 + 鼓身 + 下半屏空白都算敲鼓（幼儿手不准）=====
function pointOf(e) {
  const t = e.touches && e.touches[0] ? e.touches[0] : e;
  return [t.clientX, t.clientY];
}
// target 不是元素（合成事件派发到 document）时 closest 不存在，别让整个 handler 炸掉
function within(e, sel) {
  return e.target instanceof Element && !!e.target.closest(sel);
}
function onStageTouch(e) {
  if (within(e, '#back')) return;   // 放行返回键（bath 教训）
  if (within(e, '#drummer')) { tapDrummer(); e.preventDefault(); return; }
  const [x, y] = pointOf(e);
  hitDrum(x, y);
  e.preventDefault();   // 抑制 iOS 合成 click，避免一戳触发两次
}
function onStageClick(e) {
  if (within(e, '#back')) return;
  if (within(e, '#drummer')) { tapDrummer(); return; }
  hitDrum(e.clientX, e.clientY);
}
document.addEventListener('touchstart', onStageTouch, { passive: false });
document.addEventListener('mousedown', onStageClick, { passive: true });

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === 'Escape') {
    if (!document.fullscreenElement) location.href = '../../';
    return;
  }
  if ((e.key === 'f' || e.key === 'F') && !document.fullscreenElement) {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    return;
  }
  e.preventDefault();
  if (e.key === 'r' || e.key === 'R') { tapDrummer(); return; }
  // 其他任意键（键盘乱拍）= 敲大鼓
  hitDrum();
});

// 进入：摆好第一个节奏型的空心点，静候首戳（iOS 音频需手势）
pickPattern();
paintDots();
