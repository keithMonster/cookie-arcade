<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>排排队 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    background: linear-gradient(180deg, #aee3f5 0%, #cdeefb 52%, #a8dc9c 52%, #8fce84 100%);
  }
  /* 固定光晕：同 shapes/find——质感走这层 overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 12%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 60%),
      radial-gradient(120% 90% at 50% 112%, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0) 55%);
    pointer-events: none;
    z-index: 0;
  }
  /* 远景装饰：太阳 + 云（纯 CSS，不抢注意力）*/
  .sun {
    position: fixed;
    top: 6vmin; right: 10vmin;
    width: 11vmin; height: 11vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffe9a3, #ffce54);
    box-shadow: 0 0 5vmin rgba(255, 214, 90, 0.55);
    z-index: 1;
  }
  .cloud {
    position: fixed;
    font-size: 9vmin;
    opacity: 0.85;
    z-index: 1;
    animation: cloud-drift 40s linear infinite;
  }
  .cloud.c2 { top: 16vmin; font-size: 6vmin; animation-duration: 55s; animation-delay: -25s; }
  @keyframes cloud-drift {
    0%   { transform: translateX(-16vmin); }
    100% { transform: translateX(110vw); }
  }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    padding: max(6vmin, env(safe-area-inset-top, 0px)) 2vmin 2vmin;
  }

  /* 顶部指令区：戳喇叭重听 */
  .ask {
    display: flex;
    align-items: center;
    gap: 2vmin;
    font-size: clamp(22px, 5vmin, 48px);
    font-weight: 800;
    color: rgba(50, 30, 18, 0.85);
    text-shadow: 0 3px 0 rgba(255, 255, 255, 0.7);
    cursor: pointer;
    min-height: 8vmin;
    z-index: 5;
  }
  .ask .horn {
    font-size: clamp(30px, 6.5vmin, 60px);
    line-height: 1;
  }
  .ask.talking .horn { animation: horn-wiggle 600ms ease-in-out infinite; }
  @keyframes horn-wiggle {
    0%, 100% { transform: rotate(0)      scale(1); }
    25%      { transform: rotate(-8deg)  scale(1.1); }
    75%      { transform: rotate(8deg)   scale(1.1); }
  }

  /* ===== 候车的小动物 ===== */
  .kids {
    display: flex;
    gap: 7vmin;
    z-index: 4;
  }
  .kid {
    font-size: 17vmin;
    line-height: 1;
    cursor: pointer;
    position: relative;
    filter: drop-shadow(0 1.6vmin 1vmin rgba(50, 70, 30, 0.25));
    will-change: transform;
    animation: kid-sway 2.4s ease-in-out infinite;
  }
  .kid:nth-child(2) { animation-delay: -0.8s; }
  .kid:nth-child(3) { animation-delay: -1.6s; }
  @keyframes kid-sway {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50%      { transform: rotate(3deg)  translateY(-1vmin); }
  }
  /* 点错：摇头 */
  .kid.nope { animation: kid-nope 480ms ease-in-out; }
  @keyframes kid-nope {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-8%) rotate(-6deg); }
    50%      { transform: translateX(8%)  rotate(6deg); }
    80%      { transform: translateX(-4%) rotate(-3deg); }
  }
  /* 错 2 次：该上车的那只发光蹦跳引导（永远以成功收尾）*/
  .kid.guide { animation: kid-guide 1s ease-in-out infinite; }
  @keyframes kid-guide {
    0%, 100% { transform: scale(1)    translateY(0);      filter: drop-shadow(0 1.6vmin 1vmin rgba(50, 70, 30, 0.25)); }
    50%      { transform: scale(1.14) translateY(-2.4vmin); filter: drop-shadow(0 0 3vmin rgba(255, 240, 130, 0.95)); }
  }
  .kid.gone { visibility: hidden; pointer-events: none; animation: none; }
  /* 新一轮进出场 */
  .kid.deal-out { animation: kid-deal-out 300ms ease-in forwards; }
  .kid.deal-in  { animation: kid-deal-in  430ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
  @keyframes kid-deal-out {
    100% { transform: translateY(26%) scale(0.4); opacity: 0; }
  }
  @keyframes kid-deal-in {
    0%   { transform: translateY(32%) scale(0.3); opacity: 0; }
    60%  { transform: translateY(-5%) scale(1.08); opacity: 1; }
    100% { transform: translateY(0)   scale(1);    opacity: 1; }
  }

  /* ===== 铁轨 + 小火车 ===== */
  .rail {
    position: relative;
    width: 100%;
    height: 34vmin;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .rail::after {
    /* 轨道：两条钢轨 + 枕木 */
    content: '';
    position: absolute;
    left: -4vw; right: -4vw;
    bottom: 1.4vmin;
    height: 3vmin;
    background:
      repeating-linear-gradient(90deg, rgba(120, 84, 50, 0.55) 0 2.4vmin, transparent 2.4vmin 6.6vmin),
      linear-gradient(180deg, transparent 18%, #9a9186 18% 34%, transparent 34%, transparent 66%, #9a9186 66% 82%, transparent 82%);
  }
  .train {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 1.6vmin;
    padding-bottom: 3.4vmin;
    will-change: transform;
    z-index: 3;
  }
  .train.arrive { animation: train-arrive 900ms cubic-bezier(0.22, 0.9, 0.35, 1) backwards; }
  @keyframes train-arrive {
    0%   { transform: translateX(-110vw); }
    100% { transform: translateX(0); }
  }
  .train.launch { animation: train-launch 2.1s cubic-bezier(0.5, 0, 0.8, 1) forwards; }
  @keyframes train-launch {
    0%   { transform: translateX(0); }
    12%  { transform: translateX(-1.6vmin); }
    100% { transform: translateX(115vw); }
  }
  /* 出发时整列轻微哐当颠簸 */
  .train.launch .loco, .train.launch .car { animation: bump 340ms ease-in-out infinite; }
  @keyframes bump {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-0.7vmin); }
  }

  /* 火车头 */
  .loco {
    position: relative;
    width: 17vmin;
    height: 15vmin;
  }
  .loco .cab {
    position: absolute;
    left: 0; bottom: 2.6vmin;
    width: 9vmin; height: 11.5vmin;
    background: linear-gradient(180deg, #ff8a7a, #ef5f4e);
    border-radius: 2vmin 2vmin 1vmin 0;
    box-shadow: inset 0 -1.2vmin 0 rgba(0, 0, 0, 0.08);
  }
  .loco .cab::before {
    /* 驾驶室小窗 */
    content: '';
    position: absolute;
    top: 1.6vmin; left: 1.6vmin;
    width: 5.4vmin; height: 4.2vmin;
    background: #cdeefb;
    border-radius: 1vmin;
    box-shadow: inset 0 0.5vmin 0 rgba(255, 255, 255, 0.75);
  }
  .loco .nose {
    position: absolute;
    left: 8.4vmin; bottom: 2.6vmin;
    width: 8.6vmin; height: 6.4vmin;
    background: linear-gradient(180deg, #ffb25e, #f2913a);
    border-radius: 0 2.6vmin 1vmin 0;
    box-shadow: inset 0 -1.2vmin 0 rgba(0, 0, 0, 0.08);
  }
  .loco .chimney {
    position: absolute;
    left: 11.6vmin; bottom: 8.6vmin;
    width: 2.6vmin; height: 3.2vmin;
    background: #6b7b8c;
    border-radius: 0.7vmin 0.7vmin 0 0;
  }
  .wheel {
    position: absolute;
    bottom: 0;
    width: 4vmin; height: 4vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #d9dde2 0 26%, #4a5560 27%);
    box-shadow: inset 0 0 0 0.5vmin #333c46;
  }
  .wheel::before {
    /* 轮辐：转起来才看得出在滚 */
    content: '';
    position: absolute;
    inset: 18%;
    background:
      linear-gradient(0deg,   transparent 44%, #d9dde2 44% 56%, transparent 56%),
      linear-gradient(90deg,  transparent 44%, #d9dde2 44% 56%, transparent 56%);
    border-radius: 50%;
  }
  .train.arrive .wheel, .train.launch .wheel { animation: wheel-spin 500ms linear infinite; }
  @keyframes wheel-spin {
    100% { transform: rotate(360deg); }
  }
  .loco .wheel.w1 { left: 1.4vmin; }
  .loco .wheel.w2 { left: 10.4vmin; }

  /* 车厢：敞篷斗车，动物上车后从斗里露出来 */
  .car {
    position: relative;
    width: 15vmin;
    height: 12vmin;
  }
  .car .box {
    position: absolute;
    left: 0; right: 0; bottom: 2.6vmin;
    height: 7.4vmin;
    border-radius: 1.4vmin;
    box-shadow: inset 0 -1.2vmin 0 rgba(0, 0, 0, 0.08), inset 0 0.6vmin 0 rgba(255, 255, 255, 0.35);
  }
  .car.c0 .box { background: linear-gradient(180deg, #7cc8f0, #4da4d8); }
  .car.c1 .box { background: linear-gradient(180deg, #ffd66e, #f4b93e); }
  .car.c2 .box { background: linear-gradient(180deg, #a5df8f, #79c465); }
  .car .wheel.w1 { left: 1.6vmin; }
  .car .wheel.w2 { right: 1.6vmin; }
  /* 动物坐斗里：rider 在 DOM 里排在 .box 前 → 斗沿天然盖住下半身，露头 */
  .car .rider {
    position: absolute;
    left: 50%;
    bottom: 5.2vmin;
    transform: translateX(-50%);
    font-size: 9.5vmin;
    line-height: 1;
  }
  .car .rider.hop { animation: rider-hop 520ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes rider-hop {
    0%   { transform: translateX(-50%) translateY(0); }
    40%  { transform: translateX(-50%) translateY(-2.6vmin) scale(1.08); }
    100% { transform: translateX(-50%) translateY(0); }
  }
  /* 上车瞬间车厢欢快弹一下 */
  .car.happy { animation: car-happy 620ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes car-happy {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.1) rotate(-2deg); }
    70%  { transform: scale(0.97) rotate(1deg); }
    100% { transform: scale(1); }
  }

  /* 飞进车厢的克隆动物 */
  .flyer {
    position: fixed;
    z-index: 500;
    pointer-events: none;
    font-size: 17vmin;
    line-height: 1;
    transition: transform 640ms cubic-bezier(0.5, 0, 0.3, 1.15);
    will-change: transform;
  }

  /* 出发的烟圈 */
  .puff {
    position: fixed;
    font-size: 6vmin;
    line-height: 1;
    pointer-events: none;
    z-index: 400;
    animation: puff-rise 1.3s ease-out forwards;
  }
  @keyframes puff-rise {
    0%   { transform: translate(0, 0)               scale(0.4); opacity: 0.9; }
    100% { transform: translate(var(--dx), -16vmin) scale(1.5); opacity: 0; }
  }
  /* 庆祝粒子 */
  .spark {
    position: fixed;
    font-size: 7vmin;
    line-height: 1;
    pointer-events: none;
    z-index: 600;
    animation: spark-fly 950ms ease-out forwards;
  }
  @keyframes spark-fly {
    0%   { transform: translate(0, 0)                                    scale(0.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.2); opacity: 0; }
  }

  #back {
    position: fixed;
    top: 8px; left: 4px;
    top: calc(constant(safe-area-inset-top) + 8px);
    left: calc(constant(safe-area-inset-left) + 4px);
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: calc(env(safe-area-inset-left, 0px) + 4px);
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(80, 50, 30, 0.5);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
  }
  #back:active { color: rgba(80, 50, 30, 0.9); }

  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    letter-spacing: 0.3em;
    color: rgba(80, 50, 30, 0.5);
    pointer-events: none;
    transition: opacity 600ms;
    z-index: 100;
    white-space: nowrap;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div class="sun"></div>
<div class="cloud" style="top: 7vmin;">☁️</div>
<div class="cloud c2">☁️</div>

<div class="stage" id="stage">
  <div class="ask" id="ask"><span class="horn">📢</span><span id="askWord"></span></div>
  <div class="kids" id="kids">
    <div class="kid" id="kid0"></div>
    <div class="kid" id="kid1"></div>
    <div class="kid" id="kid2"></div>
  </div>
  <div class="rail">
    <div class="train" id="train">
      <div class="car c0"><div class="rider"></div><div class="box"></div><div class="wheel w1"></div><div class="wheel w2"></div></div>
      <div class="car c1"><div class="rider"></div><div class="box"></div><div class="wheel w1"></div><div class="wheel w2"></div></div>
      <div class="car c2"><div class="rider"></div><div class="box"></div><div class="wheel w1"></div><div class="wheel w2"></div></div>
      <div class="loco">
        <div class="chimney"></div>
        <div class="cab"></div>
        <div class="nose"></div>
        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
      </div>
    </div>
  </div>
</div>

<a id="back" href="../../">←</a>
<div id="hint">听一听，谁先上车</div>

<script>
// ===== 动物池：与 bath/feed/sleep 同源 8 只 =====
const ANIMALS = [
  { key: 'cat',      emoji: '🐱', name: '小猫' },
  { key: 'dog',      emoji: '🐶', name: '小狗' },
  { key: 'rabbit',   emoji: '🐰', name: '兔子' },
  { key: 'monkey',   emoji: '🐵', name: '猴子' },
  { key: 'panda',    emoji: '🐼', name: '熊猫' },
  { key: 'cow',      emoji: '🐮', name: '奶牛' },
  { key: 'chicken',  emoji: '🐔', name: '母鸡' },
  { key: 'elephant', emoji: '🐘', name: '大象' },
];
// 指令的三段序列语：先 → 轮到 → 最后（这款游戏存在的理由）
const CUE = [
  { file: k => 'first_' + k + '.mp3', text: n => n + '，先上车！' },
  { file: k => 'next_'  + k + '.mp3', text: n => '轮到' + n + '啦！' },
  { file: k => 'last_'  + k + '.mp3', text: n => '最后是' + n + '！' },
];
const NO_COUNT = 2;   // 拒绝语 no_1 / no_2 轮换

// ===== 音频：单元素 + 换 src（iOS 解锁后非手势链 play 才可靠）=====
const qEl = new Audio();   // 指令 / 开场（连播链）
const yEl = new Audio();   // 出发庆祝
qEl.preload = 'auto';
yEl.preload = 'auto';

// Web Audio：汽笛与上车叮声（非语音效果音，音量克制）
let actx = null;
function beepWhistle(long) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(520, t0);
    o.frequency.linearRampToValueAtTime(long ? 420 : 620, t0 + (long ? 0.5 : 0.16));
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.22, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (long ? 0.7 : 0.28));
    o.connect(g).connect(actx.destination);
    o.start(t0);
    o.stop(t0 + (long ? 0.75 : 0.32));
  } catch (e) {}
}

// ===== DOM =====
const askEl = document.getElementById('ask');
const askWordEl = document.getElementById('askWord');
const trainEl = document.getElementById('train');
const kidEls = [0, 1, 2].map(i => document.getElementById('kid' + i));
const carEls = Array.from(trainEl.querySelectorAll('.car'));

// ===== 状态机 =====
// idle = 静候首戳解锁音频；ask = 等点动物；boarding = 飞入动画中；
// depart = 火车出发中；dealing = 换轮动画中
let phase = 'idle';
let order = [];        // 本轮 3 只动物的上车顺序
let boarded = [];      // 对应 kid 是否已上车
let seat = 0;          // 正在等第几只
let wrongCount = 0;
let noAlt = 0;
let prevKeys = [];

function pickRound() {
  let trio;
  do {
    trio = ANIMALS.slice().sort(() => Math.random() - 0.5).slice(0, 3);
  } while (prevKeys.length && trio.every(a => prevKeys.includes(a.key)));
  prevKeys = trio.map(a => a.key);
  order = trio;
  boarded = [false, false, false];
  seat = 0;
  wrongCount = 0;
}

function paintRound() {
  // 候车顺序打乱站位：屏幕位置 ≠ 上车顺序，得听指令
  const spots = order.slice().sort(() => Math.random() - 0.5);
  kidEls.forEach((el, i) => {
    el.textContent = spots[i].emoji;
    el.dataset.key = spots[i].key;
    el.className = 'kid';
  });
  carEls.forEach(c => { c.querySelector('.rider').textContent = ''; });
}

// ===== 语音：qEl 连播链（intro → 指令），words 单元素模式 =====
let chain = [];
function playChain(files) {
  chain = files.slice();
  stepChain();
}
function stepChain() {
  if (!chain.length) { askEl.classList.remove('talking'); return; }
  qEl.src = 'audio/' + chain.shift();
  qEl.currentTime = 0;
  askEl.classList.add('talking');
  qEl.play().catch(() => {});
}
qEl.addEventListener('ended', stepChain);
qEl.addEventListener('error', stepChain);

function playCue(withIntro) {
  const a = order[seat];
  askWordEl.textContent = CUE[seat].text(a.name);
  playChain(withIntro ? ['intro.mp3', CUE[seat].file(a.key)] : [CUE[seat].file(a.key)]);
}
function replayCue() { playCue(false); }

function playNo() {
  noAlt = noAlt % NO_COUNT + 1;
  playChain(['no_' + noAlt + '.mp3']);
}

// ===== 粒子 =====
function burstSparks(fromEl) {
  const r = fromEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const EMOJIS = ['⭐', '✨', '🎉', '💛', '🌟'];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = EMOJIS[i % EMOJIS.length];
    const ang = (Math.PI * 2 * i) / 10 + Math.random() * 0.6;
    const dist = 18 + Math.random() * 16;
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'vmin');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'vmin');
    s.style.setProperty('--rot', (Math.random() * 90 - 45) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}
function puffSmoke() {
  const ch = trainEl.querySelector('.chimney');
  if (!ch) return;
  const r = ch.getBoundingClientRect();
  const s = document.createElement('div');
  s.className = 'puff';
  s.textContent = '💨';
  s.style.left = (r.left + r.width / 2) + 'px';
  s.style.top = r.top + 'px';
  s.style.setProperty('--dx', (Math.random() * 8 - 2) + 'vmin');
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1350);
}

// ===== 上车 =====
function board(kidEl) {
  phase = 'boarding';
  qEl.pause();
  askEl.classList.remove('talking');
  const car = carEls[seat];
  // 克隆 emoji 飞进车厢
  const a = kidEl.getBoundingClientRect();
  const fl = document.createElement('div');
  fl.className = 'flyer';
  fl.textContent = kidEl.textContent;
  fl.style.left = a.left + 'px';
  fl.style.top = a.top + 'px';
  document.body.appendChild(fl);
  kidEl.className = 'kid gone';
  const rider = car.querySelector('.rider');
  void fl.offsetWidth;
  const b = rider.getBoundingClientRect();
  const scale = 9.5 / 17;   // rider 字号 / kid 字号
  // 中心到中心的位移，缩放围绕中心
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  const dy = (b.top + b.height * 0.35) - (a.top + a.height / 2);
  fl.style.transformOrigin = 'center center';
  fl.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + scale + ')';
  beepWhistle(false);
  setTimeout(() => {
    fl.remove();
    const kid = order[seat];
    rider.textContent = kid.emoji;
    rider.classList.remove('hop');
    void rider.offsetWidth;
    rider.classList.add('hop');
    car.classList.remove('happy');
    void car.offsetWidth;
    car.classList.add('happy');
    boarded[seat] = true;
    seat++;
    wrongCount = 0;
    kidEls.forEach(k => k.classList.remove('guide'));
    if (seat < 3) {
      phase = 'ask';
      playCue(false);
    } else {
      depart();
    }
  }, 660);
}

// ===== 出发 =====
let puffTimer = null;
function depart() {
  phase = 'depart';
  askWordEl.textContent = '出发咯！';
  beepWhistle(true);
  yEl.src = 'audio/go.mp3';
  yEl.currentTime = 0;
  yEl.play().catch(() => {});
  trainEl.classList.remove('arrive');
  void trainEl.offsetWidth;
  trainEl.classList.add('launch');
  burstSparks(trainEl);
  puffTimer = setInterval(puffSmoke, 240);
  // 火车开出屏（2.1s）后换轮；语音与动画并行，取更长者
  setTimeout(() => {
    clearInterval(puffTimer);
    nextRound();
  }, 2300);
}

function nextRound() {
  if (phase === 'dealing') return;
  phase = 'dealing';
  kidEls.forEach(k => { if (!k.classList.contains('gone')) k.className = 'kid deal-out'; });
  setTimeout(() => {
    pickRound();
    paintRound();
    // 火车带着空车厢从左边再开进来
    trainEl.classList.remove('launch');
    void trainEl.offsetWidth;
    trainEl.classList.add('arrive');
    kidEls.forEach((k, i) => {
      k.classList.add('deal-in');
      k.style.animationDelay = (i * 90) + 'ms';
    });
    setTimeout(() => {
      kidEls.forEach(k => { k.classList.remove('deal-in'); k.style.animationDelay = ''; });
      phase = 'ask';
      playCue(true);
    }, 950);
  }, 320);
}

let hintGone = false;
function hideHint() {
  if (hintGone) return;
  hintGone = true;
  const h = document.getElementById('hint');
  if (h) {
    h.classList.add('gone');
    setTimeout(() => h.remove(), 800);
  }
}

// ===== 输入 =====
function tapKid(i) {
  hideHint();
  if (phase === 'idle') {
    // 首戳：手势内解锁两个音频元素 + AudioContext，播开场与首条指令
    yEl.muted = true;
    yEl.play().then(() => { yEl.pause(); yEl.muted = false; }).catch(() => { yEl.muted = false; });
    beepWhistle(false);
    phase = 'ask';
    playCue(true);
    return;
  }
  if (phase !== 'ask') return;
  if (i < 0) { replayCue(); return; }
  const el = kidEls[i];
  if (el.classList.contains('gone')) return;
  if (el.dataset.key === order[seat].key) {
    board(el);
  } else {
    wrongCount++;
    el.classList.remove('nope');
    void el.offsetWidth;
    el.classList.add('nope');
    playNo();
    if (wrongCount >= 2) {
      const t = kidEls.find(k => k.dataset.key === order[seat].key && !k.classList.contains('gone'));
      if (t) t.classList.add('guide');
      // 拒绝语念完再重播指令，帮他找目标
      setTimeout(replayCue, 1600);
    }
  }
}

kidEls.forEach((el, i) => {
  el.addEventListener('click', () => tapKid(i), { passive: true });
  el.addEventListener('touchstart', (e) => {
    tapKid(i);
    e.preventDefault();   // 抑制 iOS 合成 click，避免一戳触发两次
  }, { passive: false });
});

// 戳已上车的动物：在车斗里蹦一下 + 短汽笛（每次输入必反馈）
carEls.forEach(car => {
  const poke = () => {
    hideHint();
    const rider = car.querySelector('.rider');
    if (!rider.textContent) return;
    rider.classList.remove('hop');
    void rider.offsetWidth;
    rider.classList.add('hop');
    beepWhistle(false);
  };
  car.addEventListener('click', poke, { passive: true });
  car.addEventListener('touchstart', (e) => { poke(); e.preventDefault(); }, { passive: false });
});

// 戳喇叭 = 重听指令（idle 时同首戳解锁）
function tapHorn() {
  hideHint();
  if (phase === 'idle') { tapKid(-1); return; }
  if (phase !== 'ask') return;
  replayCue();
}
askEl.addEventListener('click', () => tapHorn(), { passive: true });
askEl.addEventListener('touchstart', (e) => {
  tapHorn();
  e.preventDefault();
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === 'Escape') {
    if (!document.fullscreenElement) location.href = '../../';
    return;
  }
  if ((e.key === 'f' || e.key === 'F') && !document.fullscreenElement) {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    return;
  }
  e.preventDefault();
  if (e.key === 'ArrowLeft')  { tapKid(0); return; }
  if (e.key === 'ArrowDown')  { tapKid(1); return; }
  if (e.key === 'ArrowRight') { tapKid(2); return; }
  // 其他任意键（键盘乱拍）：随机点一只还没上车的
  const waiting = [0, 1, 2].filter(i => !kidEls[i].classList.contains('gone'));
  if (waiting.length) tapKid(waiting[Math.floor(Math.random() * waiting.length)]);
});

// 进入：摆好第一轮 + 火车进站，静候首戳（iOS 音频需手势）
pickRound();
paintRound();
trainEl.classList.add('arrive');
askWordEl.textContent = '小火车来啦！';

// 空闲预载全部 mp3 进 HTTP 缓存——后续换 src 即播不等网络
setTimeout(() => {
  ANIMALS.forEach(({ key }) => {
    ['first_', 'next_', 'last_'].forEach(p => fetch('audio/' + p + key + '.mp3').catch(() => {}));
  });
  ['intro.mp3', 'no_1.mp3', 'no_2.mp3', 'go.mp3'].forEach(f => fetch('audio/' + f).catch(() => {}));
}, 600);
</script>
