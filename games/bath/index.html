<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>洗澡澡 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    background-color: #d6ecf5;
    transition: background-color 600ms ease;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 18%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%),
      radial-gradient(120% 90% at 50% 110%, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0) 55%);
    pointer-events: none;
    z-index: 0;
  }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vmin;
  }

  /* ===== 动物区（patch 叠在 wrap 内，跟随动物一起进出场）===== */
  .pet-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5vmin;
  }
  .pet-wrap {
    position: relative;
    width: 44vmin;
    height: 44vmin;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform;
  }
  /* 脚下水洼 */
  .pet-wrap::before {
    content: '';
    position: absolute;
    bottom: -2vmin;
    left: 50%;
    transform: translateX(-50%);
    width: 40vmin;
    height: 8vmin;
    background: radial-gradient(50% 50% at 50% 50%, rgba(130, 190, 220, 0.5), rgba(130, 190, 220, 0) 70%);
    pointer-events: none;
  }
  .pet {
    font-size: 34vmin;
    line-height: 1.05;
    filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.08));
    transition: filter 500ms ease;
  }
  /* 脏兮兮：发灰发暗 + 蔫蔫地慢摇 */
  .pet-wrap.dirty .pet { filter: grayscale(0.45) brightness(0.9) drop-shadow(0 6px 0 rgba(0, 0, 0, 0.08)); }
  .pet-wrap.dirty { animation: pet-mope 3s ease-in-out infinite; }
  @keyframes pet-mope {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2deg) translateY(1%); }
  }
  /* 每擦一下小小开心一晃 */
  .pet-wrap.wiggle { animation: pet-wiggle 380ms ease-in-out; }
  @keyframes pet-wiggle {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.06) rotate(-3deg); }
    100% { transform: scale(1); }
  }
  /* 洗干净：大弹跳庆祝 */
  .pet-wrap.clean { animation: pet-clean 1.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pet-clean {
    0%   { transform: scale(1)    rotate(0); }
    25%  { transform: scale(1.22) rotate(-8deg) translateY(-6%); }
    50%  { transform: scale(1.05) rotate(8deg); }
    75%  { transform: scale(1.18) rotate(-4deg) translateY(-4%); }
    100% { transform: scale(1)    rotate(0); }
  }
  /* 换动物进出场 */
  .pet-wrap.deal-out { animation: pet-deal-out 300ms ease-in forwards; }
  .pet-wrap.deal-in  { animation: pet-deal-in  460ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes pet-deal-out {
    100% { transform: translateX(-40vw) scale(0.5); opacity: 0; }
  }
  @keyframes pet-deal-in {
    0%   { transform: translateX(40vw) scale(0.5); opacity: 0; }
    60%  { transform: translateX(-2vw) scale(1.06); opacity: 1; }
    100% { transform: translateX(0)    scale(1);    opacity: 1; }
  }
  .pet-name {
    font-size: clamp(24px, 5.5vmin, 52px);
    font-weight: 800;
    letter-spacing: 0.14em;
    color: rgba(30, 55, 70, 0.85);
    text-shadow: 0 3px 0 rgba(255, 255, 255, 0.7);
  }

  /* ===== 泥点 ===== */
  .mud {
    position: absolute;
    background: radial-gradient(60% 60% at 40% 35%, #a07a52, #7c5a38 70%, #6b4c2e);
    opacity: 0.92;
    box-shadow: inset 0 -1vmin 2vmin rgba(0, 0, 0, 0.18);
    animation: mud-in 320ms ease-out backwards;
    will-change: transform;
  }
  @keyframes mud-in {
    0% { transform: scale(0); }
  }
  .mud.pop {
    animation: mud-pop 340ms ease-out forwards;
    pointer-events: none;
  }
  @keyframes mud-pop {
    40%  { transform: scale(1.25); opacity: 0.7; }
    100% { transform: scale(0.2); opacity: 0; }
  }

  /* 水花 / 泡泡粒子 */
  .spark {
    position: fixed;
    font-size: 7vmin;
    line-height: 1;
    pointer-events: none;
    z-index: 600;
    animation: spark-fly 900ms ease-out forwards;
  }
  @keyframes spark-fly {
    0%   { transform: translate(0, 0)                                    scale(0.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.2); opacity: 0; }
  }

  #back {
    position: fixed;
    top: 8px; right: 4px;
    top: calc(constant(safe-area-inset-top) + 8px);
    right: calc(constant(safe-area-inset-right) + 4px);
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    right: calc(env(safe-area-inset-right, 0px) + 4px);
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(40, 70, 90, 0.5);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
  }
  #back:active { color: rgba(40, 70, 90, 0.9); }

  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    letter-spacing: 0.3em;
    color: rgba(40, 70, 90, 0.5);
    pointer-events: none;
    transition: opacity 600ms;
    z-index: 100;
    white-space: nowrap;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div class="stage">
  <div class="pet-zone">
    <div class="pet-wrap dirty" id="petWrap">
      <div class="pet" id="pet"></div>
    </div>
    <div class="pet-name" id="petName"></div>
  </div>
</div>

<a id="back" href="../../">←</a>
<div id="hint">搓一搓泥点，帮小动物洗澡澡</div>

<script>
// ===== 洗澡澡：擦除揭示 + 生活自理假装游戏（动物池与 feed 同源）=====
const PETS = [
  { key: 'cat',      emoji: '🐱', name: '小猫' },
  { key: 'dog',      emoji: '🐶', name: '小狗' },
  { key: 'rabbit',   emoji: '🐰', name: '兔子' },
  { key: 'monkey',   emoji: '🐵', name: '猴子' },
  { key: 'panda',    emoji: '🐼', name: '熊猫' },
  { key: 'cow',      emoji: '🐮', name: '奶牛' },
  { key: 'chicken',  emoji: '🐔', name: '母鸡' },
  { key: 'elephant', emoji: '🐘', name: '大象' },
];
// 水感底色跟动物轮换
const THEMES = ['#d6ecf5', '#d2f0e4', '#fdeaad', '#ffd9dd', '#e0dcf5', '#d9e8d2', '#ffe3c9', '#cfe8f0'];
// 泥点候选落位（相对 pet-wrap 的百分比中心，避开纯边角），每轮抽 5-7 个加抖动
const MUD_SLOTS = [
  [32, 30], [62, 26], [50, 46], [30, 58], [68, 56], [46, 70], [64, 76], [34, 78],
];

// ===== 音频 =====
// voiceEl 单元素 src-swap：开场求助音在换场后自动播（手势链外，靠首戳解锁）；
// 洗净表扬音在最后一擦的手势内播。单元素顺序用不叠音。
const voiceEl = new Audio();
voiceEl.preload = 'auto';

// 每擦必响的水泡音走 Web Audio 合成（预录语音每擦都念会轰炸）
let actx = null, masterGain = null;
function ensureCtx() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  // 总线限幅：多指齐搓不削波（drums 同款教训）
  const comp = actx.createDynamicsCompressor();
  masterGain = actx.createGain();
  masterGain.gain.value = 0.5;
  masterGain.connect(comp);
  comp.connect(actx.destination);
}
function popSound(big) {
  if (!actx) return;
  if (actx.state === 'suspended') actx.resume();
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'sine';
  const f0 = big ? 340 : 520 + Math.random() * 320;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f0 * 1.9, t + 0.09);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  o.connect(g);
  g.connect(masterGain);
  o.start(t);
  o.stop(t + 0.18);
}

// ===== DOM =====
const petWrapEl = document.getElementById('petWrap');
const petEl = document.getElementById('pet');
const petNameEl = document.getElementById('petName');

// ===== 状态机 =====
// idle = 静候首戳解锁音频；scrub = 搓洗中；clean = 洗净庆祝中；dealing = 换动物中
let phase = 'idle';
let pet = null;
let muds = [];          // 存活泥点元素
let petIdx = 0;
let petOrder = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 洗牌队列：一轮 8 只全亮相再重洗（同 feed nextPet）
function nextPet() {
  if (petIdx >= petOrder.length) {
    const last = petOrder.length ? petOrder[petOrder.length - 1] : null;
    do { petOrder = shuffle(PETS); } while (petOrder.length > 1 && petOrder[0] === last);
    petIdx = 0;
  }
  return petOrder[petIdx++];
}

function spawnMuds() {
  muds.forEach(m => m.remove());
  muds = [];
  const n = 5 + Math.floor(Math.random() * 3);   // 5-7 个
  shuffle(MUD_SLOTS).slice(0, n).forEach(([sx, sy], i) => {
    const m = document.createElement('div');
    m.className = 'mud';
    const size = 7 + Math.random() * 3;          // 7-10vmin，偏小减少相邻槽位重叠
    // 抖动只算一次：视觉位置与命中几何共用同一个中心
    const cx = sx + (Math.random() * 4 - 2);
    const cy = sy + (Math.random() * 4 - 2);
    const h = size * (0.8 + Math.random() * 0.3);
    m.style.width = size + 'vmin';
    m.style.height = h + 'vmin';
    // wrap 固定 44vmin（与 CSS .pet-wrap 同步）：vmin 尺寸换算成 % 让视觉中心 = 命中中心 cx/cy
    m.style.left = (cx - (size / 44 * 100) / 2) + '%';
    m.style.top = (cy - (h / 44 * 100) / 2) + '%';
    // 不规则蛋形泥团
    m.style.borderRadius = (42 + Math.random() * 18) + '% ' + (48 + Math.random() * 16) + '% '
      + (44 + Math.random() * 18) + '% ' + (50 + Math.random() * 14) + '% / '
      + (52 + Math.random() * 14) + '% ' + (44 + Math.random() * 16) + '% '
      + (50 + Math.random() * 16) + '% ' + (46 + Math.random() * 14) + '%';
    m.style.transform = 'rotate(' + (Math.random() * 40 - 20) + 'deg)';
    m.style.animationDelay = (i * 60) + 'ms';
    // 命中几何 spawn 时固化（wrap 内百分比中心 + vmin 半径）——
    // 不用 getBoundingClientRect：入场/pop 动画中 transform 缩放会让实时 rect 失真甚至为 0
    m._hit = { cx: cx, cy: cy, size: size };
    petWrapEl.appendChild(m);
    muds.push(m);
  });
}

// 泥点在视口里的固化中心/容差（px）
function mudGeom(m) {
  const w = petWrapEl.getBoundingClientRect();
  const vmin = Math.min(window.innerWidth, window.innerHeight) / 100;
  return {
    x: w.left + (m._hit.cx / 100) * w.width,
    y: w.top + (m._hit.cy / 100) * w.height,
    tol: m._hit.size * vmin * 1.1,
  };
}

function paintPet() {
  petEl.textContent = pet.emoji;
  petNameEl.textContent = pet.name;
  document.body.style.backgroundColor = THEMES[PETS.indexOf(pet)];
  spawnMuds();
}

function burstSparks(x, y, emojis, count) {
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = emojis[i % emojis.length];
    const ang = (Math.PI * 2 * i) / count + Math.random() * 0.6;
    const dist = 12 + Math.random() * 14;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'vmin');
    s.style.setProperty('--dy', (Math.sin(ang) * dist - 6) + 'vmin');
    s.style.setProperty('--rot', (Math.random() * 90 - 45) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}

function popMud(m) {
  const i = muds.indexOf(m);
  if (i === -1) return;
  muds.splice(i, 1);
  m.classList.add('pop');
  setTimeout(() => m.remove(), 360);
  const g = mudGeom(m);
  burstSparks(g.x, g.y, ['💦', '🫧', '💧'], 4);
  popSound(false);
  // 每擦一下动物小小开心一晃
  if (muds.length > 0) {
    petWrapEl.classList.remove('wiggle');
    void petWrapEl.offsetWidth;
    petWrapEl.classList.add('wiggle');
  } else {
    allClean();
  }
}

function allClean() {
  phase = 'clean';
  petWrapEl.classList.remove('dirty', 'wiggle');
  void petWrapEl.offsetWidth;
  petWrapEl.classList.add('clean');
  const r = petEl.getBoundingClientRect();
  burstSparks(r.left + r.width / 2, r.top + r.height / 2, ['✨', '🫧', '⭐', '💛', '🌟'], 10);
  popSound(true);
  // 最后一擦在手势链内，直接换 src 播表扬
  voiceEl.src = 'audio/clean_' + pet.key + '.mp3';
  voiceEl.currentTime = 0;
  voiceEl.play().catch(() => setTimeout(nextRound, 1600));
  // 看门狗：iOS 中断（Siri/锁屏）时 ended/error 都不来，6s 兜底防卡死（nextRound 有 dealing guard）
  setTimeout(() => { if (phase === 'clean') nextRound(); }, 6000);
}
// 表扬念完再停 500ms 进换场，让干净闪亮的画面多留一会
voiceEl.addEventListener('ended', () => { if (phase === 'clean') setTimeout(nextRound, 500); });
voiceEl.addEventListener('error', () => { if (phase === 'clean') setTimeout(nextRound, 1400); });

function nextRound() {
  if (phase === 'dealing') return;
  phase = 'dealing';
  petWrapEl.className = 'pet-wrap deal-out';
  setTimeout(() => {
    pet = nextPet();
    paintPet();
    petWrapEl.className = 'pet-wrap dirty deal-in';
    setTimeout(() => {
      petWrapEl.className = 'pet-wrap dirty';
      phase = 'scrub';
      // 开场求助音：手势链外，靠首戳解锁过的单元素 src-swap（find 同款技巧）
      voiceEl.src = 'audio/dirty_' + pet.key + '.mp3';
      voiceEl.currentTime = 0;
      voiceEl.play().catch(() => {});
    }, 470);
  }, 310);
}

let hintGone = false;
function hideHint() {
  if (hintGone) return;
  hintGone = true;
  const h = document.getElementById('hint');
  if (h) {
    h.classList.add('gone');
    setTimeout(() => h.remove(), 800);
  }
}

// ===== 输入：任意位置搓（点/拖都行），命中泥点就擦掉 =====
function unlockOnFirst() {
  if (phase !== 'idle') return;
  ensureCtx();
  voiceEl.muted = true;
  voiceEl.src = 'audio/dirty_' + pet.key + '.mp3';
  voiceEl.play().then(() => { voiceEl.pause(); voiceEl.muted = false; }).catch(() => { voiceEl.muted = false; });
  phase = 'scrub';
}

function scrubAt(x, y) {
  hideHint();
  unlockOnFirst();
  if (phase !== 'scrub') return;
  // 命中判定：找距离最近且在容差内的泥点（容差按泥点自身大小放宽，2 岁准头友好）
  let best = null, bestD = Infinity;
  muds.forEach(m => {
    const g = mudGeom(m);
    const d = Math.hypot(x - g.x, y - g.y);
    if (d < g.tol && d < bestD) { best = m; bestD = d; }
  });
  if (best) {
    popMud(best);
  } else {
    // 没搓到泥点也给反馈：落点冒个小水花
    burstSparks(x, y, ['💧'], 2);
    popSound(false);
  }
}

// 触屏：start 直接搓，move 按距离节流连续搓（keyboard/drums 同款 per-touch 节流）
const touchLast = new Map();
document.addEventListener('touchstart', (e) => {
  if (e.target.closest('#back')) return;   // 放行返回键，preventDefault 会吞掉它的合成 click
  for (const t of e.changedTouches) {
    touchLast.set(t.identifier, { x: t.clientX, y: t.clientY });
    scrubAt(t.clientX, t.clientY);
  }
  e.preventDefault();   // 抑制 iOS 合成 click/mouse，避免幽灵双触发
}, { passive: false });
document.addEventListener('touchmove', (e) => {
  if (e.target.closest('#back')) return;
  for (const t of e.changedTouches) {
    const last = touchLast.get(t.identifier);
    if (!last || Math.hypot(t.clientX - last.x, t.clientY - last.y) > 44) {
      touchLast.set(t.identifier, { x: t.clientX, y: t.clientY });
      scrubAt(t.clientX, t.clientY);
    }
  }
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) touchLast.delete(t.identifier);
});
document.addEventListener('touchcancel', (e) => {
  for (const t of e.changedTouches) touchLast.delete(t.identifier);
});

// 桌面鼠标：按住拖动连续搓；见过触屏后整路忽略（tw-bubbles 幽灵 mousemove 教训）
let sawTouch = false;
document.addEventListener('touchstart', () => { sawTouch = true; }, { passive: true, once: true });
let mouseDown = false, mouseLast = null;
document.addEventListener('mousedown', (e) => {
  if (sawTouch) return;
  mouseDown = true;
  mouseLast = { x: e.clientX, y: e.clientY };
  scrubAt(e.clientX, e.clientY);
});
document.addEventListener('mousemove', (e) => {
  if (sawTouch || !mouseDown) return;
  if (!mouseLast || Math.hypot(e.clientX - mouseLast.x, e.clientY - mouseLast.y) > 44) {
    mouseLast = { x: e.clientX, y: e.clientY };
    scrubAt(e.clientX, e.clientY);
  }
});
document.addEventListener('mouseup', () => { mouseDown = false; });
document.addEventListener('mouseleave', () => { mouseDown = false; });

// 键盘：任意键随机搓掉一个泥点（乱拍键盘也玩得下去）
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;   // 按住键 OS 自动重复不是真实按键
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === 'Escape') {
    if (!document.fullscreenElement) location.href = '../../';
    return;
  }
  if ((e.key === 'f' || e.key === 'F') && !document.fullscreenElement) {
    // 已全屏时 F 键不再拦截——落回下方正常游戏反馈（每按必反馈）
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    return;
  }
  e.preventDefault();
  hideHint();
  unlockOnFirst();
  if (phase !== 'scrub') return;
  if (muds.length) {
    const m = muds[Math.floor(Math.random() * muds.length)];
    const g = mudGeom(m);
    scrubAt(g.x, g.y);
  }
});

// 进入：摆好第一只脏脏的动物，静候首戳
pet = nextPet();
paintPet();

// 空闲预载全部 16 个 mp3 进 HTTP 缓存
setTimeout(() => {
  PETS.forEach(({ key }) => {
    fetch(`audio/dirty_${key}.mp3`).catch(() => {});
    fetch(`audio/clean_${key}.mp3`).catch(() => {});
  });
}, 600);
</script>
</body>
</html>
