<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>More More More · Cookie's Arcade</title>
<script src="../_lib/twirlywoos.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(180deg, #fff5e8 0%, #ffe8c8 100%);
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: none) {
    #back { color: rgba(0, 0, 0, 0.4) !important; }
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }
  /* 地面线（隐形，球停留在此） */
  #ground {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 38%;
    pointer-events: none;
  }
  /* 角色排（底部） */
  #cast {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 30%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 4%;
    padding: 0 4% 12px;
    pointer-events: none;
    z-index: 5;
  }
  .char-slot {
    height: 100%;
    display: flex;
    align-items: flex-end;
    transition: transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .char-slot.wiggle {
    animation: wiggle 380ms ease-out;
  }
  @keyframes wiggle {
    0%, 100% { transform: translateY(0) rotate(0); }
    25%      { transform: translateY(-22px) rotate(-4deg); }
    60%      { transform: translateY(-8px)  rotate(4deg); }
  }
  .char-slot.jump {
    animation: jump 520ms cubic-bezier(0.5, 1.4, 0.5, 1) infinite;
  }
  @keyframes jump {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-60px); }
  }
  .char-slot svg {
    height: 100%;
    width: auto;
    display: block;
    filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.08));
  }

  /* 球 */
  .ball {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
    box-shadow:
      inset -10px -12px 18px rgba(0, 0, 0, 0.18),
      inset 6px 8px 14px rgba(255, 255, 255, 0.35),
      0 4px 12px rgba(0, 0, 0, 0.1);
  }
  .ball.falling {
    transition: top 700ms cubic-bezier(0.4, 0.05, 0.7, 0.6);
  }
  .ball.popping {
    animation: ball-pop 400ms ease-out forwards;
  }
  @keyframes ball-pop {
    0%   { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.3); opacity: 0.7; }
    100% { transform: scale(0); opacity: 0; }
  }

  /* 字幕 */
  #caption {
    position: fixed;
    top: 12%;
    left: 0; right: 0;
    text-align: center;
    font-size: clamp(48px, 10vw, 120px);
    font-weight: 800;
    color: rgba(0, 0, 0, 0.78);
    text-shadow: 0 4px 0 rgba(255, 255, 255, 0.6);
    letter-spacing: 0.08em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 200ms, transform 200ms;
  }
  #caption.show {
    opacity: 1;
    animation: cap-pop 420ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cap-pop {
    0%   { transform: scale(0.4); }
    100% { transform: scale(1); }
  }

  /* 返回 */
  #back {
    position: fixed; top: 0; right: 0;
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    color: rgba(0, 0, 0, 0.15);
    text-decoration: none;
    transition: color 250ms, background 250ms;
  }
  #back:hover {
    color: rgba(0, 0, 0, 0.7);
    background: rgba(0, 0, 0, 0.04);
  }

  /* 启动提示 */
  #hint {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(0, 0, 0, 0.4);
    font-size: 22px;
    letter-spacing: 0.1em;
    pointer-events: none;
    transition: opacity 600ms;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="cast">
  <div class="char-slot" data-char="chick"></div>
  <div class="char-slot" data-char="chickedy"></div>
  <div class="char-slot" data-char="toodloo"></div>
  <div class="char-slot" data-char="bighoo"></div>
</div>
<div id="caption"></div>
<a id="back" href="../../">←</a>
<div id="hint">戳一戳 · 球球越多越多</div>

<script>
  const stage = document.getElementById('stage');
  const cast = document.getElementById('cast');
  const caption = document.getElementById('caption');
  const hint = document.getElementById('hint');

  const BALL_COLORS = [
    '#ef4444', '#f59e0b', '#fbbf24', '#84cc16',
    '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6',
    '#ec4899', '#f97316',
  ];

  // 当前堆积的球：{el, x, y, size}
  let balls = [];
  const TARGET_COUNT = 15; // 到 15 触发欢呼+清场
  let resetting = false;
  let started = false;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ===== 初始化 4 角色形象 =====
  function renderCast(expression) {
    cast.querySelectorAll('.char-slot').forEach(slot => {
      const ck = slot.dataset.char;
      const sr = TW.CHARS[ck].sizeRatio;
      slot.style.height = (sr * 100) + '%';
      // noFilter: 整页持续 spawn 球，省 GPU
      slot.innerHTML = TW.svg(ck, { expression, noFilter: true });
    });
  }
  renderCast('idle');

  // 球数 → 表情：0-4 idle / 5-9 surprised / 10+ cheer
  function expressionFor(count) {
    if (count >= 10) return 'cheer';
    if (count >= 5) return 'surprised';
    return 'idle';
  }
  // 只在跨阈值时才重渲染（不是每球都重渲染——之前 15 球 = 15 次全量重渲染）
  let lastExpression = 'idle';
  function updateCastExpression() {
    const exp = expressionFor(balls.length);
    if (exp !== lastExpression) {
      renderCast(exp);
      lastExpression = exp;
    }
  }
  function resetCastExpression() {
    if (lastExpression !== 'idle') {
      renderCast('idle');
      lastExpression = 'idle';
    }
  }

  // ===== 抖动反馈 =====
  function wiggleRandomChar() {
    const slots = cast.querySelectorAll('.char-slot');
    const slot = slots[Math.floor(Math.random() * slots.length)];
    slot.classList.remove('wiggle');
    void slot.offsetWidth;
    slot.classList.add('wiggle');
    setTimeout(() => slot.classList.remove('wiggle'), 400);
  }

  function castJumpAll() {
    cast.querySelectorAll('.char-slot').forEach(s => s.classList.add('jump'));
    setTimeout(() => {
      cast.querySelectorAll('.char-slot').forEach(s => s.classList.remove('jump'));
    }, 1600);
  }

  // ===== 落球 =====
  function dropBall() {
    if (resetting) return;
    const size = rand(60, 110);
    const color = pick(BALL_COLORS);

    // 计算落点：底部一片随机位置（中间稠密）
    const padding = size;
    const fieldW = window.innerWidth - padding * 2;
    // 倾向中间：x = 中心 + 高斯偏移
    const center = window.innerWidth / 2;
    const spread = window.innerWidth * 0.32;
    let x = center + (Math.random() + Math.random() + Math.random() - 1.5) * spread;
    x = Math.max(padding, Math.min(window.innerWidth - padding, x));

    // y 落点：找堆中最上层 +/- 视觉错位
    const groundY = window.innerHeight - 20;
    // 简易"堆"：根据已有球与新球水平接近度堆叠
    let landingY = groundY - size / 2;
    for (const b of balls) {
      const dx = Math.abs(b.x - x);
      // 水平半径接近 → 落在它上面
      const sum = (b.size + size) / 2;
      if (dx < sum * 0.85) {
        const onTop = b.y - sum * 0.78;
        if (onTop < landingY) landingY = onTop;
      }
    }

    const el = document.createElement('div');
    el.className = 'ball falling';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.background = `radial-gradient(circle at 32% 32%, ${color}, ${TW.darken(color, 0.4)})`;
    el.style.left = (x - size / 2) + 'px';
    el.style.top = (-size - 20) + 'px';
    stage.appendChild(el);

    // 触发 transition 到 landingY
    requestAnimationFrame(() => {
      el.style.top = (landingY - size / 2) + 'px';
    });

    const rec = { el, x, y: landingY, size, color };
    balls.push(rec);

    // 落地后播 thud
    setTimeout(() => {
      if (!resetting) {
        TW.playThud();
        wiggleRandomChar();
        updateCastExpression();
        // 满 → 欢呼 + 清场
        if (balls.length >= TARGET_COUNT) {
          triggerCelebration();
        }
      }
    }, 700);
  }

  // ===== 欢呼 + 清场 =====
  const CHEER_LINES = ['哇！', '好多！', 'More!', 'Oooooh!', '哇哇哇'];
  function triggerCelebration() {
    if (resetting) return;
    resetting = true;
    TW.playCheer();
    castJumpAll();
    showCaption(pick(CHEER_LINES));

    setTimeout(() => {
      // 清场：所有球 pop
      balls.forEach((b, i) => {
        setTimeout(() => {
          b.el.classList.remove('falling');
          b.el.classList.add('popping');
          TW.playPop();
        }, i * 60);
      });
      // 全部移除
      const totalDelay = balls.length * 60 + 500;
      setTimeout(() => {
        stage.innerHTML = '';
        balls = [];
        resetting = false;
        resetCastExpression();
        hideCaption();
      }, totalDelay);
    }, 1400);
  }

  function showCaption(text) {
    caption.textContent = text;
    caption.classList.remove('show');
    void caption.offsetWidth;
    caption.classList.add('show');
  }
  function hideCaption() {
    caption.classList.remove('show');
  }

  // ===== 触发 (按键 / 戳屏) =====
  function trigger() {
    if (!started) start();
    if (resetting) return;
    dropBall();
  }

  function start() {
    if (started) return;
    started = true;
    hint.classList.add('gone');
    setTimeout(() => hint.remove(), 800);
    TW.ensureCtx();
  }

  // ===== 输入 =====
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === 'Escape') {
      if (!document.fullscreenElement) location.href = '../../';
      return;
    }
    e.preventDefault();
    if (e.key === 'f' || e.key === 'F') {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }
      return;
    }
    trigger();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('#back')) return;
    trigger();
  });
  document.addEventListener('touchstart', (e) => {
    if (e.target.closest('#back')) return;
    if (!started) start();
    if (resetting) { e.preventDefault(); return; }
    for (const t of e.changedTouches) { dropBall(); }
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('resize', () => {
    stage.innerHTML = '';
    balls = [];
  });
</script>
</body>
</html>
