<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>分一分 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    /* 桌面而不是草地：绿色是本款四个玩色之一，绿篮子放绿草地上会自己吃掉线索 */
    background: linear-gradient(180deg, #fdf3e2 0%, #f8e9d0 62%, #e3c193 62%, #cfa670 100%);
  }
  /* 固定光晕：同 shapes/find/basket——质感走这层 overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 14%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%),
      radial-gradient(120% 90% at 50% 112%, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0) 55%);
    pointer-events: none;
    z-index: 0;
  }
  /* 桌沿：给两个篮子一条「站在桌上」的水平线 */
  .edge {
    position: fixed;
    left: 0; right: 0;
    top: 62%;
    height: 1.2vmin;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(150, 100, 50, 0.18));
    z-index: 1;
  }

  /* ===== 物件：散在中上部，可拿起拖动 ===== */
  .item {
    position: fixed;
    width: 15vmin;
    height: 15vmin;
    cursor: grab;
    z-index: 10;
    filter: drop-shadow(0 5px 6px rgba(80, 50, 20, 0.25));
    will-change: transform;
    touch-action: none;
  }
  .item svg { width: 100%; height: 100%; display: block; }
  /* 待拿起时轻轻摇——「我可以动」的暗示 */
  .item.idle-sway { animation: item-sway 3s ease-in-out infinite; }
  @keyframes item-sway {
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    50%      { transform: rotate(4deg)  translateY(-1vmin); }
  }
  /* 拿起：放大 + 影子加深，跟手由 JS transform 接管 */
  .item.lift {
    cursor: grabbing;
    filter: drop-shadow(0 12px 14px rgba(80, 50, 20, 0.32));
    z-index: 300;
  }
  /* 点按（没拖）：原地开心跳一下 */
  .item.hop { animation: item-hop 460ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes item-hop {
    0%, 100% { transform: translateY(0)        scale(1); }
    40%      { transform: translateY(-3.5vmin) scale(1.12); }
  }
  /* 放错 / 放空处：滑回原位（信息不是评价，没有失败音）*/
  .item.slide-back { transition: transform 420ms cubic-bezier(0.3, 0.9, 0.4, 1.1); }
  /* 飞进篮子（拖到位 / 点按降级 / 键盘 / 闲置帮忙）*/
  .item.fly-in { transition: transform 520ms cubic-bezier(0.5, 0, 0.3, 1.1); z-index: 200; }
  /* 已入篮：趴在篮口，不再响应 */
  .item.in-bin { pointer-events: none; }
  /* 同一个物件错 2 次：它自己也跟着脉动，和发光的篮子连成一条线索 */
  .item.guide { animation: item-guide 1s ease-in-out infinite; }
  @keyframes item-guide {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 5px 6px rgba(80, 50, 20, 0.25)); }
    50%      { transform: scale(1.16); filter: drop-shadow(0 0 3vmin rgba(255, 245, 150, 0.95)); }
  }
  /* 换轮倒空：物件淡出 */
  .item.dump { transition: opacity 420ms ease, transform 420ms ease; opacity: 0; }

  /* ===== 两个大色篮：篮身整体着色，饱和不描边 ===== */
  .bin {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 4vh);
    width: 32vmin;
    /* 竖屏手机 vmin 是宽度，纯 vmin 会让篮子在长屏上缩成一小坨；给一个 vh 下限撑起来 */
    height: max(25vmin, 18vh);
    z-index: 100;
    cursor: pointer;
    will-change: transform;
    animation: bin-idle 3.4s ease-in-out infinite;
  }
  .bin.left  { left:  calc(env(safe-area-inset-left, 0px)  + 6vw); }
  .bin.right { right: calc(env(safe-area-inset-right, 0px) + 6vw); animation-delay: -1.7s; }
  @keyframes bin-idle {
    0%, 100% { transform: rotate(-1.6deg); }
    50%      { transform: rotate(1.6deg); }
  }
  /* 篮身：上宽下窄的斗，整块饱和色 */
  .bin .body {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 82%;
    background: linear-gradient(180deg, var(--c) 0%, var(--c) 55%, var(--cd) 100%);
    border-radius: 2vmin 2vmin 5vmin 5vmin / 2vmin 2vmin 4vmin 4vmin;
    box-shadow:
      inset 0 -2vmin 0 rgba(0, 0, 0, 0.12),
      0 1.4vmin 2.4vmin rgba(80, 50, 20, 0.28);
    clip-path: polygon(4% 0, 96% 0, 88% 100%, 12% 100%);
  }
  /* 篮身横向编织纹：看得出是个篮子，但不抢颜色 */
  .bin .body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg,
      rgba(255, 255, 255, 0.16) 0 1.1vmin, rgba(0, 0, 0, 0.06) 1.1vmin 2.4vmin);
    border-radius: inherit;
    clip-path: inherit;
  }
  /* 篮口：更深一档的沿，物件落进去有「进去了」的层次 */
  .bin .rim {
    /* 左右对齐篮身顶边（body 的 clip-path 是 4% ~ 96%），不然椭圆两头支出去像个地洞 */
    position: absolute;
    left: 3%; right: 3%;
    top: 5%;
    height: 5.6vmin;
    background: var(--cd);
    border-radius: 50%;
    box-shadow: inset 0 0.8vmin 0 rgba(0, 0, 0, 0.16);
  }
  .bin .rim::after {
    content: '';
    position: absolute;
    inset: 16% 7%;
    background: rgba(0, 0, 0, 0.18);
    border-radius: 50%;
  }
  /* 放对了：篮子开心弹一下 */
  .bin.bounce { animation: bin-bounce 560ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes bin-bounce {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.12, 0.9); }
    65%  { transform: scale(0.96, 1.06); }
    100% { transform: scale(1); }
  }
  /* 放错了：左右摇头（是信息不是批评，没有失败音）*/
  .bin.nope { animation: bin-nope 520ms ease-in-out; }
  @keyframes bin-nope {
    0%, 100% { transform: translateX(0)      rotate(0); }
    18%      { transform: translateX(-6%)    rotate(-7deg); }
    46%      { transform: translateX(6%)     rotate(7deg); }
    74%      { transform: translateX(-3%)    rotate(-3deg); }
  }
  /* 开场介绍 / 闲置提醒：这个篮子亮一下 */
  .bin.lit { animation: bin-lit 900ms ease-in-out; }
  @keyframes bin-lit {
    0%, 100% { transform: scale(1);    filter: none; }
    45%      { transform: scale(1.12); filter: brightness(1.22) drop-shadow(0 0 3.4vmin rgba(255, 246, 160, 0.95)); }
  }
  /* 错 2 次：正确的那个篮子持续发光脉动，直到他放对（永远以成功收尾）*/
  .bin.guide { animation: bin-guide 1s ease-in-out infinite; }
  @keyframes bin-guide {
    0%, 100% { transform: scale(1);    filter: none; }
    50%      { transform: scale(1.1);  filter: brightness(1.22) drop-shadow(0 0 3.4vmin rgba(255, 246, 160, 0.95)); }
  }
  /* 全部分完：两个篮子一起跳 */
  .bin.party { animation: bin-party 900ms ease-in-out; }
  @keyframes bin-party {
    0%, 100% { transform: translateY(0)       rotate(0); }
    20%      { transform: translateY(-4vmin)  rotate(-6deg) scale(1.08); }
    50%      { transform: translateY(-1vmin)  rotate(5deg)  scale(1.1); }
    80%      { transform: translateY(-2.6vmin) rotate(-3deg) scale(1.04); }
  }

  /* 庆祝粒子（同 basket / train）*/
  .spark {
    position: fixed;
    font-size: 7vmin;
    line-height: 1;
    pointer-events: none;
    z-index: 600;
    animation: spark-fly 900ms ease-out forwards;
  }
  @keyframes spark-fly {
    0%   { transform: translate(0, 0)                                    scale(0.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.2); opacity: 0; }
  }

  #back {
    position: fixed;
    top: 8px; left: 4px;
    top: calc(constant(safe-area-inset-top) + 8px);
    left: calc(constant(safe-area-inset-left) + 4px);
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: calc(env(safe-area-inset-left, 0px) + 4px);
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(80, 50, 30, 0.5);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
  }
  #back:active { color: rgba(80, 50, 30, 0.9); }

  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    letter-spacing: 0.3em;
    color: rgba(80, 50, 30, 0.5);
    pointer-events: none;
    transition: opacity 600ms;
    z-index: 100;
    white-space: nowrap;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div class="edge"></div>
<div class="bin left"  id="binL"><div class="rim"></div><div class="body"></div></div>
<div class="bin right" id="binR"><div class="rim"></div><div class="body"></div></div>

<a id="back" href="../../">←</a>
<div id="hint">放到一样颜色的篮子里</div>

<script>
// ===== 分一分：按颜色把东西分到两个篮子 =====
// 能力线 #5「属性与配对」新增颜色维度（此前只有形状 / 语义），
// 同时接上第 8 线「装一装」的下一站：从「一个篮子随便装」到「两个篮子要看颜色」。
// 唯一线索是颜色——同一轮里所有物件长得一模一样，只差颜色。

// 颜色池：篮身与物件共用同一组饱和色（--c 主色 / --cd 暗一档，用来做篮沿与底影）
const COLORS = {
  red:    { c: '#e8402f', cd: '#b02618', name: '红' },
  yellow: { c: '#f6c518', cd: '#c99805', name: '黄' },
  blue:   { c: '#2b7ede', cd: '#1a539f', name: '蓝' },
  green:  { c: '#45b648', cd: '#2c8030', name: '绿' },
};
// 每轮抽一对。蓝/绿这一对幼儿最难分，直接排除，只留下面五种组合。
const PAIRS = [
  ['red', 'blue'], ['red', 'yellow'], ['red', 'green'],
  ['yellow', 'blue'], ['yellow', 'green'],
];

// 物件：CSS/内联 SVG 画，不用 emoji——emoji 颜色由字体定死，改不了色就没法「只差颜色」
const KINDS = {
  ball: '<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="42" fill="currentColor"/>' +
        '<ellipse cx="36" cy="34" rx="15" ry="10" fill="#fff" opacity=".4"/></svg>',
  block: '<svg viewBox="0 0 100 100"><rect x="12" y="22" width="76" height="66" rx="11" fill="currentColor"/>' +
         '<rect x="12" y="22" width="76" height="16" rx="8" fill="#fff" opacity=".3"/>' +
         '<circle cx="34" cy="58" r="6" fill="#fff" opacity=".35"/>' +
         '<circle cx="66" cy="58" r="6" fill="#fff" opacity=".35"/></svg>',
  sock: '<svg viewBox="0 0 100 100"><g fill="currentColor">' +
        '<rect x="34" y="12" width="34" height="54" rx="9"/>' +
        '<rect x="12" y="54" width="56" height="32" rx="16"/></g>' +
        '<rect x="34" y="12" width="34" height="13" rx="6" fill="#fff" opacity=".38"/></svg>',
  flower: '<svg viewBox="0 0 100 100"><g fill="currentColor">' +
          '<circle cx="50" cy="24" r="17"/><circle cx="78" cy="44" r="17"/>' +
          '<circle cx="67" cy="77" r="17"/><circle cx="33" cy="77" r="17"/>' +
          '<circle cx="22" cy="44" r="17"/></g>' +
          '<circle cx="50" cy="51" r="15" fill="#fff6cf"/></svg>',
};
const KIND_KEYS = ['ball', 'block', 'sock', 'flower'];

// 中上部散落槽位（vw / vh），每轮取前 N 个再加随机抖动
const SLOTS = [
  [16, 24], [39, 17], [62, 21], [84, 29], [27, 50], [55, 48],
];

const DONE_COUNT = 3;        // done_1 ~ done_3 轮换
const IDLE_MS = 8000;        // 闲置多久提醒一次
const CHAIN_DOG_MS = 5500;   // 语音链看门狗（iOS 被打断时 ended/error 都不来）

// ===== 音频：单元素 + 换 src（iOS 解锁后非手势链 play 才可靠）=====
const vEl = new Audio();      // 链播专用
vEl.preload = 'auto';
const uEl = new Audio();      // 解锁专用：只在首个手势里静音 ping 一次，从不参与语音链
uEl.preload = 'none';

// 效果音：Web Audio 合成，音量克制（≤0.3）
let actx = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();   // iOS 挂起后不 resume 会静默失声（同 basket/train）
    return true;
  } catch (e) { return false; }
}
function fx(freqs, dur, type, gain) {
  if (!ensureAudio()) return;
  try {
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + i * 0.06);
      g.gain.linearRampToValueAtTime(gain, t0 + i * 0.06 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.06 + dur);
      o.connect(g).connect(actx.destination);
      o.start(t0 + i * 0.06);
      o.stop(t0 + i * 0.06 + dur + 0.05);
    });
  } catch (e) {}
}
const fxPick  = () => fx([520], 0.12, 'sine', 0.18);                 // 拿起：短噗
const fxDing  = () => fx([660, 880], 0.22, 'sine', 0.26);            // 放对：上行叮咚
const fxParty = () => fx([523, 659, 784, 1047], 0.4, 'sine', 0.24);  // 分完：琶音

// ===== DOM =====
const binEls = { L: document.getElementById('binL'), R: document.getElementById('binR') };

// ===== 状态机 =====
// idle = 静候首次输入解锁音频；intro = 开场介绍两个篮子；play = 分拣中；
// celebrate = 全部分完庆祝；dealing = 换轮动画中
let phase = 'idle';
let pair = null;         // 本轮两色 [左, 右]
let kind = null;         // 本轮物件种类
let items = [];          // 本轮物件元素
let left = 0;            // 还没分的个数
let binCount = { L: 0, R: 0 };
let roundSeq = 0;        // 轮次序号：跨轮的延时回调靠它认领自己那一轮
let prevPairIdx = -1;
let prevKindIdx = -1;
let doneAlt = 0;
let idleTimer = null;

function binOf(color) { return pair[0] === color ? 'L' : 'R'; }

function pickRound() {
  roundSeq++;
  let p;
  do { p = Math.floor(Math.random() * PAIRS.length); } while (p === prevPairIdx);
  prevPairIdx = p;
  // 左右随机对调，免得「红的永远在左边」变成位置记忆而不是颜色判断
  pair = PAIRS[p].slice();
  if (Math.random() < 0.5) pair.reverse();

  let k;
  do { k = Math.floor(Math.random() * KIND_KEYS.length); } while (k === prevKindIdx);
  prevKindIdx = k;
  kind = KIND_KEYS[k];

  binCount = { L: 0, R: 0 };
}

function paintRound() {
  items.forEach(el => el.remove());
  items = [];
  // 篮子上色
  ['L', 'R'].forEach((side, i) => {
    const col = COLORS[pair[i]];
    binEls[side].style.setProperty('--c', col.c);
    binEls[side].style.setProperty('--cd', col.cd);
    binEls[side].className = 'bin ' + (side === 'L' ? 'left' : 'right');
    binEls[side].dataset.color = pair[i];
  });
  // 每色 2-3 个，合计 4-6 个
  const perColor = [2 + Math.floor(Math.random() * 2), 2 + Math.floor(Math.random() * 2)];
  const plan = [];
  pair.forEach((c, i) => { for (let n = 0; n < perColor[i]; n++) plan.push(c); });
  plan.sort(() => Math.random() - 0.5);
  left = plan.length;

  const slots = SLOTS.slice(0, plan.length).sort(() => Math.random() - 0.5);
  plan.forEach((color, i) => {
    const [x, y] = slots[i];
    const el = document.createElement('div');
    el.className = 'item idle-sway';
    el.style.color = COLORS[color].c;
    el.innerHTML = KINDS[kind];
    el.dataset.color = color;
    el.dataset.wrong = '0';
    el.dataset.taps = '0';
    const jx = x + (Math.random() * 6 - 3), jy = y + (Math.random() * 5 - 2.5);
    el.style.left = 'calc(' + jx + 'vw - 7.5vmin)';
    el.style.top  = 'calc(' + jy + 'vh - 7.5vmin)';
    el.style.animationDelay = (Math.random() * 2).toFixed(2) + 's';
    bindItem(el);
    document.body.appendChild(el);
    items.push(el);
  });
}

// ===== 语音链：单元素换 src + 看门狗，每步可带同步动作（高亮对应篮子）=====
let chain = [], chainDone = null, chainDog = null;
function say(steps, onDone) {
  chain = steps.slice();
  chainDone = onDone || null;
  stepChain();
}
function stepChain() {
  clearTimeout(chainDog);
  if (!chain.length) {
    const fn = chainDone; chainDone = null;
    if (fn) fn();
    return;
  }
  const step = chain.shift();
  const file = typeof step === 'string' ? step : step.file;
  if (typeof step === 'object' && step.on) step.on();
  vEl.src = 'audio/' + file;
  vEl.currentTime = 0;
  vEl.play().catch(() => {});
  chainDog = setTimeout(stepChain, CHAIN_DOG_MS);
}
vEl.addEventListener('ended', stepChain);
vEl.addEventListener('error', stepChain);   // mp3 缺失也不卡链，往下走

function litBin(side) {
  const el = binEls[side];
  el.classList.remove('lit');
  void el.offsetWidth;
  el.classList.add('lit');
}

// 开场：来分一分 → 左篮亮 + 「X 色的，放这里！」 → 右篮亮 + 同构
function playIntro() {
  phase = 'intro';
  say([
    'intro.mp3',
    { file: 'put_' + pair[0] + '.mp3', on: () => litBin('L') },
    { file: 'put_' + pair[1] + '.mp3', on: () => litBin('R') },
  ], finishIntro);
}
// 开场收尾。挂在语音 chainDone 上会被任何一次 say() 抢占掉（说过的话都没人替它收尾），
// 于是 phase 永远停在 'intro'、armIdle 首行直接 return、整轮闲置引导死掉。
// 故独立成函数 + 幂等，三个输入入口在 intro 期间也各自调一次。
function finishIntro() {
  if (phase !== 'intro') return;
  phase = 'play';
  armIdle();
}

// ===== 粒子 =====
function burstSparks(fromEl, big) {
  const r = fromEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const EMOJIS = ['⭐', '✨', '🎉', '💛', '🌟'];
  const n = big ? 14 : 7;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = EMOJIS[i % EMOJIS.length];
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.6;
    const dist = (big ? 26 : 16) + Math.random() * 14;
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'vmin');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'vmin');
    s.style.setProperty('--rot', (Math.random() * 90 - 45) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}

// ===== 入篮 =====
function binLanding(side, i) {
  const b = binEls[side].getBoundingClientRect();
  const col = i % 3, row = Math.floor(i / 3);
  const x = b.left + b.width * (0.26 + col * 0.24);
  const y = b.top + b.height * (0.34 + row * 0.24);
  return [x, y];
}

function flyIn(el) {
  if (el.classList.contains('in-bin')) return;
  // 正被手指按着的物件不许被替他送走：否则 release 的「只点没拖」分支会把已入篮的它
  // 拽回桌上，留下一个计数已减、pointer-events 已关的幽灵
  if (el.dataset.dragging === '1') return;
  const color = el.dataset.color;
  const side = binOf(color);
  clearIdle();
  el.classList.remove('idle-sway', 'hop', 'slide-back', 'guide');
  binEls[side].classList.remove('guide');
  el.style.animation = 'none';
  // 拖动中的视觉位置带 transform 偏移——先固化成 left/top 清掉 transform，
  // 让四个入口（拖放 / 点按降级 / 键盘 / 闲置帮忙）的飞行起点基准一致（同 basket）
  el.style.transition = 'none';
  const r = el.getBoundingClientRect();
  el.style.left = r.left + 'px';
  el.style.top = r.top + 'px';
  el.style.transform = 'none';
  void el.offsetWidth;
  el.style.transition = '';
  const [tx, ty] = binLanding(side, binCount[side]);
  el.classList.add('fly-in', 'in-bin');
  el.style.transform = 'translate(' + (tx - r.left - r.width / 2) + 'px,' +
                                      (ty - r.top - r.height / 2) + 'px) scale(0.44)';
  binCount[side]++;
  left--;
  const rest = left;
  setTimeout(() => {
    fxDing();
    const b = binEls[side];
    b.classList.remove('bounce');
    void b.offsetWidth;
    b.classList.add('bounce');
    burstSparks(b, false);
    if (rest <= 0) {
      phase = 'celebrate';
      const seq = roundSeq;
      say(['name_' + color + '.mp3'], celebrate);
      // 看门狗兜底。只看相位会跨轮误杀：键盘连击一轮 2-3s 跑完，上一轮遗留的这个定时器
      // 正好落进下一轮的 celebrate 把庆祝掐断，故加轮次锁
      setTimeout(() => { if (phase === 'celebrate' && seq === roundSeq) nextRound(); }, 8000);
    } else {
      say(['name_' + color + '.mp3']);
      armIdle();
    }
  }, 520);
}

// ===== 放错了：摇头 + 滑回 + 告诉他这东西是什么颜色 =====
function refuse(el, side) {
  const b = binEls[side];
  b.classList.remove('nope');
  void b.offsetWidth;
  b.classList.add('nope');
  slideBack(el);
  const wrong = parseInt(el.dataset.wrong, 10) + 1;
  el.dataset.wrong = String(wrong);
  const color = el.dataset.color;
  const files = ['no_' + color + '.mp3'];
  if (wrong >= 2) {
    // 「2 次后正确项发光」是底线，发光是状态不是播报的附属：挂在语音 chainDone 上，
    // no_* 那 2.2 秒里任何一次 say()（戳篮子 / 又放一个 / 闲置提醒）都会让它永不点亮。
    // 篮子同步点亮；物件的脉动等 slide-back 走完再上，免得两个 transform 打架
    binEls[binOf(color)].classList.add('guide');
    setTimeout(() => {
      if (el.classList.contains('in-bin')) return;
      el.classList.remove('idle-sway');
      el.style.animation = '';
      el.classList.add('guide');
    }, 470);
    files.push('put_' + color + '.mp3');
  }
  say(files);
  armIdle();
}

function slideBack(el) {
  el.style.transition = '';
  el.classList.add('slide-back');
  el.style.transform = 'scale(1)';
  setTimeout(() => {
    el.classList.remove('slide-back');
    if (el.classList.contains('in-bin')) return;
    if (!el.classList.contains('guide')) el.classList.add('idle-sway');
    el.style.animation = '';
  }, 460);
}

// ===== 全部分完 =====
function celebrate() {
  fxParty();
  ['L', 'R'].forEach(s => {
    binEls[s].classList.remove('party');
    void binEls[s].offsetWidth;
    binEls[s].classList.add('party');
    burstSparks(binEls[s], true);
  });
  doneAlt = doneAlt % DONE_COUNT + 1;
  say(['done_' + doneAlt + '.mp3'], () => setTimeout(nextRound, 1500));
}

function nextRound() {
  if (phase === 'dealing') return;
  phase = 'dealing';
  clearIdle();
  // 篮子倒空：物件淡出
  items.forEach(el => { el.classList.add('dump'); el.style.transform += ' scale(0.2)'; });
  setTimeout(() => {
    pickRound();
    paintRound();
    playIntro();
  }, 520);
}

// ===== 闲置提醒：随机一个剩下的物件 + 它的篮子一起亮一下，复播 put_ =====
function clearIdle() { if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; } }
function armIdle() {
  clearIdle();
  idleTimer = setTimeout(() => {
    if (phase !== 'play') return;
    const rest = items.filter(el => !el.classList.contains('in-bin'));
    if (!rest.length) return;
    // 正在引导某个物件时就提醒那一个——否则发光的篮子和念出来的颜色会指向两个不同的东西
    const el = rest.find(x => x.classList.contains('guide')) ||
               rest[Math.floor(Math.random() * rest.length)];
    const color = el.dataset.color;
    el.classList.remove('hop');
    void el.offsetWidth;
    el.classList.add('hop');
    setTimeout(() => el.classList.remove('hop'), 500);
    litBin(binOf(color));
    say(['put_' + color + '.mp3']);
    armIdle();
  }, IDLE_MS);
}

// ===== 拖放（机制同 basket：pointer capture + transform 跟手 + 命中区外扩）=====
function hitBin(cx, cy) {
  for (const side of ['L', 'R']) {
    const b = binEls[side].getBoundingClientRect();
    const pad = b.width * 0.26;   // 命中区外扩——2 岁的手不必精准
    if (cx > b.left - pad && cx < b.right + pad &&
        cy > b.top - pad * 1.5 && cy < b.bottom + pad) return side;
  }
  return null;
}

function bindItem(el) {
  let startX = 0, startY = 0, dragging = false, moved = false;

  el.addEventListener('pointerdown', (e) => {
    hideHint();
    if (phase === 'idle') { unlockAudio(); }
    if (el.classList.contains('in-bin')) return;
    if (phase !== 'play' && phase !== 'intro') return;
    finishIntro();   // 抢了介绍语音的输入，自己把 intro 收尾——别把 phase 丢在 'intro'
    clearIdle();
    dragging = true;
    el.dataset.dragging = '1';
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.classList.remove('idle-sway', 'hop', 'slide-back');
    el.style.animation = 'none';
    el.style.transition = 'none';
    el.classList.add('lift');
    el.style.transform = 'scale(1.18)';
    fxPick();
    e.preventDefault();
  });

  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    // 阈值 14px：2 岁的手指按下去就会蹭，10px 太容易把「点一下」误判成「拖了一下」（basket 教训）
    if (Math.abs(dx) + Math.abs(dy) > 14) moved = true;
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.18)';
  });

  function release(e) {
    if (!dragging) return;
    dragging = false;
    el.dataset.dragging = '0';
    el.classList.remove('lift');
    // 系统收走手势（来电 / 手势冲突 / 多指）不是「他放的」，落在哪个篮子上都不判对错
    if (e && e.type === 'pointercancel') { slideBack(el); armIdle(); return; }
    const r = el.getBoundingClientRect();
    const side = hitBin(r.left + r.width / 2, r.top + r.height / 2);

    if (moved && side) {
      el.dataset.taps = '0';
      if (binEls[side].dataset.color === el.dataset.color) {
        el.style.transition = 'none';
        flyIn(el);
      } else {
        refuse(el, side);
      }
      return;
    }
    if (moved) {
      // 拖到空处：滑回原位，不出声（放错才有信息，放空处什么也没发生）
      slideBack(el);
      armIdle();
      return;
    }
    // 只点没拖：原地蹦一下 + 噗声；连点 3 次还没拖 → 替他送进正确的篮子
    const taps = parseInt(el.dataset.taps, 10) + 1;
    el.dataset.taps = String(taps);
    el.style.transition = 'none';
    el.style.transform = '';
    el.classList.remove('hop');
    el.style.animation = '';   // pointerdown 关掉的 animation 先还回来，否则 hop 关键帧被 inline none 压死（basket 教训）
    void el.offsetWidth;
    el.classList.add('hop');
    fxPick();
    setTimeout(() => {
      el.classList.remove('hop');
      if (el.classList.contains('in-bin')) return;
      if (!el.classList.contains('guide')) el.classList.add('idle-sway');
      el.style.transition = '';
    }, 500);
    if (taps >= 3) {
      el.dataset.taps = '0';
      setTimeout(() => flyIn(el), 480);
    } else {
      armIdle();
    }
  }
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.dataset.dragging = '0';
}

// ===== 首次输入解锁（iOS 音频需手势）=====
function unlockAudio() {
  if (phase !== 'idle') return;
  ensureAudio();
  // 解锁走独立元素静音 ping（train 同款双元素写法）；vEl 的首次 play 由 playIntro 在同一个
  // 手势里发出，iOS 据此解锁它。不对 vEl 做「空 src 先 play 再换 src」——WebKit 行为不确定
  uEl.muted = true;
  uEl.src = 'audio/intro.mp3';
  uEl.play().then(() => { uEl.pause(); uEl.muted = false; }).catch(() => { uEl.muted = false; });
  playIntro();
}

// 戳篮子 = 重听「这个篮子放什么颜色」（idle 时同首次解锁）
function tapBin(side) {
  hideHint();
  if (phase === 'idle') { unlockAudio(); return; }
  if (phase !== 'play' && phase !== 'intro') return;
  finishIntro();
  litBin(side);
  fxPick();
  say(['put_' + binEls[side].dataset.color + '.mp3']);
  armIdle();
}
['L', 'R'].forEach(side => {
  binEls[side].addEventListener('click', () => tapBin(side), { passive: true });
  binEls[side].addEventListener('touchstart', (e) => {
    tapBin(side);
    e.preventDefault();   // 抑制 iOS 合成 click，避免一戳触发两次
  }, { passive: false });
});

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === 'Escape') {
    if (!document.fullscreenElement) location.href = '../../';
    return;
  }
  if ((e.key === 'f' || e.key === 'F') && !document.fullscreenElement) {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    return;
  }
  e.preventDefault();
  hideHint();
  if (phase === 'idle') { unlockAudio(); return; }
  if (phase !== 'play' && phase !== 'intro') return;
  finishIntro();
  // 任意键：随机一个还没分的物件自动飞进正确的篮子（键盘乱拍也能玩完整循环）
  const rest = items.filter(el => !el.classList.contains('in-bin'));
  if (rest.length) flyIn(rest[Math.floor(Math.random() * rest.length)]);
});

// 后台切回 / bfcache 返回：AudioContext 会被挂起，不 resume 就静默失声
function resumeAudio() {
  if (document.visibilityState === 'hidden') return;
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
}
document.addEventListener('visibilitychange', resumeAudio);
window.addEventListener('pageshow', resumeAudio);

let hintGone = false;
function hideHint() {
  if (hintGone) return;
  hintGone = true;
  const h = document.getElementById('hint');
  if (h) {
    h.classList.add('gone');
    setTimeout(() => h.remove(), 800);
  }
}

// 进入：摆好第一轮，静候首次输入
pickRound();
paintRound();

// 只读状态快照：CDP 行为回归用（零 UI、不参与玩法）
window.__sort = () => ({
  phase, pair, kind, left, roundSeq,
  binL: binCount.L, binR: binCount.R,
  binColors: [binEls.L.dataset.color, binEls.R.dataset.color],
  src: vEl.src.split('/').pop(),
});

// 空闲预载全部 mp3 进 HTTP 缓存——后续换 src 即播不等网络
setTimeout(() => {
  fetch('audio/intro.mp3').catch(() => {});
  Object.keys(COLORS).forEach(c => {
    ['put_', 'name_', 'no_'].forEach(p => fetch('audio/' + p + c + '.mp3').catch(() => {}));
  });
  for (let n = 1; n <= DONE_COUNT; n++) fetch('audio/done_' + n + '.mp3').catch(() => {});
}, 600);
</script>
