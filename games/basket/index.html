<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>装一装 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    background-color: #fdeeca;
    transition: background-color 600ms ease;
  }
  /* 固定光晕：同 shapes/find——主色走 background-color 可过渡，质感走这层固定 overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 18%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%),
      radial-gradient(120% 90% at 50% 110%, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0) 55%);
    pointer-events: none;
    z-index: 0;
  }
  /* 地面草坪：篮子坐在草地上 */
  .grass {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 24vh;
    background: linear-gradient(180deg, #b9e3a2, #94d086);
    border-radius: 50% 50% 0 0 / 18% 18% 0 0;
    z-index: 1;
  }

  /* 顶部引导区：戳喇叭重听 */
  .ask {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 3vmin);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 2vmin;
    font-size: clamp(22px, 5vmin, 48px);
    font-weight: 800;
    color: rgba(60, 40, 18, 0.85);
    text-shadow: 0 3px 0 rgba(255, 255, 255, 0.7);
    cursor: pointer;
    z-index: 20;
    white-space: nowrap;
  }
  .ask .horn { font-size: clamp(30px, 6.5vmin, 60px); line-height: 1; }
  .ask.talking .horn { animation: horn-wiggle 600ms ease-in-out infinite; }
  @keyframes horn-wiggle {
    0%, 100% { transform: rotate(0)      scale(1); }
    25%      { transform: rotate(-8deg)  scale(1.1); }
    75%      { transform: rotate(8deg)   scale(1.1); }
  }

  /* ===== 水果：散落上半屏，可拿起拖动 ===== */
  .fruit {
    position: fixed;
    width: 16vmin;
    height: 16vmin;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13vmin;
    line-height: 1;
    cursor: grab;
    z-index: 10;
    filter: drop-shadow(0 5px 6px rgba(80, 50, 20, 0.22));
    will-change: transform;
    touch-action: none;
  }
  /* 待拿起时轻轻摇——「我可以动」的暗示 */
  .fruit.idle-sway { animation: fruit-sway 3s ease-in-out infinite; }
  @keyframes fruit-sway {
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    50%      { transform: rotate(4deg)  translateY(-1vmin); }
  }
  /* 拿起：放大 + 影子加深，跟手由 JS transform 接管 */
  .fruit.lift {
    cursor: grabbing;
    filter: drop-shadow(0 12px 14px rgba(80, 50, 20, 0.3));
    z-index: 300;
  }
  /* 点按（没拖）：原地开心跳一下 */
  .fruit.hop { animation: fruit-hop 460ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes fruit-hop {
    0%, 100% { transform: translateY(0)      scale(1); }
    40%      { transform: translateY(-3.5vmin) scale(1.12); }
  }
  /* 松手没到篮子：滑回原位（信息不是评价，没有失败音）*/
  .fruit.slide-back { transition: transform 420ms cubic-bezier(0.3, 0.9, 0.4, 1.1); }
  /* 飞进篮子（拖到位 / 点按降级 / 键盘）*/
  .fruit.fly-in { transition: transform 520ms cubic-bezier(0.5, 0, 0.3, 1.1); z-index: 200; }
  /* 已入篮：缩小趴在篮口，不再响应 */
  .fruit.in-basket { pointer-events: none; }

  /* ===== 篮子 ===== */
  .basket {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 4vh);
    transform: translateX(-50%);
    width: 40vmin;
    height: 32vmin;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-size: 30vmin;
    line-height: 1;
    z-index: 100;
    cursor: pointer;
    filter: drop-shadow(0 8px 14px rgba(80, 50, 20, 0.25));
    will-change: transform;
  }
  .basket.bounce { animation: basket-bounce 560ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes basket-bounce {
    0%   { transform: translateX(-50%) scale(1); }
    35%  { transform: translateX(-50%) scale(1.12, 0.9); }
    65%  { transform: translateX(-50%) scale(0.95, 1.06); }
    100% { transform: translateX(-50%) scale(1); }
  }
  .basket.party { animation: basket-party 900ms ease-in-out; }
  @keyframes basket-party {
    0%, 100% { transform: translateX(-50%) rotate(0); }
    20%      { transform: translateX(-50%) rotate(-6deg) scale(1.08); }
    50%      { transform: translateX(-50%) rotate(5deg)  scale(1.12); }
    80%      { transform: translateX(-50%) rotate(-3deg) scale(1.05); }
  }

  /* 庆祝粒子（同 shapes）*/
  .spark {
    position: fixed;
    font-size: 7vmin;
    line-height: 1;
    pointer-events: none;
    z-index: 600;
    animation: spark-fly 900ms ease-out forwards;
  }
  @keyframes spark-fly {
    0%   { transform: translate(0, 0)                                    scale(0.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.2); opacity: 0; }
  }

  /* 换轮淡出淡入 */
  .stage-fade { transition: opacity 400ms ease; }
  .stage-fade.out { opacity: 0; }

  #back {
    position: fixed;
    top: 8px; left: 4px;
    top: calc(constant(safe-area-inset-top) + 8px);
    left: calc(constant(safe-area-inset-left) + 4px);
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: calc(env(safe-area-inset-left, 0px) + 4px);
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(80, 50, 30, 0.5);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
  }
  #back:active { color: rgba(80, 50, 30, 0.9); }

  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    letter-spacing: 0.3em;
    color: rgba(80, 50, 30, 0.5);
    pointer-events: none;
    transition: opacity 600ms;
    z-index: 100;
    white-space: nowrap;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div class="stage-fade" id="stage">
  <div class="ask" id="ask"><span class="horn">📢</span><span id="askWord"></span></div>
  <div class="grass"></div>
  <div class="basket" id="basket">🧺</div>
</div>

<a id="back" href="../../">←</a>
<div id="hint">把果果拖进小篮子</div>

<script>
// ===== 装一装：拖水果进篮，放一个数一个 =====
// 数量感（能力线 #8）首款 + 全台第一个「拖放到目标」交互。
// 语音替娃数数（2 岁是跟着念的输入期，不考他）；没有对错、没有失败态。
const FRUITS = [
  { key: 'apple',      emoji: '🍎', theme: '#fddcd3' },
  { key: 'banana',     emoji: '🍌', theme: '#fdeeca' },
  { key: 'orange',     emoji: '🍊', theme: '#fde4c4' },
  { key: 'strawberry', emoji: '🍓', theme: '#fcd9e2' },
];
// 上半屏 5 个散落槽位（vw/vh 百分比），每轮取前 N 个再加随机抖动
const SLOTS = [
  [18, 26], [50, 18], [80, 26], [30, 44], [68, 44],
];

// ===== 音频：单元素 + 换 src（iOS 解锁后非手势链 play 才可靠）=====
const vEl = new Audio();   // 人声：intro / count / done 共用
vEl.preload = 'auto';

// 效果音：Web Audio 合成，音量克制（≤0.3）
let actx = null;
function fx(freqs, dur, type, gain) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + i * 0.06);
      g.gain.linearRampToValueAtTime(gain, t0 + i * 0.06 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.06 + dur);
      o.connect(g).connect(actx.destination);
      o.start(t0 + i * 0.06);
      o.stop(t0 + i * 0.06 + dur + 0.05);
    });
  } catch (e) {}
}
const fxPick = () => fx([520], 0.12, 'sine', 0.18);            // 拿起：短噗
const fxDrop = () => fx([660, 880], 0.22, 'sine', 0.26);       // 入篮：上行叮咚
const fxParty = () => fx([523, 659, 784, 1047], 0.4, 'sine', 0.24); // 装满：琶音

// ===== DOM =====
const stageEl = document.getElementById('stage');
const askEl = document.getElementById('ask');
const askWordEl = document.getElementById('askWord');
const basketEl = document.getElementById('basket');

// ===== 状态机 =====
// idle = 静候首戳解锁音频；play = 拖放中；celebrate = 装满庆祝；dealing = 换轮动画
let phase = 'idle';
let fruit = null;        // 本轮水果种类
let total = 0;           // 本轮个数 3-5
let inCount = 0;         // 已入篮数
let fruitEls = [];
let firstRound = true;
let missStreak = 0;      // 连续「没送进篮子」的尝试次数——只点没拖 / 拖了没到，都算
let everDragged = false; // 成功拖入过一次 = 会拖了，帮忙门槛放宽一档
let assistMode = false;  // 还不会拖的娃：帮过一次之后，碰一下就替他送进去
let lastFruitKey = null;

function pickRound() {
  let f;
  do { f = FRUITS[Math.floor(Math.random() * FRUITS.length)]; } while (f.key === lastFruitKey);
  fruit = f;
  lastFruitKey = f.key;
  total = firstRound ? 3 : 3 + Math.floor(Math.random() * 3);   // 首轮 3 个热身，后面 3-5
  firstRound = false;
  inCount = 0;
}

function paintRound() {
  fruitEls.forEach(el => el.remove());
  fruitEls = [];
  document.body.style.backgroundColor = fruit.theme;
  askWordEl.textContent = '装' + fruit.emoji + '进篮子！';
  const slots = SLOTS.slice(0, total);
  slots.forEach(([x, y]) => {
    const el = document.createElement('div');
    el.className = 'fruit idle-sway';
    el.textContent = fruit.emoji;
    const jx = x + (Math.random() * 6 - 3), jy = y + (Math.random() * 5 - 2.5);
    el.style.left = 'calc(' + jx + 'vw - 8vmin)';
    el.style.top = 'calc(' + jy + 'vh - 8vmin)';
    el.style.animationDelay = (Math.random() * 2).toFixed(2) + 's';
    bindFruit(el);
    document.body.appendChild(el);
    fruitEls.push(el);
  });
}

function playVoice(src, onEnded) {
  vEl.onended = onEnded || null;
  vEl.onerror = onEnded ? () => setTimeout(onEnded, 400) : null;
  vEl.src = src;
  vEl.currentTime = 0;
  askEl.classList.add('talking');
  vEl.play().catch(() => { if (onEnded) setTimeout(onEnded, 400); });
}
vEl.addEventListener('ended', () => askEl.classList.remove('talking'));
vEl.addEventListener('error', () => askEl.classList.remove('talking'));

const playIntro = () => playVoice('audio/intro_' + fruit.key + '.mp3');

function burstSparks(fromEl, big) {
  const r = fromEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const EMOJIS = ['⭐', '✨', '🎉', '💛', '🌟'];
  const n = big ? 14 : 7;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = EMOJIS[i % EMOJIS.length];
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.6;
    const dist = (big ? 26 : 16) + Math.random() * 14;
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'vmin');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'vmin');
    s.style.setProperty('--rot', (Math.random() * 90 - 45) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}

// ===== 入篮 =====
function basketLanding(i) {
  // 篮口横排小水果落点：按已入篮序号在篮口错开
  const b = basketEl.getBoundingClientRect();
  const spread = b.width * 0.5;
  const x = b.left + b.width / 2 + (i - (total - 1) / 2) * (spread / Math.max(total - 1, 1));
  const y = b.top + b.height * 0.28;
  return [x, y];
}

function flyIn(el) {
  el.classList.remove('idle-sway', 'hop', 'slide-back');
  el.style.animation = 'none';
  // 拖动中的视觉位置带 transform 偏移——先固化成 left/top 清掉 transform，
  // 让三个入口（拖放 / 点按降级 / 键盘）的飞行起点基准一致
  el.style.transition = 'none';
  const r = el.getBoundingClientRect();
  el.style.left = r.left + 'px';
  el.style.top = r.top + 'px';
  el.style.transform = 'none';
  void el.offsetWidth;
  el.style.transition = '';
  const [tx, ty] = basketLanding(inCount);
  el.classList.add('fly-in');
  el.style.transform = 'translate(' + (tx - r.left - r.width / 2) + 'px,' + (ty - r.top - r.height / 2) + 'px) scale(0.52)';
  el.classList.add('in-basket');
  inCount++;
  const n = inCount;
  setTimeout(() => {
    fxDrop();
    basketEl.classList.remove('bounce');
    void basketEl.offsetWidth;
    basketEl.classList.add('bounce');
    burstSparks(basketEl, false);
    if (n >= total) {
      // 最后一个：数完这声再庆祝
      phase = 'celebrate';
      playVoice('audio/count_' + n + '.mp3', celebrate);
    } else {
      playVoice('audio/count_' + n + '.mp3');
    }
  }, 520);
}

function celebrate() {
  fxParty();
  basketEl.classList.remove('party');
  void basketEl.offsetWidth;
  basketEl.classList.add('party');
  burstSparks(basketEl, true);
  playVoice('audio/done_' + fruit.key + '_' + total + '.mp3', () => setTimeout(nextRound, 900));
  // 看门狗：iOS 中断（Siri/锁屏）时 ended/error 都不来，8s 兜底防卡死
  setTimeout(() => { if (phase === 'celebrate') nextRound(); }, 8000);
}

function nextRound() {
  if (phase === 'dealing') return;
  phase = 'dealing';
  stageEl.classList.add('out');
  // 水果挂在 body 不在 stage 里，单独淡出
  fruitEls.forEach(el => { el.style.transition = 'opacity 400ms'; el.style.opacity = '0'; });
  setTimeout(() => {
    pickRound();
    paintRound();
    stageEl.classList.remove('out');
    playIntro();
    phase = 'play';
  }, 450);
}

// ===== 拖放 =====
function bindFruit(el) {
  let startX = 0, startY = 0, baseR = null, dragging = false, moved = false;

  el.addEventListener('pointerdown', (e) => {
    hideHint();
    if (phase === 'idle') { unlockAudio(); }
    if (phase !== 'play' && phase !== 'idle') return;
    if (el.classList.contains('in-basket')) return;
    dragging = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    baseR = el.getBoundingClientRect();
    el.setPointerCapture(e.pointerId);
    el.classList.remove('idle-sway', 'hop', 'slide-back');
    el.style.animation = 'none';
    el.style.transition = 'none';
    el.classList.add('lift');
    el.style.transform = 'scale(1.18)';
    fxPick();
    e.preventDefault();
  });

  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    // 阈值给到 14px：2 岁的手指按下去就会蹭，10px 太容易把「点一下」误判成「拖了一下」
    if (Math.abs(dx) + Math.abs(dy) > 14) moved = true;
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.18)';
  });

  function release(e) {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('lift');
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const b = basketEl.getBoundingClientRect();
    const pad = b.width * 0.32;   // 篮子命中区外扩——2 岁手不必精准
    const hit = cx > b.left - pad && cx < b.right + pad && cy > b.top - pad * 1.6 && cy < b.bottom + pad;

    if (moved && hit) {
      everDragged = true;
      assistMode = false;   // 会拖了就把帮忙收回去，让他接着自己拖
      missStreak = 0;
      el.style.transition = 'none';
      flyIn(el);
      return;
    }
    // 没送进篮子——「只点没拖」和「拖了没到」都算一次没成的尝试，攒够就替他送进去。
    // 只数「点」不数「拖偏」会留死路：娃反复戳同一个果子，每次都滑回原地，这一轮永远装不满。
    missStreak++;
    if (assistMode || missStreak >= (everDragged ? 4 : 3)) {
      if (!everDragged) assistMode = true;   // 还不会拖 → 之后碰一下就送进去
      missStreak = 0;
      flyIn(el);
      return;
    }
    if (moved) {
      // 拖了但没到篮子：滑回原位（无失败音，纯信息）
      el.style.transition = '';
      el.classList.add('slide-back');
      el.style.transform = 'scale(1)';
      setTimeout(() => { el.classList.remove('slide-back'); el.classList.add('idle-sway'); el.style.animation = ''; }, 460);
      return;
    }
    // 只点没拖：原地开心跳一下 + 噗声
    el.style.transition = 'none';
    el.style.transform = '';
    el.classList.remove('hop');
    el.style.animation = '';   // pointerdown 关掉的 animation 先还回来，否则 hop 关键帧被 inline none 压死、点了纹丝不动
    void el.offsetWidth;
    el.classList.add('hop');
    fxPick();
    setTimeout(() => { el.classList.remove('hop'); el.classList.add('idle-sway'); el.style.transition = ''; }, 500);
  }
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
}

// ===== 首戳解锁（iOS 音频需手势）=====
function unlockAudio() {
  if (phase !== 'idle') return;
  vEl.muted = true;
  vEl.play().then(() => { vEl.pause(); vEl.muted = false; }).catch(() => { vEl.muted = false; });
  playIntro();
  phase = 'play';
}

// 戳篮子 / 喇叭 = 重听引导（idle 时同首戳解锁）
function tapHorn() {
  hideHint();
  if (phase === 'idle') { unlockAudio(); return; }
  if (phase !== 'play') return;
  basketEl.classList.remove('bounce');
  void basketEl.offsetWidth;
  basketEl.classList.add('bounce');
  playIntro();
}
[askEl, basketEl].forEach(el => {
  el.addEventListener('click', () => tapHorn(), { passive: true });
  el.addEventListener('touchstart', (e) => {
    tapHorn();
    e.preventDefault();   // 抑制 iOS 合成 click，避免一戳触发两次
  }, { passive: false });
});

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === 'Escape') {
    if (!document.fullscreenElement) location.href = '../../';
    return;
  }
  if ((e.key === 'f' || e.key === 'F') && !document.fullscreenElement) {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    return;
  }
  e.preventDefault();
  hideHint();
  if (phase === 'idle') { unlockAudio(); return; }
  if (phase !== 'play') return;
  // 任意键：下一个水果自动飞进篮（键盘乱拍也能玩完整循环）
  const next = fruitEls.find(el => !el.classList.contains('in-basket'));
  if (next) flyIn(next);
});

let hintGone = false;
function hideHint() {
  if (hintGone) return;
  hintGone = true;
  const h = document.getElementById('hint');
  if (h) {
    h.classList.add('gone');
    setTimeout(() => h.remove(), 800);
  }
}

// 进入：摆好第一轮，静候首戳
pickRound();
paintRound();

// 空闲预载全部 mp3 进 HTTP 缓存——后续换 src 即播不等网络
setTimeout(() => {
  for (let n = 1; n <= 5; n++) fetch('audio/count_' + n + '.mp3').catch(() => {});
  FRUITS.forEach(({ key }) => {
    fetch('audio/intro_' + key + '.mp3').catch(() => {});
