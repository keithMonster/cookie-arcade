<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>找一找 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    background-color: #a8dcc0;
    transition: background-color 600ms ease;
  }
  /* 固定光晕：同 words——主色走 background-color 可过渡，质感走这层固定 overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 18%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%),
      radial-gradient(120% 90% at 50% 110%, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0) 55%);
    pointer-events: none;
    z-index: 0;
  }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4vmin;
  }

  /* 顶部问题区：大喇叭，戳它重听问题 */
  .ask {
    display: flex;
    align-items: center;
    gap: 2vmin;
    font-size: clamp(28px, 7vmin, 64px);
    font-weight: 800;
    color: rgba(50, 30, 18, 0.85);
    text-shadow: 0 3px 0 rgba(255, 255, 255, 0.7);
    cursor: pointer;
    min-height: 12vmin;
  }
  .ask .horn {
    font-size: clamp(36px, 9vmin, 80px);
    line-height: 1;
  }
  .ask.talking .horn { animation: horn-wiggle 600ms ease-in-out infinite; }
  @keyframes horn-wiggle {
    0%, 100% { transform: rotate(0)      scale(1); }
    25%      { transform: rotate(-8deg)  scale(1.1); }
    75%      { transform: rotate(8deg)   scale(1.1); }
  }

  .cards {
    display: flex;
    gap: 5vmin;
  }

  .pick {
    width: min(40vw, 44vh);
    aspect-ratio: 1;
    border-radius: 6vmin;
    background: rgba(255, 255, 255, 0.82);
    box-shadow:
      0 10px 24px rgba(60, 40, 20, 0.16),
      0 2px 4px rgba(60, 40, 20, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5vmin;
    cursor: pointer;
    will-change: transform;
  }
  .pick .em {
    font-size: 22vmin;
    line-height: 1.15;
    filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.08));
  }
  .pick .wd {
    font-size: clamp(22px, 5vmin, 48px);
    font-weight: 800;
    letter-spacing: 0.14em;
    color: rgba(50, 30, 18, 0.75);
  }

  /* 答对：胜利卡放大弹跳 */
  .pick.win { animation: pick-win 760ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pick-win {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.16) rotate(-3deg); }
    65%  { transform: scale(0.97) rotate(2deg); }
    100% { transform: scale(1.08); }
  }
  /* 答对后另一张安静退场 */
  .pick.lose { animation: pick-lose 500ms ease-in forwards; }
  @keyframes pick-lose {
    100% { transform: scale(0.82); opacity: 0.25; }
  }
  /* 答错：摇头 */
  .pick.nope { animation: pick-nope 480ms ease-in-out; }
  @keyframes pick-nope {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-4%) rotate(-2deg); }
    50%      { transform: translateX(4%)  rotate(2deg); }
    80%      { transform: translateX(-2%) rotate(-1deg); }
  }
  /* 错 2 次后：正确卡呼吸发光引导（永远以成功收尾）*/
  .pick.guide { animation: pick-guide 1.1s ease-in-out infinite; }
  @keyframes pick-guide {
    0%, 100% { transform: scale(1);    box-shadow: 0 10px 24px rgba(60, 40, 20, 0.16); }
    50%      { transform: scale(1.07); box-shadow: 0 0 0 14px rgba(255, 255, 255, 0.55), 0 10px 30px rgba(60, 40, 20, 0.2); }
  }

  /* 新一轮换题进出场 */
  .pick.deal-out { animation: pick-deal-out 300ms ease-in forwards; }
  .pick.deal-in  { animation: pick-deal-in  430ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes pick-deal-out {
    100% { transform: translateY(24%) scale(0.4); opacity: 0; }
  }
  @keyframes pick-deal-in {
    0%   { transform: translateY(30%) scale(0.3); opacity: 0; }
    60%  { transform: translateY(-4%) scale(1.08); opacity: 1; }
    100% { transform: translateY(0)   scale(1);    opacity: 1; }
  }

  /* 答对庆祝粒子 */
  .spark {
    position: fixed;
    font-size: 7vmin;
    line-height: 1;
    pointer-events: none;
    z-index: 50;
    animation: spark-fly 900ms ease-out forwards;
  }
  @keyframes spark-fly {
    0%   { transform: translate(0, 0)                                   scale(0.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.2); opacity: 0; }
  }

  #back {
    position: fixed; top: 0; right: 0;
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(80, 50, 30, 0.5);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
  }
  #back:active { color: rgba(80, 50, 30, 0.9); }

  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    letter-spacing: 0.3em;
    color: rgba(80, 50, 30, 0.5);
    pointer-events: none;
    transition: opacity 600ms;
    z-index: 100;
    white-space: nowrap;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="ask" id="ask"><span class="horn">📢</span><span id="askWord"></span></div>
  <div class="cards">
    <div class="pick" id="pick0"><div class="em"></div><div class="wd"></div></div>
    <div class="pick" id="pick1"><div class="em"></div><div class="wd"></div></div>
  </div>
</div>

<a id="back" href="../../">←</a>
<div id="hint">听一听，戳对的那张</div>

<script>
// ===== 词库（与 words 同源 29 词；theme 决定背景色）=====
const WORDS = [
  { emoji: '👨', word: '爸爸', key: 'baba',   theme: 0 },
  { emoji: '👩', word: '妈妈', key: 'mama',   theme: 0 },
  { emoji: '👶', word: '宝宝', key: 'baobao', theme: 0 },
  { emoji: '👴', word: '爷爷', key: 'yeye',   theme: 0 },
  { emoji: '👵', word: '奶奶', key: 'nainai', theme: 0 },
  { emoji: '🍎', word: '苹果', key: 'apple',      theme: 1 },
  { emoji: '🍌', word: '香蕉', key: 'banana',     theme: 1 },
  { emoji: '🍓', word: '草莓', key: 'strawberry', theme: 1 },
  { emoji: '🍇', word: '葡萄', key: 'grape',      theme: 1 },
  { emoji: '🍊', word: '橘子', key: 'orange',     theme: 1 },
  { emoji: '🍉', word: '西瓜', key: 'watermelon', theme: 1 },
  { emoji: '🍚', word: '米饭', key: 'rice',    theme: 2 },
  { emoji: '🥚', word: '鸡蛋', key: 'egg',     theme: 2 },
  { emoji: '🥛', word: '牛奶', key: 'milk',    theme: 2 },
  { emoji: '🍞', word: '面包', key: 'bread',   theme: 2 },
  { emoji: '🍜', word: '面条', key: 'noodle',  theme: 2 },
  { emoji: '🍪', word: '饼干', key: 'biscuit', theme: 2 },
  { emoji: '👀', word: '眼睛', key: 'eye',   theme: 3 },
  { emoji: '👂', word: '耳朵', key: 'ear',   theme: 3 },
  { emoji: '👃', word: '鼻子', key: 'nose',  theme: 3 },
  { emoji: '👄', word: '嘴巴', key: 'mouth', theme: 3 },
  { emoji: '✋', word: '小手', key: 'hand',  theme: 3 },
  { emoji: '🦶', word: '小脚', key: 'foot',  theme: 3 },
  { emoji: '☀️', word: '太阳', key: 'sun',     theme: 4 },
  { emoji: '🌙', word: '月亮', key: 'moon',    theme: 4 },
  { emoji: '⭐', word: '星星', key: 'star',    theme: 4 },
  { emoji: '🌈', word: '彩虹', key: 'rainbow', theme: 4 },
  { emoji: '🌸', word: '花',   key: 'flower',  theme: 4 },
  { emoji: '🌧️', word: '下雨', key: 'rain',    theme: 4 },
];
const THEMES = ['#ffc4d2', '#ffae86', '#ffd86b', '#a8dcc0', '#9ec8f0'];

// ===== 音频：单元素 + 换 src（iOS 解锁元素后，后续非手势链 play 才可靠）=====
// qEl 播问题（轮次开始自动播 = 手势链外，必须复用首戳解锁过的元素）
// yEl 播表扬（永远在 tap 手势内触发，顺带保持解锁）
const qEl = new Audio();
const yEl = new Audio();
qEl.preload = 'auto';
yEl.preload = 'auto';

// ===== DOM =====
const askEl = document.getElementById('ask');
const askWordEl = document.getElementById('askWord');
const picks = [document.getElementById('pick0'), document.getElementById('pick1')];

// ===== 状态机 =====
// idle = 进入后静候首戳（iOS 音频要手势解锁）；ask = 等答题；celebrate = 表扬中；dealing = 换题动画中
let phase = 'idle';
let target = null;        // 本轮正确词
let options = [];         // 两张卡的词
let wrongCount = 0;
let lastTargetKey = null;

function pickRound() {
  // 随机抽 2 个不同词，target 随机其一；避免连续两轮同一个 target
  let a, b;
  do { a = WORDS[Math.floor(Math.random() * WORDS.length)]; } while (a.key === lastTargetKey);
  do { b = WORDS[Math.floor(Math.random() * WORDS.length)]; } while (b.key === a.key);
  target = a;
  lastTargetKey = a.key;
  options = Math.random() < 0.5 ? [a, b] : [b, a];
  wrongCount = 0;
}

function paintRound() {
  options.forEach((w, i) => {
    picks[i].querySelector('.em').textContent = w.emoji;
    picks[i].querySelector('.wd').textContent = w.word;
    picks[i].className = 'pick';
  });
  askWordEl.textContent = target.word + '在哪里呀？';
  document.body.style.backgroundColor = THEMES[target.theme];
}

function playQuestion() {
  qEl.src = 'audio/q_' + target.key + '.mp3';
  qEl.currentTime = 0;
  askEl.classList.add('talking');
  qEl.play().catch(() => {});
}
qEl.addEventListener('ended', () => askEl.classList.remove('talking'));
qEl.addEventListener('error', () => askEl.classList.remove('talking'));

function burstSparks(fromEl) {
  const r = fromEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const EMOJIS = ['⭐', '✨', '🎉', '💛', '🌟'];
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = EMOJIS[i % EMOJIS.length];
    const ang = (Math.PI * 2 * i) / 8 + Math.random() * 0.6;
    const dist = 18 + Math.random() * 16;
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'vmin');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'vmin');
    s.style.setProperty('--rot', (Math.random() * 90 - 45) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}

function answer(i) {
  const w = options[i];
  if (w.key === target.key) {
    // 答对：胜利动画 + 表扬念两遍 + 粒子；表扬完换下一题
    phase = 'celebrate';
    askEl.classList.remove('talking');
    qEl.pause();
    picks[i].classList.add('win');
    picks[1 - i].className = 'pick lose';
    burstSparks(picks[i]);
    yEl.src = 'audio/y_' + target.key + '.mp3';
    yEl.currentTime = 0;
    // 表扬音频万一加载失败也要能进入下一轮（catch → 定时兜底）
    yEl.play().catch(() => setTimeout(nextRound, 1400));
  } else {
    // 答错：摇头 + 重播问题；错 2 次起正确卡呼吸发光引导——永远以成功收尾
    wrongCount++;
    const el = picks[i];
    el.classList.remove('nope');
    void el.offsetWidth;
    el.classList.add('nope');
    if (wrongCount >= 2) {
      picks[options.findIndex(o => o.key === target.key)].classList.add('guide');
    }
    playQuestion();
  }
}
yEl.addEventListener('ended', () => setTimeout(nextRound, 500));

function nextRound() {
  if (phase === 'dealing') return;
  phase = 'dealing';
  picks.forEach(p => { p.className = 'pick deal-out'; });
  setTimeout(() => {
    pickRound();
    paintRound();
    picks.forEach(p => { p.classList.add('deal-in'); });
    playQuestion();    // qEl 已被首戳解锁，换 src 自动播可靠
    setTimeout(() => {
      picks.forEach(p => { p.classList.remove('deal-in'); });
      phase = 'ask';
    }, 440);
  }, 310);
}

let hintGone = false;
function hideHint() {
  if (hintGone) return;
  hintGone = true;
  const h = document.getElementById('hint');
  if (h) {
    h.classList.add('gone');
    setTimeout(() => h.remove(), 800);
  }
}

// ===== 输入 =====
function tapCard(i) {
  hideHint();
  if (phase === 'idle') {
    // 首戳：手势内解锁两个音频元素，播本轮问题（不判对错——还没听到问题）
    yEl.muted = true;
    yEl.play().then(() => { yEl.pause(); yEl.muted = false; }).catch(() => { yEl.muted = false; });
    playQuestion();
    phase = 'ask';
    return;
  }
  if (phase !== 'ask') return;
  answer(i);
}

picks.forEach((p, i) => {
  p.addEventListener('click', () => tapCard(i), { passive: true });
  p.addEventListener('touchstart', (e) => {
    tapCard(i);
    e.preventDefault();   // 抑制 iOS 合成 click，避免一戳触发两次
  }, { passive: false });
});

// 戳喇叭/问题文字 = 重听一遍（idle 时同首戳解锁）
askEl.addEventListener('click', () => tapHorn(), { passive: true });
askEl.addEventListener('touchstart', (e) => {
  tapHorn();
  e.preventDefault();
}, { passive: false });
function tapHorn() {
  hideHint();
  if (phase === 'idle') { tapCard(-1); return; }   // i=-1 走不到 answer（phase 已转 ask）
  if (phase !== 'ask') return;
  playQuestion();
}

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === 'Escape') {
    if (!document.fullscreenElement) location.href = '../../';
    return;
  }
  if (e.key === 'f' || e.key === 'F') {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) {
      el.requestFullscreen().catch(() => {});
    }
    return;
  }
  e.preventDefault();
  if (e.key === 'ArrowLeft') { tapCard(0); return; }
  if (e.key === 'ArrowRight') { tapCard(1); return; }
  // 其他任意键（键盘乱拍）：随机选一张——50% 答对率也玩得下去，错了有引导
  tapCard(Math.floor(Math.random() * 2));
});

// 进入：摆好第一轮，静候首戳（iOS 音频需手势）
pickRound();
paintRound();
</script>
</body>
</html>
