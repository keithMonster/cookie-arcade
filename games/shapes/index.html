<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>送回家 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    background-color: #bfe3f2;
    transition: background-color 600ms ease;
  }
  /* 固定光晕：同 find/words——主色走 background-color 可过渡，质感走这层固定 overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 18%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%),
      radial-gradient(120% 90% at 50% 110%, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0) 55%);
    pointer-events: none;
    z-index: 0;
  }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vmin;
  }

  /* 顶部问题区：戳喇叭重听 */
  .ask {
    display: flex;
    align-items: center;
    gap: 2vmin;
    font-size: clamp(24px, 5.5vmin, 52px);
    font-weight: 800;
    color: rgba(50, 30, 18, 0.85);
    text-shadow: 0 3px 0 rgba(255, 255, 255, 0.7);
    cursor: pointer;
    min-height: 9vmin;
  }
  .ask .horn {
    font-size: clamp(32px, 7vmin, 64px);
    line-height: 1;
  }
  .ask.talking .horn { animation: horn-wiggle 600ms ease-in-out infinite; }
  @keyframes horn-wiggle {
    0%, 100% { transform: rotate(0)      scale(1); }
    25%      { transform: rotate(-8deg)  scale(1.1); }
    75%      { transform: rotate(8deg)   scale(1.1); }
  }

  /* ===== 房子：屋顶 + 墙 + 墙中央的形状洞 ===== */
  .house {
    display: flex;
    flex-direction: column;
    align-items: center;
    will-change: transform;
  }
  .roof {
    width: 46vmin;
    height: 13vmin;
    background: linear-gradient(180deg, #ef8468, #e06a4e);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    filter: drop-shadow(0 2px 3px rgba(60, 40, 20, 0.15));
  }
  .wall {
    width: 38vmin;
    height: 26vmin;
    background: linear-gradient(180deg, #fffaf0, #fdeed8);
    border-radius: 0 0 3vmin 3vmin;
    box-shadow:
      0 10px 24px rgba(60, 40, 20, 0.16),
      0 2px 4px rgba(60, 40, 20, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* 墙上两扇小圆窗装饰 */
  .wall::before, .wall::after {
    content: '';
    position: absolute;
    top: 3vmin;
    width: 4vmin;
    height: 4vmin;
    border-radius: 50%;
    background: #bfe0f5;
    box-shadow: inset 0 1px 3px rgba(60, 40, 20, 0.2);
  }
  .wall::before { left: 4vmin; }
  .wall::after  { right: 4vmin; }
  .hole {
    width: 17vmin;
    height: 17vmin;
  }
  .hole svg { width: 100%; height: 100%; display: block; overflow: visible; }
  /* 洞：虚线轮廓等着被填；答对后 JS 把 fill/stroke 换成实色 */
  .hole path {
    fill: rgba(60, 40, 20, 0.07);
    stroke: rgba(60, 40, 20, 0.35);
    stroke-width: 3;
    stroke-dasharray: 7 6;
    stroke-linejoin: round;
  }
  /* 答对入洞：房子欢快弹一下 */
  .house.happy { animation: house-happy 700ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes house-happy {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.08) rotate(-2deg); }
    65%  { transform: scale(0.98) rotate(1deg); }
    100% { transform: scale(1); }
  }

  .cards {
    display: flex;
    gap: 6vmin;
  }
  .pick {
    width: min(32vw, 30vh);
    aspect-ratio: 1;
    border-radius: 5vmin;
    background: rgba(255, 255, 255, 0.82);
    box-shadow:
      0 10px 24px rgba(60, 40, 20, 0.16),
      0 2px 4px rgba(60, 40, 20, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2vmin;
    cursor: pointer;
    will-change: transform;
  }
  .pick .shp {
    width: 62%;
    aspect-ratio: 1;
  }
  .pick .shp svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .pick .shp path {
    filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.08));
  }
  .pick .wd {
    font-size: clamp(18px, 4vmin, 40px);
    font-weight: 800;
    letter-spacing: 0.14em;
    color: rgba(50, 30, 18, 0.75);
  }

  /* 答对：胜利卡放大弹跳（形状本体克隆飞进洞）*/
  .pick.win { animation: pick-win 760ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pick-win {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.12) rotate(-3deg); }
    65%  { transform: scale(0.97) rotate(2deg); }
    100% { transform: scale(1.04); }
  }
  .pick.lose { animation: pick-lose 500ms ease-in forwards; }
  @keyframes pick-lose {
    100% { transform: scale(0.82); opacity: 0.25; }
  }
  /* 答错：摇头 */
  .pick.nope { animation: pick-nope 480ms ease-in-out; }
  @keyframes pick-nope {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-4%) rotate(-2deg); }
    50%      { transform: translateX(4%)  rotate(2deg); }
    80%      { transform: translateX(-2%) rotate(-1deg); }
  }
  /* 错 2 次后：正确卡呼吸发光引导（永远以成功收尾）*/
  .pick.guide { animation: pick-guide 1.1s ease-in-out infinite; }
  @keyframes pick-guide {
    0%, 100% { transform: scale(1);    box-shadow: 0 10px 24px rgba(60, 40, 20, 0.16); }
    50%      { transform: scale(1.07); box-shadow: 0 0 0 14px rgba(255, 255, 255, 0.55), 0 10px 30px rgba(60, 40, 20, 0.2); }
  }

  /* 新一轮进出场 */
  .pick.deal-out { animation: pick-deal-out 300ms ease-in forwards; }
  .pick.deal-in  { animation: pick-deal-in  430ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes pick-deal-out {
    100% { transform: translateY(24%) scale(0.4); opacity: 0; }
  }
  @keyframes pick-deal-in {
    0%   { transform: translateY(30%) scale(0.3); opacity: 0; }
    60%  { transform: translateY(-4%) scale(1.08); opacity: 1; }
    100% { transform: translateY(0)   scale(1);    opacity: 1; }
  }

  /* 飞进洞的克隆形状 */
  .flyer {
    position: fixed;
    z-index: 500;
    pointer-events: none;
    transition: transform 620ms cubic-bezier(0.5, 0, 0.3, 1.15);
    will-change: transform;
  }
  .flyer svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* 答对庆祝粒子 */
  .spark {
    position: fixed;
    font-size: 7vmin;
    line-height: 1;
    pointer-events: none;
    z-index: 600;
    animation: spark-fly 900ms ease-out forwards;
  }
  @keyframes spark-fly {
    0%   { transform: translate(0, 0)                                    scale(0.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.2); opacity: 0; }
  }

  #back {
    position: fixed; top: 0; right: 0;
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(80, 50, 30, 0.5);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
  }
  #back:active { color: rgba(80, 50, 30, 0.9); }

  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    letter-spacing: 0.3em;
    color: rgba(80, 50, 30, 0.5);
    pointer-events: none;
    transition: opacity 600ms;
    z-index: 100;
    white-space: nowrap;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="ask" id="ask"><span class="horn">📢</span><span id="askWord"></span></div>
  <div class="house" id="house">
    <div class="roof"></div>
    <div class="wall"><div class="hole" id="hole"></div></div>
  </div>
  <div class="cards">
    <div class="pick" id="pick0"><div class="shp"></div><div class="wd"></div></div>
    <div class="pick" id="pick1"><div class="shp"></div><div class="wd"></div></div>
  </div>
</div>

<a id="back" href="../../">←</a>
<div id="hint">戳一戳，送它回家</div>

<script>
// ===== 形状库：6 个基础形状，2 岁形状配对窗口（蒙氏嵌板同款维度）=====
// path 统一 viewBox 0 0 100 100；star/heart 与 keyboard 同源
const SHAPES = [
  { key: 'circle',   word: '圆形',   path: 'M50,8 A42,42 0 1,1 49.99,8 Z' },
  { key: 'square',   word: '方形',   path: 'M14,14 H86 V86 H14 Z' },
  { key: 'triangle', word: '三角形', path: 'M50,10 L92,86 L8,86 Z' },
  { key: 'star',     word: '星星',   path: 'M50,5 L61,38 L96,38 L68,59 L78,92 L50,72 L22,92 L32,59 L4,38 L39,38 Z' },
  { key: 'heart',    word: '爱心',   path: 'M50,85 C20,65 5,45 5,28 C5,15 15,5 28,5 C38,5 45,12 50,22 C55,12 62,5 72,5 C85,5 95,15 95,28 C95,45 80,65 50,85 Z' },
  { key: 'moon',     word: '月亮',   path: 'M62,6 A44,44 0 1,0 62,94 A36,36 0 1,1 62,6 Z' },
];
// 糖果色池：每轮给两张卡随机配色（形状认知不绑颜色，颜色只做趣味变量）
const COLORS = ['#ff6b81', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#b197fc'];
// 背景色跟随 target 形状轮换（同 find 的主题色语义）
const THEMES = ['#bfe3f2', '#ffd9c9', '#fde9ad', '#c9ecd3', '#ffd2dd', '#d8d2f5'];

function shapeSvg(shape, color) {
  return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="'
    + shape.path + '"' + (color ? ' fill="' + color + '"' : '') + '/></svg>';
}

// ===== 音频：单元素 + 换 src（iOS 解锁元素后，后续非手势链 play 才可靠）=====
const qEl = new Audio();
const yEl = new Audio();
qEl.preload = 'auto';
yEl.preload = 'auto';

// ===== DOM =====
const askEl = document.getElementById('ask');
const askWordEl = document.getElementById('askWord');
const houseEl = document.getElementById('house');
const holeEl = document.getElementById('hole');
const picks = [document.getElementById('pick0'), document.getElementById('pick1')];

// ===== 状态机（同 find）=====
// idle = 静候首戳解锁音频；ask = 等答题；celebrate = 表扬+飞入中；dealing = 换题动画中
let phase = 'idle';
let target = null;
let options = [];
let colors = [];
let wrongCount = 0;
let lastTargetKey = null;

function pickRound() {
  let a, b;
  do { a = SHAPES[Math.floor(Math.random() * SHAPES.length)]; } while (a.key === lastTargetKey);
  do { b = SHAPES[Math.floor(Math.random() * SHAPES.length)]; } while (b.key === a.key);
  target = a;
  lastTargetKey = a.key;
  options = Math.random() < 0.5 ? [a, b] : [b, a];
  // 两张卡颜色不同（互相区分），target 卡的颜色 = 飞入洞后的颜色
  const ci = Math.floor(Math.random() * COLORS.length);
  let cj;
  do { cj = Math.floor(Math.random() * COLORS.length); } while (cj === ci);
  colors = options[0].key === target.key ? [COLORS[ci], COLORS[cj]] : [COLORS[cj], COLORS[ci]];
  wrongCount = 0;
}

function paintRound() {
  options.forEach((s, i) => {
    picks[i].querySelector('.shp').innerHTML = shapeSvg(s, colors[i]);
    picks[i].querySelector('.wd').textContent = s.word;
    picks[i].className = 'pick';
  });
  holeEl.innerHTML = shapeSvg(target, null);   // 虚线空洞（CSS 接管 fill/stroke）
  askWordEl.textContent = target.word + '的家！';
  document.body.style.backgroundColor = THEMES[SHAPES.indexOf(target)];
  yEl.src = 'audio/y_' + target.key + '.mp3';  // 表扬提前挂载，答对瞬间即播
}

function playQuestion() {
  qEl.src = 'audio/q_' + target.key + '.mp3';
  qEl.currentTime = 0;
  askEl.classList.add('talking');
  qEl.play().catch(() => {});
}
qEl.addEventListener('ended', () => askEl.classList.remove('talking'));
qEl.addEventListener('error', () => askEl.classList.remove('talking'));

function burstSparks(fromEl) {
  const r = fromEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const EMOJIS = ['⭐', '✨', '🎉', '💛', '🌟'];
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = EMOJIS[i % EMOJIS.length];
    const ang = (Math.PI * 2 * i) / 8 + Math.random() * 0.6;
    const dist = 18 + Math.random() * 16;
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'vmin');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'vmin');
    s.style.setProperty('--rot', (Math.random() * 90 - 45) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}

// 答对：把卡上的形状克隆出来飞进洞，到位后洞变实色
function flyIntoHole(fromPick, color) {
  const src = fromPick.querySelector('.shp');
  const a = src.getBoundingClientRect();
  const b = holeEl.getBoundingClientRect();
  const fl = document.createElement('div');
  fl.className = 'flyer';
  fl.style.left = a.left + 'px';
  fl.style.top = a.top + 'px';
  fl.style.width = a.width + 'px';
  fl.style.height = a.height + 'px';
  fl.innerHTML = shapeSvg(target, color);
  document.body.appendChild(fl);
  // 强制 reflow 后再设目标 transform，确保 transition 生效
  void fl.offsetWidth;
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  const dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  fl.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + (b.width / a.width) + ')';
  setTimeout(() => {
    // 入洞：洞里的 path 变实色，房子欢快弹一下
    const p = holeEl.querySelector('path');
    if (p) {
      p.style.fill = color;
      p.style.stroke = 'none';
    }
    houseEl.classList.remove('happy');
    void houseEl.offsetWidth;
    houseEl.classList.add('happy');
    burstSparks(houseEl);
    fl.remove();
  }, 640);
}

function answer(i) {
  const s = options[i];
  if (s.key === target.key) {
    phase = 'celebrate';
    askEl.classList.remove('talking');
    qEl.pause();
    picks[i].classList.add('win');
    picks[1 - i].className = 'pick lose';
    flyIntoHole(picks[i], colors[i]);
    yEl.currentTime = 0;
    yEl.play().catch(() => setTimeout(nextRound, 1800));
  } else {
    wrongCount++;
    const el = picks[i];
    el.classList.remove('nope');
    void el.offsetWidth;
    el.classList.add('nope');
    if (wrongCount >= 2) {
      picks[options.findIndex(o => o.key === target.key)].classList.add('guide');
    }
    playQuestion();
  }
}
// 表扬念完再多停 700ms——让「形状嵌在洞里」的完成画面多留一会
yEl.addEventListener('ended', () => setTimeout(nextRound, 700));
yEl.addEventListener('error', () => { if (phase === 'celebrate') setTimeout(nextRound, 1200); });

function nextRound() {
  if (phase === 'dealing') return;
  phase = 'dealing';
  picks.forEach(p => { p.className = 'pick deal-out'; });
  setTimeout(() => {
    pickRound();
    paintRound();
    picks.forEach(p => { p.classList.add('deal-in'); });
    playQuestion();
    setTimeout(() => {
      picks.forEach(p => { p.classList.remove('deal-in'); });
      phase = 'ask';
    }, 440);
  }, 310);
}

let hintGone = false;
function hideHint() {
  if (hintGone) return;
  hintGone = true;
  const h = document.getElementById('hint');
  if (h) {
    h.classList.add('gone');
    setTimeout(() => h.remove(), 800);
  }
}

// ===== 输入 =====
function tapCard(i) {
  hideHint();
  if (phase === 'idle') {
    // 首戳：手势内解锁两个音频元素，播本轮问题
    yEl.muted = true;
    yEl.play().then(() => { yEl.pause(); yEl.muted = false; }).catch(() => { yEl.muted = false; });
    playQuestion();
    phase = 'ask';
    return;
  }
  if (phase !== 'ask') return;
  answer(i);
}

picks.forEach((p, i) => {
  p.addEventListener('click', () => tapCard(i), { passive: true });
  p.addEventListener('touchstart', (e) => {
    tapCard(i);
    e.preventDefault();   // 抑制 iOS 合成 click，避免一戳触发两次
  }, { passive: false });
});

// 戳喇叭/房子 = 重听一遍（idle 时同首戳解锁）
function tapHorn() {
  hideHint();
  if (phase === 'idle') { tapCard(-1); return; }   // i=-1 走不到 answer（phase 已转 ask）
  if (phase !== 'ask') return;
  playQuestion();
}
[askEl, houseEl].forEach(el => {
  el.addEventListener('click', () => tapHorn(), { passive: true });
  el.addEventListener('touchstart', (e) => {
    tapHorn();
    e.preventDefault();
  }, { passive: false });
});

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === 'Escape') {
    if (!document.fullscreenElement) location.href = '../../';
    return;
  }
  if (e.key === 'f' || e.key === 'F') {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) {
      el.requestFullscreen().catch(() => {});
    }
    return;
  }
  e.preventDefault();
  if (e.key === 'ArrowLeft') { tapCard(0); return; }
  if (e.key === 'ArrowRight') { tapCard(1); return; }
  // 其他任意键（键盘乱拍）：随机选一张——50% 答对率也玩得下去，错了有引导
  tapCard(Math.floor(Math.random() * 2));
});

// 进入：摆好第一轮，静候首戳（iOS 音频需手势）
pickRound();
paintRound();

// 空闲预载全部 12 个 mp3 进 HTTP 缓存——后续换 src 即播不等网络
setTimeout(() => {
  SHAPES.forEach(({ key }) => {
    fetch(`audio/q_${key}.mp3`).catch(() => {});
    fetch(`audio/y_${key}.mp3`).catch(() => {});
  });
}, 600);
</script>
</body>
</html>
