<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#b9dfdf"><title>积木小镇 · Cookie</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}body{background:#b9dfdf;font-family:ui-rounded,system-ui,sans-serif}button,a{touch-action:none}button{border:0;padding:0;background:none;cursor:pointer;color:inherit}#back{position:fixed;z-index:50;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:48px;height:48px;border-radius:50%;background:#fff9e9d9;display:grid;place-items:center;color:#44645e;text-decoration:none;font-size:32px}#scene{position:absolute;inset:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));max-width:1000px;margin:auto;overflow:hidden;border-radius:32px;background:linear-gradient(#b9dfdf 0%,#d6ebe1 58%,#a9c993 58%,#a9c993 78%,#ead7ad 78%)}#scene:before{content:'';position:absolute;left:-10%;top:51%;width:120%;height:22%;background:#bdd5a4;border-radius:50% 50% 0 0;pointer-events:none}.sky{position:absolute;z-index:4;min-width:56px;min-height:56px}#sun{left:19%;top:5%;width:64px;height:64px;border-radius:50%;background:#f1be61;box-shadow:0 0 0 10px #f4cc7a55}.face:before{content:'';position:absolute;width:5px;height:7px;background:#6f573c;border-radius:50%;left:32%;top:40%;box-shadow:18px 0 #6f573c}.face:after{content:'';position:absolute;left:42%;top:57%;width:14px;height:7px;border-bottom:3px solid #6f573c;border-radius:50%}#cloud{right:13%;top:10%;width:96px;height:56px;background:#fff8e8;border-radius:50px;box-shadow:0 5px 0 #9fcac655}#cloud:before{content:'';position:absolute;left:18px;top:-18px;width:46px;height:46px;border-radius:50%;background:inherit}#cloud:after{content:'';position:absolute;right:12px;top:-8px;width:40px;height:40px;border-radius:50%;background:inherit}#bird{left:47%;top:19%;width:56px;height:56px}#bird i{position:absolute;inset:14px 10px;background:#d78165;border-radius:60% 60% 50% 50%;transform:rotate(-12deg)}#bird i:after{content:'';position:absolute;right:-9px;top:6px;border-left:12px solid #e9b15f;border-top:6px solid transparent;border-bottom:6px solid transparent}#bird i:before{content:'';position:absolute;right:8px;top:6px;width:4px;height:4px;background:#3e544a;border-radius:50%}#build{position:absolute;left:12%;right:12%;top:28%;bottom:31%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;z-index:5}.column{position:relative;min-width:0;border-bottom:7px solid #8d9e69;border-radius:8px;background:linear-gradient(0deg,#fff8da12,transparent 30%)}.column:before{content:'';position:absolute;left:20%;right:20%;bottom:8px;height:8px;border-radius:50%;background:#6e925133;pointer-events:none}.column.aim{background:#fff9e855;box-shadow:inset 0 0 0 3px #fff5cf}.piece{position:absolute;left:3%;width:94%;height:31%;z-index:5;filter:drop-shadow(0 4px 0 #6a62452e);border-radius:8px}.piece.held{opacity:.35}.shape{display:block;position:absolute;inset:0;border-radius:9px;background:#dc8c69;box-shadow:inset 0 -7px #b7704d,inset 0 3px #f0b58a;pointer-events:none}.shape.block:after{content:'';position:absolute;inset:22% 20%;border-radius:4px;background:#f2bc8d;box-shadow:inset 0 3px #bb795850}.shape.arch{background:#7bb0b2;box-shadow:inset 0 3px #a6d4cd;clip-path:polygon(0 0,100% 0,100% 100%,78% 100%,78% 58%,72% 42%,61% 33%,39% 33%,28% 42%,22% 58%,22% 100%,0 100%)}.shape.roof{background:#e5b756;box-shadow:none;clip-path:polygon(50% 20%,100% 85%,100% 100%,0 100%,0 85%)}#road{position:absolute;left:0;right:0;top:65%;height:13%;background:#ddc89d;border-block:5px solid #e9d6af;z-index:2}#road:after{content:'';position:absolute;left:3%;right:3%;top:62%;border-top:4px dashed #f8eac9}#car{position:absolute;left:1%;bottom:29%;width:10%;height:8%;min-width:40px;min-height:40px;z-index:3;transition:left .48s linear;filter:drop-shadow(0 4px 1px #5e725a22)}.car-body{position:absolute;left:2%;right:2%;top:35%;bottom:15%;background:#d86b51;border-radius:12px 16px 7px 7px;box-shadow:inset 0 -5px #b65543}.car-body:before{content:'';position:absolute;left:20%;right:25%;height:90%;bottom:70%;background:#d86b51;border-radius:10px 16px 0 0}.car-body:after{content:'';position:absolute;left:30%;right:36%;height:60%;bottom:85%;background:#d8ece5;border-radius:5px 8px 0 0}.wheel{position:absolute;bottom:0;width:24%;aspect-ratio:1;border-radius:50%;background:#45635b;border:4px solid #45635b;box-shadow:inset 0 0 0 4px #e4d9b5}.wheel.a{left:12%}.wheel.b{right:12%}#tray{position:absolute;left:5%;right:5%;bottom:3%;height:17%;display:flex;align-items:center;justify-content:space-around;gap:12px;z-index:12}.material,#basket{position:relative;width:20%;height:90%;min-height:56px;max-width:120px;border-radius:18px;background:#f6e8c8;box-shadow:0 5px 0 #c4a879,0 8px 14px #997d3a18}.material .shape{inset:16% 18%}.material.selected{outline:4px solid #fffaf0;outline-offset:4px}#basket{background:transparent;box-shadow:none}#basket:before{content:'';position:absolute;inset:25% 8% 6%;background:repeating-linear-gradient(0deg,#ae8054 0 8px,#c99c6b 8px 15px);border:5px solid #9a7350;border-radius:8px 8px 24px 24px}#basket:after{content:'';position:absolute;left:28%;right:28%;top:9%;height:34%;border:6px solid #9a7350;border-radius:50%;z-index:-1}.ghost{position:fixed;z-index:40;pointer-events:none;opacity:.95;filter:drop-shadow(0 10px 8px #45635b44);transform:translate(-50%,-50%) rotate(-4deg)}.hint{animation:hint 1s ease-in-out infinite}.pop{animation:pop .42s ease-out}.wobble{animation:wobble .4s ease-in-out}.spark{position:fixed;pointer-events:none;width:12px;height:12px;border-radius:50%;background:#fff4bd;z-index:45;animation:spark .7s ease-out forwards}@keyframes pop{50%{filter:brightness(1.13);translate:0 -8px}}@keyframes wobble{25%{translate:-5px 0}75%{translate:5px 0}}@keyframes hint{50%{filter:brightness(1.25);box-shadow:0 0 0 4px #fff2a0}}@keyframes spark{to{translate:var(--dx) -65px;opacity:0;scale:.2}}@media(max-aspect-ratio:3/4){#build{left:16%;right:0;top:29%;bottom:33%;gap:3px}#car{width:12%;bottom:31%}#road{top:63%}#tray{left:3%;right:3%;height:17%;gap:8px}.material .shape{inset:20% 12%}#sun{left:24%;top:7%;width:56px;height:56px}#cloud{right:8%;top:15%;width:80px}#bird{left:43%;top:21%}}@media(max-height:480px){#build{top:18%;bottom:30%}#tray{height:19%;bottom:2%}#sun{top:5%;width:48px;height:48px}#cloud{top:8%;height:40px}#bird{top:6%}}@media(prefers-reduced-motion:reduce){.pop,.wobble,.hint{animation-duration:.1s}#car{transition-duration:.01s}}
#car{z-index:9;height:48px;width:14%;min-width:56px;max-width:90px}.car-body{left:12%;right:12%}.wheel.a{left:19%}.wheel.b{right:19%}.shape.arch{clip-path:polygon(0 0,100% 0,100% 100%,86% 100%,86% 58%,79% 42%,65% 30%,35% 30%,21% 42%,14% 58%,14% 100%,0 100%)}

/* 场景按可用空间排布；物件只按同一单位等比缩放。 */
#scene{background:linear-gradient(#c1e1df 0%,#d9e9dc 70%,#b5ce9b 70%,#b5ce9b 100%);border-radius:24px}
#scene:before{top:calc(var(--floor) - 40px);height:72px}
#build{left:var(--build-left);right:auto;top:calc(var(--floor) - 3 * var(--unit));bottom:auto;width:calc(5 * var(--unit) + 16px);height:calc(3 * var(--unit));grid-template-columns:repeat(5,var(--unit));gap:4px}
.column{border:0;border-radius:8px;background:none}
.column:before{left:8%;right:8%;bottom:-6px;height:8px}
.piece{left:0;width:var(--unit);height:var(--unit);border-radius:8px;filter:drop-shadow(0 3px 0 #6a62452e)}
.shape{border-radius:8px}
.shape.block{box-shadow:inset 0 -5px #b7704d,inset 0 3px #f0b58a}
.shape.block:after{inset:22%;border-radius:5px}
#road{top:calc(var(--floor) - 4px);height:40px;border-width:3px}
#road:after{top:67%;border-width:3px}
#car{top:calc(var(--floor) - 38px);bottom:auto;width:var(--car-hit);height:44px;min-width:44px;min-height:44px;max-width:none;z-index:9}
.car-art{position:absolute;left:50%;bottom:0;width:var(--car-width);height:calc(var(--car-width) * .65);transform:translateX(-50%);pointer-events:none}
.car-art *{pointer-events:none}
.wheel{border:2px solid #45635b;box-shadow:inset 0 0 0 2px #e4d9b5}
#tray{left:50%;right:auto;top:calc(var(--floor) + 48px);bottom:auto;transform:translateX(-50%);width:calc(4 * var(--control) + 24px);height:var(--control);gap:8px}
.material,#basket{flex:none;width:var(--control);height:var(--control);min-height:0;max-width:none;border-radius:16px}
.material .shape{inset:18%}
#basket:before{inset:28% 12% 6%}
#basket:after{left:30%;right:30%;top:13%;height:35%;z-index:0}
.sky{min-width:44px;min-height:44px}
#sun{left:10%;top:var(--sky-top);width:48px;height:48px}
#cloud{right:8%;top:calc(var(--sky-top) + 12px);width:80px;height:44px}
#cloud:before{top:-10px;width:40px;height:40px}
#cloud:after{top:-4px;width:36px;height:36px}
#bird{left:46%;top:var(--sky-top);width:44px;height:44px}
</style></head><body>
<a id="back" href="../../" aria-label="返回游戏台">‹</a>
<main id="scene" aria-label="积木小镇"><button id="sun" class="sky face" aria-label="太阳"></button><button id="cloud" class="sky" aria-label="云"></button><button id="bird" class="sky" aria-label="小鸟"><i></i></button><div id="road"></div><div id="build"></div><button id="car" aria-label="开小车"><span class="car-art"><span class="car-body"></span><i class="wheel a"></i><i class="wheel b"></i></span></button><div id="tray"><button class="material" data-kind="block" aria-label="方积木"><i class="shape block"></i></button><button class="material" data-kind="arch" aria-label="拱门"><i class="shape arch"></i></button><button class="material" data-kind="roof" aria-label="屋顶"><i class="shape roof"></i></button><button id="basket" aria-label="收回积木"></button></div></main>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const kinds=['block','arch','roof'],key='cookie-town-v1',pointers=new Map();
let columns=load(),selected=null,misses=0,hintReason=null,hintColumn=null,carPhase='idle',carColumn=-1,carTimer=0,voiceTimer=0,audioContext=null,lastTone=0,introduced=false;
let parkingX=0;
const voice=new Audio('audio/intro.mp3');voice.volume=.65;voice.preload='auto';
function layoutScene(){
 const scene=$('#scene'),style=getComputedStyle(scene),w=scene.clientWidth;
 const available=innerHeight-parseFloat(style.top)-parseFloat(style.bottom);
 const control=Math.floor(Math.min(88,Math.max(64,available*.16),(w-36)/4));
 const unit=Math.floor(Math.min(100,(w-32)/5.9,(available-control-92)/3));
 const height=Math.min(available,3*unit+control+160),floor=height-control-60;
 const carWidth=unit*.90,carHit=Math.max(44,carWidth+8);
 const buildLeft=Math.max(carHit+8,(w-5*unit-16)/2);
 parkingX=buildLeft-carHit-8;scene.style.height=`${height}px`;
 const car=$('#car');car.style.transition='none';car.style.left=`${parkingX}px`;void car.offsetWidth;car.style.transition='';
 for(const [name,value] of Object.entries({'unit':unit,'floor':floor,'control':control,'build-left':buildLeft,'car-width':carWidth,'car-hit':carHit,'sky-top':Math.max(4,Math.min(24,floor-3*unit-56))}))scene.style.setProperty('--'+name,`${value}px`);
}
function load(){try{const s=JSON.parse(localStorage.getItem(key));if(s?.schema===1&&Array.isArray(s.columns)&&s.columns.length===5&&s.columns.every(c=>Array.isArray(c)&&c.length<=3&&c.every((v,i)=>kinds.includes(v)&&(v!=='roof'||i===c.length-1))))return s.columns;}catch{}return Array.from({length:5},()=>[]);}
function save(){try{localStorage.setItem(key,JSON.stringify({schema:1,columns}));}catch{}}
function tone(f=520){if(performance.now()-lastTone<60)return;lastTone=performance.now();try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(()=>{});const o=audioContext.createOscillator(),g=audioContext.createGain();o.frequency.setValueAtTime(f,audioContext.currentTime);o.frequency.exponentialRampToValueAtTime(f*.65,audioContext.currentTime+.15);g.gain.setValueAtTime(.08,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.2);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.22);}catch{}}
function say(name){if(document.hidden)return;clearTimeout(voiceTimer);voice.pause();voice.src=`audio/${name}.mp3`;voice.play().catch(()=>{});voiceTimer=setTimeout(()=>voice.pause(),6000);}
function animate(el,name='pop'){if(!el)return;el.classList.remove(name);void el.offsetWidth;el.classList.add(name);}
function feedback(el){animate(el);tone();if(!introduced){introduced=true;say('intro');}}
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<6;i++){const p=document.createElement('i');p.className='spark';p.style.left=`${r.x+r.width/2}px`;p.style.top=`${r.y+r.height/2}px`;p.style.setProperty('--dx',`${(i-2.5)*18}px`);document.body.append(p);setTimeout(()=>p.remove(),750);}}
function locked(col,except){return [...pointers.values()].some(p=>p!==except&&p.source?.col===col);}
function clearHints(){hintReason=null;hintColumn=null;$$('.hint').forEach(el=>el.classList.remove('hint'));}
function hint(){
 $$('.hint').forEach(el=>el.classList.remove('hint'));
 if(hintReason==='blocked'&&Number.isInteger(hintColumn)){$(`[data-column="${hintColumn}"]`)?.classList.add('hint');return;}
 if(hintReason==='top'&&Number.isInteger(hintColumn)){
  $(`.piece[data-col="${hintColumn}"][data-row="${columns[hintColumn].length-1}"]`)?.classList.add('hint');return;
 }
 let any=false;columns.forEach((c,i)=>{if(c.length<3&&c.at(-1)!=='roof'&&!locked(i)){$(`[data-column="${i}"]`).classList.add('hint');any=true;}});
 if(!any){$$('.piece').filter(el=>+el.dataset.row===columns[+el.dataset.col].length-1).forEach(el=>el.classList.add('hint'));$('#basket').classList.add('hint');}
}
function miss(el,name){misses++;hintReason=name;hintColumn=el?.dataset.col===undefined?null:Number(el.dataset.col);animate(el,'wobble');tone(270);say(name);if(misses>=2)hint();}
function render(){
 $('#build').innerHTML=columns.map((c,i)=>`<div class="column" data-column="${i}" data-col="${i}" role="button" aria-label="搭建位置"><span></span>${c.map((kind,row)=>`<button class="piece ${locked(i)?'held':''}" data-piece="${kind}" data-col="${i}" data-row="${row}" style="bottom:calc(${row} * var(--unit))" aria-label="${kind==='block'?'方积木':kind==='arch'?'拱门':'屋顶'}"><i class="shape ${kind}"></i></button>`).join('')}</div>`).join('');
 $$('.material').forEach(el=>el.classList.toggle('selected',selected?.kind===el.dataset.kind&&!selected.source));
 if(selected?.source){const el=$(`.piece[data-col="${selected.source.col}"][data-row="${selected.source.row}"]`);if(el)el.classList.add('hint');}
 if(hintReason&&(misses>=2||hintReason==='blocked'))hint();
}
function stopCar(){clearTimeout(carTimer);carPhase='idle';carColumn=-1;$('#car').style.left=`${parkingX}px`;}
// 源列直到释放都不变；任何提交都在这里再次核对源块和目的列。
function commit(item,dest){
 const source=item.source;
 if(source&&(locked(source.col,item)||source.row!==columns[source.col].length-1||columns[source.col][source.row]!==item.kind))return false;
 if(dest===null){if(source){columns[source.col].pop();finish('remove');return true;}tone(350);return false;}
 if(!Number.isInteger(dest)||dest<0||dest>4)return false;
 if(source?.col===dest){tone(420);return false;}
 const c=columns[dest],target=$(`[data-column="${dest}"]`);
 if(locked(dest,item)){miss(target,'release');return false;}
 if(c.length>=3){miss(target,'full');return false;}
 if(c.at(-1)==='roof'){miss(target,'roof_top');return false;}
 if(source)columns[source.col].pop();c.push(item.kind);finish('placed');burst($(`[data-column="${dest}"]`));return true;
}
function finish(name){stopCar();selected=null;misses=0;clearHints();save();render();tone(name==='remove'?380:720);say(name);}
function drive(){
 if([...pointers.values()].some(p=>p.kind)){animate($('#car'),'wobble');tone(320);say('release');return;}
 if(carPhase==='drive'||carPhase==='arrived'){feedback($('#car'));return;}
 selected=null;render();clearHints();stopCar();carPhase='drive';say('drive');stepCar();
}
function stepCar(){
 if(carPhase!=='drive')return;
 const next=carColumn+1;
 if(next===5){$('#car').style.left=`${Math.max(0,$('#scene').clientWidth-$('#car').offsetWidth-8)}px`;carPhase='arrived';say('arrived');burst($('#car'));carTimer=setTimeout(stopCar,1600);return;}
 const bottom=columns[next][0];
 if(bottom&&bottom!=='arch'){carPhase='blocked';misses++;hintReason='blocked';hintColumn=next;tone(250);say('blocked');hint();animate($('#car'),'wobble');return;}
 const s=$('#scene').getBoundingClientRect(),c=$(`[data-column="${next}"]`).getBoundingClientRect(),w=$('#car').getBoundingClientRect().width;
 $('#car').style.left=`${(c.x+c.width/2-s.x-w/2)/s.width*100}%`;carColumn=next;carTimer=setTimeout(stepCar,570);
}
function choose(item){if(item.source&&locked(item.source.col)){say('release');return;}stopCar();selected=selected&&selected.kind===item.kind&&selected.source?.col===item.source?.col?null:item;render();say(item.kind);}
function tap(target){
 const material=target.closest('[data-kind]'),piece=target.closest('[data-piece]'),col=target.closest('[data-column]');
 if(material){choose({kind:material.dataset.kind,source:null});return;}
 if(piece){const i=+piece.dataset.col,row=+piece.dataset.row;if(selected){commit(selected,i);return;}if(row!==columns[i].length-1){miss(piece,'top');return;}choose({kind:piece.dataset.piece,source:{col:i,row}});return;}
 if(col){if(selected)commit(selected,+col.dataset.column);else{say('place');animate(col);}return;}
 if(target.closest('#basket')){if(selected)commit(selected,null);else{burst($('#basket'));say('remove');}return;}
 if(target.closest('#car')){drive();return;}
 const sky=target.closest('.sky');if(sky){burst(sky);if(sky.id==='bird')say('hello');else tone(sky.id==='sun'?760:370);}
}
function destination(x,y){const b=$('#basket').getBoundingClientRect();if(x>=b.left&&x<=b.right&&y>=b.top&&y<=b.bottom)return null;const el=document.elementFromPoint(x,y)?.closest('[data-column]');return el?+el.dataset.column:undefined;}
function clearPointer(id){const p=pointers.get(id);if(!p)return;p.ghost?.remove();pointers.delete(id);try{if($('#scene').hasPointerCapture(id))$('#scene').releasePointerCapture(id);}catch{}return p;}
function down(e){
 if(e.target.closest('#back'))return;e.preventDefault();
 const target=e.target.closest('button,[data-column]')||$('#scene');feedback(target);
 const material=target.closest('[data-kind]'),piece=target.closest('[data-piece]');let kind=null,source=null;
 if(material)kind=material.dataset.kind;
 if(piece){const col=+piece.dataset.col,row=+piece.dataset.row;if(locked(col)){say('release');return;}if(row!==columns[col].length-1){if(!selected){miss(piece,'top');return;}}else{kind=piece.dataset.piece;source={col,row};}}
 if(kind)stopCar();
 const p={target,kind,source,x:e.clientX,y:e.clientY,moved:false,ghost:null};pointers.set(e.pointerId,p);
 $('#scene').setPointerCapture(e.pointerId);
 if(kind){const r=(piece||material).getBoundingClientRect();const unit=parseFloat(getComputedStyle($('#scene')).getPropertyValue('--unit'));p.width=unit;p.height=unit;}
}
function move(e){const p=pointers.get(e.pointerId);if(!p)return;e.preventDefault();if(Math.hypot(e.clientX-p.x,e.clientY-p.y)>8)p.moved=true;if(!p.kind||!p.moved)return;
 if(!p.ghost){selected=null;p.ghost=document.createElement('div');p.ghost.className='ghost';p.ghost.style.width=`${p.width}px`;p.ghost.style.height=`${p.height}px`;p.ghost.innerHTML=`<i class="shape ${p.kind}"></i>`;document.body.append(p.ghost);render();}
 p.ghost.style.left=`${e.clientX}px`;p.ghost.style.top=`${e.clientY}px`;
 $$('.aim').forEach(el=>el.classList.remove('aim'));const dest=destination(e.clientX,e.clientY);if(Number.isInteger(dest))$(`[data-column="${dest}"]`).classList.add('aim');
}
function up(e){const p=clearPointer(e.pointerId);if(!p)return;e.preventDefault();$$('.aim').forEach(el=>el.classList.remove('aim'));
 if(p.kind&&p.moved){const dest=destination(e.clientX,e.clientY);if(dest===undefined){miss($('#basket'),'place');}else commit(p,dest);render();return;}
 if(!p.moved){tap(p.target);render();}
}
function cancel(id){const p=clearPointer(id);if(p){selected=null;render();}$$('.aim').forEach(el=>el.classList.remove('aim'));}
function cleanup(){[...pointers.keys()].forEach(id=>clearPointer(id));selected=null;stopCar();voice.pause();clearTimeout(voiceTimer);clearHints();render();}
$('#scene').addEventListener('pointerdown',down);$('#scene').addEventListener('pointermove',move);$('#scene').addEventListener('pointerup',up);$('#scene').addEventListener('pointercancel',e=>cancel(e.pointerId));$('#scene').addEventListener('lostpointercapture',e=>cancel(e.pointerId));
window.addEventListener('blur',cleanup);window.addEventListener('pagehide',cleanup);window.addEventListener('resize',()=>{layoutScene();cleanup();});document.addEventListener('visibilitychange',()=>{if(document.hidden)cleanup();});document.addEventListener('gesturestart',e=>e.preventDefault());
window.townDebug=()=>({columns:columns.map(c=>c.slice()),held:[...pointers.values()].filter(p=>p.kind).length,selected,carPhase,carColumn,misses});layoutScene();stopCar();render();
</script></body></html>
