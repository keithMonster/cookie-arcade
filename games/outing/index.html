<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>出门喽 · Cookie's Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    /* 早晨的家：亮一档的奶油墙 + 木地板（与 helper 的午后同族不同时辰）*/
    background: linear-gradient(180deg, #fff8ec 0%, #ffeed5 66%, #e0b585 66%, #cb9760 100%);
  }
  /* 晨光光晕：质感走这层 overlay，不抢注意力 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(110% 80% at 78% 6%, rgba(255, 250, 226, 0.9), rgba(255, 255, 255, 0) 60%),
      radial-gradient(120% 90% at 50% 112%, rgba(90, 50, 10, 0.16), rgba(0, 0, 0, 0) 58%);
    pointer-events: none;
    z-index: 0;
  }

  /* 右侧那扇门：小车最后就是往它那儿开出去的（纯装饰不可点）*/
  .door {
    position: fixed;
    right: 0;
    bottom: 0;
    width: 11vmin;
    height: 36vmin;
    border-radius: 7vmin 0 0 0;
    background: linear-gradient(100deg, #c98a4e, #a96c34);
    box-shadow: inset 0.8vmin 0 0 rgba(255, 255, 255, 0.28), -1.2vmin 0 2.4vmin rgba(90, 50, 10, 0.18);
    z-index: 1;
    pointer-events: none;
  }
  .door::after {
    content: '';
    position: absolute;
    left: 2.2vmin;
    top: 52%;
    width: 1.8vmin;
    height: 1.8vmin;
    border-radius: 50%;
    background: #ffe08a;
    box-shadow: 0 0 0 0.4vmin rgba(120, 70, 20, 0.25);
  }
  /* 出门的一刻门口透进外面的光 */
  .door.open { background: linear-gradient(100deg, #fff4cd, #ffe08a); }

  /* 舞台：inset 用 safe-area 真正缩进（padding 缩不动绝对定位的孩子——
     它们的包含块是 padding box，加 padding 不挪原点，喇叭会被顶到屏幕外）。
     八件东西排左右两列各四行：横排用 max()/min() 夹一道 vmin 上限，
     iPad 横屏不会被拉成两条贴边的长队；竖屏用百分比自然收窄。 */
  .field {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);
    z-index: 2;
  }

  /* ===== 窗户：这一轮的天气条件就写在这儿，帽子还是雨伞全看它 ===== */
  .window {
    position: absolute;
    left: 50%;
    top: 2.5%;
    transform: translateX(-50%);
    width: 25vmin;
    height: 17vmin;
    border-radius: 1.8vmin;
    border: 1.4vmin solid #c98a4e;
    box-shadow: 0 1vmin 1.6vmin rgba(90, 50, 10, 0.2), inset 0 0 2vmin rgba(255, 255, 255, 0.5);
    overflow: hidden;
    cursor: pointer;
    z-index: 6;
  }
  .window.sunny { background: linear-gradient(180deg, #cdefff, #8ed3f6); }
  .window.rainy { background: linear-gradient(180deg, #a9bfcd, #7c93a6); }
  /* 窗棂：十字压在天气图案下面，看着才像一扇窗 */
  .window .bar-v, .window .bar-h { position: absolute; background: #c98a4e; z-index: 1; }
  .window .bar-v { left: 50%; top: 0; width: 1.1vmin; height: 100%; transform: translateX(-50%); }
  .window .bar-h { top: 50%; left: 0; height: 1.1vmin; width: 100%; transform: translateY(-50%); }
  .window .wx {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 9.5vmin;
    line-height: 1;
    z-index: 3;
    filter: drop-shadow(0 0.6vmin 0.6vmin rgba(60, 40, 10, 0.25));
  }
  .window.sunny .wx { animation: wx-shine 3.4s ease-in-out infinite; }
  @keyframes wx-shine {
    0%, 100% { transform: translate(-50%, -50%) scale(1)    rotate(0); }
    50%      { transform: translate(-50%, -50%) scale(1.12) rotate(8deg); }
  }
  .window .rain { display: none; position: absolute; inset: 0; z-index: 2; }
  .window.rainy .rain { display: block; }
  .window .rain i {
    position: absolute;
    top: -20%;
    width: 0.7vmin;
    height: 3.6vmin;
    border-radius: 0.4vmin;
    background: rgba(255, 255, 255, 0.8);
    animation: rain-fall 820ms linear infinite;
  }
  @keyframes rain-fall {
    0%   { transform: translateY(0)    rotate(9deg); opacity: 0; }
    18%  { opacity: 1; }
    100% { transform: translateY(24vmin) rotate(9deg); opacity: 0; }
  }
  /* 播报天气 / 戳窗户：整扇窗弹一下，把注意力拉过去 */
  .window.tell { animation: win-pop 700ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes win-pop {
    0%, 100% { transform: translateX(-50%) scale(1); }
    45%      { transform: translateX(-50%) scale(1.16); }
  }

  /* ===== 右上喇叭：戳一下听一句「现在能做的事」（零文字 UI，只有图形）===== */
  .ask {
    position: absolute;
    right: 1.5%;
    top: 2%;
    width: 18vmin;
    height: 13vmin;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 30;
  }
  .ask .horn {
    font-size: clamp(26px, 7vmin, 58px);
    line-height: 1;
    filter: drop-shadow(0 0.8vmin 0.8vmin rgba(120, 70, 20, 0.2));
  }
  .ask.talking .horn { animation: horn-wiggle 620ms ease-in-out infinite; }
  @keyframes horn-wiggle {
    0%, 100% { transform: rotate(0)     scale(1); }
    25%      { transform: rotate(-9deg) scale(1.12); }
    75%      { transform: rotate(9deg)  scale(1.12); }
  }

  /* ===== 中间的小宝宝 ===== */
  .baby {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 34vmin;
    height: 38vmin;
    margin-left: -17vmin;
    margin-top: -19vmin;
    z-index: 10;
    cursor: pointer;
    will-change: transform;
  }
  .baby > span {
    position: absolute;
    left: 50%;
    line-height: 1;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 1vmin 0.8vmin rgba(120, 70, 20, 0.24));
  }
  .baby .face   { top: 29%; font-size: 19vmin; z-index: 5; }
  .baby .cap    { top: 4%;  font-size: 10vmin; z-index: 6; }
  .baby .torso  { top: 63%; width: 15vmin; height: 12vmin; z-index: 2; filter: none; }
  .baby .shirt  { top: 63%; font-size: 14vmin; z-index: 3; }
  .baby .legs   { top: 86%; width: 13.5vmin; height: 6vmin; z-index: 2; filter: none; }
  .baby .sock   { top: 88%; font-size: 5.4vmin; z-index: 3; letter-spacing: 0.6vmin; }
  .baby .shoe   { top: 96%; font-size: 6.4vmin; z-index: 4; letter-spacing: 0.4vmin; }
  .baby .hand   { left: 88%; top: 52%; font-size: 11vmin; z-index: 6; }
  .baby .ride   { top: 106%; font-size: 18vmin; z-index: 1; }
  /* 一截连着脑袋和脚丫的小身子，衣服正好盖在它上面 */
  .baby .torso {
    border-radius: 5vmin 5vmin 3.4vmin 3.4vmin;
    background: linear-gradient(180deg, #ffe6cf, #f6c9a3);
    box-shadow: inset 0 0.5vmin 0 rgba(255, 255, 255, 0.6), 0 0.8vmin 0.8vmin rgba(120, 70, 20, 0.18);
  }
  /* 身上这几件默认全是空的：穿上 / 戴上 / 坐进去时才由 .on 亮出来 */
  .baby .worn, .baby .ride { opacity: 0; }
  /* 光脚丫：袜子和鞋子得有个落点，不然「穿到脚上」这件事看不见 */
  .baby .legs::before, .baby .legs::after {
    content: '';
    position: absolute;
    top: 0;
    width: 5.6vmin;
    height: 6vmin;
    border-radius: 2.4vmin 2.4vmin 2.9vmin 2.9vmin;
    background: linear-gradient(180deg, #ffdfc4, #f4c096);
    box-shadow: inset 0 0.4vmin 0 rgba(255, 255, 255, 0.6), 0 0.8vmin 0.8vmin rgba(120, 70, 20, 0.2);
  }
  .baby .legs::before { left: 0; }
  .baby .legs::after  { right: 0; }
  /* 穿上 / 戴上 / 坐进去：从上方轻轻落位 */
  .baby .worn.on, .baby .ride.on { animation: put-on 620ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes put-on {
    0%   { opacity: 0; transform: translate(-50%, -160%) scale(0.7) rotate(-14deg); }
    70%  { opacity: 1; transform: translate(-50%, -38%)  scale(1.08) rotate(4deg); }
    100% { opacity: 1; transform: translate(-50%, -50%)  scale(1)   rotate(0); }
  }
  /* 收到东西：整个宝宝开心晃一下 */
  .baby.wiggle { animation: baby-wiggle 720ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes baby-wiggle {
    0%, 100% { transform: translateY(0)      rotate(0); }
    25%      { transform: translateY(-3vmin) rotate(-6deg); }
    60%      { transform: translateY(0)      rotate(5deg); }
    85%      { transform: translateY(-1vmin) rotate(-2deg); }
  }
  /* 拿错东西：摇头（信息，不是惩罚——没有难听的声音）*/
  .baby.shake { animation: baby-shake 640ms ease-in-out; }
  @keyframes baby-shake {
    0%, 100% { transform: rotate(0); }
    20%      { transform: rotate(-7deg); }
    50%      { transform: rotate(7deg); }
    80%      { transform: rotate(-4deg); }
  }
  /* 光脚穿鞋：晃脚丫「鞋子穿不上」*/
  .baby.kick .legs { animation: legs-kick 700ms ease-in-out; }
  @keyframes legs-kick {
    0%, 100% { transform: translate(-50%, -50%) rotate(0); }
    22%      { transform: translate(-50%, -56%) rotate(-13deg); }
    55%      { transform: translate(-50%, -50%) rotate(12deg); }
    80%      { transform: translate(-50%, -54%) rotate(-6deg); }
  }
  /* 喝奶时轻轻仰头 */
  .baby.drinking .face { animation: baby-drink 900ms ease-in-out infinite alternate; }
  @keyframes baby-drink {
    0%   { transform: translate(-50%, -50%) rotate(0); }
    100% { transform: translate(-50%, -52%) rotate(-7deg); }
  }
  /* 擦嘴：小脸左右蹭两下再亮一下 */
  .baby.wipe .face { animation: face-wipe 760ms ease-in-out; }
  @keyframes face-wipe {
    0%, 100% { transform: translate(-50%, -50%) rotate(0)      scale(1); }
    25%      { transform: translate(-53%, -50%) rotate(-6deg)  scale(1.05); }
    60%      { transform: translate(-47%, -50%) rotate(6deg)   scale(1.05); }
  }
  /* 出门：连人带车往右开出画面 */
  .baby.drive { animation: baby-drive 1700ms cubic-bezier(0.5, 0, 0.75, 0.3) forwards; }
  @keyframes baby-drive {
    0%   { transform: translate(0, 0)      rotate(0); }
    14%  { transform: translate(-4vmin, 0) rotate(-3deg); }
    100% { transform: translate(120vw, 0)  rotate(2deg); }
  }

  /* ===== 八件东西 ===== */
  .item {
    position: absolute;
    width: 19vmin;
    height: 19vmin;
    margin-left: -9.5vmin;
    margin-top: -9.5vmin;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    z-index: 20;
    will-change: transform;
  }
  .item .art {
    font-size: 12vmin;
    line-height: 1;
    display: block;
    filter: drop-shadow(0 1vmin 0.9vmin rgba(120, 70, 20, 0.26));
    will-change: transform;
  }
  /* 顺序有先后，但「能做的事」始终不止一件——只有还做不了的才不摇 */
  .item.sway .art { animation: art-sway 3s ease-in-out infinite; }
  @keyframes art-sway {
    0%, 100% { transform: rotate(-5deg) translateY(0); }
    50%      { transform: rotate(5deg)  translateY(-1.2vmin); }
  }
  /* 同一步错第 2 次：该先做的那件持续脉冲发光，直到它被做掉（不是闪两下就没）*/
  .item.glow .art { animation: item-glow 1100ms ease-in-out infinite; }
  @keyframes item-glow {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 0.5vmin rgba(255, 214, 80, 0.55)); }
    50%      { transform: scale(1.15); filter: drop-shadow(0 0 3vmin   rgba(255, 226, 110, 1)); }
  }
  /* 车按早了：还没做完的一起晃一下 */
  .item.jiggle .art { animation: item-jiggle 760ms ease-in-out; }
  @keyframes item-jiggle {
    0%, 100% { transform: translateX(0)       rotate(0); }
    20%      { transform: translateX(-1.6vmin) rotate(-10deg); }
    55%      { transform: translateX(1.6vmin)  rotate(10deg); }
    80%      { transform: translateX(-0.8vmin) rotate(-5deg); }
  }
  /* 只点没拖：原地开心跳一下（每次输入必反馈）*/
  .item.hop .art { animation: art-hop 480ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes art-hop {
    0%, 100% { transform: translateY(0)       scale(1); }
    40%      { transform: translateY(-3vmin)  scale(1.14); }
  }
  /* 闲置 8s / 戳喇叭：能做的其中一件亮两下（一次性，与持续发光的 glow 分开）*/
  .item.flash .art { animation: item-flash 900ms ease-in-out 2; }
  @keyframes item-flash {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(255, 226, 110, 0)); }
    50%      { transform: scale(1.18); filter: drop-shadow(0 0 3.2vmin rgba(255, 226, 110, 1)); }
  }
  /* lift 必须排在所有会动的类之后，拿在手里时一律不再自己动 */
  .item.lift { cursor: grabbing; z-index: 320; }
  .item.lift .art { animation: none; filter: drop-shadow(0 0 2.6vmin rgba(255, 226, 110, 0.95)); }
  .item.back { transition: transform 420ms cubic-bezier(0.3, 0.9, 0.4, 1.1); }
  .item.done { pointer-events: none; }
  /* 天气拿错太多次：那件不对的悄悄退场，只剩对的（永远以成功收尾）*/
  .item.gone { pointer-events: none; opacity: 0; transition: opacity 460ms ease; }
  /* 换宝宝：淡出淡入 */
  .item.deal-out { animation: deal-out 320ms ease-in forwards; }
  .item.deal-in  { animation: deal-in  460ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
  @keyframes deal-out { 100% { transform: translateY(16%) scale(0.4); opacity: 0; } }
  @keyframes deal-in {
    0%   { transform: translateY(22%) scale(0.35); opacity: 0; }
    60%  { transform: translateY(-4%) scale(1.08); opacity: 1; }
    100% { transform: translateY(0)   scale(1);    opacity: 1; }
  }

  /* ===== 奶瓶：CSS 画的，长按时奶量真的往下掉 ===== */
  /* 倾斜挂在 .bottle-set 上而不是瓶身上——奶嘴和瓶盖圈是它的兄弟节点，
     只转瓶身会把奶嘴留在原地 */
  .bottle-set {
    position: relative;
    display: block;
    /* 用 padding 不用瓶身的 margin-top —— margin 会外溢（margin collapsing），
       父容器顶边跟着下移，奶嘴反而落进瓶身里 */
    padding-top: 4.6vmin;
    transform-origin: 50% 16%;
  }
  .bottle {
    position: relative;
    display: block;
    width: 10vmin;
    height: 14.4vmin;
    border-radius: 2.4vmin 2.4vmin 3vmin 3vmin;
    /* 空的那半是淡蓝玻璃、奶是暖白——两者必须一眼分得出，
       奶量往下掉才是「按着是对的」的那个可见信号 */
    background: linear-gradient(180deg, #b7d6e6, #93bcd2);
    box-shadow:
      inset 0 0 0 0.55vmin rgba(255, 255, 255, 0.95),
      0 0 0 0.32vmin rgba(120, 80, 40, 0.16),
      0 1vmin 1.4vmin rgba(120, 70, 20, 0.24);
    overflow: hidden;
  }
  .bottle-top {
    position: absolute;
    left: 50%;
    top: 0.4vmin;
    transform: translateX(-50%);
    width: 3.5vmin;
    height: 4.2vmin;
    border-radius: 50% 50% 34% 34%;
    background: #f6cfae;
    box-shadow: 0 0.5vmin 0.8vmin rgba(120, 70, 20, 0.2);
  }
  .bottle-ring {
    position: absolute;
    left: 50%;
    top: 3.3vmin;
    transform: translateX(-50%);
    width: 6.4vmin;
    height: 2.1vmin;
    border-radius: 1.1vmin;
    background: linear-gradient(180deg, #ffd7e6, #f7aec8);
  }
  .milk {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 100%;
    background: linear-gradient(180deg, #fffdf6, #ffe9c2);
    box-shadow: inset 0 0.6vmin 0 rgba(255, 255, 255, 0.9);
    transition: height 320ms ease;
  }
  /* 喝的过程：整支奶瓶倾斜 + 暖光晕渐强（按着是对的，看得见）*/
  .bottle-wrap { position: relative; display: block; }
  .item.holding .bottle-wrap { animation: none; }
  .item.holding .bottle-wrap::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 24vmin;
    height: 24vmin;
    margin: -12vmin 0 0 -12vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 226, 110, 0.6), rgba(255, 226, 110, 0) 68%);
    pointer-events: none;
    animation: halo-grow 1700ms ease-out forwards;
  }
  @keyframes halo-grow {
    0%   { transform: scale(0.4);  opacity: 0.35; }
    100% { transform: scale(1.15); opacity: 1; }
  }

  /* ===== 毛巾：CSS 画的（emoji 里没有一眼认得出的毛巾）===== */
  .towel {
    position: relative;
    display: block;
    width: 11.6vmin;
    height: 9vmin;
    border-radius: 1.6vmin;
    background: linear-gradient(180deg, #ffffff, #e9f3fb);
    box-shadow:
      inset 0 0 0 0.5vmin rgba(255, 255, 255, 0.95),
      0 0 0 0.3vmin rgba(120, 80, 40, 0.12),
      0 1vmin 1.2vmin rgba(120, 70, 20, 0.24);
    overflow: hidden;
  }
  .towel::before, .towel::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 1.3vmin;
  }
  .towel::before { top: 2.4vmin; background: #7fc4e8; }
  .towel::after  { top: 5.3vmin; background: #f7aec8; }

  /* 庆祝粒子（同 helper）*/
  .spark {
    position: fixed;
    font-size: 7vmin;
    line-height: 1;
    pointer-events: none;
    z-index: 600;
    animation: spark-fly 1s ease-out forwards;
  }
  @keyframes spark-fly {
    0%   { transform: translate(0, 0)                                    scale(0.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.2); opacity: 0; }
  }

  #back {
    position: fixed;
    top: 8px; left: 4px;
    top: calc(constant(safe-area-inset-top) + 8px);
    left: calc(constant(safe-area-inset-left) + 4px);
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: calc(env(safe-area-inset-left, 0px) + 4px);
    width: 70px; height: 70px;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    color: rgba(80, 50, 30, 0.5);
    text-decoration: none;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
  }
  #back:active { color: rgba(80, 50, 30, 0.9); }

  /* 竖屏（iPhone）：vmin 跟着窄边走，同样的数值比横屏小一圈——整体放大一档。
     竖屏纵向不缺地方，缺的是横向，所以只放大尺寸、两列反而再往中间收一点。 */
  @media (orientation: portrait) {
    .item      { width: 23vmin; height: 23vmin; margin-left: -11.5vmin; margin-top: -11.5vmin; }
    .item .art { font-size: 15vmin; }
    .baby      { width: 38vmin; height: 43vmin; margin-left: -19vmin; margin-top: -21.5vmin; }
    .baby .face  { font-size: 22vmin; }
    .baby .cap   { font-size: 12vmin; }
    .baby .shirt { font-size: 16vmin; }
    .baby .torso { width: 17vmin; height: 13.6vmin; }
    .baby .legs  { width: 15vmin; height: 6.8vmin; }
    .baby .sock  { font-size: 6.2vmin; }
    .baby .shoe  { font-size: 7.3vmin; }
    .baby .hand  { font-size: 13vmin; }

<script>
// ===== 出门喽 2.0：先 A 才能 B =====
// 一代四件事任意顺序、碰哪件都对，对 26 个月的 Cookie 等于零挑战（Keith 原话：
// 「没有什么逻辑、没有推理、没有顺序」）。二代加两样他生活里真在学的东西：
//   ① 依赖推理：先穿袜子才穿得上鞋、先喝完奶才擦得了嘴、全都准备好才能上车
//   ② 条件判断：窗外下雨拿伞、大太阳戴帽——同一个动作，看条件选不同的东西
// 顺序错了给的是信息不是惩罚：东西滑回去 + 一句话告诉他缺什么，同一步错第 2 次

// needs: 前置依赖（这些做完之前，做它只会得到一句提示）

// last: 收尾那一步（要求前面全部做完）
const ITEMS = [
  { key: 'shirt',    mode: 'drag', needs: [] },
  { key: 'sock',     mode: 'drag', needs: [] },
  { key: 'shoe',     mode: 'drag', needs: ['sock'] },
  { key: 'bottle',   mode: 'hold', needs: [] },
  { key: 'towel',    mode: 'drag', needs: ['bottle'] },
  { key: 'cap',      mode: 'drag', needs: [], gear: 'sun' },
  { key: 'umbrella', mode: 'drag', needs: [], gear: 'rain' },
  { key: 'car',      mode: 'tap',  needs: [], last: true },
];

// 换宝宝时整套换皮：角色 + 衣服 + 鞋 + 帽子 + 伞 + 车
const BABIES    = ['👶', '🐻', '🐰', '🐱', '🐶', '🐼'];
const SHIRTS    = ['👕', '👚', '🧥', '🦺'];
const SOCKS     = ['🧦'];
const SHOES     = ['👟', '👞', '🥾'];   // 不收 🩴：拖鞋不用穿袜子，跟这一款的规则打架
const CAPS      = ['🧢', '👒', '⛑️', '🎩'];
const UMBRELLAS = ['☂️', '🌂'];
const CARS      = ['🚗', '🚙', '🚕', '🛺'];

// 八个落位：左右两列各四行。横排夹一道 vmin 上限，横屏时不会贴到屏幕两边去
const COL_L = 'max(11%, calc(50% - 34vmin))';
const COL_R = 'min(89%, calc(50% + 34vmin))';

// 热区底下，而 .ask 的 z-index 30 盖过 .item 的 20 —— 娃去拿那件东西，
// 拿到的是一句语音提示。四行一起重新等距，横屏那三档间距不能因此被压破。
const ROWS  = ['22%', '43%', '64%', '85%'];
const SLOTS = [];
ROWS.forEach(y => { SLOTS.push({ x: COL_L, y: y }); SLOTS.push({ x: COL_R, y: y }); });

const IDLE_MS      = 8000;   // 静默这么久：能做的其中一件亮两下 + 说一句引导
const HOLD_STEPS   = [1700, 1250, 900];  // 长按阈值：松手早了不惩罚，下次门槛降一档
const HOLD_ASSIST  = 350;    // 已经试过 3 次：碰一下就算喝完
const DRAG_THRESH  = 14;     // 2 岁的手指按下去就会蹭，阈值给宽（同 basket/helper）
const CHAIN_DOG_MS = 5500;   // 语音链看门狗：iOS 被 Siri/锁屏打断时 ended/error 都不来
const BYE_COUNT    = 2;
const GLOW_AT      = 2;      // 同一步错到第几次开始持续发光
const DECOY_OUT_AT = 4;      // 天气拿错到第几次让干扰项退场

// ===== 语音：单 Audio 元素 + 换 src（iOS 解锁后非手势链 play 才可靠）=====
const qEl = new Audio();
qEl.preload = 'auto';
const uEl = new Audio();     // 只用来在首次手势里解锁播放权限
uEl.preload = 'auto';

// ===== Web Audio 效果音：peak ≤ 0.3 且再过一层 0.55 的 master =====
let actx = null, master = null;
function ensureAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = 0.55;
      const comp = actx.createDynamicsCompressor();
      master.connect(comp);
      comp.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    return true;
  } catch (e) { return false; }
}
function tone(type, f0, f1, peak, dur, delay) {
  if (!ensureAudio()) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  if (f1 && f1 !== f0) o.frequency.linearRampToValueAtTime(f1, t0 + dur * 0.8);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(master);
  o.start(t0);
  o.stop(t0 + dur + 0.05);
}
const fxPick  = () => tone('sine', 520, 600, 0.16, 0.14);                    // 拿起
const fxSoft  = () => tone('sine', 440, 520, 0.13, 0.16);                    // 随手戳
const fxOn    = () => { tone('triangle', 660, 660, 0.22, 0.16);              // 穿好 / 戴好
                        tone('triangle', 990, 990, 0.2, 0.26, 0.1); };
const fxGulp  = () => tone('sine', 210, 130, 0.2, 0.16);                     // 咕咚
const fxCar   = () => { tone('sawtooth', 90, 190, 0.12, 0.5);                // 引擎
                        tone('square', 520, 660, 0.1, 0.18, 0.12); };
// 顺序不对 / 拿错东西：两声柔和的下行「咦——」，不是刺耳的错误音
const fxNope  = () => { tone('sine', 480, 380, 0.13, 0.2);
                        tone('sine', 380, 300, 0.12, 0.24, 0.16); };
const fxHonk  = () => { tone('square', 330, 330, 0.12, 0.16);                // 叭叭
                        tone('square', 300, 300, 0.12, 0.2, 0.22); };
const fxParty = () => [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, 0.2, 0.36, i * 0.09));

// ===== DOM =====
const askEl       = document.getElementById('ask');
const babyEl      = document.getElementById('baby');
const faceEl      = document.getElementById('face');
const rideEl      = document.getElementById('ride');
const winEl       = document.getElementById('win');
const wxEl        = document.getElementById('wx');
const wornCapEl   = document.getElementById('wornCap');
const wornShirtEl = document.getElementById('wornShirt');
const wornSockEl  = document.getElementById('wornSock');
const wornShoeEl  = document.getElementById('wornShoe');
const wornHandEl  = document.getElementById('wornHand');
const milkEl      = document.getElementById('milkEl');
const bottleEl    = document.getElementById('bottleSet');
const doorEl      = document.getElementById('door');

ITEMS.forEach(it => {
  it.el = document.getElementById('it' + it.key[0].toUpperCase() + it.key.slice(1));
  it.art = it.el.querySelector('.art');
});
const byKey = k => ITEMS.find(it => it.key === k);

// ===== 状态机 =====
// idle    = 静候首戳解锁音频（iOS 音频必须在手势里起播）
// play    = 玩：依赖满足的都能做，没满足的做了只会得到提示
// leaving = 全部准备好，小车往门外开 + confetti + 收尾语音
// dealing = 换下一个宝宝的进出场动画
let phase = 'idle';
let weather = 'sun';       // 'sun' | 'rain'，每轮随机；决定该拿帽子还是雨伞
let finished = false;      // 出门只触发一次
let outSeq = 0;            // 出门/换场那条独立定时器的代次（不挂在语音回调上）
let idleTimer = null;
let byeAlt = 0;
let everDragged = false;   // 成功拖到宝宝身上过一次 = 会拖了，帮忙门槛放宽一档
let wrongGearMiss = 0;     // 这一轮天气拿错了几次
let gearNudge = 0;         // 天气那一步被引导过几次（第一次只问「要拿什么呀」，之后才报答案）
let lastBaby = null;
let roundSeq = 0;         // 轮次代次：dealRound 一跑就 +1，晚落地的回调靠它认出「我这一跳过期了」
// 帮忙标记挂在每一件东西自己身上（it.assist），不设全局开关，也不跨步传染：
// 一代原样抄 basket 的全局 assistMode，结果「拖不好衣服 ⇒ 连长按喝奶也被跳过」，
// 而四个动作各不相同正是这一款存在的理由。它只活一轮，dealRound 里清零。
const glowKeys = new Set();   // 正在持续发光的东西（做掉它就熄）

function later(fn, ms) { return setTimeout(fn, ms); }
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function pick(arr, not) {
  const pool = arr.filter(x => x !== not);
  return (pool.length ? pool : arr)[Math.floor(Math.random() * (pool.length ? pool.length : arr.length))];
}

// ===== 这一轮谁算数 =====
// 天气不匹配的那件是干扰项：它在场上、能拿起来，但它不是「要做的事」
function isActive(it) { return !it.gear || it.gear === weather; }
// 攒到第几次没成就替他做：会拖了就多给一次机会。拖放和长按共用同一把尺，
// 各写各的会飘（长按那边曾经硬编码 3，会拖之后就跟拖放的 4 对不上）
function assistLimit() { return everDragged ? 4 : 3; }
function gearItem() { return ITEMS.find(it => it.gear === weather); }
function decoyItem() { return ITEMS.find(it => it.gear && it.gear !== weather); }
// 还差哪几件才轮得到它（返回 key 数组，空数组 = 现在就能做）
function unmet(it) {
  if (it.last) return ITEMS.filter(x => isActive(x) && !x.last && !x.done).map(x => x.key);
  return it.needs.filter(k => !byKey(k).done);
}
function activeTasks() { return ITEMS.filter(isActive); }

// ===== 语音链（helper / words / train 同一模式）=====
let chain = [];
let chainDog = null;
function say(files) {
  chain = files.slice();
  stepChain();
}
function stepChain() {
  clearTimeout(chainDog);
  if (!chain.length) {
    askEl.classList.remove('talking');
    return;
  }
  qEl.src = 'audio/' + chain.shift();
  qEl.currentTime = 0;
  askEl.classList.add('talking');
  qEl.play().catch(() => {});
  // 看门狗：iOS 被打断 / 后台 tab 里 ended 与 error 都可能永远不来，裸接事件的链会卡死
  chainDog = setTimeout(stepChain, CHAIN_DOG_MS);
}
qEl.addEventListener('ended', stepChain);
qEl.addEventListener('error', stepChain);   // mp3 缺失也不卡链，往下走
// 注意：say() 只管播报。相位切换、引导点亮、换宝宝一律走独立定时器 —— 挂在语音
// 回调上的话，下一次 say() 一抢占就把那一跳丢了（前两款抓出来的真 bug）。

// ===== 持续发光：只指「该先做的那件」，做掉就熄 =====
function applyGlow() {
  ITEMS.forEach(it => it.el.classList.toggle('glow', glowKeys.has(it.key) && !it.done));
}
function glowAll(keys) {
  keys.forEach(k => glowKeys.add(k));
  applyGlow();
}
// 把注意力拉回那扇窗（播天气 / 拿错 / 无事可指时用）
function popWindow() {
  restart(winEl, 'tell');
  later(() => winEl.classList.remove('tell'), 800);
}

// ===== 闲置引导：只说「现在能做的」，被前置挡住的一句都不提 =====
function armIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (phase !== 'play') return;
    nudge();
    armIdle();
  }, IDLE_MS);
}
function nudge(fromTap) {
  // 正拿在手里 / 正按着的那件不点它：flash 的 keyframes 优先级高于 inline transform，
  // 一手拖东西一手戳喇叭时东西会当场跳一下
  const todo = activeTasks().filter(it => !it.done && !unmet(it).length &&
    !it.el.classList.contains('lift') && !it.el.classList.contains('holding'));
  if (!todo.length) {
    // 能做的那件正拿在他自己手上（一手按奶瓶一手戳喇叭）：没什么可指的，
    // 但「每次输入必反馈」是台上的底线——给一声轻响 + 把窗户弹一下，别是死的。
    // 只有他主动戳才响；8s 闲置那条静默跳过，免得他按着奶瓶时被每 8s 叮一次
    if (fromTap) { fxSoft(); popWindow(); }
    return;
  }
  const it = todo[Math.floor(Math.random() * todo.length)];
  restart(it.el, 'flash');
  later(() => it.el.classList.remove('flash'), 1900);
  // 天气那一步：第一次只把他的眼睛引到窗户上，让他自己判断；再问一次才报答案
  if (it.gear && gearNudge++ === 0) { say(['go_weather.mp3']); return; }
  say(['go_' + it.key + '.mp3']);
}

// ===== 粒子 =====
function burst(fromEl, emojis, n) {
  const r = fromEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < n; i++) {
    const sp = document.createElement('div');
    sp.className = 'spark';
    sp.textContent = emojis[i % emojis.length];
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.6;
    const dist = 16 + Math.random() * 18;
    sp.style.left = cx + 'px';
    sp.style.top = cy + 'px';
    sp.style.setProperty('--dx', Math.cos(ang) * dist + 'vmin');
    sp.style.setProperty('--dy', Math.sin(ang) * dist + 'vmin');
    sp.style.setProperty('--rot', (Math.random() * 90 - 45) + 'deg');
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 1050);
  }
}
const sparkle  = el => burst(el, ['✨', '⭐', '💛', '🌟'], 8);
const confetti = el => burst(el, ['🎉', '⭐', '✨', '🎊', '🌟'], 16);

// ===== 位移：item 的 transform 全归 JS 管（摇摆动画挂在里层 .art 上，互不打架）=====
function setXY(el, dx, dy, extra) {
  el._dx = dx; el._dy = dy;
  el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)' + (extra || '');
}
function resetXY(el) { el._dx = 0; el._dy = 0; el.style.transform = ''; }
function slideBack(el, it) {
  el.style.transition = '';
  el.classList.add('back');
  resetXY(el);
  later(() => { el.classList.remove('back'); if (!it.done) el.classList.add('sway'); }, 440);
}

// ===== 完成一步（幂等）=====
function completeStep(it) {
  if (it.done || phase === 'leaving' || phase === 'dealing') return;
  // 这两行是「哪些东西现在能被做掉」的唯一咽喉点：拖放 / 长按 / 键盘 / 降级帮忙
  // 以后再加任何入口都必须从这儿过。分散到各入口去判，早晚漏一条路——
  // 实证：assist 只挡了 unmet 没挡 isActive，大晴天把雨伞往空地拖偏三次就把伞塞进手里了。
  if (unmet(it).length) return;    // 顺序：前置没满足绝不放行
  if (!isActive(it)) return;       // 条件：这一轮天气不要的那件，怎么弄都不该被做掉
  it.done = true;
  clearTimeout(idleTimer);
  glowKeys.delete(it.key);
  applyGlow();
  it.el.classList.remove('sway', 'lift', 'flash', 'hop', 'holding', 'glow', 'jiggle');
  it.el.classList.add('done');
  // 走降级路径替他喝完时，奶量刚被 cancelHold 退回满格——飞走前先把它喝干净，
  // 别让一支满奶瓶飞到宝宝嘴边还说「奶喝完啦」
  if (it.key === 'bottle') {
    // 别的路（键盘 / 降级）判完成时，手指可能还按在奶瓶上：咕咚声会一直响到阈值烧完
    clearTimeout(holdTimer); holdTimer = null;
    clearInterval(gulpTimer); gulpTimer = null;
    holdPtr = null;
    milkEl.style.transition = 'height 300ms ease';
    milkEl.style.height = '8%';
    babyEl.classList.remove('drinking');
  }
  // 天气选对了，那件不对的就没用了，让它安静退场
  if (it.gear) fadeDecoy();

  // 东西飞到宝宝身上再消失
  const a = it.el.getBoundingClientRect();
  const b = babyEl.getBoundingClientRect();
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  const dy = (b.top + b.height * 0.5) - (a.top + a.height / 2);
  it.el.style.transition = 'transform 460ms cubic-bezier(0.5, 0, 0.3, 1.1), opacity 460ms ease-in';
  setXY(it.el, (it.el._dx || 0) + dx, (it.el._dy || 0) + dy, ' scale(0.35)');
  it.el.style.opacity = '0';

  const seq = roundSeq;
  later(() => {
    // 这一跳晚 420ms 落地，中间可能已经换了宝宝——上一轮的衣服绝不能穿到下一个身上
    if (seq !== roundSeq) return;
    if (it.key === 'shirt')    { wornShirtEl.textContent = it.emoji; restart(wornShirtEl, 'on'); }
    if (it.key === 'sock')     { wornSockEl.textContent  = it.emoji + it.emoji; restart(wornSockEl, 'on'); }
    if (it.key === 'shoe')     { wornShoeEl.textContent  = it.emoji + it.emoji; restart(wornShoeEl, 'on'); }
    if (it.key === 'cap')      { wornCapEl.textContent   = it.emoji; restart(wornCapEl, 'on'); }
    if (it.key === 'umbrella') { wornHandEl.textContent  = it.emoji; restart(wornHandEl, 'on'); }
    if (it.key === 'towel')    { restart(babyEl, 'wipe'); }
    if (it.key === 'car')      { rideEl.textContent = it.emoji; restart(rideEl, 'on'); fxCar(); }
    if (it.key !== 'car') fxOn();
    if (it.key !== 'towel') restart(babyEl, 'wiggle');
    sparkle(babyEl);
    // 出门这一跳也押在这个 420ms 回调里、不在上面同步触发：小车得先真的飞到宝宝脚下、
    // 人真的坐进去了，门才开、彩纸才撒。同步 leave 会让宝宝在空车位上被开走。
    if (it.last) { leave(); return; }
    say(['ok_' + it.key + '.mp3']);        // 只说这一步的名字，不预告下一步
    armIdle();
  }, 420);
}

// ===== 没成一次：不是失败，只是还没成。攒够就替他做（照 basket 抄）=====
// 「只点没拖」和「拖偏了没到」都算，别只数点击——只数点会留死路：
// 娃反复戳同一件东西，每次都滑回原地，这一轮永远出不了门。
// 但抄进来的这条有两个前提要单独钉住：**前置没满足、或这一轮压根不该拿的那件，一律不替他做**——
// 替他穿上没袜子的鞋 / 把晴天的雨伞塞进他手里，等于把这一款唯一要教的东西直接跳过去了。
function registerMiss(it) {
  it.miss = (it.miss || 0) + 1;
  // 与 completeStep 开头那两条同源：还做不了 / 这一轮压根不该做的，攒再多次也不替他做
  if (unmet(it).length || !isActive(it)) return false;
  if (it.assist || it.miss >= assistLimit()) {
    it.assist = true;                // 只帮它自己，不传染给别的步骤
    completeStep(it);
    return true;
  }
  return false;
}

// ===== 顺序不对：给信息，不给惩罚 =====
function blockedFeedback(it, um) {
  it.blockMiss = (it.blockMiss || 0) + 1;
  slideBack(it.el, it);
  fxNope();
  if (it.key === 'shoe') { restart(babyEl, 'kick'); say(['hint_sock_first.mp3']); }
  else                   { restart(babyEl, 'shake'); say(['hint_milk_first.mp3']); }
  // 第 2 次错：该先做的那件持续发光，直到它被做掉
  if (it.blockMiss >= GLOW_AT) glowAll(um);
  armIdle();
}

// ===== 天气拿错：同一个动作，条件变了答案就变 =====
function wrongGearPick(it) {
  wrongGearMiss++;
  slideBack(it.el, it);
  restart(babyEl, 'shake');
  fxNope();
  say([weather === 'rain' ? 'hint_rain.mp3' : 'hint_sun.mp3']);
  popWindow();
  if (wrongGearMiss >= GLOW_AT) glowAll([gearItem().key]);
  // 错到第 4 次：干扰项退场，只剩发着光的那件（永远以成功收尾，且不教错答案）
  if (wrongGearMiss >= DECOY_OUT_AT) fadeDecoy();
  armIdle();
}
function fadeDecoy() {
  const d = decoyItem();
  if (!d || d.el.classList.contains('gone')) return;
  d.el.classList.add('gone');
}

// ===== 车按早了：没做完的一起晃给他看 =====
function carTooEarly(c, um) {
  c.blockMiss = (c.blockMiss || 0) + 1;
  fxHonk();
  say(['hint_car_wait.mp3']);
  um.forEach(k => restart(byKey(k).el, 'jiggle'));
  later(() => um.forEach(k => byKey(k).el.classList.remove('jiggle')), 820);
  if (c.blockMiss >= GLOW_AT) glowAll(um);
  armIdle();
}

// ===== 出门：全部准备好了 =====
function leave() {
  if (finished) return;
  finished = true;
  phase = 'leaving';
  clearTimeout(idleTimer);
  const seq = ++outSeq;

  doorEl.classList.add('open');
  confetti(babyEl);
  fxParty();
  later(fxCar, 260);
  later(() => { if (seq === outSeq) restart(babyEl, 'drive'); }, 420);

  byeAlt = byeAlt % BYE_COUNT + 1;
  say(['ok_car.mp3', 'bye_' + byeAlt + '.mp3']);
  // 换宝宝走这条独立定时器，不挂语音回调——语音被抢占也照样换场
  later(() => { if (seq === outSeq) nextBaby(); }, 4200);
}

// ===== 换下一个宝宝：换角色 + 换天气 + 换位置，无限循环 =====
function nextBaby() {
  if (phase === 'dealing') return;
  phase = 'dealing';
  clearTimeout(idleTimer);
  const seq = ++outSeq;
  ITEMS.forEach(it => { if (!it.done && !it.el.classList.contains('gone')) restart(it.el, 'deal-out'); });

  later(() => {
    if (seq !== outSeq) return;
    dealRound();
    ITEMS.forEach((it, i) => {
      it.el.classList.add('deal-in');
      it.el.style.animationDelay = (i * 70) + 'ms';
    });
    later(() => {
      if (seq !== outSeq) return;
      ITEMS.forEach(it => { it.el.classList.remove('deal-in'); it.el.style.animationDelay = ''; });
      phase = 'play';
      say(['next.mp3', weather === 'rain' ? 'weather_rain.mp3' : 'weather_sun.mp3']);
      popWindow();
      armIdle();
    }, 900);
  }, 360);
}

// 摆好一轮：清空所有计数 + 换天气 + 换皮 + 打乱位置
// 一代的真 bug 就出在这里漏了重置——assist 一旦点亮就跨轮永不恢复，
// 于是后面每一轮碰一下就自动完成。所有 miss / assist / done / glow 都得在这清零。
function dealRound() {
  roundSeq++;
  finished = false;
  // 换轮时手可能还按在奶瓶上：不收住的话，上一轮那只 holdTimer 会在新一轮里把奶替他喝完
  clearTimeout(holdTimer); holdTimer = null;
  clearInterval(gulpTimer); gulpTimer = null;
  holdPtr = null;
  wrongGearMiss = 0;
  gearNudge = 0;
  glowKeys.clear();
  babyEl.classList.remove('drive', 'wiggle', 'drinking', 'shake', 'kick', 'wipe');
  babyEl.style.transform = '';
  doorEl.classList.remove('open');
  winEl.classList.remove('tell');
  [wornCapEl, wornShirtEl, wornSockEl, wornShoeEl, wornHandEl, rideEl].forEach(el => {
    el.textContent = '';
    el.classList.remove('on');
  });

  weather = Math.random() < 0.5 ? 'sun' : 'rain';
  winEl.className = 'window ' + (weather === 'sun' ? 'sunny' : 'rainy');
  wxEl.textContent = weather === 'sun' ? '☀️' : '🌧️';

  const baby = pick(BABIES, lastBaby);
  lastBaby = baby;
  faceEl.textContent = baby;
  byKey('shirt').emoji    = pick(SHIRTS);
  byKey('sock').emoji     = pick(SOCKS);
  byKey('shoe').emoji     = pick(SHOES);
  byKey('cap').emoji      = pick(CAPS);
  byKey('umbrella').emoji = pick(UMBRELLAS);
  byKey('car').emoji      = pick(CARS);
  byKey('bottle').emoji   = '🍼';
  byKey('towel').emoji    = '';

  // 位置打乱：同一件东西不总在同一个角落，逼他每轮重新找
  const slots = SLOTS.slice();
  for (let i = slots.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = slots[i]; slots[i] = slots[j]; slots[j] = t;
  }
  ITEMS.forEach((it, i) => {
    it.done = false;
    it.miss = 0;
    it.blockMiss = 0;
    it.assist = false;   // 帮忙是「这一轮他手不顺」，不是「这个娃从此不会拖」
    it.el.className = 'item sway';
    it.el.style.transition = '';
    it.el.style.opacity = '';
    it.el.style.left = slots[i].x;
    it.el.style.top  = slots[i].y;
    resetXY(it.el);
    if (it.key !== 'bottle' && it.key !== 'towel') it.art.textContent = it.emoji;
  });
  applyGlow();
  resetMilk(true);
}

// ===== 奶瓶长按 =====
// pointerdown 起计时；pointerup / pointercancel / pointerleave / 切后台都要能取消，
// 任何一条路都把 holdTimer 清掉——不留永久卡住的计时器。
let holdPtr = null;      // 正在按的那根手指（第二根手指按上来直接忽略，不重复计时）
let holdTimer = null;
let gulpTimer = null;

function holdThreshold() {
  const it = byKey('bottle');
  if (it.assist || (it.miss || 0) >= assistLimit()) return HOLD_ASSIST;
  return HOLD_STEPS[Math.min(it.miss || 0, HOLD_STEPS.length - 1)];
}
function resetMilk(instant) {
  milkEl.style.transition = instant ? 'none' : 'height 340ms ease';
  milkEl.style.height = '100%';
  bottleEl.style.transition = instant ? 'none' : 'transform 340ms ease';
  bottleEl.style.transform = 'rotate(0deg)';
  if (instant) { void milkEl.offsetWidth; milkEl.style.transition = ''; bottleEl.style.transition = ''; }
}
function startHold() {
  const it = byKey('bottle');
  if (phase !== 'play' || it.done || holdTimer) return false;
  const ms = holdThreshold();
  it.el.classList.remove('hop', 'flash', 'back');
  it.el.classList.add('holding');
  babyEl.classList.add('drinking');
  // 持续视觉：奶量一路往下掉 + 奶瓶倾斜（按着是对的，看得见）
  milkEl.style.transition = 'height ' + ms + 'ms linear';
  milkEl.style.height = '8%';
  bottleEl.style.transition = 'transform ' + ms + 'ms ease-in';
  bottleEl.style.transform = 'rotate(-34deg)';
  fxGulp();
  clearInterval(gulpTimer);
  gulpTimer = setInterval(fxGulp, 340);   // 咕咚咕咚
  holdTimer = setTimeout(() => {
    holdTimer = null;
    endHold(true);
    completeStep(it);
  }, ms);
  clearTimeout(idleTimer);
  return true;
}
// completed=true 表示喝完了（奶量停在空）；false 是松手太早，奶量退回去
function endHold(completed) {
  clearTimeout(holdTimer); holdTimer = null;
  clearInterval(gulpTimer); gulpTimer = null;
  holdPtr = null;
  const it = byKey('bottle');
  it.el.classList.remove('holding');
  babyEl.classList.remove('drinking');
  if (!completed) resetMilk(false);
}
// 松手太早：不算失败，只累计一次没成的尝试（攒够就替他喝完），没有惩罚音。
// silent=true 是「不是他松的手」——系统收走手势 / 切后台 / 失焦。这一路只收视觉不记账：
// 记了账，一次来电就能把长按阈值从 1700ms 砍到 350ms，甚至直接替他喝完，
// 而他从头到尾按得好好的。
function cancelHold(silent) {
  const it = byKey('bottle');
  const wasHolding = !!holdTimer;
  // 已经喝完了就别把奶量退回去——喝完后那一下 pointerup 也会走到这里
  endHold(it.done);
  if (!wasHolding || it.done) return;
  if (silent) { armIdle(); return; }
  restart(it.el, 'hop');
  later(() => it.el.classList.remove('hop'), 500);
  fxSoft();
  if (!registerMiss(it)) armIdle();
}

// ===== 拖放 / 长按 / 点按 =====
function bindItem(it) {
  const el = it.el;
  // seq 记下「这一把是哪一轮开始拖的」：手一直没离开屏幕、中间换了宝宝的话，
  // 这一把就作废——不然东西会停在离手几百像素的地方，miss 还记进新一轮的账
  let sx = 0, sy = 0, dragging = false, moved = false, ptr = null, seq = -1;

  el.addEventListener('pointerdown', (e) => {
    hideHint();
    if (phase === 'idle') unlock();          // 首戳既解锁也照常玩，不白按一下（同 basket）
    if (phase !== 'play' || it.done) { fxSoft(); return; }
    e.preventDefault();
    if (it.mode === 'hold') {
      if (holdPtr !== null) return;          // 第二根手指按上来：忽略，别重复计时
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      // 起不来就别占着 holdPtr——占住了这只奶瓶后面谁都按不动
      if (startHold()) holdPtr = e.pointerId;
      return;
    }
    if (dragging) return;                    // 同一件东西上的第二根手指
    dragging = true;
    moved = false;
    ptr = e.pointerId;
    seq = roundSeq;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    // 拿起前先量一次：下面 setXY(0,0) 会把东西瞬间拽回原位，
    // 半路截住一件正在滑回去的东西时，那一拽就是手指与东西之间凭空多出来的错位。
    // 娃刚拖歪立刻再抓一次是最常见的动作，不补这一下他后面怎么拖都送不到宝宝身上。
    const r0 = el.getBoundingClientRect();
    el.classList.remove('sway', 'hop', 'back', 'flash', 'jiggle');
    el.style.transition = 'none';
    el.classList.add('lift');
    setXY(el, 0, 0, ' scale(1.16)');
    const r1 = el.getBoundingClientRect();
    // 比中心不比左上角：lift 的 scale(1.16) 会改宽高，中心点不受它影响
    sx = e.clientX + ((r1.left + r1.width / 2) - (r0.left + r0.width / 2));
    sy = e.clientY + ((r1.top + r1.height / 2) - (r0.top + r0.height / 2));
    fxPick();
    clearTimeout(idleTimer);
  });

  el.addEventListener('pointermove', (e) => {
    if (!dragging || e.pointerId !== ptr) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > DRAG_THRESH) moved = true;
    setXY(el, dx, dy, ' scale(1.16)');
  });

  function release(e) {
    if (it.mode === 'hold') {
      if (holdPtr !== null && e.pointerId !== holdPtr) return;
      // 和下面拖放那支一样先认 pointercancel：系统收走手势不是他没按住
      cancelHold(!!(e && e.type === 'pointercancel'));
      return;
    }
    // cancel 也必须认 id：第二根手指落在同一件东西上被忽略、随后被系统收走发 cancel，
    // 放行的话会把第一根手指正拖着的东西滑回去，之后再也不跟手
    if (!dragging || e.pointerId !== ptr) return;
    dragging = false;
    ptr = null;
    // 拖到一半换了宝宝：这一把属于上一轮，只把视觉收回原位，一个字都不记进新一轮
    if (seq !== roundSeq) {
      el.classList.remove('lift');
      resetXY(el);
      if (!it.done) el.classList.add('sway');
      return;
    }
    // 先量再摘 lift —— 一摘 lift，.art 的摇摆动画就回来了，量到的会是归位后的矩形
    const r = el.getBoundingClientRect();
    el.classList.remove('lift');
    if (it.done || phase !== 'play') { slideBack(el, it); return; }

    // 系统收走手势（第二根手指缩放 / 掌根碰到 / 来电）：孩子没做错任何事，
    // 一律滑回原位，不记一次没成
    if (e && e.type === 'pointercancel') { slideBack(el, it); armIdle(); return; }

    // 点一下就上的那件（小车）：点了 / 拖了都算数，但前面没准备好就只有喇叭
    if (it.mode === 'tap') {
      const um = unmet(it);
      if (um.length) { slideBack(el, it); carTooEarly(it, um); return; }
      completeStep(it);
      return;
    }

    const b = babyEl.getBoundingClientRect();
    const pad = b.width * 0.34;    // 命中区外扩——2 岁的手不必精准，碰到宝宝就算
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const hit = cx > b.left - pad && cx < b.right + pad && cy > b.top - pad && cy < b.bottom + pad;
    if (moved && hit) {
      everDragged = true;
      // 送到宝宝身上了 = 手上功夫没问题，这件的帮忙收回去，让他接着自己拖
      it.miss = 0;
      it.assist = false;
      // 天气不对的那件：动作做对了，判断没做对——摇头 + 再问一遍窗外
      if (it.gear && it.gear !== weather) { wrongGearPick(it); return; }
      const um = unmet(it);
      if (um.length) { blockedFeedback(it, um); return; }
      completeStep(it);
      return;
    }
    // 没送到宝宝身上——「只点没拖」和「拖了没到」都算一次没成的尝试
    if (registerMiss(it)) return;
    if (moved) {
      slideBack(el, it);           // 拖偏了：滑回原位（无失败音，纯信息）
      armIdle();
      return;
    }
    resetXY(el);                   // 只点没拖：原地开心跳一下
    restart(el, 'hop');
    fxSoft();
    later(() => { el.classList.remove('hop'); if (!it.done) el.classList.add('sway'); }, 500);
    armIdle();
  }

  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', (e) => {
    if (it.mode !== 'hold') return;
    // 规范要求触摸指针在 pointerup 之后补发一发 pointerleave——不认 id 的话，
    // 另一根手指戳一下奶瓶再抬起，就会掐掉拇指正按着的那口奶
    if (holdPtr === null || e.pointerId !== holdPtr) return;
    cancelHold();   // 只收自己那根：桌面鼠标划出元素那条兜底仍然成立
  });
  // capture 拿不到时 pointerup 可能丢在别处，用它兜住，别让东西永远粘在手上
  el.addEventListener('lostpointercapture', (e) => {
    if (dragging && e.pointerId === ptr) release(e);
  });
}
ITEMS.forEach(bindItem);

// ===== 首戳解锁（iOS 音频必须在手势里起播）=====
function unlock() {
  if (phase !== 'idle') return;
  ensureAudio();
  uEl.muted = true;
  uEl.play().then(() => { uEl.pause(); uEl.muted = false; }).catch(() => { uEl.muted = false; });
  phase = 'play';
  // 开场先报天气：这一轮该拿帽子还是雨伞，答案就在这一句和那扇窗里
  say(['intro.mp3', weather === 'rain' ? 'weather_rain.mp3' : 'weather_sun.mp3']);
  popWindow();
  armIdle();
}

// ===== 戳喇叭 = 听一句现在能做的事；戳窗户 = 再报一次天气；戳宝宝 = 他笑一下 =====
function tapHorn() {
  hideHint();
  if (phase === 'idle') { unlock(); return; }
  if (phase !== 'play') { fxSoft(); return; }
  nudge(true);
  armIdle();
}
function tapWindow() {
  hideHint();
  if (phase === 'idle') { unlock(); return; }
  fxSoft();
  popWindow();
  say([weather === 'rain' ? 'weather_rain.mp3' : 'weather_sun.mp3']);
  if (phase === 'play') armIdle();
}
function tapBaby() {
  hideHint();
  if (phase === 'idle') { unlock(); return; }
  restart(babyEl, 'wiggle');
  fxSoft();
  if (phase === 'play') armIdle();
}
// touchstart 内 preventDefault 抑制 iOS 合成 click（一戳只触发一次）；
// 只绑在这几个元素上，绝不在 document 上无条件 preventDefault —— bath 曾因此
// 吞掉 #back 的合成 click，返回键在触屏上点不动。
function bindTap(el, fn) {
  el.addEventListener('click', fn, { passive: true });
  el.addEventListener('touchstart', (e) => { fn(); e.preventDefault(); }, { passive: false });
}
bindTap(askEl, tapHorn);
bindTap(winEl, tapWindow);
bindTap(babyEl, tapBaby);

// 点画面任何空白处也能解锁音频（只挂 click、不 preventDefault，返回键照常工作）
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t && t.closest && t.closest('#back')) return;
  hideHint();   // 第一下戳在空白处也算开局，那行字不能挂着不走（零文字 UI）
  if (phase === 'idle') unlock();
}, { passive: true });

// ===== 键盘：三输入全通 =====
// 按住任意键 ≥300ms = 长按喝奶；短按一下 = 做完「下一件现在能做的事」。
// 键盘这一路同样守依赖：它跳过被前置挡住的步骤，不给一条绕过顺序的后门。
let keyDownAt = 0, keyArm = null, keyHolding = false;
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;              // 按住时 OS 的自动重复不是新的一次按键
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') {
    if (!document.fullscreenElement) location.href = '../../';
    return;
  }
  if ((e.key === 'f' || e.key === 'F') && !document.fullscreenElement) {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    return;
  }
  e.preventDefault();
  hideHint();
  if (phase === 'idle') { unlock(); return; }
  if (phase !== 'play') { fxSoft(); return; }
  if (keyDownAt) return;             // 已经有一个键按着了
  keyDownAt = Date.now();
  clearTimeout(keyArm);
  // 300ms 后才进长按视觉：短按不会把奶瓶的奶量白晃一下
  keyArm = setTimeout(() => {
    keyArm = null;
    if (!keyDownAt) return;
    if (byKey('bottle').done) return;
    keyHolding = startHold();
  }, 300);
});
document.addEventListener('keyup', (e) => {
  if (!keyDownAt) return;
  keyDownAt = 0;
  clearTimeout(keyArm); keyArm = null;
  if (keyHolding) { keyHolding = false; cancelHold(); return; }
  if (phase !== 'play') return;
  // 短按：做完下一件「现在能做的」；只剩奶瓶时按 hold 的语义记一次没成
  const next = activeTasks().find(it => !it.done && it.mode !== 'hold' && !unmet(it).length);
  if (next) { completeStep(next); return; }
  const b = byKey('bottle');
  if (!b.done) {
    restart(b.el, 'hop');
    later(() => b.el.classList.remove('hop'), 500);
    fxSoft();
    if (!registerMiss(b)) armIdle();
  }
});

// ===== 回前台 / 失焦：AudioContext 与语音链都可能被挂起；长按一律收住 =====
function onResume() {
  if (document.visibilityState === 'hidden') {
    if (holdTimer) cancelHold(true);  // 切后台时正按着：收住，但这不算他没按好
    keyDownAt = 0; clearTimeout(keyArm); keyArm = null;
    return;
  }
  try { if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {}
  if (chain.length && qEl.paused) stepChain();   // 后台里 ended/error 不来，链卡在哪句从哪句续
  if (phase === 'play') armIdle();
}
document.addEventListener('visibilitychange', onResume);
window.addEventListener('pageshow', onResume);
window.addEventListener('blur', () => {
  if (holdTimer) cancelHold(true);   // 失焦同上：不是他松的手，不记账
  // keyHolding 不清的话，回来第一次短按会被当成「松手太早」白记一次没成
  keyDownAt = 0; keyHolding = false; clearTimeout(keyArm); keyArm = null;
});

let hintGone = false;
function hideHint() {
  if (hintGone) return;
  hintGone = true;
  const h = document.getElementById('hint');
  if (h) {
    h.classList.add('gone');
    setTimeout(() => h.remove(), 800);
  }
}

// ===== 进入：摆好第一个宝宝，静候首戳 =====
dealRound();

// 空闲预载全部 mp3 进 HTTP 缓存——后续换 src 即播不等网络
setTimeout(() => {
  const files = ['intro.mp3', 'next.mp3', 'go_weather.mp3',
                 'weather_sun.mp3', 'weather_rain.mp3',
                 'hint_sock_first.mp3', 'hint_milk_first.mp3',
                 'hint_rain.mp3', 'hint_sun.mp3', 'hint_car_wait.mp3'];
  ITEMS.forEach(it => files.push('ok_' + it.key + '.mp3', 'go_' + it.key + '.mp3'));
  for (let i = 1; i <= BYE_COUNT; i++) files.push('bye_' + i + '.mp3');
  files.forEach(f => fetch('audio/' + f).catch(() => {}));
}, 600);
</script>
